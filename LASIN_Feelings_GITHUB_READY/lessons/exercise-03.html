<script>
(()=>{
'use strict';
const LASIN_MOTIVATION_EXERCISE_ID='exercise-03';
function lasinMotivationBridge(action,payload={}){
  try{window.parent.postMessage({channel:'LASIN_MOTIVATION_V2',action,payload:Object.assign({exerciseId:LASIN_MOTIVATION_EXERCISE_ID},payload||{})},'*');}catch(e){}
}
function lasinMotivationSignal(action,extra={}){
  const localIndex=currentIndex+1;
  lasinMotivationBridge(action,Object.assign({questionId:String(localIndex),localIndex},extra||{}));
}
function lasinHostSuspend(){
  const hasQuestion=!!document.querySelector('.word-tile');
  if(!hasQuestion){stopAudio();return;}
  if(!mandatoryDone){
    stopAudio();mandatoryDone=false;mandatoryNeedsTap=true;
    disableAllTiles();setAnswerLocked(true);setAudioButtons(true,false);setListenNote('Tap the headset to listen twice.');
    return;
  }
  const replayActive=audioPlaying||!!currentAudio||!!document.querySelector('.audio-btn.playing');
  if(replayActive){
    stopAudio();setAudioButtons(true,false);restoreInteraction();setListenNote(instructionForCurrentState());
    if(pendingFinish)maybeFinishQuestion();
  }
}
window.addEventListener('message',e=>{
  const d=e.data;if(!d||d.channel!=='LASIN_HOST_V1'||d.action!=='active-state')return;
  if(d.payload&&d.payload.active===false)lasinHostSuspend();
});

const DATA=JSON.parse(document.getElementById('lesson-data').textContent);
const IS_BUILDER=document.documentElement.dataset.builder==='true';
const screenEl=document.getElementById('screen');

const AUTO_DELAY=800, QA_GAP=700, REPEAT_GAP=800, WRONG_CLEAR=750, BRAVO_MS=1900;
const reducedMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const MODES=['supported','fullBuild'];
const QUESTIONS=MODES.flatMap(mode=>DATA.items.map(item=>({mode,item})));
lasinMotivationBridge('register-exercise',{order:3,label:'Exercise 03',scorable:true,totalQuestions:QUESTIONS.length,mode:'scored'});

const HEADSET=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13v5a2 2 0 0 0 2 2h2v-8H6a2 2 0 0 0-2 2Zm16 0v5a2 2 0 0 1-2 2h-2v-8h2a2 2 0 0 1 2 2Z"/><path d="M4 13v-1a8 8 0 0 1 16 0v1h-2v-1a6 6 0 0 0-12 0v1Z"/></svg>`;

let currentIndex=0,qBuilt=0,aBuilt=0;
let questionDone=false,answerDone=false;
let mandatoryDone=false,mandatoryNeedsTap=false,pendingFinish=false;
let currentAudio=null,audioToken=0,finishTimer=null,audioPlaying=false;
const timers=new Set();

function escapeHTML(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffledNotSame(arr){if(arr.length<2)return [...arr];for(let n=0;n<14;n++){const a=shuffle(arr);if(a.some((v,i)=>v!==arr[i]))return a;}return [...arr.slice(1),arr[0]];}
function allAudioEmbedded(){return Object.values(DATA.audio).every(v=>String(v||'').length>0);}

function clearTimers(){for(const t of timers)clearTimeout(t);timers.clear();if(finishTimer){clearTimeout(finishTimer);finishTimer=null;}}
function stopAudio(){
  audioToken++;clearTimers();audioPlaying=false;
  if(currentAudio){try{currentAudio.pause();currentAudio.currentTime=0;currentAudio.removeAttribute('src');currentAudio.load();}catch(e){}currentAudio=null;}
  document.querySelectorAll('.audio-btn').forEach(b=>b.classList.remove('playing'));
}
function sleep(ms,token){return new Promise(resolve=>{const id=setTimeout(()=>{timers.delete(id);resolve(token===audioToken);},ms);timers.add(id);});}

function setFeedback(msg,bad=false){const f=document.getElementById('feedback');if(!f)return;f.textContent=msg||'';f.className='feedback'+(bad?' bad':'');}

function setAudioButtons(enabled,playing=false){
  document.querySelectorAll('.audio-btn').forEach(b=>{
    b.disabled=!enabled;
    b.classList.toggle('ready',enabled&&!playing);
    b.classList.toggle('playing',playing);
  });
}
function disableAllTiles(){document.querySelectorAll('.word-tile').forEach(b=>b.disabled=true);}

function restoreInteraction(){
  if(!mandatoryDone){disableAllTiles();setAnswerLocked(true);return;}
  if(!questionDone){
    document.querySelectorAll('#questionBank .word-tile').forEach(b=>b.disabled=b.classList.contains('moved'));
    document.querySelectorAll('#answerBank .word-tile').forEach(b=>b.disabled=true);
    setAnswerLocked(true);
  }else if(!answerDone){
    document.querySelectorAll('#questionBank .word-tile').forEach(b=>b.disabled=true);
    document.querySelectorAll('#answerBank .word-tile').forEach(b=>b.disabled=b.classList.contains('moved'));
    setAnswerLocked(false);
  }else{
    disableAllTiles();setAnswerLocked(false);
  }
}

function playSource(url,button,token){
  return new Promise(resolve=>{
    if(token!==audioToken||!url){resolve(false);return;}
    const a=new Audio();currentAudio=a;a.preload='auto';a.setAttribute('playsinline','');a.setAttribute('webkit-playsinline','');a.src=url;
    let settled=false;
    const done=ok=>{
      if(settled)return;settled=true;
      a.onended=null;a.onerror=null;audioPlaying=false;
      if(button)button.classList.remove('playing');
      if(currentAudio===a)currentAudio=null;
      resolve(ok&&token===audioToken);
    };
    a.onended=()=>done(true);a.onerror=()=>done(false);
    audioPlaying=true;if(button){button.classList.add('playing');button.classList.remove('ready');}
    const p=a.play();if(p&&p.catch)p.catch(()=>done(false));
  });
}

async function playQASequence(button,token){
  const q=QUESTIONS[currentIndex];
  const qa=DATA.audio[q.item.qAudio],aa=DATA.audio[q.item.aAudio];

  let ok=await playSource(qa,button,token);if(!ok)return false;
  ok=await sleep(QA_GAP,token);if(!ok)return false;
  ok=await playSource(aa,button,token);if(!ok)return false;

  ok=await sleep(REPEAT_GAP,token);if(!ok)return false;

  ok=await playSource(qa,button,token);if(!ok)return false;
  ok=await sleep(QA_GAP,token);if(!ok)return false;
  ok=await playSource(aa,button,token);if(!ok)return false;

  return token===audioToken;
}

async function runMandatory(buttonId='rightAudioBtn'){
  stopAudio();
  const token=audioToken;
  const button=document.getElementById(buttonId)||document.getElementById('rightAudioBtn');

  mandatoryDone=false;mandatoryNeedsTap=false;
  disableAllTiles();setAnswerLocked(true);setAudioButtons(false,true);
  setListenNote('Listen carefully. The question and answer will play twice.');

  let ok=await sleep(AUTO_DELAY,token);
  if(ok)ok=await playQASequence(button,token);
  if(token!==audioToken)return;

  if(ok){
    mandatoryDone=true;mandatoryNeedsTap=false;
    setAudioButtons(true,false);restoreInteraction();
    lasinMotivationSignal('question-ready');
    setListenNote(instructionForCurrentState());
  }else{
    mandatoryDone=false;mandatoryNeedsTap=true;
    disableAllTiles();setAnswerLocked(true);setAudioButtons(true,false);
    setListenNote('Tap the headset to listen twice.');
  }
}

async function replaySequence(buttonId){
  if(audioPlaying)return;
  if(!mandatoryDone){
    if(mandatoryNeedsTap)runMandatory(buttonId);
    return;
  }

  stopAudio();
  const token=audioToken;
  const button=document.getElementById(buttonId);

  disableAllTiles();setAudioButtons(false,true);setListenNote('Listen again.');

  const ok=await playQASequence(button,token);
  if(token!==audioToken)return;

  setAudioButtons(true,false);restoreInteraction();
  setListenNote(instructionForCurrentState());
  if(ok)maybeFinishQuestion();
}

function audioClick(buttonId){
  if(mandatoryDone)replaySequence(buttonId);
  else if(mandatoryNeedsTap)runMandatory(buttonId);
}

    'How did you feel when you rode a roller coaster.mp3',
    'How did you feel when you dived into the swimming pool.mp3',
    'How did you feel when you acted in a play.mp3',
    'I felt relaxed, but she felt nervous..mp3',
    'I felt shy, but she felt confident..mp3',
    'I felt wide awake, but she felt sleepy..mp3',
    'I felt nervous, but he felt relaxed..mp3',
    'I felt confident, but he felt shy..mp3',
    'I felt sleepy, but he felt wide awake..mp3'
  ];
  return `<div class="audio-setup">
    <div class="audio-setup-title">Original Audio Embedder — 9 MP3 files</div>
    <div class="audio-setup-text">Select the nine original Exercise 03 MP3 files from your computer. The three question recordings are reused across the six speaker items. The builder matches by filename, embeds the original bytes without re-encoding, and creates a clean standalone student HTML.</div>
    <button class="audio-setup-btn" id="embedAudioBtn" type="button">Embed the Original MP3s</button>

  </div>`;
}

function renderIntro(){
  stopAudio();currentIndex=0;qBuilt=0;aBuilt=0;questionDone=false;answerDone=false;mandatoryDone=false;mandatoryNeedsTap=false;pendingFinish=false;
  const embedded=allAudioEmbedded(),builder=IS_BUILDER;
  screenEl.innerHTML=`<section class="intro">
    <h1>${escapeHTML(DATA.title)}</h1>
    <button class="start" id="startBtn" type="button" ${embedded?'':'disabled'}>Start</button>
    ${builder&&!embedded?audioSetupHTML():''}
  </section>`;
  document.getElementById('startBtn').addEventListener('click',()=>{if(allAudioEmbedded()){unlockMobileAudio();renderQuestion();}});
  if(window.LASIN_BUILDER&&builder)window.LASIN_BUILDER.bind();
}

function progressHTML(){
  const n=currentIndex+1,total=QUESTIONS.length,pct=(n/total)*100;
  return `<div class="progress-wrap"><div class="progress-meta">${n} / ${total}</div><div class="progress-track" aria-label="Progress"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
}

function instructionForCurrentState(){
  const q=QUESTIONS[currentIndex];
  if(!questionDone)return q.mode==='supported'?'Now choose the missing activity.':'Now make the question in the correct order.';
  if(!answerDone)return q.mode==='supported'?'Great! Now choose the missing feelings.':'Great! Now make the answer in the correct order.';
  return 'Great job!';
}

function questionAreaHTML(q){
  if(q.mode==='supported'){
    return `<span class="fixed-chunk">How did you feel when you</span><span class="slot-punct-group"><span class="answer-slot phrase-slot" id="qSlot0">...</span><span class="punctuation">?</span></span>`;
  }
  return `<span class="answer-slot build-placeholder" id="qBuildTarget">...</span>`;
}

function answerAreaHTML(q){
  const i=q.item;
  if(q.mode==='supported'){
    return `<span class="fixed-chunk">I felt</span><span class="slot-punct-group"><span class="answer-slot" id="aSlot0">...</span><span class="punctuation">,</span></span><span class="fixed-chunk">but ${escapeHTML(i.secondPronoun)} felt</span><span class="slot-punct-group"><span class="answer-slot" id="aSlot1">...</span><span class="punctuation">.</span></span>`;
  }
  return `<span class="answer-slot build-placeholder" id="aBuildTarget">...</span>`;
}

function questionChoices(q){return q.mode==='supported'?shuffle(q.item.round1QuestionChoices):shuffledNotSame(q.item.questionChunks);}
function answerChoices(q){return q.mode==='supported'?shuffle(q.item.round1AnswerChoices):shuffledNotSame(q.item.answerChunks);}
function tilesHTML(values,kind,klass){return values.map(w=>`<button class="word-tile ${klass}" type="button" data-kind="${kind}" data-word="${escapeHTML(w)}" aria-label="Choose ${escapeHTML(w)}" disabled>${escapeHTML(w)}</button>`).join('');}

function renderQuestion(){
  stopAudio();qBuilt=0;aBuilt=0;questionDone=false;answerDone=false;mandatoryDone=false;mandatoryNeedsTap=false;pendingFinish=false;
  const q=QUESTIONS[currentIndex],i=q.item;

  screenEl.innerHTML=`<section class="stage">${progressHTML()}<div class="halves">
    <section class="half" aria-label="Picture and listening prompt">
      <h2 class="half-title">Look and listen.</h2>
      <button class="audio-btn" id="leftAudioBtn" aria-label="Listen to the question and answer again" type="button" disabled>${HEADSET}</button>
      <div class="picture-card"><img src="${DATA.images[i.image]}" alt="Speaker marked by the red arrow. ${escapeHTML(i.question)} ${escapeHTML(i.answer)}"></div>
      <p class="left-caption">You can listen again anytime.</p>
    </section>

    <section class="half" aria-label="Grammar exercise">
      <h2 class="half-title">Then listen and choose.</h2>
      <button class="audio-btn" id="rightAudioBtn" aria-label="Listen to the question and answer again" type="button" disabled>${HEADSET}</button>
      <div class="task-wrap">
        <p class="listen-note" id="listenNote">Listen carefully. The question and answer will play twice.</p>

        <div class="task-block">
          <div class="task-label">Question</div>
          <div class="sentence-area question-area ${q.mode==='fullBuild'?'full-build-area':''}" id="questionArea" aria-label="Question building area">${questionAreaHTML(q)}</div>
          <div class="word-bank" id="questionBank">${tilesHTML(questionChoices(q),'question','question-tile')}</div>
        </div>

        <div class="task-block answer-panel locked" id="answerPanel">
          <div class="task-label">Answer</div>
          <div class="sentence-area answer-area ${q.mode==='fullBuild'?'full-build-area':''}" id="answerArea" aria-label="Answer building area">${answerAreaHTML(q)}</div>
          <div class="word-bank" id="answerBank">${tilesHTML(answerChoices(q),'answer','answer-tile')}</div>
        </div>

        <p class="feedback" id="feedback" aria-live="polite"></p>
      </div>
    </section>
  </div></section>`;

  document.getElementById('leftAudioBtn').addEventListener('click',()=>audioClick('leftAudioBtn'));
  document.getElementById('rightAudioBtn').addEventListener('click',()=>audioClick('rightAudioBtn'));
  document.querySelectorAll('.word-tile').forEach(btn=>btn.addEventListener('click',()=>chooseTile(btn,q)));

  runMandatory('rightAudioBtn');
}

function wrongTile(btn){
  lasinMotivationSignal('question-mistake');
  btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('is-wrong','shake');btn.disabled=true;setFeedback('Try again!',true);
  const id=setTimeout(()=>{
    timers.delete(id);btn.classList.remove('is-wrong','shake');
    setFeedback('');
    setListenNote(instructionForCurrentState());
    restoreInteraction();
  },WRONG_CLEAR);
  timers.add(id);
}

function flyInto(btn,target,text){
  return new Promise(resolve=>{
    if(reducedMotion){resolve();return;}
    const a=btn.getBoundingClientRect(),b=target.getBoundingClientRect(),clone=btn.cloneNode(true);
    clone.className='word-tile fly-tile';clone.disabled=true;clone.textContent=text;
    clone.style.left=a.left+'px';clone.style.top=a.top+'px';clone.style.width=a.width+'px';clone.style.height=a.height+'px';
    document.body.appendChild(clone);
    const dx=(b.left+b.width/2)-(a.left+a.width/2),dy=(b.top+b.height/2)-(a.top+a.height/2);
    requestAnimationFrame(()=>{clone.style.transform=`translate(${dx}px,${dy}px) scale(.82)`;clone.style.opacity='.12';});
    setTimeout(()=>{clone.remove();resolve();},340);
  });
}

async function chooseTile(btn,q){
  if(!mandatoryDone||audioPlaying||btn.disabled)return;
  if(btn.dataset.kind==='question'&&!questionDone){
    if(q.mode==='supported')await chooseSupportedQuestion(btn,q);else await chooseFullQuestion(btn,q);
  }else if(btn.dataset.kind==='answer'&&questionDone&&!answerDone){
    if(q.mode==='supported')await chooseSupportedAnswer(btn,q);else await chooseFullAnswer(btn,q);
  }
}

async function chooseSupportedQuestion(btn,q){
  const word=btn.dataset.word;
  if(word!==q.item.questionPhrase){wrongTile(btn);return;}
  const slot=document.getElementById('qSlot0');
  await flyInto(btn,slot,word);slot.className='built-word';slot.textContent=word;btn.classList.add('moved');btn.disabled=true;
  qBuilt=1;questionDone=true;
  document.querySelectorAll('#questionBank .word-tile').forEach(b=>b.disabled=true);
  setAnswerLocked(false);document.querySelectorAll('#answerBank .word-tile').forEach(b=>b.disabled=false);
  setFeedback('');setListenNote(instructionForCurrentState());
}

async function chooseSupportedAnswer(btn,q){
  const expected=[q.item.firstFeeling,q.item.secondFeeling][aBuilt],word=btn.dataset.word;
  if(word!==expected){wrongTile(btn);return;}
  const isFinalFeeling=aBuilt===1;if(isFinalFeeling)lasinMotivationSignal('question-completed');
  const slot=document.getElementById('aSlot'+aBuilt);
  await flyInto(btn,slot,word);slot.className='built-word';slot.textContent=word;btn.classList.add('moved');btn.disabled=true;aBuilt++;
  if(aBuilt===2){
    answerDone=true;document.querySelectorAll('#answerBank .word-tile').forEach(b=>b.disabled=true);
    setFeedback('Great job!');setListenNote('Great job!');finishQuestionWhenSafe();
  }else{
    setFeedback('Good! Now choose the second feeling.');
  }
}

async function chooseFullQuestion(btn,q){
  const expected=q.item.questionChunks[qBuilt],word=btn.dataset.word;
  if(word!==expected){wrongTile(btn);return;}
  const target=document.getElementById('questionArea');
  await flyInto(btn,target,word);
  const ph=document.getElementById('qBuildTarget');if(ph)ph.remove();
  const node=document.createElement('span');node.className='built-word';node.textContent=word;target.appendChild(node);
  btn.classList.add('moved');btn.disabled=true;qBuilt++;
  if(qBuilt===q.item.questionChunks.length){
    questionDone=true;document.querySelectorAll('#questionBank .word-tile').forEach(b=>b.disabled=true);
    setAnswerLocked(false);document.querySelectorAll('#answerBank .word-tile').forEach(b=>b.disabled=false);
    setFeedback('');setListenNote(instructionForCurrentState());
  }
}

async function chooseFullAnswer(btn,q){
  const expected=q.item.answerChunks[aBuilt],word=btn.dataset.word;
  if(word!==expected){wrongTile(btn);return;}
  const isFinalAnswerChunk=aBuilt===q.item.answerChunks.length-1;if(isFinalAnswerChunk)lasinMotivationSignal('question-completed');
  const target=document.getElementById('answerArea');
  await flyInto(btn,target,word);
  const ph=document.getElementById('aBuildTarget');if(ph)ph.remove();
  const node=document.createElement('span');node.className='built-word';node.textContent=word;target.appendChild(node);
  btn.classList.add('moved');btn.disabled=true;aBuilt++;
  if(aBuilt===q.item.answerChunks.length){
    answerDone=true;document.querySelectorAll('#answerBank .word-tile').forEach(b=>b.disabled=true);
    setFeedback('Great job!');setListenNote('Great job!');finishQuestionWhenSafe();
  }
}

function finishQuestionWhenSafe(){pendingFinish=true;maybeFinishQuestion();}
function maybeFinishQuestion(){
  if(!pendingFinish)return;
  if(audioPlaying||(currentAudio&&!currentAudio.paused&&!currentAudio.ended))return;
  pendingFinish=false;setAudioButtons(false,false);
  finishTimer=setTimeout(()=>{finishTimer=null;showBravo();},320);
}

function playSuccessChime(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ctx=new AC(),now=ctx.currentTime;
    [523.25,659.25,783.99].forEach((f,k)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12,now+.02+k*.04);g.gain.exponentialRampToValueAtTime(.0001,now+.34+k*.05);
      o.connect(g);g.connect(ctx.destination);o.start(now+k*.05);o.stop(now+.42+k*.06);
    });
    setTimeout(()=>ctx.close&&ctx.close(),900);
  }catch(e){}
}

function showBravo(){
  playSuccessChime();
  const overlay=document.createElement('div');overlay.className='celebration';
  overlay.innerHTML='<div class="celebration-core"><div class="celebration-title">BRAVO!</div><div class="celebration-sub">Excellent work!</div></div>';
  document.body.appendChild(overlay);
  for(let i=0;i<30;i++){
    const s=document.createElement('span');s.className='star';s.textContent='★';
    s.style.left=(44+Math.random()*12)+'%';s.style.top=(43+Math.random()*14)+'%';
    const angle=Math.random()*Math.PI*2,dist=130+Math.random()*340;
    s.style.setProperty('--dx',Math.cos(angle)*dist+'px');s.style.setProperty('--dy',Math.sin(angle)*dist+'px');
    s.style.setProperty('--rot',(Math.random()*720-360)+'deg');s.style.animationDelay=(Math.random()*.16)+'s';
    overlay.appendChild(s);
  }
  setTimeout(()=>{overlay.remove();lasinMotivationSignal('question-settled');if(currentIndex<QUESTIONS.length-1){currentIndex++;renderQuestion();}else renderComplete();},BRAVO_MS);
}

function renderComplete(){
  stopAudio();
  screenEl.innerHTML=`<section class="complete"><h2>Great job!</h2><p>You finished all ${QUESTIONS.length} questions.</p><button class="restart" id="restartBtn" type="button">Play again</button></section>`;
  document.getElementById('restartBtn').addEventListener('click',renderIntro);
}

function unlockMobileAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ctx=new AC(),o=ctx.createOscillator(),g=ctx.createGain();g.gain.value=0;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.01);
    if(ctx.state==='suspended')ctx.resume();setTimeout(()=>ctx.close&&ctx.close(),100);
  }catch(e){}
}

document.addEventListener('pointerdown',unlockMobileAudio,{once:true,passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAudio();});
window.addEventListener('pagehide',stopAudio);
window.addEventListener('beforeunload',stopAudio);

window.LASIN={DATA,renderIntro,allAudioEmbedded,stopAudio};
renderIntro();

})();
</script>
