/script>\n\u003cscript>\n(() => {\n'use strict';\n\n/* LASIN v3.0 scoring bridge — Exercise 02. */\nlet LASIN_CHILD_ACTIVE=false, LASIN_RESTORE_INDEX=0;\nfunction lasinSend(action,payload={}){ try{parent.postMessage({channel:'LASIN_MOTIVATION_V3',action,payload:Object.assign({exerciseId:'exercise-02'},payload)},'*');}catch(e){} }\nfunction lasinMeta(){const r=DATA.rounds[roundIndex];if(!r)return null;return {questionId:String(roundIndex+1),localIndex:roundIndex+1,responseMode:r.mode==='complete'?'selection':'tiles',expectedAnswer:null,sourceQuestionId:r.id};}\nfunction lasinReady(){const m=lasinMeta();if(LASIN_CHILD_ACTIVE&&m)lasinSend('question-ready',m);}\nfunction lasinMistake(){const m=lasinMeta();if(m)lasinSend('question-mistake',m);}\nfunction lasinComplete(){const m=lasinMeta();if(m)lasinSend('question-completed',m);}\nfunction lasinExerciseFinished(){lasinSend('exercise-finished',{});}\nwindow.addEventListener('message',event=>{const d=event.data||{};if(d.channel!=='LASIN_MOTIVATION_V3'||d.action!=='lasin:set-active')return;const p=d.payload||{};if(p.exerciseId!=='exercise-02')return;if(Number.isFinite(Number(p.resumeLocalIndex)))LASIN_RESTORE_INDEX=Math.max(0,Math.min(DATA.rounds.length-1,Number(p.resumeLocalIndex)-1));LASIN_CHILD_ACTIVE=!!p.active;if(!LASIN_CHILD_ACTIVE){stopAudio();return;}if(stage!=='intro'&&stage!=='complete'&&stage!=='bravo'&&!mandatoryRightDone)renderRound(roundIndex);});\nsetTimeout(()=>lasinSend('child-ready',{}),0);\n\nconst DATA = JSON.parse(document.getElementById('lesson-data').textContent);\nconst screen = document.getElementById('screen');\nconst ENTRY_DELAY = 800;\nconst REPEAT_GAP = 500;\nconst SIDE_HANDOFF = 500;\nconst WRONG_CLEAR = 900;\nconst BRAVO_TIME = 2100;\nlet roundIndex = 0;\nlet audioToken = 0;\nlet currentAudio = new Audio();\ncurrentAudio.preload = 'auto';\ncurrentAudio.setAttribute('playsinline','');\ncurrentAudio.setAttribute('webkit-playsinline','');\nlet audioTimers = new Set();\nlet uiTimers = new Set();\nlet wrongResetTimer = null;\nlet stage = 'intro';\nlet mandatoryRightDone = false;\nlet rightSequenceRunning = false;\nlet pendingRoundFinish = false;\nlet builtCount = 0;\nlet reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;\nlet audioCtx = null;\n\nconst audioSleep = ms => new Promise(resolve => {\n  const id = setTimeout(() => { audioTimers.delete(id); resolve(); }, ms);\n  audioTimers.add(id);\n});\nfunction clearAudioTimers(){ for(const id of audioTimers) clearTimeout(id); audioTimers.clear(); }\nfunction clearUITimers(){ for(const id of uiTimers) clearTimeout(id); uiTimers.clear(); wrongResetTimer=null; }\nfunction scheduleUI(fn,ms){ const id=setTimeout(()=>{ uiTimers.delete(id); if(wrongResetTimer===id) wrongResetTimer=null; fn(); },ms); uiTimers.add(id); return id; }\nfunction clearWrongReset(){ if(wrongResetTimer){ clearTimeout(wrongResetTimer); uiTimers.delete(wrongResetTimer); wrongResetTimer=null; } }\nfunction clearTransientUI(){ clearUITimers(); document.querySelectorAll('.fly-tile,.celebration').forEach(el=>el.remove()); }\nfunction headphones(){ return '\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M12 3a8 8 0 0 0-8 8v6a3 3 0 0 0 3 3h2v-8H6v-1a6 6 0 0 1 12 0v1h-3v8h2a3 3 0 0 0 3-3v-6a8 8 0 0 0-8-8z\"/>\u003c/svg>'; }\nfunction audioReady(){ return Object.values(DATA.audio).every(v => typeof v === 'string' && v.length > 0); }\nfunction persistData(){ document.getElementById('lesson-data').textContent = JSON.stringify(DATA).replace(/\u003c\\//g,'\u003c\\\\/'); }\nfunction stopAudio(){\n  audioToken++;\n  clearAudioTimers();\n  try{ currentAudio.pause(); currentAudio.currentTime = 0; }catch(e){}\n  document.querySelectorAll('.audio-btn').forEach(b => b.classList.remove('playing'));\n  rightSequenceRunning = false;\n}\nasync function unlockAudio(){\n  try{\n    if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }\n    if(audioCtx.state === 'suspended') await audioCtx.resume();\n    const silent = new Audio('assets/audio/audio_001_c0230a478972.wav');\n    silent.volume = 0.001; await silent.play(); silent.pause();\n  }catch(e){}\n}\nasync function playClip(src, btn, token){\n  if(!src || token !== audioToken) return false;\n  currentAudio.pause(); currentAudio.currentTime = 0; currentAudio.src = src;\n  if(btn) btn.classList.add('playing');\n  return await new Promise(resolve => {\n    let done = false;\n    const finish = ok => {\n      if(done) return; done = true;\n      currentAudio.onended = null; currentAudio.onerror = null;\n      if(btn) btn.classList.remove('playing');\n      resolve(ok);\n    };\n    currentAudio.onended = () => finish(token === audioToken);\n    currentAudio.onerror = () => finish(false);\n    currentAudio.play().catch(() => finish(false));\n  });\n}\nasync function playTwice(src, btn, token){\n  if(!await playClip(src,btn,token)) return false;\n  if(token !== audioToken) return false;\n  await audioSleep(REPEAT_GAP);\n  if(token !== audioToken) return false;\n  return await playClip(src,btn,token);\n}\nfunction progressMarkup(){\n  const current = roundIndex + 1, total = DATA.rounds.length, pct = (current/total)*100;\n  return `\u003cdiv class=\"progress-wrap\">\u003cdiv class=\"progress-meta\">${current} / ${total}\u003c/div>\u003cdiv class=\"progress-track\" role=\"progressbar\" aria-valuemin=\"1\" aria-valuemax=\"${total}\" aria-valuenow=\"${current}\">\u003cdiv class=\"progress-fill\" style=\"width:${pct}%\">\u003c/div>\u003c/div>\u003c/div>`;\n}\nfunction renderIntro(){\n  stopAudio(); clearTransientUI(); stage='intro'; roundIndex=0; builtCount=0; mandatoryRightDone=false; pendingRoundFinish=false;\n  const ready = audioReady();\n  screen.innerHTML = `\u003csection class=\"intro\">\u003ch1>${escapeHTML(DATA.title)}\u003c/h1>\u003cbutton class=\"start\" id=\"startBtn\" ${ready?'':'disabled'}>Start\u003c/button>${ready?'':setupMarkup()}\u003c/section>`;\n  const start = document.getElementById('startBtn');\n  start.addEventListener('click', async () => { await unlockAudio(); renderRound(LASIN_RESTORE_INDEX||0); });\n  bindSetup();\n}\nfunction setupMarkup(){\n  const keys=Object.keys(DATA.audioFiles), count=keys.length;\n  const wordCount=keys.filter(k=>k.startsWith('word_')).length;\n  const sentenceCount=keys.filter(k=>k.startsWith('sentence_')).length;\n  return `\u003cdiv class=\"audio-setup\" id=\"audioSetup\">\u003cdiv class=\"audio-setup-title\">Original Audio Setup\u003c/div>\u003cdiv class=\"audio-setup-text\">Select the ${count} original MP3 files required for this lesson: ${wordCount} individual color recordings and ${sentenceCount} complete-sentence recordings. Extra MP3s are safely ignored. The original files are embedded without re-encoding.\u003c/div>\u003cbutton class=\"audio-setup-btn\" id=\"embedAudio\">Embed the Original MP3s\u003c/button>\u003cinput id=\"audioFiles\" type=\"file\" accept=\"audio/mpeg,.mp3\" multiple hidden>\u003cdiv class=\"audio-setup-track\">\u003cdiv class=\"audio-setup-fill\" id=\"audioFill\">\u003c/div>\u003c/div>\u003cdiv class=\"audio-setup-status\" id=\"audioStatus\">Waiting for the ${count} original MP3 files.\u003c/div>\u003c/div>`;\n}\nfunction normalizeName(name){\n  return String(name||'').normalize('NFKC').replace(/[’‘]/g,\"'\").split(/[\\\\/]/).pop().trim().toLowerCase().replace(/\\s+/g,' ').replace(/\\.+mp3$/i,'.mp3');\n}\nfunction bindSetup(){\n  const btn=document.getElementById('embedAudio'), input=document.getElementById('audioFiles');\n  if(!btn||!input) return;\n  btn.addEventListener('click',()=>input.click());\n  input.addEventListener('change',()=>embedFiles([...input.files]));\n}\nasync function embedFiles(files){\n  const status=document.getElementById('audioStatus'), fill=document.getElementById('audioFill');\n  const byName=new Map(files.map(f=>[normalizeName(f.name),f]));\n  const expected=Object.entries(DATA.audioFiles);\n  const missing=expected.filter(([,name])=>!byName.has(normalizeName(name)));\n  if(missing.length){\n    status.className='audio-setup-status bad'; status.textContent='Missing: '+missing.map(x=>x[1]).join(', '); fill.style.width='0%'; return;\n  }\n  let done=0;\n  try{\n    for(const [key,name] of expected){\n      const f=byName.get(normalizeName(name));\n      DATA.audio[key]=await readDataURL(f); done++; fill.style.width=((done/expected.length)*100)+'%';\n    }\n  }catch(e){\n    status.className='audio-setup-status bad'; status.textContent='One or more MP3 files could not be read. Please select the originals again.'; fill.style.width='0%'; return;\n  }\n  if(!audioReady()){\n    status.className='audio-setup-status bad'; status.textContent='Audio validation failed. Please select the files again.'; return;\n  }\n  persistData();\n  status.className='audio-setup-status ok'; status.textContent='Original MP3s embedded successfully. The full activity is ready.';\n  const start=document.getElementById('startBtn'); start.disabled=false;\n  await audioSleep(180);\n  exportCleanLesson();\n}\nfunction readDataURL(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); }); }\nfunction exportCleanLesson(){\n  const clone=document.documentElement.cloneNode(true);\n  const setup=clone.querySelector('#audioSetup'); if(setup) setup.remove();\n  const start=clone.querySelector('#startBtn'); if(start) start.removeAttribute('disabled');\n  const clean='\u003c!doctype html>\\n'+clone.outerHTML;\n  const blob=new Blob([clean],{type:'text/html;charset=utf-8'}), url=URL.createObjectURL(blob), a=document.createElement('a');\n  a.href=url; a.download=DATA.exportFilename || 'LASIN_Grammar_Exercise_02_FULL_EMBEDDED.html'; document.body.appendChild(a); a.click(); a.remove();\n  setTimeout(()=>URL.revokeObjectURL(url),1500);\n}\nfunction renderRound(index){\n  stopAudio(); clearTransientUI(); roundIndex=index; stage='left'; mandatoryRightDone=false; pendingRoundFinish=false; builtCount=0;\n  const r=DATA.rounds[roundIndex];\n  const rightTitle=r.mode==='complete'?'Then listen and choose.':'Then listen and make the sentence.';\n  screen.innerHTML=`\u003csection class=\"stage\">${progressMarkup()}\u003cdiv class=\"halves\">\n    \u003csection class=\"half\" id=\"leftHalf\" aria-label=\"Picture and word listening\">\n      \u003ch2 class=\"half-title\">Look and listen.\u003c/h2>\n      \u003cbutton class=\"audio-btn\" id=\"leftAudio\" aria-label=\"Listen again to ${escapeHTML(r.item)}\">${headphones()}\u003c/button>\n      \u003cdiv class=\"picture-card\">\u003cimg src=\"${DATA.pictures[r.pictureKey]}\" alt=\"${escapeHTML(r.item)}\">\u003c/div>\n      \u003cdiv class=\"left-caption\" id=\"leftCaption\">Listen carefully.\u003c/div>\n    \u003c/section>\n    \u003csection class=\"half locked\" id=\"rightHalf\" aria-label=\"Grammar listening task\">\n      \u003ch2 class=\"half-title\">${rightTitle}\u003c/h2>\n      \u003cbutton class=\"audio-btn\" id=\"rightAudio\" aria-label=\"Listen again to the sentence\" disabled>${headphones()}\u003c/button>\n      \u003cdiv class=\"task-wrap\" id=\"taskWrap\">${taskMarkup(r)}\u003c/div>\n    \u003c/section>\n  \u003c/div>\u003c/section>`;\n  bindRound(r);\n  window.scrollTo({top:0,behavior:'auto'});\n  beginMandatoryFlow(r);\n}\nfunction taskMarkup(r){\n  const punctuation=escapeHTML(r.punctuation || '.');\n  if(r.mode==='complete'){\n    return `\u003cdiv class=\"listen-note\" id=\"listenNote\">Listen to the whole sentence twice first.\u003c/div>\n      \u003cdiv class=\"sentence-area\" id=\"sentenceArea\" aria-label=\"Incomplete sentence\">\u003cspan>${escapeHTML(r.stem)}\u003c/span>\u003cspan class=\"answer-slot\" id=\"answerSlot\">...\u003c/span>\u003cspan class=\"period\">${punctuation}\u003c/span>\u003c/div>\n      \u003cdiv class=\"word-bank\" id=\"wordBank\">${r.choices.map(w=>`\u003cbutton class=\"word-tile\" data-word=\"${escapeAttr(w)}\" disabled>${escapeHTML(w)}\u003c/button>`).join('')}\u003c/div>\n      \u003cdiv class=\"feedback\" id=\"feedback\" aria-live=\"polite\">\u003c/div>`;\n  }\n  return `\u003cdiv class=\"listen-note\" id=\"listenNote\">Listen to the whole sentence twice first.\u003c/div>\n    \u003cdiv class=\"sentence-area\" id=\"sentenceArea\" aria-label=\"Build the sentence\">\u003cspan class=\"answer-slot\" id=\"buildTarget\">...\u003c/span>\u003c/div>\n    \u003cdiv class=\"word-bank\" id=\"wordBank\">${r.chunks.map(w=>`\u003cbutton class=\"word-tile\" data-word=\"${escapeAttr(w)}\" disabled>${escapeHTML(w)}\u003c/button>`).join('')}\u003c/div>\n    \u003cdiv class=\"feedback\" id=\"feedback\" aria-live=\"polite\">\u003c/div>`;\n}\nfunction bindRound(r){\n  document.getElementById('leftAudio').addEventListener('click',()=>manualReplay(r.leftAudio,'leftAudio'));\n  document.getElementById('rightAudio').addEventListener('click',()=>manualReplay(r.rightAudio,'rightAudio'));\n  if(r.mode==='complete') document.querySelectorAll('.word-tile').forEach(b=>b.addEventListener('click',()=>chooseComplete(b,r)));\n  else document.querySelectorAll('.word-tile').forEach(b=>b.addEventListener('click',()=>chooseChunk(b,r)));\n}\nasync function beginMandatoryFlow(r){\n  if(!LASIN_CHILD_ACTIVE) return;\n  const token=++audioToken; clearAudioTimers();\n  const leftBtn=document.getElementById('leftAudio'); leftBtn.disabled=true;\n  await audioSleep(ENTRY_DELAY); if(token!==audioToken) return;\n  await playTwice(DATA.audio[r.leftAudio],leftBtn,token); if(token!==audioToken) return;\n  const caption=document.getElementById('leftCaption'); if(caption) caption.textContent='You can listen again anytime.';\n  await audioSleep(SIDE_HANDOFF); if(token!==audioToken) return;\n  const rightHalf=document.getElementById('rightHalf'), rightBtn=document.getElementById('rightAudio');\n  rightHalf.classList.remove('locked'); rightHalf.classList.add('open');\n  if(innerWidth\u003c=900) rightHalf.scrollIntoView({behavior:reducedMotion?'auto':'smooth',block:'start'});\n  rightSequenceRunning=true;\n  await playTwice(DATA.audio[r.rightAudio],rightBtn,token); if(token!==audioToken) return;\n  rightSequenceRunning=false; mandatoryRightDone=true; stage='answer';\n  leftBtn.disabled=false; leftBtn.classList.add('ready'); rightBtn.disabled=false; rightBtn.classList.add('ready');\n  unlockChoices();\n  lasinReady();\n  const note=document.getElementById('listenNote'); if(note) note.textContent=r.mode==='complete'?'Now choose the correct word.':'Now make the sentence in the correct order.';\n}\nfunction unlockChoices(){ document.querySelectorAll('.word-tile').forEach(b=>b.disabled=false); }\nasync function manualReplay(audioKey,btnId){\n  if(!mandatoryRightDone) return;\n  stopAudio();\n  const token=++audioToken, btn=document.getElementById(btnId); if(!btn) return;\n  await playTwice(DATA.audio[audioKey],btn,token);\n  if(token===audioToken && pendingRoundFinish) maybeFinishRound();\n}\nfunction setFeedback(text,bad=false){ const f=document.getElementById('feedback'); if(!f) return; f.textContent=text; f.className='feedback'+(bad?' bad':''); }\nfunction wrongTile(btn){\n  lasinMistake();\n  clearWrongReset();\n  btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('is-wrong','shake'); setFeedback('Try again!',true);\n  wrongResetTimer=scheduleUI(()=>{ btn.classList.remove('is-wrong','shake'); setFeedback(''); },WRONG_CLEAR);\n}\nasync function chooseComplete(btn,r){\n  if(!mandatoryRightDone || btn.disabled) return;\n  const word=btn.dataset.word;\n  if(word!==r.correct){ wrongTile(btn); return; }\n  clearWrongReset();\n  document.querySelectorAll('.word-tile').forEach(b=>b.disabled=true);\n  const slot=document.getElementById('answerSlot');\n  await flyInto(btn,slot,word);\n  slot.className='built-word'; slot.textContent=word;\n  btn.classList.add('moved'); setFeedback('Great job!');\n  finishRoundWhenSafe();\n}\nasync function chooseChunk(btn,r){\n  if(!mandatoryRightDone || btn.disabled) return;\n  const word=btn.dataset.word, expected=r.answerChunks[builtCount];\n  if(word!==expected){ wrongTile(btn); return; }\n  clearWrongReset(); setFeedback('');\n  const target=document.getElementById('sentenceArea');\n  await flyInto(btn,target,word);\n  btn.classList.add('moved'); btn.disabled=true;\n  const placeholder=document.getElementById('buildTarget'); if(placeholder) placeholder.remove();\n  const node=document.createElement('span'); node.className='built-word'; node.textContent=word; target.appendChild(node);\n  builtCount++;\n  if(builtCount===r.answerChunks.length){\n    const punctuation=document.createElement('span'); punctuation.className='period'; punctuation.textContent=r.punctuation || '.'; target.appendChild(punctuation);\n    document.querySelectorAll('.word-tile').forEach(b=>b.disabled=true);\n    setFeedback('Great job!'); finishRoundWhenSafe();\n  }\n}\nfunction flyInto(btn,target,text){\n  return new Promise(resolve=>{\n    if(reducedMotion){ resolve(); return; }\n    const a=btn.getBoundingClientRect(), b=target.getBoundingClientRect();\n    const clone=btn.cloneNode(true); clone.className='word-tile fly-tile'; clone.disabled=true; clone.textContent=text;\n    clone.style.left=a.left+'px'; clone.style.top=a.top+'px'; clone.style.width=a.width+'px'; clone.style.height=a.height+'px';\n    document.body.appendChild(clone);\n    const dx=(b.left+b.width/2)-(a.left+a.width/2), dy=(b.top+b.height/2)-(a.top+a.height/2);\n    requestAnimationFrame(()=>{ clone.style.transform=`translate(${dx}px,${dy}px) scale(.82)`; clone.style.opacity='.12'; });\n    setTimeout(()=>{ clone.remove(); resolve(); },340);\n  });\n}\nfunction finishRoundWhenSafe(){ lasinComplete(); pendingRoundFinish=true; maybeFinishRound(); }\nfunction maybeFinishRound(){\n  if(!pendingRoundFinish) return;\n  if(currentAudio && !currentAudio.paused) return;\n  pendingRoundFinish=false;\n  scheduleUI(showBravo,350);\n}\nfunction successChime(){\n  try{\n    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();\n    const now=audioCtx.currentTime, freqs=[523.25,659.25,783.99,1046.50];\n    freqs.forEach((f,i)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,now+i*.11); g.gain.exponentialRampToValueAtTime(.13,now+i*.11+.02); g.gain.exponentialRampToValueAtTime(.0001,now+i*.11+.24); o.connect(g).connect(audioCtx.destination); o.start(now+i*.11); o.stop(now+i*.11+.26); });\n  }catch(e){}\n}\nfunction showBravo(){\n  stage='bravo'; successChime();\n  const layer=document.createElement('div'); layer.className='celebration'; layer.innerHTML='\u003cdiv class=\"celebration-core\">\u003cdiv class=\"celebration-title\">BRAVO!\u003c/div>\u003cdiv class=\"celebration-sub\">Excellent work!\u003c/div>\u003c/div>';\n  for(let i=0;i\u003c30;i++){\n    const s=document.createElement('div'); s.className='star'; s.textContent='★'; s.style.left=(46+Math.random()*8)+'%'; s.style.top=(42+Math.random()*12)+'%';\n    s.style.setProperty('--dx',((Math.random()-.5)*1100)+'px'); s.style.setProperty('--dy',((Math.random()-.5)*760)+'px'); s.style.setProperty('--rot',((Math.random()-.5)*680)+'deg'); s.style.animationDelay=(Math.random()*.16)+'s'; layer.appendChild(s);\n  }\n  document.body.appendChild(layer);\n  scheduleUI(()=>{ layer.remove(); if(roundIndex+1\u003cDATA.rounds.length){ renderRound(roundIndex+1); }else renderComplete(); },BRAVO_TIME);\n}\nfunction renderComplete(){\n  stopAudio(); clearTransientUI(); stage='complete'; builtCount=0; mandatoryRightDone=false; pendingRoundFinish=false;\n  screen.innerHTML=`\u003csection class=\"complete\">\u003ch2>Great job!\u003c/h2>\u003cp>You finished all ${DATA.rounds.length} questions.\u003c/p>\u003cbutton class=\"restart\" id=\"restart\">Play again\u003c/button>\u003c/section>`;\n  document.getElementById('restart').addEventListener('click',renderIntro);\n  window.scrollTo({top:0,behavior:'auto'});\n  lasinExerciseFinished();\n}\nfunction escapeHTML(v){ function normalizeId(v){return String(v==null?'':v).trim()} function normalizeMode(v){return String(v==null?'':v).trim().toLowerCase()} function now(){return performance&&typeof performance.now==='function'?performance.now():Date.now()} function questionKey(e,q){return `${normalizeId(e)}::${normalizeId(q)}`}

function ensureQuestion(exerciseId,questionId,localIndex){const exId=normalizeId(exerciseId),qId=normalizeId(questionId);if(!exId||!qId)return null;const key=questionKey(exId,qId);if(!state.questions.has(key))state.questions.set(key,{key,exerciseId:exId,questionId:qId,localIndex:+localIndex||null,ready:false,hadMistake:false,completed:false,classification:null,pointsEarned:0,elapsedMs:0,runningSince:null,responseMode:'',expectedAnswer:null,matchedExpectedAnswer:null,typingAllowanceOverrideSeconds:null,typingAllowanceSeconds:0,rawElapsedSeconds:null,effectiveElapsedSeconds:null});const q=state.questions.get(key);if(+localIndex&&!q.localIndex)q.localIndex=+localIndex;return q}

function normalizeExpectedAnswer(answer){if(Array.isArray(answer)){const first=answer.find(v=>typeof v==='string'&&v.trim());answer=first==null?'':first}return String(answer==null?'':answer).trim().replace(/\s+/g,' ')}

function questionCompleted(payload){const q=resolveQuestion(payload);if(!state.started||state.finished||!q)return {accepted:false};if(q.completed)return {accepted:false,reason:'already-completed'};if(payload&&payload.hadMistake===true)q.hadMistake=true;if(payload&&payload.matchedExpectedAnswer!=null)q.matchedExpectedAnswer=payload.matchedExpectedAnswer;const elapsedMs=effectiveElapsedMs(q);pauseQuestion(q);const rawSeconds=Math.max(0,elapsedMs/1000),answerForFairness=q.matchedExpectedAnswer!=null?q.matchedExpectedAnswer:q.expectedAnswer,allowance=calculateTypingAllowanceSeconds({responseMode:q.responseMode,expectedAnswer:answerForFairness,typingAllowanceOverrideSeconds:q.typingAllowanceOverrideSeconds}),effectiveSeconds=Math.max(0,rawSeconds-allowance),clean=!q.hadMistake,earned=clean?pointsForEffectiveSeconds(effectiveSeconds):0;q.completed=true;q.elapsedMs=elapsedMs;q.rawElapsedSeconds=rawSeconds;q.typingAllowanceSeconds=allowance;q.effectiveElapsedSeconds=effectiveSeconds;q.classification=clean?'correct':'wrong';q.pointsEarned=earned;state.points+=earned;if(clean)state.correct++;else state.wrong++;if(clean&&earned>0)showPointsCelebration(earned);updateHUD(true);persist();finishIfComplete(q.exerciseId);return {accepted:true}}

function serializePersistentQuestion(q){return {key:q.key,exerciseId:q.exerciseId,questionId:q.questionId,localIndex:q.localIndex,ready:q.ready,hadMistake:q.hadMistake,completed:q.completed,classification:q.classification,pointsEarned:q.pointsEarned,elapsedMs:effectiveElapsedMs(q),responseMode:q.responseMode,expectedAnswer:q.expectedAnswer,matchedExpectedAnswer:q.matchedExpectedAnswer,typingAllowanceOverrideSeconds:q.typingAllowanceOverrideSeconds,typingAllowanceSeconds:q.typingAllowanceSeconds,rawElapsedSeconds:q.rawElapsedSeconds,effectiveElapsedSeconds:q.effectiveElapsedSeconds}}
function persist(){if(hydrating||!CONFIG.persistSession)return;try{sessionStorage.setItem(CONFIG.persistenceKey,JSON.stringify({version:CONFIG.version,studentName:state.studentName,started:state.started,finished:state.finished,pendingFinish:state.pendingFinish,finalizingExerciseId:state.finalizingExerciseId,activeExerciseId:state.activeExerciseId,points:state.points,correct:state.correct,wrong:state.wrong,questions:[...state.questions.values()].map(serializePersistentQuestion),lastQuestionByExercise:[...state.lastQuestionByExercise.entries()]}))}catch(e){}}
function restore(){let saved=null;try{const raw=sessionStorage.getItem(CONFIG.persistenceKey);if(raw)saved=JSON.parse(raw)}catch(e){}if(saved&&saved.version===CONFIG.version){state.studentName=saved.studentName||'';state.started=!!saved.started;state.finished=!!saved.finished;state.pendingFinish=!!saved.pendingFinish;state.finalizingExerciseId=saved.finalizingExerciseId||null;state.activeExerciseId=state.exercises.has(saved.activeExerciseId)?saved.activeExerciseId:'vocab';state.points=+saved.points||0;state.correct=+saved.correct||0;state.wrong=+saved.wrong||0;(saved.questions||[]).forEach(s=>{const q=ensureQuestion(s.exerciseId,s.questionId,s.localIndex);Object.assign(q,{ready:!!s.ready,hadMistake:!!s.hadMistake,completed:!!s.completed,classification:s.classification||null,pointsEarned:+s.pointsEarned||0,elapsedMs:Math.max(0,+s.elapsedMs||0),runningSince:null,responseMode:normalizeMode(s.responseMode),expectedAnswer:s.expectedAnswer??null,matchedExpectedAnswer:s.matchedExpectedAnswer??null,typingAllowanceOverrideSeconds:s.typingAllowanceOverrideSeconds==null?null:+s.typingAllowanceOverrideSeconds,typingAllowanceSeconds:Math.max(0,+s.typingAllowanceSeconds||0),rawElapsedSeconds:s.rawElapsedSeconds==null?null:+s.rawElapsedSeconds,effectiveElapsedSeconds:s.effectiveElapsedSeconds==null?null:+s.effectiveElapsedSeconds})});state.lastQuestionByExercise=new Map(Array.isArray(saved.lastQuestionByExercise)?saved.lastQuestionByExercise:[]);if(state.started){nameInput.value=state.studentName;startScreen.classList.add('hidden');root.classList.add('started')}if(state.finished){renderResults();resultsScreen.classList.remove('hidden')}}hydrating=false;updateHUD();updateNav();if(state.started)showExercise(state.activeExerciseId,{skipPersist:true});persist()}
function firstIncompleteIndex(exerciseId){const ex=state.exercises.get(exerciseId);if(!ex||!ex.scorable)return 1;for(let i=1;i<=ex.totalQuestions;i++){const q=state.questions.get(questionKey(exerciseId,String(i)));if(!q||!q.completed)return i}return 1}
const frames=new Map(),loaded=new Set();
function ensureFrame(exerciseId){if(frames.has(exerciseId))return frames.get(exerciseId);const frame=document.createElement('iframe');frame.className='lasin-lesson-frame';frame.title=state.exercises.get(exerciseId)?.label||exerciseId;frame.dataset.exercise=exerciseId;frame.setAttribute('allow','autoplay');frame.addEventListener('load',()=>{loaded.add(exerciseId);sendActiveToChild(exerciseId,exerciseId===state.activeExerciseId)});const srcNode=document.getElementById(`lasin-src-${exerciseId}`);frame.srcdoc=JSON.parse(srcNode.textContent);host.appendChild(frame);frames.set(exerciseId,frame);return frame}
function sendActiveToChild(exerciseId,active){const frame=frames.get(exerciseId);if(!frame||!frame.contentWindow)return;frame.contentWindow.postMessage({channel:CONFIG.messageChannel,action:'lasin:set-active',payload:{exerciseId,active,resumeLocalIndex:firstIncompleteIndex(exerciseId)}},'*')}
function showExercise(exerciseId,opt={}){if(!state.exercises.has(exerciseId))return;const old=state.activeExerciseId;if(old!==exerciseId){pauseActive();sendActiveToChild(old,false)}state.activeExerciseId=exerciseId;const frame=ensureFrame(exerciseId);frames.forEach((f,id)=>f.classList.toggle('active',id===exerciseId));if(loaded.has(exerciseId))sendActiveToChild(exerciseId,true);if(state.started&&!state.finished&&isScorableExercise(exerciseId))resumeQuestionForExercise(exerciseId);updateHUD();updateNav();if(!opt.skipPersist)persist()}
function updateNav(){document.querySelectorAll('.lasin-nav-btn').forEach(b=>{const id=b.dataset.exercise;b.classList.toggle('active',id===state.activeExerciseId);const ex=state.exercises.get(id);if(ex&&ex.scorable){let c=0;for(let i=1;i<=ex.totalQuestions;i++){const q=state.questions.get(questionKey(id,String(i)));if(q&&q.completed)c++}b.querySelector('.nav-count')?.remove();if(c){const s=document.createElement('span');s.className='nav-count';s.textContent=`${c}/${ex.totalQuestions}`;b.appendChild(s)}}})}
function start(name){const clean=String(name??nameInput.value??'').trim();if(!clean){startError.textContent='Please type your name first.';nameInput.focus();return false}state.studentName=clean;state.started=true;state.finished=false;state.pendingFinish=false;startError.textContent='';startScreen.classList.add('hidden');resultsScreen.classList.add('hidden');root.classList.add('started');updateHUD();persist();showExercise(state.activeExerciseId);return true}
function reset(){try{sessionStorage.removeItem(CONFIG.persistenceKey)}catch(e){}location.reload()}
window.addEventListener('message',event=>{const data=event.data||{};if(data.channel!==CONFIG.messageChannel||typeof data.action!=='string')return;let sourceExercise=null;for(const [id,f] of frames){if(f.contentWindow===event.source){sourceExercise=id;break}}if(!sourceExercise)return;const p=Object.assign({},data.payload||{},{exerciseId:sourceExercise});if(data.action==='child-ready'){sendActiveToChild(sourceExercise,sourceExercise===state.activeExerciseId);return}if(sourceExercise!==state.activeExerciseId&&['question-ready','question-mistake','question-completed'].includes(data.action))return;if(data.action==='question-ready')questionReady(p);else if(data.action==='question-mistake')questionMistake(p);else if(data.action==='question-completed')questionCompleted(p);else if(data.action==='exercise-finished')onExerciseFinished(sourceExercise)});
document.querySelectorAll('.lasin-nav-btn').forEach(b=>b.addEventListener('click',()=>showExercise(b.dataset.exercise)));startBtn.addEventListener('click',()=>start());nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')start()});restartBtn.addEventListener('click',reset);window.addEventListener('pagehide',pauseActive);document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseActive();sendActiveToChild(state.activeExerciseId,false)}else if(state.started&&!state.finished){sendActiveToChild(state.activeExerciseId,true);resumeQuestionForExercise(state.activeExerciseId)}});
window.LASINMotivation=Object.freeze({version:CONFIG.version,config:CONFIG,getState:()=>({started:state.started,finished:state.finished,studentName:state.studentName,activeExerciseId:state.activeExerciseId,totalQuestions:totalScoredQuestions(),answered:completedQuestions().length,correct:state.correct,wrong:state.wrong,points:state.points,maxPoints:maxPoints(),timerSeconds:CONFIG.timerSeconds}),calculateTypingAllowanceSeconds,pointsForEffectiveSeconds,reset});
restore();
})();
</script>
</body></html>
