n.picture-frame img{\n  display:block;\n  width:100%;\n  height:100%;\n  object-fit:contain;\n  object-position:center;\n  image-rendering:auto;\n}\n.word-box{\n  width:calc(100% - 6px);\n  min-height:54px;\n  margin-top:clamp(11px,1vw,15px);\n  padding:8px 8px;\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  text-align:center;\n  border-radius:13px;\n  background:var(--blue);\n  color:#fff;\n  box-shadow:0 7px 14px rgba(33,108,222,.16);\n  font-size:clamp(18px,1.45vw,25px);\n  line-height:1.08;\n  font-weight:700;\n  letter-spacing:.005em;\n}\n.audio-area{\n  width:100%;\n  margin-top:11px;\n  display:flex;\n  flex-direction:column;\n  align-items:center;\n  justify-content:flex-end;\n}\n.audio-btn{\n  width:58px;\n  height:58px;\n  flex:0 0 58px;\n  border:0;\n  border-radius:50%;\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  background:var(--blue);\n  color:#fff;\n  cursor:pointer;\n  box-shadow:0 8px 16px rgba(33,108,222,.18);\n  transition:transform .16s ease,background .16s ease,box-shadow .16s ease;\n}\n.audio-btn:hover{background:var(--blue-dark);transform:scale(1.045)}\n.audio-btn:active{transform:scale(.96)}\n.audio-btn svg{width:28px;height:28px;display:block}\n.audio-btn.playing{\n  background:var(--red);\n  box-shadow:0 0 0 7px var(--soft-red),0 9px 18px rgba(226,30,43,.18);\n  animation:pulse 1s ease-in-out infinite;\n}\n.tap-note{\n  min-height:17px;\n  margin-top:7px;\n  color:#79859A;\n  font-size:clamp(10px,.8vw,12.5px);\n  line-height:1.1;\n  text-align:center;\n  font-weight:650;\n}\n@keyframes pulse{\n  0%,100%{transform:scale(1)}\n  50%{transform:scale(1.09)}\n}\n\n/* ---------- NAV ---------- */\n.navbar{\n  width:var(--page-width);\n  margin:12px auto 0;\n  display:grid;\n  grid-template-columns:1fr auto 1fr;\n  align-items:center;\n  gap:12px;\n}\n.nav-btn{\n  min-width:150px;\n  min-height:54px;\n  border:0;\n  border-radius:15px;\n  background:var(--blue);\n  color:#fff;\n  font-size:20px;\n  font-weight:800;\n  cursor:pointer;\n  box-shadow:0 8px 18px rgba(33,108,222,.14);\n}\n.nav-btn.prev{justify-self:start}\n.nav-btn.next{justify-self:end}\n.nav-btn:disabled{\n  cursor:default;\n  background:#F4F6F9;\n  color:#939CAB;\n  box-shadow:none;\n}\n.dots{\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  gap:8px;\n  min-width:90px;\n}\n.dot{\n  width:12px;height:12px;padding:0;border:0;border-radius:50%;\n  background:#D2DCEB;cursor:pointer;transition:transform .15s ease,background .15s ease;\n}\n.dot.active{background:var(--blue);transform:scale(1.18)}\n\n/* partial page centering on wide layouts */\n.cards.partial-5{grid-template-columns:repeat(5,minmax(0,240px));justify-content:center}\n.cards.partial-4{grid-template-columns:repeat(4,minmax(0,260px));justify-content:center}\n.cards.partial-3{grid-template-columns:repeat(3,minmax(0,290px));justify-content:center}\n.cards.partial-2{grid-template-columns:repeat(2,minmax(0,320px));justify-content:center}\n.cards.partial-1{grid-template-columns:minmax(0,340px);justify-content:center}\n\n/* ---------- RESPONSIVE ---------- */\n@media(max-width:1350px){\n  :root{--page-width:min(1210px,97vw)}\n  .cards{grid-template-columns:repeat(6,minmax(0,1fr));gap:11px}\n  .cards > .card{grid-column:span 2}\n  .cards.page-items-5 .card:nth-child(4){grid-column:2 / span 2}\n  .cards.page-items-5 .card:nth-child(5){grid-column:4 / span 2}\n  .cards.partial-4,.cards.partial-3,.cards.partial-2,.cards.partial-1{\n    grid-template-columns:repeat(3,minmax(0,1fr));justify-content:stretch\n  }\n  .cards.partial-4 > .card,.cards.partial-3 > .card,.cards.partial-2 > .card,.cards.partial-1 > .card{grid-column:auto}\n  .word-box{font-size:clamp(17px,2vw,24px)}\n}\n@media(max-width:850px){\n  :root{--page-width:min(760px,98vw)}\n  #lessonScreen{\n    padding-top:max(10px,env(safe-area-inset-top));\n    padding-left:max(9px,env(safe-area-inset-left));\n    padding-right:max(9px,env(safe-area-inset-right));\n  }\n  .lesson-header{grid-template-columns:122px 1fr 122px;margin-bottom:10px}\n  .home-btn{min-height:46px;padding:0 12px;font-size:17px}\n  .page-pill{min-height:46px;padding:0 11px;font-size:14px}\n  .header-title{font-size:clamp(30px,5vw,40px)}\n  .header-sub{font-size:clamp(12px,2.5vw,18px)}\n  .cards{grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}\n  .cards > .card{grid-column:span 2}\n  .cards.page-items-5 .card:nth-child(4){grid-column:2 / span 2}\n  .cards.page-items-5 .card:nth-child(5){grid-column:4 / span 2}\n  .card{border-radius:19px;padding:8px}\n  .picture-frame{border-radius:15px;padding:7px}\n  .word-box{min-height:43px;margin-top:9px;border-radius:11px;font-size:clamp(15px,2.5vw,21px)}\n  .audio-btn{width:48px;height:48px;flex-basis:48px}\n  .audio-btn svg{width:23px;height:23px}\n  .nav-btn{min-width:125px;min-height:49px;font-size:17px}\n}\n@media(max-width:650px){\n  .home-panel{width:min(96vw,560px);border-radius:26px;padding:22px 14px}\n  .eyebrow{font-size:12px;letter-spacing:.12em;margin-bottom:14px}\n  .lesson-banner{\n    min-height:82px;\n    border-radius:18px;\n    padding:14px 8px;\n    font-size:clamp(14px,4.15vw,20px);\n    letter-spacing:-.035em;\n  }\n  .home-actions{margin-top:22px}\n  .vocab-btn{min-height:78px;border-radius:18px;font-size:clamp(32px,11vw,46px)}\n  .lesson-header{grid-template-columns:88px 1fr 0;margin-bottom:8px;gap:6px}\n  .home-btn{min-height:42px;padding:0 9px;font-size:14px;border-radius:12px}\n  .page-pill{display:none}\n  .header-title{font-size:clamp(28px,8vw,36px)}\n  .header-sub{\n    margin-top:5px;\n    font-size:clamp(10px,3.15vw,14px);\n    white-space:nowrap;\n  }\n  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}\n  .cards > .card{grid-column:auto}\n  .cards.partial-5,.cards.partial-4,.cards.partial-3,.cards.partial-2,.cards.partial-1{\n    grid-template-columns:repeat(2,minmax(0,1fr));justify-content:stretch\n  }\n  .cards.page-items-5 .card:last-child,\n  .cards.partial-1 .card:last-child,\n  .cards.partial-3 .card:last-child,\n  .cards.partial-5 .card:last-child{\n    grid-column:1 / -1;\n    width:calc(50% - 4px);\n    justify-self:center;\n  }\n  .card{padding:7px;border-radius:18px}\n  .picture-frame{padding:6px;border-radius:14px}\n  .word-box{\n    width:100%;\n    min-height:39px;\n    margin-top:8px;\n    padding:6px 5px;\n    border-radius:10px;\n    font-size:clamp(14px,4vw,18px);\n  }\n  .audio-area{margin-top:8px}\n  .audio-btn{width:45px;height:45px;flex-basis:45px}\n  .audio-btn svg{width:21px;height:21px}\n  .tap-note{font-size:9.5px;margin-top:6px}\n  .navbar{margin-top:8px}\n  .nav-btn{min-width:96px;min-height:45px;border-radius:12px;font-size:14px}\n  .dots{gap:6px;min-width:54px}\n  .dot{width:10px;height:10px}\n}\n@media(max-width:390px){\n  .cards{gap:6px}\n  .card{padding:6px}\n  .word-box{font-size:13.5px}\n  .audio-btn{width:42px;height:42px;flex-basis:42px}\n  .lesson-banner{font-size:13.8px}\n  .header-sub{font-size:10.5px}\n  .nav-btn{min-width:86px;font-size:13px}\n}\n@media(min-width:851px) and (max-height:760px){\n  #lessonScreen{padding-top:8px;padding-bottom:8px}\n  .lesson-header{margin-bottom:8px}\n  .card{padding:7px 9px}\n  .word-box{margin-top:8px;min-height:43px}\n  .audio-area{margin-top:7px}\n  .audio-btn{width:47px;height:47px;flex-basis:47px}\n  .tap-note{margin-top:5px}\n  .navbar{margin-top:7px}\n}\n@media(prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}\n}\n\n/* ---------- UNIT 02 • LESSON 02 • COLORS • FULL-VIEWPORT PAIRED CONTENT ---------- */\n/*\n  Two vocabulary concepts per page. Each concept is one horizontal teaching pair:\n  individual item on the left, matching “This is …” example on the right.\n\n  FULL-SCREEN RULE:\n  The lesson consumes the complete usable viewport on Windows, macOS, iPhone/iPad,\n  and Android. The header and navigation keep only the space they need; the two\n  learning rows automatically share every remaining pixel. Safe-area insets remain\n  protected. The layout reacts to actual viewport width/height rather than OS names.\n*/\n:root{\n  --page-width:100%;\n  --learning-font-size:clamp(38px,2.65vw,52px);\n  --learning-font-weight:800;\n  --learning-line-height:1.05;\n  --learning-letter-spacing:.005em;\n  --lesson-gap:clamp(5px,.65vmin,9px);\n}\n\nhtml,body{width:100%;height:100%}\n\n#lessonScreen{\n  width:100%;\n  height:100vh;\n  height:100dvh;\n  min-height:0;\n  overflow:hidden;\n  flex-direction:column;\n  padding:\n    max(6px,env(safe-area-inset-top))\n    max(8px,env(safe-area-inset-right))\n    max(6px,env(safe-area-inset-bottom))\n    max(8px,env(safe-area-inset-left));\n}\n\n/* Header stays compact so the teaching area receives the maximum usable height. */\n.lesson-header{\n  width:100%;\n  flex:0 0 auto;\n  margin:0 0 clamp(5px,.7vh,9px);\n  grid-template-columns:minmax(108px,160px) minmax(0,1fr) minmax(108px,160px);\n  gap:clamp(6px,.7vw,10px);\n}\n.home-btn,.page-pill{\n  min-height:clamp(44px,5.6vh,54px);\n  border-radius:14px;\n}\n.home-btn{\n  padding:0 clamp(12px,1.2vw,18px);\n  font-size:clamp(17px,1.35vw,21px);\n}\n.header-title{font-size:clamp(36px,3vw,50px)}\n.header-sub{\n  margin-top:4px;\n  font-size:clamp(15px,1.45vw,22px);\n}\n.page-pill{\n  padding:0 clamp(12px,1vw,16px);\n  font-size:clamp(15px,1.18vw,18px);\n}\n\n/* The learning area owns every pixel left between header and navigation. */\n.cards{\n  width:100%;\n  max-width:none;\n  flex:1 1 auto;\n  min-height:0;\n  height:auto;\n  margin:0;\n  display:grid;\n  grid-template-columns:1fr;\n  grid-template-rows:repeat(2,minmax(0,1fr));\n  gap:var(--lesson-gap);\n  align-items:stretch;\n  align-content:stretch;\n}\n.cards > .card{grid-column:auto}\n.cards.page-items-2,\n.cards.partial-2{\n  grid-template-columns:1fr;\n  grid-template-rows:repeat(2,minmax(0,1fr));\n  justify-content:stretch;\n}\n\n/* One row-card = one vocabulary concept shown in its two linked forms. */\n.card{\n  min-width:0;\n  min-height:0;\n  height:100%;\n  overflow:hidden;\n  background:#fff;\n  border:1px solid var(--border);\n  border-radius:clamp(18px,1.45vw,24px);\n  box-shadow:var(--shadow);\n  padding:clamp(4px,.42vw,7px);\n  display:grid;\n  grid-template-columns:repeat(2,minmax(0,1fr));\n  gap:clamp(4px,.52vw,8px);\n  align-items:stretch;\n}\n\n/*\n  Wide/short screens use image + controls horizontally inside each half.\n  The image frame stretches to the available row height instead of being held to\n  a small fixed desktop width. The image itself remains object-fit:contain.\n*/\n.learning-panel{\n  min-width:0;\n  min-height:0;\n  height:100%;\n  overflow:hidden;\n  border:1px solid #E6ECF4;\n  border-radius:clamp(14px,1.15vw,18px);\n  background:#fff;\n  padding:clamp(3px,.32vw,5px);\n  display:grid;\n  grid-template-columns:minmax(0,1.55fr) minmax(250px,.9fr);\n  grid-template-rows:minmax(0,1fr) minmax(0,1fr);\n  align-items:stretch;\n  justify-items:stretch;\n  column-gap:clamp(5px,.55vw,9px);\n  row-gap:2px;\n}\n\n.picture-frame{\n  grid-column:1;\n  grid-row:1 / span 2;\n  width:100%;\n  height:100%;\n  min-width:0;\n  min-height:0;\n  aspect-ratio:auto;\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  overflow:hidden;\n  background:#fff;\n  border:1px solid #DDE5EF;\n  border-radius:clamp(12px,1vw,16px);\n  padding:clamp(2px,.22vw,4px);\n}\n.picture-frame img{\n  display:block;\n  width:100%;\n  height:100%;\n  object-fit:contain;\n  object-position:center;\n  image-rendering:auto;\n}\n\n/* Word and sentence are controlled by ONE variable: exact same typography. */\n.word-box,\n.sentence-box{\n  grid-column:2;\n  grid-row:1;\n  align-self:end;\n  justify-self:center;\n  width:max-content;\n  max-width:100%;\n  min-height:clamp(50px,6.4vh,66px);\n  margin:0 auto clamp(3px,.45vh,6px);\n  padding:clamp(7px,.85vh,10px) clamp(18px,1.6vw,30px);\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  text-align:center;\n  border-radius:clamp(11px,.9vw,14px);\n  background:var(--blue);\n  color:#fff;\n  box-shadow:0 7px 14px rgba(33,108,222,.16);\n  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Arial,sans-serif;\n  font-size:var(--learning-font-size);\n  font-weight:var(--learning-font-weight);\n  line-height:var(--learning-line-height);\n  letter-spacing:var(--learning-letter-spacing);\n  white-space:nowrap;\n}\n\n.audio-area{\n  grid-column:2;\n  grid-row:2;\n  align-self:start;\n  justify-self:stretch;\n  width:100%;\n  min-height:0;\n  margin-top:clamp(3px,.4vh,6px);\n  display:flex;\n  flex-direction:column;\n  align-items:center;\n  justify-content:flex-start;\n}\n.audio-btn{\n  width:clamp(52px,4vw,60px);\n  height:clamp(52px,4vw,60px);\n  flex:0 0 clamp(52px,4vw,60px);\n}\n.audio-btn svg{width:clamp(25px,2vw,29px);height:clamp(25px,2vw,29px)}\n.tap-note,\n.sentence-note{\n  min-height:14px;\n  margin-top:clamp(3px,.42vh,5px);\n  color:#79859A;\n  font-size:clamp(10px,.78vw,12.5px);\n  line-height:1.05;\n  text-align:center;\n  font-weight:650;\n}\n\n/* Navigation stays attached to the bottom of the usable viewport. */\n.navbar{\n  width:100%;\n  flex:0 0 auto;\n  margin:clamp(5px,.68vh,8px) 0 0;\n  gap:clamp(6px,.8vw,12px);\n}\n.nav-btn{\n  min-width:clamp(112px,10vw,160px);\n  min-height:clamp(46px,5.8vh,56px);\n  border-radius:14px;\n  font-size:clamp(16px,1.35vw,20px);\n}\n.dots{min-width:72px}\n\n/* Future-proof partial page: keep one remaining concept at normal teaching-row scale.\n   Explicitly reset the older generic partial-page column width so the paired\n   word/sentence card always receives the full lesson width. */\n.cards.partial-1{\n  grid-template-columns:minmax(0,1fr);\n  grid-template-rows:minmax(0,1fr);\n  justify-content:stretch;\n  align-content:center;\n}\n.cards.partial-1 .card,\n.cards.partial-1 .card:last-child{\n  width:100%;\n  max-width:none;\n  max-height:50%;\n  min-height:220px;\n  justify-self:stretch;\n  align-self:center;\n}\n\n/*\n  Portrait tablets and phones have lots of vertical space but less width.\n  Keep the two related halves side-by-side, while each half uses its height\n  efficiently: picture above, then the same-size learning text, then audio.\n*/\n@media(max-width:1050px) and (min-height:650px){\n  :root{--learning-font-size:clamp(28px,3.65vw,40px)}\n\n  .learning-panel{\n    grid-template-columns:minmax(0,1fr);\n    grid-template-rows:minmax(0,1fr) auto auto;\n    column-gap:0;\n    row-gap:clamp(3px,.45vh,6px);\n  }\n  .picture-frame{\n    grid-column:1;\n    grid-row:1;\n    width:100%;\n    height:100%;\n  }\n  .word-box,\n  .sentence-box{\n    grid-column:1;\n    grid-row:2;\n    align-self:center;\n    margin:0 auto;\n    min-height:clamp(43px,5.3vh,56px);\n    padding:6px clamp(13px,2vw,22px);\n  }\n  .audio-area{\n    grid-column:1;\n    grid-row:3;\n    align-self:center;\n    margin-top:0;\n  }\n}\n\n/* Phone portrait: use practically all usable width/height, with safe touch targets. */\n@media(max-width:650px) and (min-height:650px){\n  :root{\n    --learning-font-size:clamp(20px,5.35vw,25px);\n    --lesson-gap:clamp(4px,.65vh,6px);\n  }\n  #lessonScreen{\n    padding:\n      max(4px,env(safe-area-inset-top))\n      max(4px,env(safe-area-inset-right))\n      max(4px,env(safe-area-inset-bottom))\n      max(4px,env(safe-area-inset-left));\n  }\n  .lesson-header{\n    grid-template-columns:82px minmax(0,1fr) 0;\n    gap:4px;\n    margin-bottom:4px;\n  }\n  .home-btn{min-height:40px;padding:0 8px;font-size:13px;border-radius:11px}\n  .page-pill{display:none}\n  .header-title{font-size:clamp(28px,7.6vw,36px)}\n  .header-sub{margin-top:3px;font-size:clamp(10px,3.05vw,14px);white-space:nowrap}\n\n  .card{\n    gap:3px;\n    padding:3px;\n    border-radius:15px;\n  }\n  .learning-panel{\n    padding:2px;\n    border-radius:12px;\n    row-gap:3px;\n  }\n  .picture-frame{padding:1px;border-radius:10px}\n  .word-box,\n  .sentence-box{\n    max-width:calc(100% - 2px);\n    min-height:34px;\n    padding:5px 7px;\n    border-radius:9px;\n  }\n  .audio-btn{width:42px;height:42px;flex-basis:42px}\n  .audio-btn svg{width:20px;height:20px}\n  .tap-note,.sentence-note{font-size:8.5px;margin-top:2px}\n\n  .navbar{margin-top:4px}\n  .nav-btn{min-width:88px;min-height:42px;border-radius:11px;font-size:13px}\n  .dots{gap:6px;min-width:52px}\n  .dot{width:10px;height:10px}\n}\n\n/* Very narrow portrait phones: preserve full one-line sentence labels. */\n@media(max-width:390px) and (min-height:650px){\n  :root{--learning-font-size:20px}\n  .lesson-header{grid-template-columns:78px minmax(0,1fr) 0}\n  .word-box,.sentence-box{padding-left:6px;padding-right:6px}\n  .audio-btn{width:40px;height:40px;flex-basis:40px}\n  .audio-btn svg{width:19px;height:19px}\n}\n\n@media(max-width:340px) and (min-height:650px){\n  :root{--learning-font-size:18px}\n  .word-box,.sentence-box{padding-left:4px;padding-right:4px}\n}\n\n/*\n  Short-height laptop / phone-landscape mode.\n  Keep image and controls horizontal and compress only nonessential spacing first.\n*/\n@media(max-height:649px){\n  :root{\n    --learning-font-size:clamp(22px,2.75vw,34px);\n    --lesson-gap:4px;\n  }\n  #lessonScreen{\n    padding:\n      max(3px,env(safe-area-inset-top))\n      max(5px,env(safe-area-inset-right))\n      max(3px,env(safe-area-inset-bottom))\n      max(5px,env(safe-area-inset-left));\n  }\n  .lesson-header{\n    margin-bottom:3px;\n    grid-template-columns:minmax(86px,130px) minmax(0,1fr) minmax(86px,130px);\n    gap:4px;\n  }\n  .home-btn,.page-pill{min-height:36px;border-radius:10px}\n  .home-btn{font-size:14px;padding:0 9px}\n  .page-pill{font-size:13px;padding:0 9px}\n  .header-title{font-size:clamp(27px,4.8vh,36px)}\n  .header-sub{margin-top:2px;font-size:clamp(10px,2.55vh,15px)}\n\n  .card{padding:3px;gap:3px;border-radius:14px}\n  .learning-panel{\n    padding:2px;\n    border-radius:11px;\n    grid-template-columns:minmax(0,1.28fr) minmax(145px,.92fr);\n    grid-template-rows:minmax(0,1fr) minmax(0,1fr);\n    column-gap:4px;\n    row-gap:1px;\n  }\n  .picture-frame{\n    grid-column:1;\n    grid-row:1 / span 2;\n    height:100%;\n    padding:1px;\n    border-radius:9px;\n  }\n  .word-box,.sentence-box{\n    grid-column:2;\n    grid-row:1;\n    align-self:end;\n    min-height:32px;\n    margin:0 auto 2px;\n    padding:4px clamp(7px,1vw,12px);\n    border-radius:8px;\n  }\n  .audio-area{\n    grid-column:2;\n    grid-row:2;\n    align-self:start;\n    margin-top:2px;\n  }\n  .audio-btn{width:36px;height:36px;flex-basis:36px}\n  .audio-btn svg{width:17px;height:17px}\n  .tap-note,.sentence-note{font-size:7.5px;margin-top:1px}\n\n  .navbar{margin-top:3px}\n  .nav-btn{min-width:84px;min-height:36px;border-radius:10px;font-size:12px}\n  .dots{gap:5px;min-width:50px}\n  .dot{width:9px;height:9px}\n}\n\n/* Extremely short landscape windows: final safeguard against vertical clipping. */\n@media(max-height:430px){\n  :root{--learning-font-size:clamp(18px,2.55vw,25px)}\n  .header-title{font-size:25px}\n  .header-sub{font-size:10px}\n  .home-btn,.page-pill{min-height:32px}\n  .word-box,.sentence-box{min-height:28px;padding-top:3px;padding-bottom:3px}\n  .audio-btn{width:31px;height:31px;flex-basis:31px}\n  .audio-btn svg{width:15px;height:15px}\n  .tap-note,.sentence-note{font-size:7px}\n  .nav-btn{min-height:32px}\n}\n\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003csection id=\"homeScreen\" class=\"screen active\" aria-label=\"Vocabulary home\">\n  \u003cdiv class=\"home-panel\">\n    \u003cp class=\"eyebrow\">Everybody Up 1 Vocabulary\u003c/p>\n    \u003cdiv class=\"lesson-banner\">Unit 02 | Lesson 02 | Colors\u003c/div>\n\n    \u003cdiv class=\"home-actions\">\n      \u003cbutton id=\"openVocab\" class=\"vocab-btn\" type=\"button\">Vocab\u003c/button>\n\n      \u003cdiv id=\"embedWrap\" class=\"embed-wrap show\">\n        \u003cbutton id=\"embedButton\" class=\"embed-btn\" type=\"button\">Embed Original MP3s\u003c/button>\n        \u003cinput id=\"audioPicker\" type=\"file\" accept=\".mp3,audio/mpeg\" multiple=\"\">\n        \u003cdiv id=\"embedHelp\" class=\"embed-help\">One-time teacher setup only. Select the 10 original MP3 files; the browser will create the final standalone student HTML.\u003c/div>\n        \u003cdiv id=\"embedStatus\" class=\"embed-status\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"lessonScreen\" class=\"screen\" aria-label=\"Vocabulary lesson\">\n  \u003cheader class=\"lesson-header\">\n    \u003cbutton id=\"homeButton\" class=\"home-btn\" type=\"button\" aria-label=\"Return to Home\">← Home\u003c/button>\n\n    \u003cdiv class=\"header-center\">\n      \u003ch1 class=\"header-title\">Vocab\u003c/h1>\n      \u003cdiv class=\"header-sub\">Unit 02 • Lesson 02 • Colors\u003c/div>\n    \u003c/div>\n\n    \u003cdiv id=\"pagePill\" class=\"page-pill\" aria-live=\"polite\">Page 3 of 3\u003c/div>\n  \u003c/header>\n\n  \u003cmain id=\"cards\" class=\"cards\" aria-live=\"polite\">\u003c/main>\n\n  \u003cnav class=\"navbar\" aria-label=\"Vocabulary page navigation\">\n    \u003cbutton id=\"prevButton\" class=\"nav-btn prev\" type=\"button\">← Previous\u003c/button>\n    \u003cdiv id=\"dots\" class=\"dots\">\u003cbutton type=\"button\" class=\"dot\" aria-label=\"Go to page 1\">\u003c/button>\u003cbutton type=\"button\" class=\"dot\" aria-label=\"Go to page 2\">\u003c/button>\u003cbutton type=\"button\" class=\"dot active\" aria-label=\"Go to page 3\" aria-current=\"page\">\u003c/button>\u003c/div>\n    \u003cbutton id=\"nextButton\" class=\"nav-btn next\" type=\"button\" disabled=\"\">Next →\u003c/button>\n  \u003c/nav>\n\u003c/section>\n\n\u003cscript id=\"vocab-data\" type=\"application/json\">[{\"word\":\"black\",\"wordImage\":\"assets/images/image_001_bb967cefbcc3.webp\",\"sentence\":\"It is black.\",\"sentenceImage\":\"assets/images/image_002_3209bdf09d6f.webp\",\"audio\":\"assets/audio/audio_001_008b2cf31aa8.mp3\",\"audioFallback\":\"\",\"expectedFile\":\"Black..mp3\",\"sentenceAudio\":\"assets/audio/audio_002_9b93c10f2d68.mp3\",\"sentenceAudioFallback\":\"\",\"sentenceExpectedFile\":\"It's black..mp3\"},{\"word\":\"white\",\"wordImage\":\"assets/images/image_003_aa4d1cc64365.webp\",\"sentence\":\"It is white.\",\"sentenceImage\":\"assets/images/image_004_a32a5ef5867a.webp\",\"audio\":\"assets/audio/audio_003_321191909b9d.mp3\",\"audioFallback\":\"\",\"expectedFile\":\"White..mp3\",\"sentenceAudio\":\"assets/audio/audio_004_7b0394221ec1.mp3\",\"sentenceAudioFallback\":\"\",\"sentenceExpectedFile\":\"It's white..mp3\"},{\"word\":\"blue\",\"wordImage\":\"assets/images/image_005_7456f7c74e27.webp\",\"sentence\":\"It is blue.\",\"sentenceImage\":\"assets/images/image_006_be44d5acf057.webp\",\"audio\":\"assets/audio/audio_005_6bf9cf3a4edd.mp3\",\"audioFallback\":\"\",\"expectedFile\":\"Blue..mp3\",\"sentenceAudio\":\"assets/audio/audio_006_9c4ed8c954af.mp3\",\"sentenceAudioFallback\":\"\",\"sentenceExpectedFile\":\"It's blue..mp3\"},{\"word\":\"yellow\",\"wordImage\":\"assets/images/image_007_8934c1bc2ef2.webp\",\"sentence\":\"It is yellow.\",\"sentenceImage\":\"assets/images/image_008_fadc14813092.webp\",\"audio\":\"assets/audio/audio_007_6865b666ceae.mp3\",\"audioFallback\":\"\",\"expectedFile\":\"Yellow..mp3\",\"sentenceAudio\":\"assets/audio/audio_008_b4499598339b.mp3\",\"sentenceAudioFallback\":\"\",\"sentenceExpectedFile\":\"It's yellow..mp3\"},{\"word\":\"red\",\"wordImage\":\"assets/images/image_009_9ec12be1c628.webp\",\"sentence\":\"It is red.\",\"sentenceImage\":\"assets/images/image_010_03fa36026011.webp\",\"audio\":\"assets/audio/audio_009_3c7edfdab17c.mp3\",\"audioFallback\":\"\",\"expectedFile\":\"Red..mp3\",\"sentenceAudio\":\"assets/audio/audio_010_3861e2dc1dc1.mp3\",\"sentenceAudioFallback\":\"\",\"sentenceExpectedFile\":\"It's red..mp3\"}]\u003c/script>\n\n\u003cscript>\n(() => {\n\"use strict\";\n\nconst PAGE_SIZE = 2;\nconst REPEAT_GAP_MS = 500;\nconst EXPORT_FILENAME = \"Everybody_Up_1_Unit_02_Lesson_02_Colors_Vocab_EMBEDDED.html\";\n\nconst homeScreen = document.getElementById(\"homeScreen\");\nconst lessonScreen = document.getElementById(\"lessonScreen\");\nconst openVocab = document.getElementById(\"openVocab\");\nconst homeButton = document.getElementById(\"homeButton\");\nconst cardsEl = document.getElementById(\"cards\");\nconst dotsEl = document.getElementById(\"dots\");\nconst prevButton = document.getElementById(\"prevButton\");\nconst nextButton = document.getElementById(\"nextButton\");\nconst pagePill = document.getElementById(\"pagePill\");\n\nconst embedWrap = document.getElementById(\"embedWrap\");\nconst embedButton = document.getElementById(\"embedButton\");\nconst audioPicker = document.getElementById(\"audioPicker\");\nconst embedStatus = document.getElementById(\"embedStatus\");\nconst embedHelp = document.getElementById(\"embedHelp\");\n\nlet ITEMS = JSON.parse(document.getElementById(\"vocab-data\").textContent);\n\nlet currentPage = 0;\nlet activeButton = null;\nlet sequenceTimer = null;\nlet playToken = 0;\n\nconst sharedAudio = new Audio();\nsharedAudio.preload = \"auto\";\n\nfunction totalPages(){\n  return Math.max(1, Math.ceil(ITEMS.length / PAGE_SIZE));\n}\n\nfunction normalizeFileName(name){\n  return String(name || \"\")\n    .replace(/^.*[\\\\/]/,\"\")\n    .trim()\n    .toLowerCase()\n    .replace(/\\s+/g,\" \")\n    .replace(/\\.+mp3$/i,\".mp3\");\n}\n\nfunction wordAudio(item){\n  return item.audio || item.audioFallback || \"\";\n}\n\nfunction sentenceAudio(item){\n  return item.sentenceAudio || item.sentenceAudioFallback || \"\";\n}\n\n/* Build requirements from lesson data, deduplicating any genuinely shared\n   expected filename. This lesson resolves to 10 unique original recordings. */\nfunction buildAudioRequirements(){\n  const byName = new Map();\n\n  const addRequirement = (label, expected, assign) => {\n    const key = normalizeFileName(expected);\n    if(!key) return;\n    if(!byName.has(key)){\n      byName.set(key, {label, expected, assigners:[]});\n    }\n    byName.get(key).assigners.push(assign);\n  };\n\n  ITEMS.forEach(item => {\n    addRequirement(item.expectedFile, item.expectedFile, data => {\n      item.audio = data;\n      item.audioFallback = \"\";\n    });\n    addRequirement(item.sentenceExpectedFile, item.sentenceExpectedFile, data => {\n      item.sentenceAudio = data;\n      item.sentenceAudioFallback = \"\";\n    });\n  });\n\n  return Array.from(byName.values());\n}\n\nfunction requiredAudioCount(){\n  return buildAudioRequirements().length;\n}\n\nfunction allAudioEmbedded(){\n  return ITEMS.length > 0 && ITEMS.every(item =>\n    Boolean(wordAudio(item)) &&\n    Boolean(sentenceAudio(item))\n  );\n}\n\nfunction updateEmbedCopy(){\n  const count = requiredAudioCount();\n  if(embedHelp){\n    embedHelp.textContent = `One-time teacher setup only. Select the ${count} original MP3 files; the browser will create the final standalone student HTML.`;\n  }\n}\n\nfunction updateEmbedVisibility(){\n  updateEmbedCopy();\n  if(allAudioEmbedded()) embedWrap.classList.remove(\"show\");\n  else embedWrap.classList.add(\"show\");\n}\n\nfunction showEmbedStatus(text, type=\"\"){\n  embedStatus.textContent = text;\n  embedStatus.className = \"embed-status show\" + (type ? \" \" + type : \"\");\n}\n\nfunction clearPlayingVisual(){\n  if(activeButton){\n    activeButton.classList.remove(\"playing\");\n    activeButton.setAttribute(\"aria-pressed\",\"false\");\n  }\n  activeButton = null;\n}\n\nfunction stopAudio(){\n  playToken++;\n  if(sequenceTimer){\n    clearTimeout(sequenceTimer);\n    sequenceTimer = null;\n  }\n  sharedAudio.pause();\n  sharedAudio.removeAttribute(\"src\");\n  sharedAudio.load();\n  sharedAudio.onended = null;\n  sharedAudio.onerror = null;\n  clearPlayingVisual();\n}\n\nfunction headsetSvg(){\n  return `\n    \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\">\n      \u003cpath fill=\"currentColor\" d=\"M12 3a8 8 0 0 0-8 8v6a3 3 0 0 0 3 3h2v-8H6v-1a6 6 0 1 1 12 0v1h-3v8h2a3 3 0 0 0 3-3v-6a8 8 0 0 0-8-8Zm-5 11h1v4H7a1 1 0 0 1-1-1v-3h1Zm10 4h-1v-4h2v3a1 1 0 0 1-1 1Z\"/>\n    \u003c/svg>`;\n}\n\n/* Run every original-audio sequence through one reusable Audio object.\n   The 500 ms pause starts only after the first recording NATURALLY ends.\n   A token invalidates every stale timer/event whenever another headset starts. */\nfunction playSequence(steps, button, missingMessage){\n  stopAudio();\n\n  if(!steps.length || steps.some(step => !step.src)){\n    showEmbedStatus(missingMessage, \"error\");\n    return;\n  }\n\n  const myToken = ++playToken;\n  activeButton = button;\n  button.classList.add(\"playing\");\n  button.setAttribute(\"aria-pressed\",\"true\");\n\n  let stepIndex = 0;\n\n  const playStep = () => {\n    if(myToken !== playToken) return;\n\n    const step = steps[stepIndex];\n    sharedAudio.onended = () => {\n      if(myToken !== playToken) return;\n\n      if(stepIndex >= steps.length - 1){\n        sharedAudio.onended = null;\n        clearPlayingVisual();\n        return;\n      }\n\n      const gap = Math.max(0, Number(step.gapAfterMs) || 0);\n      stepIndex++;\n      sequenceTimer = setTimeout(() => {\n        sequenceTimer = null;\n        if(myToken !== playToken) return;\n        playStep();\n      }, gap);\n    };\n\n    sharedAudio.onerror = () => {\n      if(myToken === playToken) stopAudio();\n    };\n\n    sharedAudio.src = step.src;\n    try{ sharedAudio.currentTime = 0; }catch(e){}\n    sharedAudio.play().catch(() => {\n      if(myToken === playToken) stopAudio();\n    });\n  };\n\n  playStep();\n}\n\nfunction playTwice(src, button, missingMessage){\n  playSequence(\n    [\n      {src, gapAfterMs:REPEAT_GAP_MS},\n      {src, gapAfterMs:0}\n    ],\n    button,\n    missingMessage\n  );\n}\n\nfunction playWordTwice(index, button){\n  const item = ITEMS[index];\n  playTwice(\n    wordAudio(item),\n    button,\n    `Original word audio for \"${item.word}\" is not embedded yet. Use “Embed Original MP3s” on the Home screen.`\n  );\n}\n\nfunction playSentenceTwice(index, button){\n  const item = ITEMS[index];\n  playTwice(\n    sentenceAudio(item),\n    button,\n    `Original sentence audio for \"${item.sentence}\" is not embedded yet. Use “Embed Original MP3s” on the Home screen.`\n  );\n}\n\nfunction renderDots(){\n  dotsEl.innerHTML = \"\";\n  const pages = totalPages();\n\n  for(let i=0;i\u003cpages;i++){\n    const dot = document.createElement(\"button\");\n    dot.type = \"button\";\n    dot.className = \"dot\" + (i === currentPage ? \" active\" : \"\");\n    dot.setAttribute(\"aria-label\", `Go to page ${i+1}`);\n    if(i === currentPage) dot.setAttribute(\"aria-current\",\"page\");\n    dot.addEventListener(\"click\", () => goToPage(i));\n    dotsEl.appendChild(dot);\n  }\n}\n\nfunction partialClass(count){\n  if(count >= PAGE_SIZE) return \"\";\n  return \" partial-\" + Math.max(1,count);\n}\n\nfunction createPicture(src, alt){\n  const frame = document.createElement(\"div\");\n  frame.className = \"picture-frame\";\n\n  const img = document.createElement(\"img\");\n  img.src = src;\n  img.alt = alt;\n  img.draggable = false;\n  frame.appendChild(img);\n  return frame;\n}\n\nfunction createAudioArea(buttonLabel, onClick, noteClass=\"tap-note\"){\n  const area = document.createElement(\"div\");\n  area.className = \"audio-area\";\n\n  const button = document.createElement(\"button\");\n  button.type = \"button\";\n  button.className = \"audio-btn\";\n  button.innerHTML = headsetSvg();\n  button.setAttribute(\"aria-label\", buttonLabel);\n  button.setAttribute(\"aria-pressed\",\"false\");\n  button.addEventListener(\"click\", () => onClick(button));\n\n  const note = document.createElement(\"div\");\n  note.className = noteClass;\n  note.textContent = \"Tap to hear it twice\";\n\n  area.append(button, note);\n  return area;\n}\n\nfunction renderPage(){\n  stopAudio();\n\n  const pages = totalPages();\n  if(currentPage > pages - 1) currentPage = pages - 1;\n\n  const start = currentPage * PAGE_SIZE;\n  const slice = ITEMS.slice(start, start + PAGE_SIZE);\n\n  cardsEl.className = \"cards page-items-\" + slice.length + partialClass(slice.length);\n  cardsEl.innerHTML = \"\";\n\n  slice.forEach((item, localIndex) => {\n    const absoluteIndex = start + localIndex;\n\n    const rowCard = document.createElement(\"article\");\n    rowCard.className = \"card\";\n    rowCard.setAttribute(\"aria-label\", `${item.word}: vocabulary word and sentence example`);\n\n    const wordPanel = document.createElement(\"section\");\n    wordPanel.className = \"learning-panel word-panel\";\n    wordPanel.appendChild(createPicture(item.wordImage, `${item.word} vocabulary picture`));\n\n    const wordBox = document.createElement(\"div\");\n    wordBox.className = \"word-box\";\n    wordBox.textContent = item.word;\n    wordPanel.appendChild(wordBox);\n    wordPanel.appendChild(createAudioArea(\n      `Play the word ${item.word} twice`,\n      button => playWordTwice(absoluteIndex, button)\n    ));\n\n    const sentencePanel = document.createElement(\"section\");\n    sentencePanel.className = \"learning-panel sentence-panel\";\n    sentencePanel.appendChild(createPicture(item.sentenceImage, `${item.sentence} sentence picture`));\n\n    const sentenceBox = document.createElement(\"div\");\n    sentenceBox.className = \"sentence-box\";\n    sentenceBox.textContent = item.sentence;\n    sentencePanel.appendChild(sentenceBox);\n    sentencePanel.appendChild(createAudioArea(\n      `Play the sentence ${item.sentence} twice`,\n      button => playSentenceTwice(absoluteIndex, button),\n      \"sentence-note\"\n    ));\n\n    rowCard.append(wordPanel, sentencePanel);\n    cardsEl.appendChild(rowCard);\n  });\n\n  pagePill.textContent = `Page ${currentPage + 1} of ${pages}`;\n  prevButton.disabled = currentPage === 0;\n  nextButton.disabled = currentPage === pages - 1;\n  renderDots();\n}\n\nfunction goToPage(index){\n  const pages = totalPages();\n  const next = Math.max(0, Math.min(pages - 1, index));\n  if(next === currentPage){\n    stopAudio();\n    return;\n  }\n  currentPage = next;\n  renderPage();\n  window.scrollTo({top:0,behavior:\"auto\"});\n}\n\nfunction showHome(){\n  stopAudio();\n  lessonScreen.classList.remove(\"active\");\n  homeScreen.classList.add(\"active\");\n  updateEmbedVisibility();\n}\n\nfunction showLesson(){\n  stopAudio();\n  homeScreen.classList.remove(\"active\");\n  lessonScreen.classList.add(\"active\");\n  renderPage();\n}\n\nopenVocab.addEventListener(\"click\", showLesson);\nhomeButton.addEventListener(\"click\", showHome);\nprevButton.addEventListener(\"click\", () => goToPage(currentPage - 1));\nnextButton.addEventListener(\"click\", () => goToPage(currentPage + 1));\n\n/* -------- ORIGINAL MP3 EMBEDDER — CONTENT-DRIVEN REQUIREMENTS -------- */\nembedButton.addEventListener(\"click\", () => {\n  audioPicker.value = \"\";\n  audioPicker.click();\n});\n\naudioPicker.addEventListener(\"change\", async () => {\n  const files = Array.from(audioPicker.files || []);\n  if(!files.length) return;\n\n  const fileMap = new Map();\n  files.forEach(file => fileMap.set(normalizeFileName(file.name), file));\n\n  const requirements = buildAudioRequirements();\n  const missing = [];\n  const matched = [];\n\n  for(const req of requirements){\n    const file = fileMap.get(normalizeFileName(req.expected));\n    if(file) matched.push({req,file});\n    else missing.push(req.label);\n  }\n\n  if(missing.length){\n    showEmbedStatus(\n      `Missing ${missing.length} file${missing.length===1?\"\":\"s\"}: ${missing.join(\", \")}. Nothing was exported.`,\n      \"error\"\n    );\n    return;\n  }\n\n  const requiredCount = requirements.length;\n  showEmbedStatus(`All ${requiredCount} original MP3s were found. Embedding them now…`);\n\n  try{\n    const readAsDataURL = file => new Promise((resolve,reject) => {\n      const reader = new FileReader();\n      reader.onload = () => resolve(reader.result);\n      reader.onerror = () => reject(reader.error || new Error(\"Could not read file\"));\n      reader.readAsDataURL(file);\n    });\n\n    for(const {req,file} of matched){\n      const data = await readAsDataURL(file);\n      req.assigners.forEach(assign => assign(data));\n    }\n\n    document.getElementById(\"vocab-data\").textContent = JSON.stringify(ITEMS);\n\n    showEmbedStatus(\n      `All ${requiredCount} original MP3s were embedded successfully. Creating the final standalone student HTML…`,\n      \"ok\"\n    );\n\n    exportStandaloneHTML();\n  }catch(err){\n    showEmbedStatus(`Audio embedding failed: ${err && err.message ? err.message : err}`,\"error\");\n  }\n});\n\nfunction exportStandaloneHTML(){\n  stopAudio();\n\n  const clone = document.documentElement.cloneNode(true);\n  clone.querySelector(\"#homeScreen\").classList.add(\"active\");\n  clone.querySelector(\"#lessonScreen\").classList.remove(\"active\");\n  clone.querySelector(\"#vocab-data\").textContent = JSON.stringify(ITEMS);\n\n  /* Prevent duplicated embedded picture data: cards regenerate from lesson data. */\n  const cloneCards = clone.querySelector(\"#cards\");\n  if(cloneCards){\n    cloneCards.innerHTML = \"\";\n    cloneCards.className = \"cards\";\n  }\n\n  const cloneEmbedStatus = clone.querySelector(\"#embedStatus\");\n  if(cloneEmbedStatus){\n    cloneEmbedStatus.className = \"embed-status\";\n    cloneEmbedStatus.textContent = \"\";\n  }\n\n  const clonePicker = clone.querySelector(\"#audioPicker\");\n  if(clonePicker) clonePicker.removeAttribute(\"value\");\n\n  clone.querySelectorAll(\".audio-btn.playing\").forEach(el => {\n    el.classList.remove(\"playing\");\n    el.setAttribute(\"aria-pressed\",\"false\");\n  });\n\n  const source = \"\u003c!doctype html>\\n\" + clone.outerHTML;\n  const blob = new Blob([source], {type:\"text/html;charset=utf-8\"});\n  const url = URL.createObjectURL(blob);\n\n  const a = document.createElement(\"a\");\n  a.href = url;\n  a.download = EXPORT_FILENAME;\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n\n  setTimeout(() => URL.revokeObjectURL(url), 3000);\n}\n\n/* -------- LIFECYCLE SAFETY -------- */\ndocument.addEventListener(\"visibilitychange\", () => {\n  if(document.hidden) stopAudio();\n});\nwindow.addEventListener(\"pagehide\", stopAudio);\nwindow.addEventListener(\"beforeunload\", stopAudio);\n\nupdateEmbedVisibility();\nrenderPage();\n\n/* LASIN v3.0 parent bridge: preview-only lifecycle safety. */\nwindow.addEventListener(\"message\", (event) => {\n  const data = event.data || {};\n  if(data.channel !== \"LASIN_MOTIVATION_V3\" || data.action !== \"lasin:set-active\") return;\n  if(!data.payload || data.payload.exerciseId !== \"vocab\") return;\n  if(!data.payload.active) stopAudio();\n});\ntry{ parent.postMessage({channel:\"LASIN_MOTIVATION_V3\",action:\"child-ready\",payload:{exerciseId:\"vocab\"}},\"*\"); }catch(e){}\n\n})();\n\u003c/script>\n\n\n\u003c/body>\u003c/html>"</script>

\n  }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv id=\"bravoOverlay\" class=\"bravoOverlay\" aria-hidden=\"true\">\n  \u003cdiv class=\"bravoCelebration\">\n    \u003csvg class=\"bravoArt\" viewBox=\"0 0 320 240\" role=\"img\" aria-label=\"Celebration\">\n      \u003cg fill=\"none\" stroke-linecap=\"round\" stroke-width=\"8\">\n        \u003cpath d=\"M49 50l16 22\" stroke=\"#F45A0A\">\u003c/path>\n        \u003cpath d=\"M269 46l-16 24\" stroke=\"#103D9B\">\u003c/path>\n        \u003cpath d=\"M31 113l29 2\" stroke=\"#D4AF37\">\u003c/path>\n        \u003cpath d=\"M289 111l-28 3\" stroke=\"#16855B\">\u003c/path>\n        \u003cpath d=\"M72 188l19-22\" stroke=\"#103D9B\">\u003c/path>\n        \u003cpath d=\"M248 188l-18-22\" stroke=\"#F45A0A\">\u003c/path>\n      \u003c/g>\n      \u003cg>\n        \u003ccircle cx=\"55\" cy=\"88\" r=\"8\" fill=\"#16855B\">\u003c/circle>\n        \u003ccircle cx=\"270\" cy=\"83\" r=\"8\" fill=\"#F45A0A\">\u003c/circle>\n        \u003ccircle cx=\"89\" cy=\"38\" r=\"7\" fill=\"#D4AF37\">\u003c/circle>\n        \u003ccircle cx=\"232\" cy=\"34\" r=\"7\" fill=\"#103D9B\">\u003c/circle>\n      \u003c/g>\n      \u003cpath d=\"M107 78h106v52c0 44-24 73-53 73s-53-29-53-73V78z\" fill=\"#F7C948\" stroke=\"#D4AF37\" stroke-width=\"7\">\u003c/path>\n      \u003cpath d=\"M107 94H78c-5 0-9 4-9 9 0 30 17 47 44 47\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"10\">\u003c/path>\n      \u003cpath d=\"M213 94h29c5 0 9 4 9 9 0 30-17 47-44 47\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"10\">\u003c/path>\n      \u003crect x=\"146\" y=\"199\" width=\"28\" height=\"19\" rx=\"5\" fill=\"#D4AF37\">\u003c/rect>\n      \u003crect x=\"126\" y=\"216\" width=\"68\" height=\"13\" rx=\"6.5\" fill=\"#103D9B\">\u003c/rect>\n      \u003cpath d=\"M160 103l8 17 19 3-14 13 4 19-17-9-17 9 4-19-14-13 19-3z\" fill=\"#fff\">\u003c/path>\n    \u003c/svg>\n    \u003cdiv class=\"bravoWord\">Bravo!\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"app\">\n  \u003cheader class=\"topbar\">\n    \u003cdiv class=\"brand\">\n      \u003cdiv class=\"logo\">L\u003c/div>\n      \u003cdiv class=\"brandText\">\n        \u003cstrong>LASIN • Vocabulary Practice\u003c/strong>\n        \u003cspan id=\"lessonMeta\">Unit 01 • Lesson 02 • Colors\u003c/span>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"progressWrap\">\n      \u003cdiv class=\"progressTrack\">\u003cdiv id=\"progressBar\" class=\"progressBar\" style=\"width: 0%;\">\u003c/div>\u003c/div>\n      \u003cdiv id=\"counter\" class=\"counter\">0/20\u003c/div>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cdiv id=\"stageRow\" class=\"stageRow\">\n    \u003cdiv class=\"stagePill\" data-stage=\"0\">Listen &amp; Choose\u003c/div>\n    \u003cdiv class=\"stagePill\" data-stage=\"1\">Missing Letters 1\u003c/div>\n    \u003cdiv class=\"stagePill\" data-stage=\"2\">Missing Letters 2\u003c/div>\n    \u003cdiv class=\"stagePill\" data-stage=\"3\">Full Spelling\u003c/div>\n  \u003c/div>\n\n  \u003csection id=\"card\" class=\"card\">\n    \u003cdiv id=\"stageOverlay\" class=\"stageOverlay\" aria-live=\"polite\">\n      \u003cdiv>\n        \u003cdiv id=\"overlayCircle\" class=\"circle\">2\u003c/div>\n        \u003ch2 id=\"overlayTitle\">Missing Letters 1\u003c/h2>\n        \u003cp id=\"overlayText\">Listen and complete two missing letters.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv id=\"startScreen\" class=\"startScreen\">\n      \u003cdiv class=\"startInner\">\n        \u003ch1 id=\"heroWord\" class=\"heroWord\">Colors\u003c/h1>\n        \u003cbutton id=\"startBtn\" class=\"startBtn\" type=\"button\">Start Vocabulary\u003c/button>\n\n        \u003cdiv id=\"audioSetup\" class=\"audioSetup hidden\">\n          \u003cdiv class=\"audioSetupTitle\">Original audio setup\u003c/div>\n          \u003cdiv class=\"audioSetupText\">\n            Select the five original Colors MP3 files once. They will be embedded directly into a new standalone student HTML without re-encoding the recordings.\n          \u003c/div>\n          \u003cdiv class=\"audioSetupActions\">\n            \u003cbutton class=\"audioSetupBtn\" id=\"embedAudioBtn\" type=\"button\">Embed the 5 Original MP3s\u003c/button>\n            \u003cinput id=\"audioFilePicker\" type=\"file\" accept=\".mp3,audio/mpeg\" multiple=\"\" hidden=\"\">\n          \u003c/div>\n          \u003cdiv class=\"audioSetupProgress\">\u003cdiv class=\"audioSetupProgressBar\" id=\"audioSetupProgressBar\" style=\"width: 100%;\">\u003c/div>\u003c/div>\n          \u003cdiv class=\"audioSetupStatus ok\" id=\"audioSetupStatus\">All 5 original MP3s are embedded. Creating the final standalone 20-question HTML…\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv id=\"questionScreen\" class=\"hidden\">\n      \u003cdiv class=\"questionHead\">\n        \u003cdiv id=\"eyebrow\" class=\"eyebrow\">\u003c/div>\n        \u003ch1 id=\"questionTitle\">\u003c/h1>\n        \u003cp id=\"instruction\" class=\"instruction\">\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"audioArea\">\n        \u003cbutton id=\"audioBtn\" class=\"audioBtn\" type=\"button\" aria-label=\"Listen to the vocabulary word\">\n          \u003cspan class=\"speaker\">🔊\u003c/span>\u003cspan>Listen again\u003c/span>\n        \u003c/button>\n      \u003c/div>\n      \u003cmain id=\"main\" class=\"main\">\u003c/main>\n      \u003cdiv id=\"feedback\" class=\"feedback\" aria-live=\"polite\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv id=\"finishScreen\" class=\"finishScreen hidden\">\n      \u003cdiv class=\"finishInner\">\n        \u003cdiv class=\"finishIcon\">✓\u003c/div>\n        \u003ch2>Great job!\u003c/h2>\n        \u003cp id=\"finishText\">You finished all 20 vocabulary questions.\u003c/p>\n        \u003cbutton id=\"restartBtn\" class=\"restartBtn\" type=\"button\">Practice again\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003cscript id=\"lasinLessonData\" type=\"application/json\">{\"unitNumber\":\"01\",\"unitName\":\"\",\"lessonNumber\":\"02\",\"lessonName\":\"Colors\",\"category\":\"Colors\",\"audioRepetitions\":2,\"audioRepeatGapMs\":500,\"words\":[{\"word\":\"red\",\"image\":\"assets/images/image_009_9ec12be1c628.webp\",\"audio\":\"assets/audio/audio_009_3c7edfdab17c.mp3\",\"expectedFile\":\"Red.mp3\",\"r2\":[0,2],\"r3\":[1,2]},{\"word\":\"yellow\",\"image\":\"assets/images/image_007_8934c1bc2ef2.webp\",\"audio\":\"assets/audio/audio_007_6865b666ceae.mp3\",\"expectedFile\":\"Yellow.mp3\",\"r2\":[0,3],\"r3\":[1,4]},{\"word\":\"blue\",\"image\":\"assets/images/image_005_7456f7c74e27.webp\",\"audio\":\"assets/audio/audio_005_6bf9cf3a4edd.mp3\",\"expectedFile\":\"Blue.mp3\",\"r2\":[0,2],\"r3\":[1,3]},{\"word\":\"white\",\"image\":\"assets/images/image_003_aa4d1cc64365.webp\",\"audio\":\"assets/audio/audio_003_321191909b9d.mp3\",\"expectedFile\":\"White.mp3\",\"r2\":[0,3],\"r3\":[1,4]},{\"word\":\"black\",\"image\":\"assets/images/image_001_bb967cefbcc3.webp\",\"audio\":\"assets/audio/audio_001_008b2cf31aa8.mp3\",\"expectedFile\":\"Black.mp3\",\"r2\":[0,3],\"r3\":[1,4]}]}\u003c/script>\n\n\u003cscript>\n\"use strict\";\n\n/* LASIN v3.0 scoring bridge — Exercise 01. */\nlet LASIN_CHILD_ACTIVE = false;\nlet LASIN_RESTORE_INDEX = 0;\nfunction lasinSend(action,payload={}){\n  try{ parent.postMessage({channel:'LASIN_MOTIVATION_V3',action,payload:Object.assign({exerciseId:'exercise-01'},payload)},'*'); }catch(e){}\n}\nfunction lasinCurrentMeta(){\n  if(q \u003c 0 || q >= TOTAL) return null;\n  const item=currentItem(), stage=stageOf(q), localIndex=q+1;\n  return {questionId:String(localIndex),localIndex,responseMode:stage===3?'typing':(stage===0?'selection':'tiles'),expectedAnswer:stage===3?item.word:null,sourceQuestionId:`stage-${stage+1}-${item.word}`};\n}\nfunction lasinReadyCurrent(){ const m=lasinCurrentMeta(); if(LASIN_CHILD_ACTIVE&&m) lasinSend('question-ready',m); }\nfunction lasinMistakeCurrent(){ const m=lasinCurrentMeta(); if(m) lasinSend('question-mistake',m); }\nfunction lasinCompleteCurrent(){ const m=lasinCurrentMeta(); if(m) lasinSend('question-completed',m); }\nfunction lasinExerciseFinished(){ lasinSend('exercise-finished',{}); }\nwindow.addEventListener('message',event=>{\n  const data=event.data||{};\n  if(data.channel!=='LASIN_MOTIVATION_V3'||data.action!=='lasin:set-active') return;\n  const p=data.payload||{}; if(p.exerciseId!=='exercise-01') return;\n  if(Number.isFinite(Number(p.resumeLocalIndex))) LASIN_RESTORE_INDEX=Math.max(0,Math.min(TOTAL-1,Number(p.resumeLocalIndex)-1));\n  LASIN_CHILD_ACTIVE=Boolean(p.active);\n  if(!LASIN_CHILD_ACTIVE){ stopAudio(); return; }\n  const qs=document.getElementById('questionScreen');\n  if(qs && !qs.classList.contains('hidden') && q\u003cTOTAL && !answered && !audioRequirementSatisfied){ renderQuestion(false); }\n});\nsetTimeout(()=>lasinSend('child-ready',{}),0);\n\n\n/* LASIN Colors Vocabulary Practice — LESSON 02 / 5-WORD / 20Q BUILD\n   MANDATORY LISTENING GATE: answers unlock only after the second natural audio ending.\n   Based directly on the approved Exercise 01 master.\n   WORD-AWARE SPELLING LAYOUT\n   5 vocabulary items × 4 stages = 20 questions.\n   Original MP3: 2 complete plays total, with a 500 ms gap after the first natural end.\n*/\nconst LASIN_DATA_NODE = document.getElementById(\"lasinLessonData\");\nconst lesson = JSON.parse(LASIN_DATA_NODE.textContent);\n\nconst WORD_COUNT = lesson.words.length;\nconst TOTAL = WORD_COUNT * 4;\n\nlet q = 0;\nlet answered = false;\nlet blankCursor = 0;\nlet currentMissing = [];\nlet currentFilled = {};\n\n/* Mandatory listening gate:\n   every new question begins locked and unlocks only after one complete,\n   valid two-play pronunciation sequence has naturally finished. */\nlet audioRequirementSatisfied = false;\n\nconst audioPlayer = new Audio();\naudioPlayer.preload = \"auto\";\nlet autoAudioTimer = null;\nlet audioRepeatTimer = null;\nlet audioSequenceToken = 0;\n\nlet bravoTimer = null;\nlet bravoDelayTimer = null;\nlet stageTimer = null;\nlet celebrationAudioContext = null;\n\nconst AUTO_PLAY_DELAY = 1700;\nconst BRAVO_DELAY = 500;\nconst BRAVO_DURATION = 2000;\nconst STAGE_OVERLAY_DURATION = 1250;\n\nconst $ = s => document.querySelector(s);\nconst main = $(\"#main\");\nconst feedback = $(\"#feedback\");\nconst questionTitle = $(\"#questionTitle\");\nconst instruction = $(\"#instruction\");\nconst eyebrow = $(\"#eyebrow\");\nconst audioBtn = $(\"#audioBtn\");\nconst startBtn = $(\"#startBtn\");\n\nfunction stageOf(index){\n  return Math.floor(index / WORD_COUNT);\n}\nfunction wordIndex(index){\n  return index % WORD_COUNT;\n}\nfunction currentItem(){\n  return lesson.words[wordIndex(q)];\n}\nfunction normalizeAnswer(s){\n  return String(s || \"\").trim().toLowerCase().replace(/\\s+/g, \" \");\n}\nfunction normalizeFileName(name){\n  return String(name || \"\")\n    .replace(/^.*[\\\\/]/,\"\")\n    .trim()\n    .toLowerCase()\n    .replace(/\\s+/g,\" \")\n    .replace(/\\.+mp3$/i,\".mp3\");\n}\nfunction audioSource(item){\n  return item && item.audio ? item.audio : \"\";\n}\nfunction allAudioEmbedded(){\n  return lesson.words.length > 0 && lesson.words.every(w => Boolean(audioSource(w)));\n}\n\nfunction lockAnswerControls(){\n  audioRequirementSatisfied = false;\n  main.classList.add(\"awaitingAudio\");\n\n  main.querySelectorAll(\".picChoice, .letterBtn, .checkBtn\").forEach(el => {\n    el.disabled = true;\n    el.setAttribute(\"aria-disabled\",\"true\");\n  });\n\n  const input = main.querySelector(\".answerInput\");\n  if(input){\n    input.disabled = true;\n    input.setAttribute(\"aria-disabled\",\"true\");\n    try{ input.blur(); }catch(e){}\n  }\n}\n\nfunction unlockAnswerControls(questionIndex){\n  /* Only the currently active, unanswered question may be unlocked. */\n  if(questionIndex !== q || answered || q >= TOTAL) return;\n\n  audioRequirementSatisfied = true;\n  main.classList.remove(\"awaitingAudio\");\n  lasinReadyCurrent();\n\n  main.querySelectorAll(\".picChoice, .letterBtn, .checkBtn\").forEach(el => {\n    el.disabled = false;\n    el.setAttribute(\"aria-disabled\",\"false\");\n  });\n\n  const input = main.querySelector(\".answerInput\");\n  if(input){\n    input.disabled = false;\n    input.setAttribute(\"aria-disabled\",\"false\");\n    /* Full Spelling receives focus only AFTER listening is completed. */\n    setTimeout(() => {\n      if(questionIndex !== q || answered || !audioRequirementSatisfied) return;\n      try{ input.focus({preventScroll:true}); }catch(e){ input.focus(); }\n    }, 80);\n  }\n}\n\nfunction applyLessonMetadata(){\n  const parts = [\n    `Unit ${lesson.unitNumber}`,\n    lesson.unitName,\n    `Lesson ${lesson.lessonNumber}`,\n    lesson.lessonName\n  ].filter(Boolean);\n  $(\"#lessonMeta\").textContent = parts.join(\" • \");\n  $(\"#heroWord\").textContent = lesson.category;\n  $(\"#finishText\").textContent = `You finished all ${TOTAL} vocabulary questions.`;\n  document.title = `LASIN | Unit ${lesson.unitNumber} Lesson ${lesson.lessonNumber} | ${lesson.category} Vocabulary`;\n}\n\nfunction setProgress(){\n  const done = Math.max(0, Math.min(q, TOTAL));\n  $(\"#counter\").textContent = `${done}/${TOTAL}`;\n  $(\"#progressBar\").style.width = `${TOTAL ? (done / TOTAL) * 100 : 0}%`;\n\n  const s = q >= TOTAL ? 4 : stageOf(q);\n  document.querySelectorAll(\".stagePill\").forEach((pill, i) => {\n    pill.classList.toggle(\"done\", i \u003c s);\n    pill.classList.toggle(\"active\", i === s && s \u003c 4);\n  });\n}\n\nfunction clearQuestionTimers(){\n  if(autoAudioTimer){ clearTimeout(autoAudioTimer); autoAudioTimer = null; }\n  if(stageTimer){ clearTimeout(stageTimer); stageTimer = null; }\n}\nfunction stopAudio(){\n  audioSequenceToken++;\n  if(audioRepeatTimer){ clearTimeout(audioRepeatTimer); audioRepeatTimer = null; }\n  if(autoAudioTimer){ clearTimeout(autoAudioTimer); autoAudioTimer = null; }\n  audioPlayer.pause();\n  audioPlayer.onended = null;\n  audioPlayer.onerror = null;\n  audioPlayer.removeAttribute(\"src\");\n  try{ audioPlayer.load(); }catch(e){}\n  audioBtn.classList.remove(\"playing\");\n}\n\nfunction playAudio(){\n  if(!LASIN_CHILD_ACTIVE) return;\n  if(q >= TOTAL) return;\n  const src = audioSource(currentItem());\n  if(!src) return;\n\n  const questionIndex = q;\n\n  stopAudio();\n  const token = ++audioSequenceToken;\n  const repetitions = Math.max(1, Number(lesson.audioRepetitions) || 1);\n  const gap = Math.max(0, Number(lesson.audioRepeatGapMs) || 0);\n  let playNo = 1;\n\n  audioBtn.classList.add(\"playing\");\n  audioPlayer.src = src;\n\n  const playNow = () => {\n    if(token !== audioSequenceToken || questionIndex !== q) return;\n    try{ audioPlayer.currentTime = 0; }catch(e){}\n    audioPlayer.play().catch(() => {\n      /* Autoplay can be blocked on some devices.\n         The answer remains locked; the student can tap Listen again. */\n      if(token === audioSequenceToken) stopAudio();\n    });\n  };\n\n  audioPlayer.onended = () => {\n    if(token !== audioSequenceToken || questionIndex !== q) return;\n\n    if(playNo \u003c repetitions){\n      playNo++;\n      audioRepeatTimer = setTimeout(() => {\n        audioRepeatTimer = null;\n        playNow();\n      }, gap);\n    }else{\n      audioBtn.classList.remove(\"playing\");\n      audioPlayer.onended = null;\n\n      /* The listening requirement is satisfied ONLY here:\n         after the final complete pronunciation naturally ends. */\n      unlockAnswerControls(questionIndex);\n    }\n  };\n\n  audioPlayer.onerror = () => {\n    /* A failed/broken sequence never satisfies the listening requirement. */\n    if(token === audioSequenceToken) stopAudio();\n  };\n\n  playNow();\n}\n\nfunction scheduleAutoAudio(){\n  if(!LASIN_CHILD_ACTIVE) return;\n  if(autoAudioTimer) clearTimeout(autoAudioTimer);\n  autoAudioTimer = setTimeout(() => {\n    autoAudioTimer = null;\n    if(!answered && q \u003c TOTAL) playAudio();\n  }, AUTO_PLAY_DELAY);\n}\n\nfunction hashString(str){\n  let h = 2166136261 >>> 0;\n  for(let i=0;i\u003cstr.length;i++){\n    h ^= str.charCodeAt(i);\n    h = Math.imul(h,16777619);\n  }\n  return h >>> 0;\n}\nfunction seededShuffle(arr, seedText){\n  let seed = hashString(seedText) || 1;\n  const out = [...arr];\n  function rand(){\n    seed ^= seed \u003c\u003c 13;\n    seed ^= seed >>> 17;\n    seed ^= seed \u003c\u003c 5;\n    return (seed >>> 0) / 4294967296;\n  }\n  for(let i=out.length-1;i>0;i--){\n    const j = Math.floor(rand() * (i+1));\n    [out[i],out[j]] = [out[j],out[i]];\n  }\n  return out;\n}\n\nfunction good(msg){\n  feedback.className = \"feedback good\";\n  feedback.textContent = msg;\n}\nfunction bad(msg){\n  feedback.className = \"feedback bad\";\n  feedback.textContent = msg;\n}\n\nfunction primeCelebrationAudio(){\n  const Ctx = window.AudioContext || window.webkitAudioContext;\n  if(!Ctx) return;\n  if(!celebrationAudioContext){\n    try{ celebrationAudioContext = new Ctx(); }catch(e){ return; }\n  }\n  if(celebrationAudioContext.state === \"suspended\"){\n    celebrationAudioContext.resume().catch(()=>{});\n  }\n}\nfunction playCelebrationChime(){\n  const ctx = celebrationAudioContext;\n  if(!ctx) return;\n  try{\n    const now = ctx.currentTime;\n    const notes = [\n      {f:523.25,t:0.00,d:.13},\n      {f:659.25,t:0.11,d:.13},\n      {f:783.99,t:0.22,d:.20}\n    ];\n    notes.forEach(n => {\n      const osc = ctx.createOscillator();\n      const gain = ctx.createGain();\n      osc.type = \"sine\";\n      osc.frequency.value = n.f;\n      gain.gain.setValueAtTime(0.0001, now+n.t);\n      gain.gain.exponentialRampToValueAtTime(0.16, now+n.t+.018);\n      gain.gain.exponentialRampToValueAtTime(0.0001, now+n.t+n.d);\n      osc.connect(gain);\n      gain.connect(ctx.destination);\n      osc.start(now+n.t);\n      osc.stop(now+n.t+n.d+.03);\n    });\n  }catch(e){}\n}\nfunction hideBravo(){\n  const el = $(\"#bravoOverlay\");\n  el.classList.remove(\"show\");\n  el.setAttribute(\"aria-hidden\",\"true\");\n}\nfunction showBravo(){\n  const el = $(\"#bravoOverlay\");\n  el.classList.add(\"show\");\n  el.setAttribute(\"aria-hidden\",\"false\");\n  playCelebrationChime();\n}\n\nfunction showStageOverlay(stage){\n  const overlay = $(\"#stageOverlay\");\n  const circle = $(\"#overlayCircle\");\n  const title = $(\"#overlayTitle\");\n  const text = $(\"#overlayText\");\n\n  const info = [\n    null,\n    [\"2\",\"Missing Letters 1\",\"Listen and complete two missing letters.\"],\n    [\"3\",\"Missing Letters 2\",\"Complete two different missing letters.\"],\n    [\"4\",\"Full Spelling\",\"Listen, look at the picture, and spell the whole word.\"]\n  ][stage];\n\n  if(!info) return;\n  circle.textContent = info[0];\n  title.textContent = info[1];\n  text.textContent = info[2];\n  overlay.classList.add(\"show\");\n\n  stageTimer = setTimeout(() => {\n    overlay.classList.remove(\"show\");\n    stageTimer = null;\n    renderQuestion(false);\n  }, STAGE_OVERLAY_DURATION);\n}\n\nfunction scheduleNext(){\n  if(bravoDelayTimer) clearTimeout(bravoDelayTimer);\n  if(bravoTimer) clearTimeout(bravoTimer);\n\n  bravoDelayTimer = setTimeout(() => {\n    bravoDelayTimer = null;\n    showBravo();\n\n    bravoTimer = setTimeout(() => {\n      bravoTimer = null;\n      hideBravo();\n\n      const previousStage = stageOf(q);\n      q++;\n\n      if(q >= TOTAL){\n        finish();\n        return;\n      }\n\n      setProgress();\n      const nextStage = stageOf(q);\n      if(nextStage !== previousStage){\n        stopAudio();\n        $(\"#main\").innerHTML = \"\";\n        feedback.textContent = \"\";\n        showStageOverlay(nextStage);\n      }else{\n        renderQuestion(false);\n      }\n    }, BRAVO_DURATION);\n  }, BRAVO_DELAY);\n}\n\nfunction makePicture(item, className=\"vocabPic\"){\n  const pic = document.createElement(\"div\");\n  pic.className = className;\n  const img = document.createElement(\"img\");\n  img.src = item.image;\n  img.alt = `${item.word} vocabulary picture`;\n  img.draggable = false;\n  pic.appendChild(img);\n  return pic;\n}\n\nfunction renderListen(item, roundNo){\n  questionTitle.textContent = \"Listen and choose\";\n  instruction.textContent = \"Which picture matches the word you hear?\";\n\n  const others = lesson.words.filter(w => w.word !== item.word);\n  const distractors = seededShuffle(others, `listen-${item.word}-${roundNo}`).slice(0,2);\n  const choices = seededShuffle([item, ...distractors], `choices-${item.word}-${roundNo}`);\n\n  const grid = document.createElement(\"div\");\n  grid.className = \"choiceGrid\";\n\n  choices.forEach((choice, idx) => {\n    const btn = document.createElement(\"button\");\n    btn.type = \"button\";\n    btn.className = \"picChoice\";\n    btn.setAttribute(\"aria-label\", `Picture choice ${idx+1}`);\n\n    const badge = document.createElement(\"span\");\n    badge.className = \"numBadge\";\n    badge.textContent = idx+1;\n\n    const img = document.createElement(\"img\");\n    img.src = choice.image;\n    img.alt = `Vocabulary picture choice ${idx+1}`;\n    img.draggable = false;\n\n    btn.append(badge,img);\n\n    btn.addEventListener(\"click\", () => {\n      if(answered || !audioRequirementSatisfied) return;\n      if(choice.word === item.word){\n        answered = true;\n        btn.classList.add(\"correct\");\n        grid.querySelectorAll(\".picChoice\").forEach(x => x.classList.add(\"locked\"));\n        good(\"Great!\");\n        stopAudio();\n        lasinCompleteCurrent();\n        scheduleNext();\n      }else{\n        btn.classList.remove(\"wrong\");\n        void btn.offsetWidth;\n        btn.classList.add(\"wrong\");\n        lasinMistakeCurrent();\n        bad(\"Try again. Listen carefully.\");\n      }\n    });\n\n    grid.appendChild(btn);\n  });\n\n  main.appendChild(grid);\n}\n\nfunction buildLetterBank(item, missing, stage){\n  const needed = missing.map(i => item.word[i]).filter(ch => ch && ch !== \" \");\n  const preferred = \"abcdefghijklmnopqrstuvwxyz\".split(\"\");\n  const pool = [...new Set(needed)];\n\n  const shuffled = seededShuffle(preferred, `bank-${item.word}-${stage}`);\n  for(const ch of shuffled){\n    if(pool.length >= 5) break;\n    if(!pool.includes(ch)) pool.push(ch);\n  }\n  return seededShuffle(pool, `bank-order-${item.word}-${stage}`);\n}\n\nfunction renderMissing(item, stage){\n  const isFirst = stage === 1;\n  questionTitle.textContent = isFirst ? \"Missing Letters 1\" : \"Missing Letters 2\";\n  instruction.textContent = isFirst\n    ? \"Listen and complete two missing letters.\"\n    : \"Complete two different missing letters.\";\n\n  currentMissing = (isFirst ? item.r2 : item.r3).slice().sort((a,b)=>a-b);\n  currentFilled = {};\n  blankCursor = 0;\n\n  const wrap = document.createElement(\"div\");\n  wrap.className = \"spellLayout\";\n\n  // Colors artwork has no printed answers, so the full picture is always shown.\n  const pic = makePicture(item, \"vocabPic\");\n\n  const pane = document.createElement(\"div\");\n  pane.className = \"spellPane\";\n\n  const wordRow = document.createElement(\"div\");\n  wordRow.className = \"letterWord\";\n\n  const tileByIndex = new Map();\n\n  // Build one unbreakable flex group per real word.\n  // A phrase may wrap only at its actual spaces: e.g. \"pencil case\" may become\n  // two lines, but \"backpack\" can never be split across lines.\n  let sourceIndex = 0;\n  item.word.split(\" \").forEach((wordPart) => {\n    const group = document.createElement(\"div\");\n    group.className = \"wordGroup\";\n    if(wordPart.length >= 8) group.classList.add(\"longWord\");\n    if(wordPart.length >= 10) group.classList.add(\"veryLongWord\");\n    group.setAttribute(\"aria-label\", wordPart);\n\n    [...wordPart].forEach((ch) => {\n      const index = sourceIndex;\n      const tile = document.createElement(\"div\");\n      tile.className = \"tile\";\n      tile.dataset.index = index;\n\n      if(currentMissing.includes(index)){\n        tile.classList.add(\"blank\");\n        tile.textContent = \"\";\n        tileByIndex.set(index,tile);\n      }else{\n        tile.textContent = ch;\n      }\n\n      group.appendChild(tile);\n      sourceIndex++;\n    });\n\n    wordRow.appendChild(group);\n    sourceIndex++; // account for the real space in the source phrase\n  });\n\n  function refreshCurrent(){\n    currentMissing.forEach((index, pos) => {\n      const tile = tileByIndex.get(index);\n      if(tile) tile.classList.toggle(\"current\", pos === blankCursor);\n    });\n  }\n\n  refreshCurrent();\n\n  const bank = document.createElement(\"div\");\n  bank.className = \"letterBank\";\n\n  buildLetterBank(item,currentMissing,stage).forEach(ch => {\n    const b = document.createElement(\"button\");\n    b.type = \"button\";\n    b.className = \"letterBtn\";\n    b.textContent = ch;\n    b.setAttribute(\"aria-label\", `Letter ${ch}`);\n\n    b.addEventListener(\"click\", () => {\n      if(answered || !audioRequirementSatisfied || blankCursor >= currentMissing.length) return;\n\n      const targetIndex = currentMissing[blankCursor];\n      const expected = item.word[targetIndex];\n\n      if(ch === expected){\n        const tile = tileByIndex.get(targetIndex);\n        currentFilled[targetIndex] = ch;\n        if(tile){\n          tile.textContent = ch;\n          tile.classList.remove(\"current\");\n        }\n        blankCursor++;\n\n        if(blankCursor >= currentMissing.length){\n          answered = true;\n          bank.querySelectorAll(\"button\").forEach(x => x.disabled = true);\n          good(\"Excellent!\");\n          stopAudio();\n          lasinCompleteCurrent();\n          scheduleNext();\n        }else{\n          refreshCurrent();\n          feedback.textContent = \"\";\n          feedback.className = \"feedback\";\n        }\n      }else{\n        b.classList.remove(\"wrong\");\n        void b.offsetWidth;\n        b.classList.add(\"wrong\");\n        lasinMistakeCurrent();\n        bad(\"Try another letter.\");\n      }\n    });\n\n    bank.appendChild(b);\n  });\n\n  pane.append(wordRow,bank);\n  wrap.append(pic,pane);\n  main.appendChild(wrap);\n}\n\nfunction renderFullSpell(item){\n  questionTitle.textContent = \"Spell the whole word\";\n  instruction.textContent = \"Listen, look at the picture, and type the complete word.\";\n\n  const wrap = document.createElement(\"div\");\n  wrap.className = \"spellLayout\";\n\n  const pic = makePicture(item,\"vocabPic\");\n\n  const pane = document.createElement(\"div\");\n  pane.className = \"fullSpell\";\n\n  const under = document.createElement(\"div\");\n  under.className = \"underscoreWord\";\n\n  // Keep every single lexical word intact; allow wrapping only between words.\n  item.word.split(\" \").forEach((wordPart) => {\n    const group = document.createElement(\"span\");\n    group.className = \"underscoreGroup\";\n    if(wordPart.length >= 8) group.classList.add(\"longWord\");\n    if(wordPart.length >= 10) group.classList.add(\"veryLongWord\");\n    group.textContent = Array.from(wordPart, () => \"_\").join(\" \");\n    under.appendChild(group);\n  });\n\n  const input = document.createElement(\"input\");\n  input.className = \"answerInput\";\n  input.type = \"text\";\n  input.inputMode = \"text\";\n  input.autocomplete = \"off\";\n  input.autocapitalize = \"none\";\n  input.spellcheck = false;\n  input.setAttribute(\"aria-label\", `Spell ${item.word}`);\n\n  const check = document.createElement(\"button\");\n  check.type = \"button\";\n  check.className = \"checkBtn\";\n  check.textContent = \"Check\";\n\n  const verify = () => {\n    if(answered || !audioRequirementSatisfied) return;\n    if(normalizeAnswer(input.value) === normalizeAnswer(item.word)){\n      answered = true;\n      input.disabled = true;\n      check.disabled = true;\n      good(\"Perfect spelling!\");\n      stopAudio();\n      lasinCompleteCurrent();\n      scheduleNext();\n    }else{\n      lasinMistakeCurrent();\n      bad(\"Try again. Listen one more time.\");\n      input.classList.remove(\"wrong\");\n      void input.offsetWidth;\n      input.classList.add(\"wrong\");\n      input.focus();\n      input.select();\n    }\n  };\n\n  check.addEventListener(\"click\",verify);\n  input.addEventListener(\"keydown\", e => {\n    if(e.key === \"Enter\") verify();\n  });\n\n  pane.append(under,input,check);\n  wrap.append(pic,pane);\n  main.appendChild(wrap);\n\n}\n\nfunction renderQuestion(initial){\n  stopAudio();\n  clearQuestionTimers();\n  if(q >= TOTAL){ finish(); return; }\n\n  answered = false;\n  blankCursor = 0;\n  currentMissing = [];\n  currentFilled = {};\n  main.innerHTML = \"\";\n  feedback.textContent = \"\";\n  feedback.className = \"feedback\";\n\n  const stage = stageOf(q);\n  const item = currentItem();\n  const local = wordIndex(q);\n\n  eyebrow.textContent = `Round ${stage+1} • Question ${local+1} of ${WORD_COUNT}`;\n\n  if(stage === 0) renderListen(item,local);\n  else if(stage === 1 || stage === 2) renderMissing(item,stage);\n  else renderFullSpell(item);\n\n  /* Freeze every answer route until this question's full audio sequence ends. */\n  lockAnswerControls();\n\n  setProgress();\n  scheduleAutoAudio();\n}\n\nfunction finish(){\n  stopAudio();\n  clearQuestionTimers();\n  q = TOTAL;\n  setProgress();\n  $(\"#questionScreen\").classList.add(\"hidden\");\n  $(\"#startScreen\").classList.add(\"hidden\");\n  $(\"#finishScreen\").classList.remove(\"hidden\");\n  lasinExerciseFinished();\n}\n\nfunction start(){\n  if(!allAudioEmbedded()) return;\n\n  if(bravoDelayTimer){ clearTimeout(bravoDelayTimer); bravoDelayTimer=null; }\n  if(bravoTimer){ clearTimeout(bravoTimer); bravoTimer=null; }\n  hideBravo();\n  primeCelebrationAudio();\n\n  q = Math.max(0,Math.min(TOTAL-1,LASIN_RESTORE_INDEX||0));\n  $(\"#startScreen\").classList.add(\"hidden\");\n  $(\"#finishScreen\").classList.add(\"hidden\");\n  $(\"#questionScreen\").classList.remove(\"hidden\");\n  setProgress();\n  renderQuestion(true);\n}\n\n$(\"#startBtn\").addEventListener(\"click\",start);\n$(\"#restartBtn\").addEventListener(\"click\",start);\n$(\"#audioBtn\").addEventListener(\"click\",playAudio);\n\ndocument.addEventListener(\"visibilitychange\", () => {\n  if(document.hidden) stopAudio();\n});\nwindow.addEventListener(\"pagehide\", stopAudio);\nwindow.addEventListener(\"beforeunload\", stopAudio);\n\n/* ---------- Teacher-side original MP3 embedder ---------- */\nconst audioSetup = $(\"#audioSetup\");\nconst embedAudioBtn = $(\"#embedAudioBtn\");\nconst audioFilePicker = $(\"#audioFilePicker\");\nconst audioSetupStatus = $(\"#audioSetupStatus\");\nconst audioSetupProgressBar = $(\"#audioSetupProgressBar\");\n\nfunction setAudioSetupStatus(text,type=\"\"){\n  audioSetupStatus.textContent = text;\n  audioSetupStatus.className = \"audioSetupStatus\" + (type ? \" \" + type : \"\");\n}\nfunction refreshAudioSetup(){\n  const embedded = lesson.words.filter(w => Boolean(audioSource(w))).length;\n  const pct = WORD_COUNT ? Math.round((embedded/WORD_COUNT)*100) : 0;\n  audioSetupProgressBar.style.width = pct + \"%\";\n\n  if(embedded === WORD_COUNT){\n    startBtn.disabled = false;\n    audioBtn.disabled = false;\n    audioSetup.classList.add(\"hidden\");\n  }else{\n    startBtn.disabled = true;\n    audioBtn.disabled = true;\n    audioSetup.classList.remove(\"hidden\");\n  }\n}\nfunction readFileAsDataURL(file){\n  return new Promise((resolve,reject) => {\n    const reader = new FileReader();\n    reader.onload = () => resolve(reader.result);\n    reader.onerror = () => reject(reader.error || new Error(\"Could not read file.\"));\n    reader.readAsDataURL(file);\n  });\n}\n\nasync function embedOriginalAudios(fileList){\n  const files = Array.from(fileList || []);\n  if(!files.length) return;\n\n  embedAudioBtn.disabled = true;\n  setAudioSetupStatus(`Checking the ${WORD_COUNT} original MP3 filenames…`);\n  audioSetupProgressBar.style.width = \"0%\";\n\n  try{\n    const map = new Map();\n    files.forEach(file => map.set(normalizeFileName(file.name),file));\n\n    const missing = [];\n    const matched = [];\n    for(const item of lesson.words){\n      const file = map.get(normalizeFileName(item.expectedFile));\n      if(file) matched.push({item,file});\n      else missing.push(item.expectedFile);\n    }\n\n    if(missing.length){\n      setAudioSetupStatus(`Missing: ${missing.join(\", \")}. Nothing was exported.`,\"bad\");\n      return;\n    }\n\n    for(let i=0;i\u003cmatched.length;i++){\n      const {item,file} = matched[i];\n      item.audio = await readFileAsDataURL(file);\n      audioSetupProgressBar.style.width = `${Math.round(((i+1)/matched.length)*100)}%`;\n      setAudioSetupStatus(`Embedding original audio ${i+1} of ${matched.length}: ${item.expectedFile}`);\n    }\n\n    LASIN_DATA_NODE.textContent = JSON.stringify(lesson).replace(/\u003c/g,\"\\\\u003c\");\n\n    if(!allAudioEmbedded()){\n      throw new Error(\"Original audio validation failed.\");\n    }\n\n    refreshAudioSetup();\n    setAudioSetupStatus(\n      `All ${WORD_COUNT} original MP3s are embedded. Creating the final standalone ${TOTAL}-question HTML…`,\n      \"ok\"\n    );\n\n    setTimeout(downloadStudentHTML,350);\n\n  }catch(err){\n    console.error(err);\n    setAudioSetupStatus(\n      `Something went wrong while reading the MP3s. Please select the ${WORD_COUNT} original files again.`,\n      \"bad\"\n    );\n    audioSetupProgressBar.style.width = \"0%\";\n  }finally{\n    embedAudioBtn.disabled = false;\n    audioFilePicker.value = \"\";\n  }\n}\n\nfunction downloadStudentHTML(){\n  stopAudio();\n\n  const clone = document.documentElement.cloneNode(true);\n\n  const dataNode = clone.querySelector(\"#lasinLessonData\");\n  dataNode.textContent = JSON.stringify(lesson).replace(/\u003c/g,\"\\\\u003c\");\n\n  // Reset student-facing state.\n  clone.querySelector(\"#startScreen\").classList.remove(\"hidden\");\n  clon
