s my ruler..mp3\",\"audio\":\"assets/audio/audio_07edf1e9c4a44fd1.mp3\",\"fallback\":\"\"},\"lets_share\":{\"expectedFile\":\"Let's SHARE..mp3\",\"audio\":\"assets/audio/audio_696b4b7a497e43fd.mp3\",\"fallback\":\"\"}}}\u003c/script\u003e\n\n\u003cscript\u003e\n(function(){\n\n/* LASIN v3.0 parent bridge \u2014 preview-only Vocab. */\nlet LASIN_CHILD_ACTIVE=false;\nfunction lasinSend(action,payload={}){\n  try{ parent.postMessage({channel:'LASIN_MOTIVATION_V3',action,payload:Object.assign({exerciseId:'vocab'},payload)},'*'); }catch(e){}\n}\nwindow.addEventListener('message',event=\u003e{\n  const data=event.data||{};\n  if(data.channel!=='LASIN_MOTIVATION_V3'||data.action!=='lasin:set-active') return;\n  const p=data.payload||{}; if(p.exerciseId!=='vocab') return;\n  LASIN_CHILD_ACTIVE=Boolean(p.active);\n  if(!LASIN_CHILD_ACTIVE){ try{stopAudio();}catch(e){} }\n});\nsetTimeout(()=\u003elasinSend('child-ready',{}),0);\n\nconst PAGE_SIZE = 2;\nconst REPEAT_GAP_MS = 500;\nconst EXPORT_FILENAME = \"Everybody_Up_1_Unit_01_Lesson_02_School_Supplies_Vocab_EMBEDDED.html\";\nconst homeScreen=document.getElementById(\"homeScreen\"),lessonScreen=document.getElementById(\"lessonScreen\"),openVocab=document.getElementById(\"openVocab\"),homeButton=document.getElementById(\"homeButton\"),cardsEl=document.getElementById(\"cards\"),dotsEl=document.getElementById(\"dots\"),prevButton=document.getElementById(\"prevButton\"),nextButton=document.getElementById(\"nextButton\"),pagePill=document.getElementById(\"pagePill\"),embedWrap=document.getElementById(\"embedWrap\"),embedButton=document.getElementById(\"embedButton\"),audioPicker=document.getElementById(\"audioPicker\"),embedStatus=document.getElementById(\"embedStatus\"),embedHelp=document.getElementById(\"embedHelp\");\nlet LESSON=JSON.parse(document.getElementById(\"lesson-data\").textContent);\nlet ROWS=Array.isArray(LESSON.rows)?LESSON.rows:[];\nlet AUDIO_ASSETS=LESSON.audioAssets\u0026\u0026typeof LESSON.audioAssets===\"object\"?LESSON.audioAssets:{};\nlet currentPage=0,activeButton=null,sequenceTimer=null,playToken=0;\nconst sharedAudio=new Audio(); sharedAudio.preload=\"auto\";\nfunction totalPages(){return Math.max(1,Math.ceil(ROWS.length/PAGE_SIZE))}\nfunction normalizeFileName(name){return String(name||\"\").replace(/^.*[\\\\/]/,\"\").trim().toLowerCase().replace(/\\s+/g,\" \").replace(/\\.+mp3$/i,\".mp3\")}\nfunction assetAudio(key){const asset=AUDIO_ASSETS[key];return asset?(asset.audio||asset.fallback||\"\"):\"\"}\nfunction buildAudioRequirements(){return Object.entries(AUDIO_ASSETS).filter(([,asset])=\u003easset\u0026\u0026normalizeFileName(asset.expectedFile)).map(([key,asset])=\u003e({key,label:asset.expectedFile,expected:asset.expectedFile,asset}))}\nfunction requiredAudioCount(){return buildAudioRequirements().length}\nfunction allAudioEmbedded(){const reqs=buildAudioRequirements();return reqs.length\u003e0\u0026\u0026reqs.every(req=\u003eBoolean(assetAudio(req.key)))}\nfunction updateEmbedCopy(){if(embedHelp)embedHelp.textContent=`One-time teacher setup only. Select the ${requiredAudioCount()} original MP3 files; the browser will create the final standalone student HTML.`}\nfunction updateEmbedVisibility(){updateEmbedCopy();if(allAudioEmbedded())embedWrap.classList.remove(\"show\");else embedWrap.classList.add(\"show\")}\nfunction showEmbedStatus(text,type=\"\"){embedStatus.textContent=text;embedStatus.className=\"embed-status show\"+(type?\" \"+type:\"\")}\nfunction clearPlayingVisual(){if(activeButton){activeButton.classList.remove(\"playing\");activeButton.setAttribute(\"aria-pressed\",\"false\")}activeButton=null}\nfunction stopAudio(){playToken++;if(sequenceTimer){clearTimeout(sequenceTimer);sequenceTimer=null}sharedAudio.pause();sharedAudio.removeAttribute(\"src\");sharedAudio.load();sharedAudio.onended=null;sharedAudio.onerror=null;clearPlayingVisual()}\nfunction headsetSvg(){return `\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"\u003e\u003cpath fill=\"currentColor\" d=\"M12 3a8 8 0 0 0-8 8v6a3 3 0 0 0 3 3h2v-8H6v-1a6 6 0 1 1 12 0v1h-3v8h2a3 3 0 0 0 3-3v-6a8 8 0 0 0-8-8Zm-5 11h1v4H7a1 1 0 0 1-1-1v-3h1Zm10 4h-1v-4h2v3a1 1 0 0 1-1 1Z\"/\u003e\u003c/svg\u003e`}\nfunction playSequence(steps,button,missingMessage){\n  stopAudio();\n  if(!steps.length||steps.some(step=\u003e!step.src)){showEmbedStatus(missingMessage,\"error\");return}\n  const myToken=++playToken;activeButton=button;button.classList.add(\"playing\");button.setAttribute(\"aria-pressed\",\"true\");let stepIndex=0;\n  const playStep=()=\u003e{if(myToken!==playToken)return;const step=steps[stepIndex];sharedAudio.onended=()=\u003e{if(myToken!==playToken)return;if(stepIndex\u003e=steps.length-1){sharedAudio.onended=null;clearPlayingVisual();return}const gap=Math.max(0,Number(step.gapAfterMs)||0);stepIndex++;sequenceTimer=setTimeout(()=\u003e{sequenceTimer=null;if(myToken!==playToken)return;playStep()},gap)};sharedAudio.onerror=()=\u003e{if(myToken===playToken)stopAudio()};sharedAudio.src=step.src;try{sharedAudio.currentTime=0}catch(e){}sharedAudio.play().catch(()=\u003e{if(myToken===playToken)stopAudio()})};\n  playStep();\n}\nfunction playTwice(src,button,missingMessage){playSequence([{src,gapAfterMs:REPEAT_GAP_MS},{src,gapAfterMs:0}],button,missingMessage)}\nfunction playPanelAudio(panel,button){playTwice(assetAudio(panel.audioKey),button,`Original sentence audio for \u201c${panel.text}\u201d is not embedded yet. Use \u201cEmbed Original MP3s\u201d on the Home screen.`)}\nfunction renderDots(){dotsEl.innerHTML=\"\";const pages=totalPages();for(let i=0;i\u003cpages;i++){const dot=document.createElement(\"button\");dot.type=\"button\";dot.className=\"dot\"+(i===currentPage?\" active\":\"\");dot.setAttribute(\"aria-label\",`Go to page ${i+1}`);if(i===currentPage)dot.setAttribute(\"aria-current\",\"page\");dot.addEventListener(\"click\",()=\u003egoToPage(i));dotsEl.appendChild(dot)}}\nfunction partialClass(count){if(count\u003e=PAGE_SIZE)return \" d(rowCard)});\n  pagePill.textContent=`Page ${currentPage+1} of ${pages}`;prevButton.disabled=currentPage===0;nextButton.disabled=currentPage===pages-1;renderDots();\n}\nfunction goToPage(index){const pages=totalPages(),next=Math.max(0,Math.min(pages-1,index));if(next===currentPage){stopAudio();return}currentPage=next;renderPage();window.scrollTo({top:0,behavior:\"auto\"})}\nfunction showHome(){stopAudio();lessonScreen.classList.remove(\"active\");homeScreen.classList.add(\"active\");updateEmbedVisibility()}\nfunction showLesson(){stopAudio();homeScreen.classList.remove(\"active\");lessonScreen.classList.add(\"active\");renderPage()}\nopenVocab.addEventListener(\"click\",showLesson);homeButton.addEventListener(\"click\",showHome);prevButton.addEventListener(\"click\",()=\u003egoToPage(currentPage-1));nextButton.addEventListener(\"click\",()=\u003egoToPage(currentPage+1));\nembedButton.addEventListener(\"click\",()=\u003e{audioPicker.value=\"\";audioPicker.click()});\naudioPicker.addEventListener(\"change\",async()=\u003e{\n  const files=Array.from(audioPicker.files||[]);if(!files.length)return;const fileMap=new Map();files.forEach(file=\u003efileMap.set(normalizeFileName(file.name),file));const requirements=buildAudioRequirements(),missing=[],matched=[];\n  for(const req of requirements){const file=fileMap.get(normalizeFileName(req.expected));if(file)matched.push({req,file});else missing.push(req.label)}\n  if(missing.length){showEmbedStatus(`Missing ${missing.length} file${missing.length===1?\"\":\"s\"}: ${missing.join(\", \")}. Nothing was exported.`,\"error\");return}\n  const requiredCount=requirements.length;showEmbedStatus(`All ${requiredCount} original MP3s were found. Embedding them now\u2026`);\n  try{\n    const readAsDataURL=file=\u003enew Promise((resolve,reject)=\u003e{const reader=new FileReader();reader.onload=()=\u003eresolve(reader.result);reader.onerror=()=\u003ereject(reader.error||new Error(\"Could not read file\"));reader.readAsDataURL(file)});\  Paint sentence practice\n   Approved master visual system, adapted to sentence-based content.\n   Five stages / 39 progress pages:\n   17 Listen \u0026 Choose + 7 Unscramble Sentence 1 + 7 Unscramble Sentence 2\n   + 3 Let's SHARE. unscrambles + 5 Drag \u0026 Drop pages.\n   Stages 1\u20134: mandatory 3-play listening gate with 500 ms gaps.\n   Stage 5: correct match -\u003e freeze page -\u003e 3-play confirmation with 500 ms gaps.\n*/\nconst LASIN_DATA_NODE = document.getElementById(\"lasinLessonData\");\nconst lesson = JSON.parse(LASIN_DATA_NODE.textContent);\n\nconst $ = s =\u003e document.querySelector(s);\nconst main = $(\"#main\");\nconst feedback = $(\"#feedback\");\nconst questionTitle = $(\"#questionTitle\");\nconst instruction = $(\"#instruction\");\nconst eyebrow = $(\"#eyebrow\");\nconst audioArea = $(\"#audioArea\");\nconst audioBtn = $(\"#audioBtn\");\nconst audioBtnLabel = $(\"#audioBtnLabel\");\nconst startBtn = $(\"#startBtn\");\n\nconst sentenceById = new Map(lesson.sentences.map(s =\u003e [s.id,s]));\nconst visualById = new Map(lesson.visuals.map(v =\u003e [v.id,v]));\n\nconst stageDefs = [\n  {\n    name:\"Listen \u0026 Choose\",\n    overlayTitle:\"Listen \u0026 Choose\",\n    overlayText:\"Listen carefully, then choose the matching picture.\",\n    questions:lesson.stageData.listenVisualIds.map(visualId =\u003e ({type:\"listen\",visualId}))\n  },\n  {\n    name:\"Unscramble Sentence 1\",\n    overlayTitle:\"Unscramble Sentence 1\",\n    overlayText:\"Listen, then put the words in the correct order.\",\n    questions:lesson.stageData.unscrambleThisIds.map(sentenceId =\u003e ({type:\"unscramble\",sentenceId}))\n  },\n  {\n    name:\"Unscramble Sentence 2\",\n    overlayTitle:\"Unscramble Sentence 2\",\n    overlayText:\"Listen, then put the words in the correct order.\",\n    questions:lesson.stageData.unscrambleItsIds.map(sentenceId =\u003e ({type:\"unscramble\",sentenceId}))\n  },\n  {\n    name:\"Let's SHARE.\",\n    overlayTitle:\"Let's SHAR ame=\"feedback good\"; feedback.textContent=msg; }\nfunction bad(msg){ feedback.className=\"feedback bad\"; feedback.textContent=msg; }\nfunction clearFeedback(){ feedback.className=\"feedback\"; feedback.textContent=\"\"; }\n\nfunction applyLessonMetadata(){\n  const parts=[`Unit ${lesson.unitNumber}`,lesson.unitName,`Lesson ${lesson.lessonNumber}`,lesson.lessonName].filter(Boolean);\n  $(\"#lessonMeta\").textContent=parts.join(\" \u2022 \");\n  $(\"#heroWord\").textContent=lesson.category;\n  $(\"#finishText\").textContent=`You finished all ${TOTAL} vocabulary questions.`;\n  document.title=`LASIN | Unit ${lesson.unitNumber} Lesson ${lesson.lessonNumber} | ${lesson.category} Vocabulary`;\n  $(\"#audioSetupText\").textContent=`Select the ${AUDIO_COUNT} original MP3 files for ${lesson.category} once. They will be embedded directly into a new standalone student HTML without re-encoding the recordings.`;\n  $(\"#embedAudioBtn\").textContent=`Embed the ${AUDIO_COUNT} Original MP3s`;\n}\nfunction setProgress(){\n  const done=Math.max(0,Math.min(q,TOTAL));\n  $(\"#counter\").textContent=`${done}/${TOTAL}`;\n  $(\"#progressBar\").style.width=`${TOTAL ? (done/TOTAL)*100 : 0}%`;\n  const s=q\u003e=TOTAL ? stageDefs.length : currentPosition().stage;\n  document.querySelectorAll(\".stagePill\").forEach((pill,i)=\u003e{\n    pill.classList.toggle(\"done\",i\u003cs);\n    pill.classList.toggle(\"active\",i===s \u0026\u0026 s\u003cstageDefs.length);\n  });\n}\nfunction clearQuestionTimers(){\n  if(autoAudioTimer){ clearTimeout(autoAudioTimer); autoAudioTimer=null; }\n  if(stageTimer){ clearTimeout(stageTimer); stageTimer=null; }\n  if(resetAttemptTimer){ clearTimeout(resetAttemptTimer); resetAttemptTimer=null; }\n}\nfunction stopAudio(){\n  audioSequenceToken++;\n  if(audioRepeatTimer){ clearTimeout(audioRepeatTimer); audioRepeatTimer=null; }\n  if(autoAudioTimer){ clearTimeout(autoAudioTimer); autoAudioTimer=null; }\n  audioPlayer.pause();\n  audioPlayer.onended=null;\n  audioP function calculateTypingAllowanceSeconds(meta){meta=meta||{};const mode=normalizeMode(meta.responseMode||meta.inputMode);if(!isTypingResponseMode(mode))return 0;if(meta.typingAllowanceOverrideSeconds!=null&&Number.isFinite(+meta.typingAllowanceOverrideSeconds))return Math.min(Math.max(0,+meta.typingAllowanceOverrideSeconds),Math.max(0,+CONFIG.typingFairness.maxAllowanceSeconds||0));const m=typingMetrics(meta.expectedAnswer);if(!m.normalized)return 0;return Math.min(Math.max(0,+CONFIG.typingFairness.maxAllowanceSeconds||0),characterAllowance(m.characters)+Math.max(0,m.words-1)*Math.max(0,+CONFIG.typingFairness.extraWordSeconds||0))}
function pointsForEffectiveSeconds(seconds){const safe=Math.max(0,+seconds||0);if(CONFIG.hardDeadline&&safe>CONFIG.timerSeconds)return 0;const b=CONFIG.pointsBands.find(x=>safe<=+x.maxSeconds);if(b)return Math.max(0,+b.points||0);const last=CONFIG.pointsBands.at(-1);return last?Math.max(0,+last.points||0):0}
function questionCompleted(payload){const q=resolveQuestion(payload);if(!state.started||state.finished||!q)return {accepted:false};if(q.completed)return {accepted:false,reason:'already-completed'};if(payload&&payload.hadMistake===true)q.hadMistake=true;if(payload&&payload.matchedExpectedAnswer!=null)q.matchedExpectedAnswer=payload.matchedExpectedAnswer;const elapsedMs=effectiveElapsedMs(q);pauseQuestion(q);const rawSeconds=Math.max(0,elapsedMs/1000),answerForFairness=q.matchedExpectedAnswer!=null?q.matchedExpectedAnswer:q.expectedAnswer,allowance=calculateTypingAllowanceSeconds({responseMode:q.responseMode,expectedAnswer:answerForFairness,typingAllowanceOverrideSeconds:q.typingAllowanceOverrideSeconds}),effectiveSeconds=Math.max(0,rawSeconds-allowance),clean=!q.hadMistake,earned=clean?pointsForEffectiveSeconds(effectiveSeconds):0;q.completed=true;q.elapsedMs=elapsedMs;q.rawElapsedSeconds=rawSeconds;q.typingAllowanceSeconds=allowance;q.effectiveElapsedSeconds=effectiveSeconds;q.classification=clean?'correct':'wrong';q.pointsEarned=earned;state.points+=earned;if(clean)state.correct++;else state.wrong++;if(clean&&earned>0)showPointsCelebration(earned);updateHUD(true);persist();finishIfComplete(q.exerciseId);return {accepted:true}}
function runTimer(){cancelAnimationFrame(state.timerRAF);const frame=()=>{const q=activeQuestion();if(!state.started||state.finished||!q||q.completed||q.runningSince==null){state.timerRAF=0;updateHUD();return}const elapsed=effectiveElapsedMs(q)/1000,remaining=Math.max(0,CONFIG.timerSeconds-elapsed);timerEl.textContent=`${Math.ceil(remaining)}s`;timerFillEl.style.width=`${Math.max(0,Math.min(1,remaining/CONFIG.timerSeconds))*100}%`;state.timerRAF=requestAnimationFrame(frame)};frame()}
function ratingForAccuracy(a){if(a>=90)return'EXCELLENT';if(a>=70)return'VERY GOOD';if(a>=50)return'GOOD';return'NOT SO GOOD'}
function updateHUD(bump=false){studentEl.textContent=state.studentName||'—';pointsEl.textContent=String(state.points);if(bump){pointsEl.classList.remove('bump');void pointsEl.offsetWidth;pointsEl.classList.add('bump');setTimeout(()=>pointsEl.classList.remove('bump'),220)}const ex=state.exercises.get(state.activeExerciseId),q=activeQuestion();if(!ex||!ex.scorable){modeLabelEl.textContent='Preview';progressEl.textContent=ex?ex.label:'Preview';timerEl.textContent=state.started?'PREVIEW':'—';timerFillEl.style.width='100%';return}if(q&&!q.completed){modeLabelEl.textContent='Question';const gi=globalIndexFor(q.exerciseId,q.localIndex);progressEl.textContent=gi?`${gi} / ${totalScoredQuestions()}`:ex.label;if(q.runningSince==null){timerEl.textContent=q.ready?'PAUSED':'WAIT';timerFillEl.style.width='100%'}return}modeLabelEl.textContent='Progress';progressEl.textContent=`${completedQuestions().length} / ${totalScoredQuestions()}`;timerEl.textContent='WAIT';timerFillEl.style.width='100%'}
function showPointsCelebration(points){const pop=document.createElement('div');pop.className='lasin-points-pop';pop.innerHTML=`<span class="lasin-points-main">+${points}</span><span class="lasin-points-sub">POINT${points===1?'':'S'} ⭐</span>`;document.body.appendChild(pop);pop.addEventListener('animationend',()=>pop.remove(),{once:true});setTimeout(()=>pop.remove(),1600)}
function finishIfComplete(exerciseId){if(totalScoredQuestions()>0&&completedQuestions().length===totalScoredQuestions()){state.pendingFinish=true;state.finalizingExerciseId=exerciseId;persist()}}
function onExerciseFinished(exerciseId){if(!state.pendingFinish||state.finished||completedQuestions().length!==totalScoredQuestions())return;if(state.finalizingExerciseId&&exerciseId!==state.finalizingExerciseId)return;clearTimeout(finishDelay);finishDelay=setTimeout(finish,700)}
function finish(){if(state.finished||completedQuestions().length!==totalScoredQuestions())return false;state.finished=true;state.pendingFinish=false;pauseActive();renderResults();resultsScreen.classList.remove('hidden');persist();return true}
function renderResults(){const total=totalScoredQuestions(),accuracy=total?Math.round(state.correct/total*100):0,rating=ratingForAccuracy(accuracy);$('#lasin-results-title').textContent=`Great work, ${state.studentName}!`;$('#lasin-result-points').textContent=`${state.points} / ${maxPoints()}`;$('#lasin-result-correct').textContent=String(state.correct);$('#lasin-result-wrong').textContent=String(state.wrong);$('#lasin-result-total').textContent=String(total);$('#lasin-result-accuracy').textContent=`${accuracy}%`;$('#lasin-rating').textContent=rating}
function serializePersistentQuestion(q){return {key:q.key,exerciseId:q.exerciseId,questionId:q.questionId,localIndex:q.localIndex,ready:q.ready,hadMistake:q.hadMistake,completed:q.completed,classification:q.classification,pointsEarned:q.pointsEarned,elapsedMs:effectiveElapsedMs(q),responseMode:q.responseMode,expectedAnswer:q.expectedAnswer,matchedExpectedAnswer:q.matchedExpectedAnswer,typingAllowanceOverrideSeconds:q.typingAllowanceOverrideSeconds,typingAllowanceSeconds:q.typingAllowanceSeconds,rawElapsedSeconds:q.rawElapsedSeconds,effectiveElapsedSeconds:q.effectiveElapsedSeconds}}
function persist(){if(hydrating||!CONFIG.persistSession)return;try{sessionStorage.setItem(CONFIG.persistenceKey,JSON.stringify({version:CONFIG.version,studentName:state.studentName,started:state.started,finished:state.finished,pendingFinish:state.pendingFinish,finalizingExerciseId:state.finalizingExerciseId,activeExerciseId:state.activeExerciseId,points:state.points,correct:state.correct,wrong:state.wrong,questions:[...state.questions.values()].map(serializePersistentQuestion),lastQuestionByExercise:[...state.lastQuestionByExercise.entries()]}))}catch(e){}}
function restore(){let saved=null;try{const raw=sessionStorage.getItem(CONFIG.persistenceKey);if(raw)saved=JSON.parse(raw)}catch(e){}if(saved&&saved.version===CONFIG.version){state.studentName=saved.studentName||'';state.started=!!saved.started;state.finished=!!saved.finished;state.pendingFinish=!!saved.pendingFinish;state.finalizingExerciseId=saved.finalizingExerciseId||null;state.activeExerciseId=state.exercises.has(saved.activeExerciseId)?saved.activeExerciseId:'vocab';state.points=+saved.points||0;state.correct=+saved.correct||0;state.wrong=+saved.wrong||0;(saved.questions||[]).forEach(s=>{const q=ensureQuestion(s.exerciseId,s.questionId,s.localIndex);Object.assign(q,{ready:!!s.ready,hadMistake:!!s.hadMistake,completed:!!s.completed,classification:s.classification||null,pointsEarned:+s.pointsEarned||0,elapsedMs:Math.max(0,+s.elapsedMs||0),runningSince:null,responseMode:normalizeMode(s.responseMode),expectedAnswer:s.expectedAnswer??null,matchedExpectedAnswer:s.matchedExpectedAnswer??null,typingAllowanceOverrideSeconds:s.typingAllowanceOverrideSeconds==null?null:+s.typingAllowanceOverrideSeconds,typingAllowanceSeconds:Math.max(0,+s.typingAllowanceSeconds||0),rawElapsedSeconds:s.rawElapsedSeconds==null?null:+s.rawElapsedSeconds,effectiveElapsedSeconds:s.effectiveElapsedSeconds==null?null:+s.effectiveElapsedSeconds})});state.lastQuestionByExercise=new Map(Array.isArray(saved.lastQuestionByExercise)?saved.lastQuestionByExercise:[]);if(state.started){nameInput.value=state.studentName;startScreen.classList.add('hidden');root.classList.add('started')}if(state.finished){renderResults();resultsScreen.classList.remove('hidden')}}hydrating=false;updateHUD();updateNav();if(state.started)showExercise(state.activeExerciseId,{skipPersist:true});persist()}
function firstIncompleteIndex(exerciseId){const ex=state.exercises.get(exerciseId);if(!ex||!ex.scorable)return 1;for(let i=1;i<=ex.totalQuestions;i++){const q=state.questions.get(questionKey(exerciseId,String(i)));if(!q||!q.completed)return i}return 1}
const frames=new Map(),loaded=new Set();
function ensureFrame(exerciseId){if(frames.has(exerciseId))return frames.get(exerciseId);const frame=document.createElement('iframe');frame.className='lasin-lesson-frame';frame.title=state.exercises.get(exerciseId)?.label||exerciseId;frame.dataset.exercise=exerciseId;frame.setAttribute('allow','autoplay');frame.addEventListener('load',()=>{loaded.add(exerciseId);sendActiveToChild(exerciseId,exerciseId===state.activeExerciseId)});const srcNode=document.getElementById(`lasin-src-${exerciseId}`);frame.srcdoc=JSON.parse(srcNode.textContent);host.appendChild(frame);frames.set(exerciseId,frame);return frame}
function sendActiveToChild(exerciseId,active){const frame=frames.get(exerciseId);if(!frame||!frame.contentWindow)return;frame.contentWindow.postMessage({channel:CONFIG.messageChannel,action:'lasin:set-active',payload:{exerciseId,active,resumeLocalIndex:firstIncompleteIndex(exerciseId)}},'*')}
function showExercise(exerciseId,opt={}){if(!state.exercises.has(exerciseId))return;const old=state.activeExerciseId;if(old!==exerciseId){pauseActive();sendActiveToChild(old,false)}state.activeExerciseId=exerciseId;const frame=ensureFrame(exerciseId);frames.forEach((f,id)=>f.classList.toggle('active',id===exerciseId));if(loaded.has(exerciseId))sendActiveToChild(exerciseId,true);if(state.started&&!state.finished&&isScorableExercise(exerciseId))resumeQuestionForExercise(exerciseId);updateHUD();updateNav();if(!opt.skipPersist)persist()}
function updateNav(){document.querySelectorAll('.lasin-nav-btn').forEach(b=>{const id=b.dataset.exercise;b.classList.toggle('active',id===state.activeExerciseId);const ex=state.exercises.get(id);if(ex&&ex.scorable){let c=0;for(let i=1;i<=ex.totalQuestions;i++){const q=state.questions.get(questionKey(id,String(i)));if(q&&q.completed)c++}b.querySelector('.nav-count')?.remove();if(c){const s=document.createElement('span');s.className='nav-count';s.textContent=`${c}/${ex.totalQuestions}`;b.appendChild(s)}}})}
function start(name){const clean=String(name??nameInput.value??'').trim();if(!clean){startError.textContent='Please type your name first.';nameInput.focus();return false}state.studentName=clean;state.started=true;state.finished=false;state.pendingFinish=false;startError.textContent='';startScreen.classList.add('hidden');resultsScreen.classList.add('hidden');root.classList.add('started');updateHUD();persist();showExercise(state.activeExerciseId);return true}
function reset(){try{sessionStorage.removeItem(CONFIG.persistenceKey)}catch(e){}location.reload()}
window.addEventListener('message',event=>{const data=event.data||{};if(data.channel!==CONFIG.messageChannel||typeof data.action!=='string')return;let sourceExercise=null;for(const [id,f] of frames){if(f.contentWindow===event.source){sourceExercise=id;break}}if(!sourceExercise)return;const p=Object.assign({},data.payload||{},{exerciseId:sourceExercise});if(data.action==='child-ready'){sendActiveToChild(sourceExercise,sourceExercise===state.activeExerciseId);return}if(sourceExercise!==state.activeExerciseId&&['question-ready','pause-active','question-mistake','question-completed'].includes(data.action))return;if(data.action==='question-ready')questionReady(p);else if(data.action==='pause-active')questionWaiting(p);else if(data.action==='question-mistake')questionMistake(p);else if(data.action==='question-completed')questionCompleted(p);else if(data.action==='exercise-finished')onExerciseFinished(sourceExercise)});
document.querySelectorAll('.lasin-nav-btn').forEach(b=>b.addEventListener('click',()=>showExercise(b.dataset.exercise)));startBtn.addEventListener('click',()=>start());nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')start()});restartBtn.addEventListener('click',reset);window.addEventListener('pagehide',pauseActive);document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseActive();sendActiveToChild(state.activeExerciseId,false)}else if(state.started&&!state.finished){sendActiveToChild(state.activeExerciseId,true);resumeQuestionForExercise(state.activeExerciseId)}});
window.LASINMotivation=Object.freeze({version:CONFIG.version,config:CONFIG,getState:()=>({started:state.started,finished:state.finished,studentName:state.studentName,activeExerciseId:state.activeExerciseId,totalQuestions:totalScoredQuestions(),answered:completedQuestions().length,correct:state.correct,wrong:state.wrong,points:state.points,maxPoints:maxPoints(),timerSeconds:CONFIG.timerSeconds}),calculateTypingAllowanceSeconds,pointsForEffectiveSeconds,reset});
restore();
})();
</script>
