 0 0-8-8Zm-5 11h1v4H7a1 1 0 0 1-1-1v-3h1Zm10 4h-1v-4h2v3a1 1 0 0 1-1 1Z\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv class=\"tap-note\">Tap to hear it twice\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"card\">\u003cdiv class=\"picture-frame\">\u003cimg src=\"@@LASIN_ASSET_0002@@\" alt=\"South America vocabulary picture\" draggable=\"false\">\u003c/div>\u003cdiv class=\"word-box\">South America\u003c/div>\u003cdiv class=\"audio-area\">\u003cbutton type=\"button\" class=\"audio-btn\" aria-label=\"Play South America twice\" aria-pressed=\"false\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\">\u003cpath fill=\"currentColor\" d=\"M12 3a8 8 0 0 0-8 8v6a3 3 0 0 0 3 3h2v-8H6v-1a6 6 0 1 1 12 0v1h-3v8h2a3 3 0 0 0 3-3v-6a8 8 0 0 0-8-8Zm-5 11h1v4H7a1 1 0 0 1-1-1v-3h1Zm10 4h-1v-4h2v3a1 1 0 0 1-1 1Z\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv class=\"tap-note\">Tap to hear it twice\u003c/div>\u003c/div>\u003c/article>\u003c/main>\n  \u003cnav class=\"navbar\" aria-label=\"Vocabulary pages\">\n    \u003cbutton id=\"prevButton\" class=\"nav-btn prev\" type=\"button\" disabled=\"\">\u2190 Previous\u003c/button>\n    \u003cdiv id=\"dots\" class=\"dots\">\u003cbutton type=\"button\" class=\"dot active\" aria-label=\"Go to page 1\" aria-current=\"page\">\u003c/button>\u003cbutton type=\"button\" class=\"dot\" aria-label=\"Go to page 2\">\u003c/button>\u003cbutton type=\"button\" class=\"dot\" aria-label=\"Go to page 3\">\u003c/button>\u003cbutton type=\"button\" class=\"dot\" aria-label=\"Go to page 4\">\u003c/button>\u003cbutton type=\"button\" class=\"dot\" aria-label=\"Go to page 5\">\u003c/button>\u003cbutton type=\"button\" class=\"dot\" aria-label=\"Go to page 6\">\u003c/button>\u003c/div>\n    \u003cbutton id=\"nextButton\" class=\"nav-btn next\" type=\"button\">Next \u2192\u003c/button>\n  \u003c/nav>\n\u003c/section>\n\u003cscript id=\"vocab-data\" type=\"application/json\">[{\"word\":\"North America\",\"image\":\"@@LASIN_ASSET_0001@@\",\"audio\":\"@@LASIN_ASSET_0003@@\",\"expectedFile\":\"North America.mp3\"},{\"word\":\"South America\",\"image\":\"@@LASIN_ASSET_0002@@\",\"audio\":\"@@LASIN_ASSET_0004@@\",\"expectedFile\":\"South America.mp3\"},{\"word\":\"Europe\",\"image\":\"@@LASIN_ASSET_0005@@\",\"audio\":\"@@LASIN_ASSET_0006@@\",\"expectedFile\":\"Europe.mp3\"},{\"word\":\"Africa\",\"image\":\"@@LASIN_ASSET_0007@@\",\"audio\":\"@@LASIN_ASSET_0008@@\",\"expectedFile\":\"Africa.mp3\"},{\"word\":\"Asia\",\"image\":\"@@LASIN_ASSET_0009@@\",\"audio\":\"@@LASIN_ASSET_0010@@\",\"expectedFile\":\"Asia.mp3\"},{\"word\":\"Australia\",\"image\":\"@@LASIN_ASSET_0011@@\",\"audio\":\"@@LASIN_ASSET_0012@@\",\"expectedFile\":\"Australia.mp3\"},{\"word\":\"Antarctica\",\"image\":\"@@LASIN_ASSET_0013@@\",\"audio\":\"@@LASIN_ASSET_0014@@\",\"expectedFile\":\"Antarctica.mp3\"},{\"word\":\"Cardinal directions\",\"image\":\"@@LASIN_ASSET_0015@@\",\"audio\":\"@@LASIN_ASSET_0016@@\",\"expectedFile\":\"Cardinal directions.mp3\"},{\"word\":\"North\",\"image\":\"@@LASIN_ASSET_0017@@\",\"audio\":\"@@LASIN_ASSET_0018@@\",\"expectedFile\":\"North..mp3\"},{\"word\":\"South\",\"image\":\"@@LASIN_ASSET_0019@@\",\"audio\":\"@@LASIN_ASSET_0020@@\",\"expectedFile\":\"South..mp3\"},{\"word\":\"East\",\"image\":\"@@LASIN_ASSET_0021@@\",\"audio\":\"@@LASIN_ASSET_0022@@\",\"expectedFile\":\"East.mp3\"},{\"word\":\"West\",\"image\":\"@@LASIN_ASSET_0023@@\",\"audio\":\"@@LASIN_ASSET_0024@@\",\"expectedFile\":\"West..mp3\"}]\u003c/script>\n\u003cscript>\n(()=>{\n  const VOCAB=JSON.parse(document.getElementById('vocab-data').textContent);\n  const PAGE_SIZE=2, TOTAL_PAGES=Math.ceil(VOCAB.length/PAGE_SIZE), GAP_MS=500;\n  let page=0, playToken=0, gapTimer=null, activeButton=null;\n  const audio=new Audio(); audio.preload='auto';\n  const $=id=>document.getElementById(id);\n  const homeScreen=$('homeScreen'), lessonScreen=$('lessonScreen'), cards=$('cards');\n  const pagePill=$('pagePill'), prev=$('prevButton'), next=$('nextButton'), dots=$('dots');\n  const headset=()=>`\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\">\u003cpath fill=\"currentColor\" d=\"M12 3a8 8 0 0 0-8 8v6a3 3 0 0 0 3 3h2v-8H6v-1a6 6 0 1 1 12 0v1h-3v8h2a3 3 0 0 0 3-3v-6a8 8 0 0 0-8-8Zm-5 11h1v4H7a1 1 0 0 1-1-1v-3h1Zm10 4h-1v-4h2v3a1 1 0 0 1-1 1Z\">\u003c/path>\u003c/svg>`;\n\n  function stopAudio(){\n    playToken++;\n    if(gapTimer){clearTimeout(gapTimer);gapTimer=null;}\n    audio.pause();\n    try{audio.currentTime=0}catch(e){}\n    audio.onended=null;audio.onerror=null;\n    if(activeButton){activeButton.classList.remove('playing');activeButton.setAttribute('aria-pressed','false');activeButton=null;}\n  }\n  function playTwice(src,button,label){\n    stopAudio();\n    if(!src){alert(`Original MP3 for \u201c${label}\u201d has not been embedded yet. Use \u201cEmbed Original MP3s\u201d on the Home screen first.`);return;}\n    const token=playToken;\n    activeButton=button;button.classList.add('playing');button.setAttribute('aria-pressed','true');\n    audio.src=src;audio.currentTime=0;\n    let completed=0;\n    const cleanup=()=>{if(token!==playToken)return;if(activeButton===button){button.classList.remove('playing');button.setAttribute('aria-pressed','false');activeButton=null;}audio.onended=null;audio.onerror=null;};\n    audio.onended=()=>{\n      if(token!==playToken)return;\n      completed++;\n      if(completed>=2){cleanup();return;}\n      gapTimer=setTimeout(()=>{if(token!==playToken)return;gapTimer=null;audio.currentTime=0;audio.play().catch(cleanup);},GAP_MS);\n    };\n    audio.onerror=cleanup;\n    audio.play().catch(cleanup);\n  }\n  function createAudioButton(src,label){\n    const b=document.createElement('button');b.type='button';b.className='audio-btn';b.innerHTML=headset();\n    b.setAttribute('aria-label',`Play ${label} twice`);b.setAttribute('aria-pressed','false');\n    b.addEventListener('click',()=>playTwice(src,b,label));return b;\n  }\n  function renderVocabPage(){\n    cards.innerHTML='';\n    const start=page*PAGE_SIZE;\n    VOCAB.slice(start,start+PAGE_SIZE).forEach(item=>{\n      const article=document.createElement('article');article.className='card';\n      const frame=document.createElement('div');frame.className='picture-frame';\n      const img=document.createElement('img');img.src=item.image;img.alt=`${item.word} vocabulary picture`;img.draggable=false;frame.appendChild(img);\n      const box=document.createElement('div');box.className='word-box';box.textContent=item.word;\n      const aa=document.createElement('div');aa.className='audio-area';aa.appendChild(createAudioButton(item.audio,item.word));\n      const note=document.createElement('div');note.className='tap-note';note.textContent='Tap to hear it twice';aa.appendChild(note);\n      article.append(frame,box,aa);cards.appendChild(article);\n    });\n  }\n  function renderDots(){dots.innerHTML='';for(let i=0;i\u003cTOTAL_PAGES;i++){const d=document.createElement('button');d.type='button';d.className='dot'+(i===page?' active':'');d.setAttribute('aria-label',`Go to page ${i+1}`);if(i===page)d.setAttribute('aria-current','page');d.addEventListener('click',()=>goToPage(i));dots.appendChild(d);}}\n  function renderPage(){stopAudio();renderVocabPage();pagePill.textContent=`Page ${page+1} of ${TOTAL_PAGES}`;prev.disabled=page===0;next.disabled=page===TOTAL_PAGES-1;renderDots();window.scrollTo({top:0,behavior:'instant'});}\n  function goToPage(n){if(n\u003c0||n>=TOTAL_PAGES||n===page)return;page=n;renderPage();}\n\n  $('openVocab').addEventListener('click',()=>{stopAudio();homeScreen.classList.remove('active');lessonScreen.classList.add('active');page=0;renderPage();});\n  $('homeButton').addEventListener('click',()=>{stopAudio();lessonScreen.classList.remove('active');homeScreen.classList.add('active');});\n  prev.addEventListener('click',()=>goToPage(page-1));next.addEventListener('click',()=>goToPage(page+1));\n  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAudio();});window.addEventListener('pagehide',stopAudio);window.addEventListener('beforeunload',stopAudio);\n\n  /* Teacher-side original MP3 embedder. It tolerates hidden Windows extensions and trailing punctuation. */\n  const picker=$('audioPicker'),status=$('embedStatus');\n  function audioKey(s){\n    let name=String(s||'').split(/[\\\\/]/).pop().trim().toLowerCase().replace(/[\\u2010-\\u2015]/g,'-').replace(/\\s+/g,' ');\n    if(name.endsWith('.mp3'))name=name.slice(0,-4);\n    name=name.trim().replace(/\\.+$/g,'').trim();\n    return name;\n  }\n  const readData=file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});\n  $('embedButton').addEventListener('click',()=>picker.click());\n  picker.addEventListener('change',async()=>{\n    status.className='embed-status show';status.textContent='Checking the 12 original MP3 files\u2026';\n    const files=[...picker.files];const map=new Map(files.map(f=>[audioKey(f.name),f]));\n    const expected=VOCAB.map(x=>({obj:x,key:'audio',file:x.expectedFile,label:x.word}));\n    const missing=expected.filter(e=>!map.has(audioKey(e.file)));\n    if(missing.length){status.className='embed-status show error';status.innerHTML='\u003cstrong>Missing MP3 file(s):\u003c/strong>\u003cbr>'+missing.map(m=>'\u2022 '+m.file).join('\u003cbr>')+'\u003cbr>\u003cbr>Nothing was exported.';picker.value='';return;}\n    try{\n      let done=0;\n      for(const e of expected){e.obj[e.key]=await readData(map.get(audioKey(e.file)));done++;status.textContent=`Embedding original MP3s\u2026 ${done} / ${expected.length}`;}\n      document.getElementById('vocab-data').textContent=JSON.stringify(VOCAB);\n      const clone=document.documentElement.cloneNode(true);\n      clone.querySelector('#homeScreen').classList.add('active');clone.querySelector('#lessonScreen').classList.remove('active');\n      clone.querySelectorAll('.playing').forEach(x=>x.classList.remove('playin \u003c/div>\u003c/div>\u003c/header>\n\u003cdiv id=\"stageRow\" class=\"stageRow\">\u003cdiv class=\"stagePill\" data-stage=\"0\">Listen &amp; Choose\u003c/div>\u003cdiv class=\"stagePill\" data-stage=\"1\">Missing Letters 1\u003c/div>\u003cdiv class=\"stagePill\" data-stage=\"2\">Missing Letters 2\u003c/div>\u003cdiv class=\"stagePill\" data-stage=\"3\">Full Spelling\u003c/div>\u003c/div>\n\u003csection id=\"card\" class=\"card\">\n\u003cdiv id=\"stageOverlay\" class=\"stageOverlay\" aria-live=\"polite\">\u003cdiv>\u003cdiv id=\"overlayCircle\" class=\"circle\">2\u003c/div>\u003ch2 id=\"overlayTitle\">Missing Letters 1\u003c/h2>\u003cp id=\"overlayText\">Listen and complete two missing letters.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv id=\"startScreen\" class=\"startScreen\">\u003cdiv class=\"startInner\">\u003ch1 id=\"heroWord\" class=\"heroWord\">Welcome Lesson\u003c/h1>\u003cbutton id=\"startBtn\" class=\"startBtn\" type=\"button\">Start Vocabulary\u003c/button>\u003cdiv id=\"audioSetup\" class=\"audioSetup hidden\">\u003cdiv class=\"audioSetupTitle\">Original audio setup\u003c/div>\u003cdiv class=\"audioSetupText\">Select the 12 original Welcome Lesson MP3 files from your PC. The recordings will be embedded directly into a new standalone student HTML without re-encoding them.\u003c/div>\u003cdiv class=\"audioSetupActions\">\u003cbutton class=\"audioSetupBtn\" id=\"embedAudioBtn\" type=\"button\">Embed the 12 Original MP3s\u003c/button>\u003cinput id=\"audioFilePicker\" type=\"file\" accept=\".mp3,audio/mpeg\" multiple=\"\" hidden=\"\">\u003c/div>\u003cdiv class=\"audioSetupProgress\">\u003cdiv class=\"audioSetupProgressBar\" id=\"audioSetupProgressBar\" style=\"width: 100%;\">\u003c/div>\u003c/div>\u003cdiv class=\"audioSetupStatus ok\" id=\"audioSetupStatus\">All 12 original MP3s are embedded. Creating the final standalone 48-question HTML\u2026\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv id=\"questionScreen\" class=\"hidden\">\u003cdiv class=\"questionHead\">\u003cdiv id=\"eyebrow\" class=\"eyebrow\">\u003c/div>\u003ch1 id=\"questionTitle\">\u003c/h1>\u003cp id=\"instruction\" class=\"instruction\">\u003c/p>\u003c/div>\u003cdiv class=\"audioArea\">\u003cbutton id=\"audioBtn\" class=\"audioBtn\" type=\"button\">\u003cspan class=\"speaker\">\ud83d\udd0a\u003c/span>\u003cspan id=\"audioBtnText\">Listen again\u003c/span>\u003c/button>\u003c/div>\u003cmain id=\"main\" class=\"main\">\u003c/main>\u003cdiv id=\"feedback\" class=\"feedback\" aria-live=\"polite\">\u003c/div>\u003c/div>\n\u003cdiv id=\"finishScreen\" class=\"finishScreen hidden\">\u003cdiv class=\"finishInner\">\u003cdiv class=\"finishIcon\">\u2713\u003c/div>\u003ch2>Great job!\u003c/h2>\u003cp id=\"finishText\">You finished all 48 vocabulary questions.\u003c/p>\u003cbutton id=\"restartBtn\" class=\"restartBtn\" type=\"button\">Practice again\u003c/button>\u003c/div>\u003c/div>\n\u003c/section>\u003c/div>\n\u003cscript id=\"lasinLessonData\" type=\"application/json\">{\"courseName\":\"Everybody Up 5\",\"lessonName\":\"Welcome Lesson\",\"category\":\"Welcome Lesson\",\"audioRepetitions\":2,\"audioRepeatGapMs\":500,\"words\":[{\"word\":\"North America\",\"image\":\"@@LASIN_ASSET_0001@@\",\"audio\":\"@@LASIN_ASSET_0003@@\",\"expectedLabel\":\"North America\",\"r2\":[1,8],\"r3\":[3,10]},{\"word\":\"South America\",\"image\":\"@@LASIN_ASSET_0002@@\",\"audio\":\"@@LASIN_ASSET_0004@@\",\"expectedLabel\":\"South America\",\"r2\":[1,8],\"r3\":[3,10]},{\"word\":\"Europe\",\"image\":\"@@LASIN_ASSET_0005@@\",\"audio\":\"@@LASIN_ASSET_0006@@\",\"expectedLabel\":\"Europe\",\"r2\":[1,4],\"r3\":[2,5]},{\"word\":\"Africa\",\"image\":\"@@LASIN_ASSET_0007@@\",\"audio\":\"@@LASIN_ASSET_0008@@\",\"expectedLabel\":\"Africa\",\"r2\":[1,4],\"r3\":[2,5]},{\"word\":\"Asia\",\"image\":\"@@LASIN_ASSET_0009@@\",\"audio\":\"@@LASIN_ASSET_0010@@\",\"expectedLabel\":\"Asia\",\"r2\":[0,2],\"r3\":[1,3]},{\"word\":\"Australia\",\"image\":\"@@LASIN_ASSET_0011@@\",\"audio\":\"@@LASIN_ASSET_0012@@\",\"expectedLabel\":\"Australia\",\"r2\":[1,5],\"r3\":[3,7]},{\"word\":\"Antarctica\",\"image\":\"@@LASIN_ASSET_0013@@\",\"audio\":\"@@LASIN_ASSET_0014@@\",\"expectedLabel\":\"Antarctica\",\"r2\":[1,6],\"r3\":[3,8]},{\"word\":\"Cardinal directions\",\"image\":\"@@LASIN_ASSET_0015@@\",\"audio\":\"@@LASIN_ASSET_0016@@\",\"expectedLabel\":\"Cardinal directions\",\"r2\":[1,10],\"r3\":[4,14]},{\"word\":\"North\",\"image\":\"@@LASIN_ASSET_0017@@\",\"audio\":\"@@LASIN_ASSET_0018@@\",\"expectedLabel\":\"North.\",\"r2\":[0,2],\"r3\":[1,3]},{\"word\":\"South\",\"image\":\"@@LASIN_ASSET_0019@@\",\"audio\":\"@@LASIN_ASSET_0020@@\",\"expectedLabel\":\"South.\",\"r2\":[0,2],\"r3\":[1,3]},{\"word\":\"East\",\"image\":\"@@LASIN_ASSET_0021@@\",\"audio\":\"@@LASIN_ASSET_0022@@\",\"expectedLabel\":\"East\",\"r2\":[0,2],\"r3\":[1,3]},{\"word\":\"West\",\"image\":\"@@LASIN_ASSET_0023@@\",\"audio\":\"@@LASIN_ASSET_0024@@\",\"expectedLabel\":\"West.\",\"r2\":[0,2],\"r3\":[1,3]}]}\u003c/script>\n\u003cscript>\n\"use strict\";\nconst DATA_NODE=document.getElementById('lasinLessonData');\nconst lesson=JSON.parse(DATA_NODE.textContent);\nconst WORD_COUNT=lesson.words.length;\nconst TOTAL=WORD_COUNT*4;\nconst AUTO_AUDIO_DELAY=1700, GAP_MS=500, BRAVO_DELAY=500, BRAVO_DURATION=2000, STAGE_OVERLAY_DURATION=1250;\nlet q=0,answered=false,interactionLocked=false,blankCursor=0,currentMissing=[],currentFilled={};\nlet autoTimer=null,repeatTimer=null,stageTimer=null,bravoDelayTimer=null,bravoTimer=null,audioToken=0,celebrationAudioContext=null;\nconst sharedAudio=new Audio();sharedAudio.preload='auto';\nconst $=s=>document.querySelector(s), main=$('#main'),feedback=$('#feedback'),questionTitle=$('#questionTitle'),instruction=$('#instruction'),eyebrow=$('#eyebrow'),audioBtn=$('#audioBtn'),audioBtnText=$('#audioBtnText'),startBtn=$('#startBtn');\nconst stagePills=[...document.querySelectorAll('.stagePill')];\nfunction lasinGameBridge(action,questionIndex){\n  try{\n    window.parent.postMessage({\n      source:'LASIN_MOTIVATION_BRIDGE',\n      exercise:2,\n      action:String(action||''),\n      questionIndex:Number(questionIndex)\n    },'*');\n  }catch(e){}\n}\nfunction stageOf(i){return Math.floor(i/WORD_COUNT)}function wordIndex(i){return i%WORD_COUNT}function currentItem(){return lesson.words[wordIndex(q)]}\nfunction normalizeAnswer(s){return String(s||'').trim().toLowerCase().replace(/\\s+/g,' ')}\nfunction normalizeAudioKey(name){let n=String(name||'').split(/[\\\\/]/).pop().trim().toLowerCase();n=n.replace(/[\u2010\u2011\u2012\u2013\u2014\u2212]/g,'-').replace(/\\.mp3$/i,'').trim().replace(/\\s+/g,' ');n=n.replace(/\\.+$/,'').trim();return n}\nfunction audioSource(item){return item&&item.audio?item.audio:''}function isAudioData(v){return typeof v==='string'&&v.length>0&&!v.includes('@@LASIN_ASSET_')}function allAudioEmbedded(){return WORD_COUNT>0&&lesson.words.every(w=>isAudioData(w.audio))}\nfunction applyMetadata(){$('#lessonMeta').textContent=[lesson.courseName,lesson.lessonName].filter(Boolean).join(' \u2022 ');$('#heroWord').textContent=lesson.category;$('#finishText').textContent=`You finished all ${TOTAL} vocabulary questions.`;document.title=['LASIN',lesson.courseName,lesson.lessonName,'Vocabulary Practice'].filter(Boolean).join(' | ')}\nfunction updateProgress(){const done=Math.max(0,Math.min(q,TOTAL));$('#counter').textContent=`${done}/${TOTAL}`;$('#progressBar').style.width=`${TOTAL?(done/TOTAL)*100:0}%`;const s=q>=TOTAL?4:stageOf(q);stagePills.forEach((p,i)=>{p.classList.toggle('done',i\u003cs);p.classList.toggle('active',i===s&&s\u003c4)})}\nfunction setPlaying(active){audioBtn.classList.toggle('playing',!!active)}\nfunction setInteractionLocked(locked){interactionLocked=!!locked;main.classList.toggle('interactionLocked',interactionLocked);main.setAttribute('aria-busy',interactionLocked?'true':'false');main.setAttribute('aria-disabled',interactionLocked?'true':'false');if('inert' in main)main.inert=interactionLocked;main.querySelectorAll('button,input').forEach(el=>{if(answered){el.disabled=true;return}el.disabled=interactionLocked})}\nfunction stopAudio(){audioToken++;if(autoTimer){clearTimeout(autoTimer);autoTimer=null}if(repeatTimer){clearTimeout(repeatTimer);repeatTimer=null}try{sharedAudio.pause()}catch{}sharedAudio.onended=null;sharedAudio.onerror=null;try{sharedAudio.removeAttribute('src');sharedAudio.load()}catch{}setPlaying(false)}\nfunction playTwice(src,onComplete){if(!src){onComplete&&onComplete(false);return}stopAudio();const token=++audioToken;let plays=0,finished=false;setPlaying(true);sharedAudio.src=src;sharedAudio.currentTime=0;const finish=ok=>{if(finished||token!==audioToken)return;finished=true;setPlaying(false);sharedAudio.onended=null;sharedAudio.onerror=null;onComplete&&onComplete(ok)};const begin=()=>{if(token!==audioToken||finished)return;let p;try{p=sharedAudio.play()}catch{finish(false);return}if(p&&p.catch)p.catch(()=>finish(false))};sharedAudio.onerror=()=>finish(false);sharedAudio.onended=()=>{if(token!==audioToken||finished)return;plays++;if(plays>=2){finish(true);return}repeatTimer=setTimeout(()=>{if(token!==audioToken||finished)return;try{sharedAudio.currentTime=0}catch{}begin()},GAP_MS)};begin()}\nfunction setFeedback(text,type=''){feedback.textContent=text;feedback.className='feedback'+(type?' '+type:'')}\nfunction completeRequiredListening(src){if(answered)return;setInteractionLocked(true);audioBtn.disabled=true;audioBtnText.textContent='Listening\u2026';setFeedback('Listen first\u2026','listening');playTwice(src,ok=>{if(answered)return;if(ok){setInteractionLocked(false);lasinGameBridge('timerStart',q);audioBtn.disabled=false;audioBtnText.textContent='Listen again';setFeedback('Now choose.','ready');const inp=main.querySelector('.answerInput');if(inp){setTimeout(()=>{try{inp.focus({preventScroll:true})}catch{inp.focus()}},80)}}else{setInteractionLocked(true);audioBtn.disabled=false;audioBtnText.textContent='Listen to unlock';setFeedback('Listen to the complete audio twice to unlock the answers.','listening')}})}\nfunction scheduleRequiredListening(src){if(autoTimer)clearTimeout(autoTimer);setInteractionLocked(true);audioBtn.disabled=true;audioBtnText.textContent='Listen first';setFeedback('Listen first\u2026','listening');autoTimer=setTimeout(()=>{autoTimer=null;if(!answered)completeRequiredListening(src)},AUTO_AUDIO_DELAY)}\nfunction recoverRequiredAudioAfterInterruption(){const needs=!!currentItem()&&!answered&&q\u003cTOTAL&&interactionLocked;stopAudio();if(needs){setInteractionLocked(true);audioBtn.disabled=false;audioBtnText.textContent='Listen to unlock';audioBtn.onclick=()=>completeRequiredListening(audioSource(currentItem()));setFeedback('Listen again completely to unlock the answers.','listening')}}\nfunction hashString(str){let h=2166136261>>>0;for(let i=0;i\u003cstr.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function seededShuffle(arr,seedText){let seed=hashString(seedText)||1;const out=[...arr];function rand(){seed^=seed\u003c\u003c13;seed^=seed>>>17;seed^=seed\u003c\u003c5;return(seed>>>0)/4294967296}for(let i=out.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}\nfunction primeCelebrationAudio(){const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;if(!celebrationAudioContext){try{celebrationAudioContext=new Ctx()}catch{return}}if(celebrationAudioContext.state==='suspended')celebrationAudioContext.resume().catch(()=>{})}\nfunction playCelebrationChime(){const ctx=celebrationAudioContext;if(!ctx)return;try{const now=ctx.currentTime;[{f:523.25,t:0,d:.13},{f:659.25,t:.11,d:.13},{f:783.99,t:.22,d:.20}].forEach(n=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=n.f;gain.gain.setValueAtTime(.0001,now+n.t);gain.gain.exponentialRampToValueAtTime(.16,now+n.t+.018);gain.gain.exponentialRampToValueAtTime(.0001,now+n.t+n.d);osc.connect(gain);gain.connect(ctx.destination);osc.start(now+n.t);osc.stop(now+n.t+n.d+.03)})}catch{}}\nfunction hideBravo(){const el=$('#bravoOverlay');el.classList.remove('show');el.setAttribute('aria-hidden','true')}function showBravo(){const el=$('#bravoOverlay');el.classList.add('show');el.setAttribute('aria-hidden','false');playCelebrationChime()}\nfunction showStageOverlay(stage){const data=[null,{title:'Missing Letters 1',text:'Listen and complete two missing letters.'},{title:'Missing Letters 2',text:'Complete two different missing letters.'},{title:'Full Spelling',text:'Listen, look at the picture, and spell the whole word or phrase.'}][stage];if(!data)return;$('#overlayCircle').textContent=stage+1;$('#overlayTitle').textContent=data.title;$('#overlayText').textContent=data.text;$('#stageOverlay').classList.add('show');stageTimer=setTimeout(()=>{$('#stageOverlay').classList.remove('show');stageTimer=null;renderQuestion()},STAGE_OVERLAY_DURATION)}\nfunction scheduleNext(){if(bravoDelayTimer)clearTimeout(bravoDelayTimer);bravoDelayTimer=setTimeout(()=>{bravoDelayTimer=null;showBravo();bravoTimer=setTimeout(()=>{bravoTimer=null;hideBravo();const oldStage=stageOf(q);q++;updateProgress();if(q>=TOTAL){finish();return}const newStage=stageOf(q);if(newStage!==oldStage)showStageOverlay(newStage);else renderQuestion()},BRAVO_DURATION)},BRAVO_DELAY)}\nfunction finishCorrect(msg='Great!'){answered=true;lasinGameBridge('complete',q);stopAudio();setInteractionLocked(true);setFeedback(msg,'good');scheduleNext()}\nfunction makePicture(item,cls){const box=document.createElement('div');box.className=cls;const img=document.createElement('img');img.src=item.image;img.alt=`${item.word} vocabulary picture`;img.draggable=false;box.appendChild(img);return box}\nfunction renderListen(item,local){questionTitle.textContent='Listen and choose';instruction.textContent='Which picture matches the word or phrase you hear?';const others=lesson.words.filter((_,i)=>i!==local);const distractors=seededShuffle(others,`listen-${item.word}-${local}`).slice(0,2);const choices=seededShuffle([item,...distractors],`listen-order-${item.word}-${local}`);const grid=document.createElement('div');grid.className='choiceGrid';choices.forEach((choice,idx)=>{const btn=document.createElement('button');btn.type='button';btn.className='picChoice';btn.setAttribute('aria-label',`Picture choice ${idx+1}`);const badge=document.createElement('span');badge.className='numBadge';badge.textContent=idx+1;const img=document.createElement('img');img.src=choice.image;img.alt=`Vocabulary picture choice ${idx+1}`;btn.append(badge,img);btn.addEventListener('click',()=>{if(answered||interactionLocked)return;if(choice.word===item.word){btn.classList.add('correct');grid.querySelectorAll('.picChoice').forEach(x=>x.classList.add('locked'));finishCorrect('Great!')}else{lasinGameBridge('mistake',q);btn.classList.remove('wrong');void btn.offsetWidth;btn.classList.add('wrong');setFeedback('Try again. Listen carefully.','bad');setTimeout(()=>btn.classList.remove('wrong'),380)}});grid.appendChild(btn)});main.appendChild(grid)}\nfunction buildLetterBank(item,missing,stage){const needed=missing.map(i=>String(item.word[i]||'').toLowerCase()).filter(ch=>ch&&ch!==' ');const preferred='abcdefghijklmnopqrstuvwxyz'.split('');const pool=[...new Set(needed)];for(const ch of seededShuffle(preferred,`bank-${item.word}-${stage}`)){if(pool.length>=5)break;if(!pool.includes(ch))pool.push(ch)}return seededShuffle(pool,`bank-order-${item.word}-${stage}`)}\nfunction renderMissing(item,stage){const first=stage===1;questionTitle.textContent=first?'Missing Letters 1':'Missing Letters 2';instruction.textContent=first?'Listen and complete two missing letters.':'Listen and complete two different missing letters.';currentMissing=(first?item.r2:item.r3).slice().sort((a,b)=>a-b);currentFilled={};blankCursor=0;const wrap=document.createElement('div');wrap.className='spellLayout';const pic=makePicture(item,'vocabPic');const pane=document.createElement('div');pane.className='spellPane';const ansform:none}\n.truth-btn.is-selected-correct{background:var(--blue);box-shadow:0 8px 20px rgba(16,61,155,.20)}\n.truth-btn.is-wrong{background:var(--red2);border-color:#8f1118;box-shadow:0 0 0 5px rgba(217,59,59,.12)}\n.truth-check-wrap{display:flex;align-items:center;justify-content:center;min-height:42px}\n.truth-check{appearance:none;-webkit-appearance:none;width:30px;height:30px;border:3px solid #9eb3df;border-radius:7px;background:#fff;cursor:pointer;position:relative;box-shadow:0 4px 10px rgba(16,61,155,.08);transition:background .16s ease,border-color .16s ease,transform .14s ease,opacity .18s ease}\n.truth-check:hover:not(:disabled){transform:scale(1.06)}\n.truth-check:disabled{opacity:.42;cursor:not-allowed}\n.truth-check:checked{background:var(--blue);border-color:var(--blue)}\n.truth-check:checked::after{content:'\u2713';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:22px;line-height:1;font-weight:1000}\n.truth-check.is-wrong{border-color:var(--bad);box-shadow:0 0 0 4px rgba(217,59,59,.11)}\n.feedback{min-height:29px;margin:5px 0 0;font-size:16px;font-weight:900;color:var(--good)}\n.feedback.bad{color:var(--bad)}\n.shake{animation:shake .34s ease}\n@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}\n\n/* Celebration and completion */\n.celebration{position:fixed;inset:0;z-index:9999;background:rgba(220,252,231,.97);display:flex;align-items:center;justify-content:center;overflow:hidden;animation:celebrateIn .25s ease-out}\n@keyframes celebrateIn{from{opacity:0}to{opacity:1}}\n.celebration-core{position:relative;z-index:2;text-align:center;animation:bravoPop .48s cubic-bezier(.2,.9,.25,1.35)}\n.celebration-title{font-size:clamp(76px,15vw,176px);font-weight:1000;letter-spacing:2px;color:#138a4f;text-shadow:0 6px 0 rgba(255,255,255,.9),0 12px 30px rgba(20,140,80,.18);line-height:.9}\n.celebration-sub{margin-top:16px;font-size:clamp(20px,3vw,35px);font-weight:900;color:var(--blue2)}\n@keyframes bravoPop{0%{transform:scale(.45) rotate(-4deg);opacity:.1}70%{transform:scale(1.08) rotate(1deg);opacity:1}100%{transform:scale(1)}}\n.star{position:absolute;z-index:1;font-size:clamp(26px,4vw,54px);color:#f4b400;text-shadow:0 3px 0 rgba(255,255,255,.75);animation:starFly 1.7s ease-out forwards;pointer-events:none}\n@keyframes starFly{0%{transform:translate(0,0) rotate(0) scale(.2);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.25);opacity:0}}\n.complete{width:min(760px,94vw);padding:40px 24px;border:2px solid var(--line);border-radius:30px;background:#fff;box-shadow:0 14px 38px rgba(28,68,140,.10)}\n.complete h2{font-size:clamp(38px,6vw,62px);color:var(--blue);margin:0 0 10px;font-weight:900}\n.complete p{font-size:21px;font-weight:700;color:#5a6b8f;margin:0}\n\n/* Audio embedder */\n.audio-setup{width:min(950px,96%);margin:16px auto 0;padding:14px 17px;border:2px solid #dbe7ff;border-radius:18px;background:#f8faff;box-shadow:0 8px 20px rgba(16,61,155,.07)}\n.audio-setup-title{font-size:16px;font-weight:1000;color:var(--blue2);margin-bottom:5px}\n.audio-setup-text{font-size:13px;line-height:1.5;font-weight:800;color:var(--muted)}\n.audio-setup-btn{margin-top:10px;border:0;border-radius:14px;background:var(--blue);color:#fff;padding:12px 17px;font-weight:1000;cursor:pointer;box-shadow:0 8px 16px rgba(16,61,155,.16)}\n.audio-setup-status{min-height:20px;margin-top:8px;font-size:13px;font-weight:900;color:var(--muted);line-height:1.45}\n.audio-setup-status.ok{color:var(--good)}\n.audio-setup-status.bad{color:var(--bad)}\n.audio-setup-track{height:8px;background:#e5edfc;border-radius:999px;overflow:hidden;margin-top:8px}\n.audio-setup-fill{height:100%;width:0;background:var(--blue);border-radius:999px;transition:width .15s ease}\n.audio-file-list{margin-top:8px;text-align:left;font-size:12px;line-height:1.45;color:#61749c;font-weight:700;max-height:180px;overflow:auto;padding:8px;border-radius:10px;background:#fff;border:1px solid #e4ebfa}\n\n@media(max-width:900px){\n  .screen{width:97vw}.exercise-card{border-radius:22px;padding:10px}\n  .reference-card img{max-height:none;width:100%;height:auto}\n  .listen-row{margin-top:6px}.statement-area{font-size:clamp(23px,5vw,34px)}\n  .intro h1{white-space:normal}.intro-image-wrap{height:clamp(200px,42vh,420px)}\n}\n@media(max-width:520px){\n  #app{padding:5px}.stage{min-height:calc(100dvh - 10px)}.progress-wrap{margin-bottom:5px}.progress-track{height:9px}\n  .exercise-card{padding:8px;border-radius:18px}.reference-card{padding:2px;border-radius:16px}\n  .listen-row{gap:8px;flex-wrap:wrap}.audio-btn{width:50px;height:50px}.mode-tag{white-space:normal}\n  .statement-area{padding:9px 5px;min-height:56px;border-bottom-width:3px;font-size:clamp(21px,6.1vw,30px)}\n  .response-panel{padding:8px 2px 2px}.truth-grid{gap:14px;grid-template-columns:1fr 1fr}.truth-btn{min-height:56px;padding:10px 8px;font-size:clamp(20px,6vw,27px)}\n  .truth-check{width:28px;height:28px}.intro{padding:14px;border-radius:22px}.intro-image-wrap{height:clamp(185px,38vh,330px)}.start,.restart{padding:14px 42px;margin-top:18px}\n}\n@media(max-width:360px){.truth-grid{grid-template-columns:1fr;gap:11px;width:min(240px,100%)}}\n@media(max-height:760px) and (min-width:901px){\n  .progress-wrap{margin-bottom:5px}.exercise-card{padding:8px 12px}.reference-card img{max-height:51vh}\n  .audio-btn{width:52px;height:52px}.listen-row{margin:4px 0 1px}.statement-area{min-height:54px;padding:7px 6px;font-size:clamp(22px,2vw,31px)}\n  .truth-btn{min-height:54px;padding:9px 18px;font-size:clamp(20px,1.8vw,27px)}.truth-check{width:27px;height:27px}.feedback{min-height:22px;font-size:14px}\n}\n@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain id=\"app\">\u003cdiv class=\"screen\" id=\"screen\">\u003csection class=\"intro\" aria-labelledby=\"intro-title\">\n    \u003cdiv class=\"intro-image-wrap\">\u003cimg class=\"intro-image\" src=\"@@LASIN_ASSET_0025@@\" alt=\"World map showing continents and oceans\">\u003c/div>\n    \u003ch1 id=\"intro-title\">Continents\u003c/h1>\n    \u003cbutton class=\"start\" id=\"startBtn\">Start\u003c/button>\n    \u003csection class=\"audio-setup\" aria-label=\"Original Audio Embedder\">\n    \u003cdiv class=\"audio-setup-title\">Original Audio Embedder \u2014 12 MP3 files\u003c/div>\n    \u003cdiv class=\"audio-setup-text\">Select the 12 original continent-sentence recordings from your PC. Each original MP3 is embedded directly without re-encoding, and the finished student file will not ask for media again.\u003c/div>\n    \u003cinput id=\"audioFiles\" type=\"file\" accept=\"audio/mpeg,.mp3\" multiple=\"\" hidden=\"\">\n    \u003cbutton class=\"audio-setup-btn\" id=\"chooseAudio\">Embed the 12 Original MP3s\u003c/button>\n    \u003cdiv class=\"audio-setup-track\">\u003cdiv class=\"audio-setup-fill\" id=\"setupFill\" style=\"width: 100%;\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"audio-setup-status ok\" id=\"setupStatus\">All 12 original MP3s are ready. Building the standalone student HTML\u2026\u003c/div>\n    \u003cdiv class=\"audio-file-list\">\u003cdiv>Africa is south of Europe..mp3\u003c/div>\u003cdiv>Asia is north of Australia..mp3\u003c/div>\u003cdiv>South America is north of North America..mp3\u003c/div>\u003cdiv>Australia is north of Antarctica..mp3\u003c/div>\u003cdiv>North America is east of Europe..mp3\u003c/div>\u003cdiv>Europe is west of Asia..mp3\u003c/div>\u003cdiv>Europe is north of Africa..mp3\u003c/div>\u003cdiv>South America is south of North America..mp3\u003c/div>\u003cdiv>Africa is east of South America..mp3\u003c/div>\u003cdiv>Australia is west of Africa..mp3\u003c/div>\u003cdiv>Europe is south of Africa..mp3\u003c/div>\u003cdiv>Antarctica is north of Australia..mp3\u003c/div>\u003c/div>\n  \u003c/section>\n  \u003c/section>\u003c/div>\u003c/main>\n\u003cscript id=\"lesson-data\" type=\"application/json\">{\"title\":\"Continents\",\"topic\":\"The Continents\",\"exercise\":\"True or False\",\"timing\":{\"initialDelayMs\":800,\"repeatGapMs\":800,\"repetitions\":2},\"introImage\":\"@@LASIN_ASSET_0025@@\",\"referenceImage\":\"@@LASIN_ASSET_0026@@\",\"expectedAudio\":{\"s01\":\"Africa is south of Europe..mp3\",\"s02\":\"Asia is north of Australia..mp3\",\"s03\":\"South America is north of North America..mp3\",\"s04\":\"Australia is north of Antarctica..mp3\",\"s05\":\"North America is east of Europe..mp3\",\"s06\":\"Europe is west of Asia..mp3\",\"s07\":\"Europe is north of Africa..mp3\",\"s08\":\"South America is south of North America..mp3\",\"s09\":\"Africa is east of South America..mp3\",\"s10\":\"Australia is west of Africa..mp3\",\"s11\":\"Europe is south of Africa..mp3\",\"s12\":\"Antarctica is north of Australia..mp3\"},\"audio\":{\"s01\":\"@@LASIN_ASSET_0027@@\",\"s02\":\"@@LASIN_ASSET_0028@@\",\"s03\":\"@@LASIN_ASSET_0029@@\",\"s04\":\"@@LASIN_ASSET_0030@@\",\"s05\":\"@@LASIN_ASSET_0031@@\",\"s06\":\"@@LASIN_ASSET_0032@@\",\"s07\":\"@@LASIN_ASSET_0033@@\",\"s08\":\"@@LASIN_ASSET_0034@@\",\"s09\":\"@@LASIN_ASSET_0035@@\",\"s10\":\"@@LASIN_ASSET_0036@@\",\"s11\":\"@@LASIN_ASSET_0037@@\",\"s12\":\"@@LASIN_ASSET_0038@@\"},\"items\":[{\"id\":\"s01\",\"sentence\":\"Africa is south of Europe.\",\"correct\":true,\"audio\":\"s01\"},{\"id\":\"s02\",\"sentence\":\"Asia is north of Australia.\",\"correct\":true,\"audio\":\"s02\"},{\"id\":\"s03\",\"sentence\":\"South America is north of North America.\",\"correct\":false,\"audio\":\"s03\"},{\"id\":\"s04\",\"sentence\":\"Australia is north of Antarctica.\",\"correct\":true,\"audio\":\"s04\"},{\"id\":\"s05\",\"sentence\":\"North America is east of Europe.\",\"correct\":false,\"audio\":\"s05\"},{\"id\":\"s06\",\"sentence\":\"Europe is west of Asia.\",\"correct\":true,\"audio\":\"s06\"},{\"id\":\"s07\",\"sentence\":\"Europe is north of Africa.\",\"correct\":true,\"audio\":\"s07\"},{\"id\":\"s08\",\"sentence\":\"South America is south of North America.\",\"correct\":true,\"audio\":\"s08\"},{\"id\":\"s09\",\"sentence\":\"Africa is east of South America.\",\"correct\":true,\"audio\":\"s09\"},{\"id\":\"s10\",\"sentence\":\"Australia is west of Africa.\",\"correct\":false,\"audio\":\"s10\"},{\"id\":\"s11\",\"sentence\":\"Europe is south of Africa.\",\"correct\":false,\"audio\":\"s11\"},{\"id\":\"s12\",\"sentence\":\"Antarctica is north of Australia.\",\"correct\":false,\"audio\":\"s12\"}]}\u003c/script>\n\u003cscript>\n(()=>{\n'use strict';\nconst lesson=JSON.parse(document.getElementById('lesson-data').textContent);\nconst isBuilder=document.documentElement.dataset.builder==='true';\nconst screen=document.getElementById('screen');\nconst TOTAL=lesson.items.length;\nconst T=lesson.timing;\nlet index=0,compulsoryDone=false,answered=false,playing=false,audioToken=0;\nfunction lasinGameBridge(action,questionIndex){\n  try{\n    window.parent.postMessage({\n      source:'LASIN_MOTIVATION_BRIDGE',\n      exercise:3,\n      action:String(action||''),\n      questionIndex:Number(questionIndex)\n    },'*');\n  }catch(e){}\n}\nlet timers=[];\nconst audioPlayer=new Audio();\naudioPlayer.preload='auto';\n\nfunction escapeHTML(v){return String(v).replace(/[&\u003c>'\"]/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;',\"'\":'&#39;','\"':'&quot;'}[c]));}\nfunction headsetSVG(){return `\u003csvg viewBox=\"0 0 64 64\" aria-hidden=\"true\">\u003cpath d=\"M12 32a20 20 0 0 1 40 0v16a6 6 0 0 1-6 6h-7V34h9v-2a16 16 0 0 0-32 0v2h9v20h-7a6 6 0 0 1-6-6V32Zm6 6h3v12h-3a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Zm25 0h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3V38Z\"/>\u003c/svg>`;}\nfunction allAudioReady(){return Object.values(lesson.expectedAudio).every((_,i)=>{const key=Object.keys(lesson.expectedAudio)[i];return typeof lesson.audio[key]==='string'&&lesson.audio[key].length>0&&!lesson.audio[key].includes('@@LASIN_ASSET_');});}\nfunction getAudio(key){return lesson.audio[key]||'';}\nfunction sleep(ms,token){return new Promise((resolve,reject)=>{const id=setTimeout(()=>{timers=timers.filter(x=>x!==id);token===audioToken?resolve():reject(new Error('cancelled'));},ms);timers.push(id);});}\nfunction clearTimers(){for(const id of timers)clearTimeout(id);timers=[];}\nfunction stopAudio(){audioToken++;clearTimers();try{audioPlayer.pause();audioPlayer.currentTime=0;audioPlayer.removeAttribute('src');audioPlayer.load();}catch{}playing=false;}\nasync function unlockAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){const c=new AC();if(c.state==='suspended')await c.resume();const o=c.createOscillator(),g=c.createGain();g.gain.value=0;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.01);setTimeout(()=>c.close().catch(()=>{}),80);}}catch{}}\n\nfunction renderIntro(){\n  stopAudio();index=0;compulsoryDone=false;answered=false;playing=false;\n  const ready=allAudioReady();\n  screen.innerHTML=`\u003csection class=\"intro\" aria-labelledby=\"intro-title\">\n    \u003cdiv class=\"intro-image-wrap\">\u003cimg class=\"intro-image\" src=\"${lesson.introImage}\" alt=\"World map showing continents and oceans\">\u003c/div>\n    \u003ch1 id=\"intro-title\">${escapeHTML(lesson.title)}\u003c/h1>\n    \u003cbutton class=\"start\" id=\"startBtn\" ${ready?'':'disabled'}>Start\u003c/button>\n    ${isBuilder?builderPanelHTML():''}\n  \u003c/section>`;\n  document.getElementById('startBtn')?.addEventListener('click',async()=>{await unlockAudio();renderStage();});\n  if(isBuilder)wireBuilder();\n}\n\nfunction builderPanelHTML(){\n  const names=Object.values(lesson.expectedAudio).map(n=>`\u003cdiv>${escapeHTML(n)}\u003c/div>`).join('');\n  return `\u003csection class=\"audio-setup\" aria-label=\"Original Audio Embedder\">\n    \u003cdiv class=\"audio-setup-title\">Original Audio Embedder \u2014 12 MP3 files\u003c/div>\n    \u003cdiv class=\"audio-setup-text\">Select the 12 original continent-sentence recordings from your PC. Each original MP3 is embedded directly without re-encoding, and the finished student file will not ask for media again.\u003c/div>\n    \u003cinput id=\"audioFiles\" type=\"file\" accept=\"audio/mpeg,.mp3\" multiple hidden>\n    \u003cbutton class=\"audio-setup-btn\" id=\"chooseAudio\">Embed the 12 Original MP3s\u003c/button>\n    \u003cdiv class=\"audio-setup-track\">\u003cdiv class=\"audio-setup-fill\" id=\"setupFill\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"audio-setup-status\" id=\"setupStatus\">Waiting for the 12 original MP3 files.\u003c/div>\n    \u003cdiv class=\"audio-file-list\">${names}\u003c/div>\n  \u003c/section>`;\n}\nfunction normalizeStem(name){return String(name).normalize('NFKC').toLowerCase().replace(/[\u2019\u2018`]/g,\"'\").replace(/\\.mp3$/i,'').replace(/[.?!]+$/g,'').trim().replace(/\\s+/g,' ');}\nfunction wireBuilder(){\n  const pick=document.getElementById('chooseAudio'),inp=document.getElementById('audioFiles'),status=document.getElementById('setupStatus'),fill=document.getElementById('setupFill');\n  if(!pick||!inp)return;\n  pick.addEventListener('click',()=>inp.click());\n  inp.addEventListener('change',async()=>{\n    const files=[...inp.files];status.className='audio-setup-status';fill.style.width='0%';\n    if(!files.length){status.textContent='No files selected.';return;}\n    const byStem=new Map();files.forEach(f=>byStem.set(normalizeStem(f.name),f));\n    const missing=[],matches=[];\n    for(const [key,expected] of Object.entries(lesson.expectedAudio)){\n      const f=byStem.get(normalizeStem(expected));f?matches.push([key,f]):missing.push(expected);\n    }\n    if(missing.length){status.classList.add('bad');status.innerHTML='Missing required file'+(missing.length>1?'s':'')+':\u003cbr>'+missing.map(escapeHTML).join('\u003cbr>');return;}\n    try{\n      for(let i=0;i\u003cmatches.length;i++){\n        const [key,file]=matches[i];lesson.audio[key]=await readDataURL(file);\n        fill.style.width=Math.round((i+1)/matches.length*100)+'%';status.textContent=`Embedding original MP3s\u2026 ${i+1} / ${matches.length}`;\n      }\n      status.classList.add('ok');status.textContent='All 12 original MP3s are ready. Building the standalone student HTML\u2026';\n      document.getElementById('startBtn').disabled=false;setTimeout(exportStudent,280);\n    }catch{status.classList.add('bad');status.textContent='The MP3 files could not be embedded. Please select the original files again.';}\n  });\n}\nfunction readDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}\nfunction exportStudent(){\n  try{\n    const clone=document.documentElement.cloneNode(true);clone.dataset.builder='false';\n    const d=clone.querySelector('#lesson-data');d.textContent=JSON.stringify(lesson).replace(/\u003c\\//g,'\u003c\\\\/');\n    const blob=new Blob(['\u003c!doctype html>\\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');\n    a.href=url;a.download='LASIN_Continents_True_or_False_STUDENT.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);\n  }catch{const st=document.getElementById('setupStatus');if(st){st.className='audio-setup-status bad';st.textContent='Could not export the final student HTML.';}}\n}\n\nfunction renderStage(){\n  stopAudio();compulsoryDone=false;answered=false;\n  if(index>=TOTAL){renderComplete();return;}\n  const item=lesson.items[index],pct=(index+1)/TOTAL*100;\n  screen.innerHTML=`\u003csection class=\"stage\" aria-label=\"Continents true or false listening practice\">\n    \u003cdiv class=\"progress-wrap\">\u003cdiv class=\"progress-meta\">\u003cspan>${index+1} / ${TOTAL}\u003c/span>\u003c/div>\u003cdiv class=\"progress-track\">\u003cdiv class=\"progress-fill\" style=\"width:${pct}%\">\u003c/div>\u003c/div>\u003c/div>\n    \u003csection class=\"exercise-card\">\n      \u003cdiv class=\"reference-card\">\u003cimg src=\"${lesson.referenceImage}\" alt=\"The Continents map showing North America, South America, Europe, Africa, Asia, Australia, Antarctica, and a compass\">\u003c/div>\n      \u003cdiv class=\"listen-row\">\n        \u003cdiv class=\"mode-tag\">Listen and choose \u2022 True or False\u003c/div>\n        \u003cbutton class=\"audio-btn\" id=\"audioBtn\" aria-label=\"Listen again\" disabled>${headsetSVG()}\u003c/button>\n        \u003cp class=\"listen-note\" id=\"listenNote\">Listen carefully. The sentence will play twice.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"task-wrap\">\n        \u003cdiv class=\"task-label\">Sentence\u003c/div>\n        \u003cdiv class=\"statement-area\" id=\"statement\">${escapeHTML(item.sentence)}\u003c/div>\n        \u003csection class=\"response-panel locked\" id=\"responsePanel\" aria-label=\"Choose true or false\">\n          \u003cp class=\"response-prompt\">Is the sentence true or false?\u003c/p>\n          \u003cdiv class=\"truth-grid\">\n            ${truthOption('false','False')}\n            ${truthOption('true','True')}\n          \u003c/div>\n        \u003c/section>\n        \u003cdiv class=\"feedback\" id=\"feedback\" aria-live=\"polite\">\u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/section>`;\n  document.querySelectorAll('.truth-btn,.truth-check').forEach(el=>el.disabled=true);\n  for(const value of ['false','true']){\n    document.getElementById('btn-'+value).addEventListener('click',()=>chooseTruth(value==='true'));\n    document.getElementById('check-'+value).addEventListener('click',e=>{e.preventDefault();chooseTruth(value==='true');});\n  }\n  document.getElementById('audioBtn').addEventListener('click',replaySequence);\n  scheduleCompulsory();\n}\nfunction truthOption(value,label){return `\u003cdiv class=\"truth-option\" id=\"option-${value}\">\n  \u003cbutton class=\"truth-btn\" id=\"btn-${value}\" data-value=\"${value}\">${label}\u003c/button>\n  \u003cdiv class=\"truth-check-wrap\">\u003cinput class=\"truth-check\" id=\"check-${value}\" type=\"checkbox\" aria-label=\"Choose ${label}\" data-value=\"${value}\">\u003c/div>\n\u003c/div>`;}\nfunction setFeedback(text,bad=false){const f=document.getElementById('feedback');if(!f)return;f.textContent=text;f.classList.toggle('bad',bad);}\nfunction setTaskLocked(locked){\n  const panel=document.getElementById('responsePanel');if(panel)panel.classList.toggle('locked',locked);\n  document.querySelectorAll('.truth-btn,.truth-check').forEach(el=>{el.disabled=locked||answered;});\n}\nfunction setAudioButton(enabled,active=false){const b=document.getElementById('audioBtn');if(!b)return;b.disabled=!enabled;b.classList.toggle('ready',enabled&&!active);b.classList.toggle('playing',active);}\nasync function scheduleCompulsory(){\n  const token=++audioToken;playing=true;setTaskLocked(true);setAudioButton(false);setFeedback('');\n  try{await sleep(T.initialDelayMs,token);await runSequence(token);compulsoryDone=true;playing=false;lasinGameBridge('timerStart',index);setAudioButton(true);setTaskLocked(false);setFeedback('Now choose True or False.');}\n  catch{if(token!==audioToken)return;playing=false;compulsoryDone=false;setFeedback('Tap the headset to listen twice.',true);setAudioButton(true);setTaskLocked(true);}\n}\nasync function replaySequence(){\n  if(playing||answered)return;stopAudio();const token=++audioToken;playing=true;setTaskLocked(true);setAudioButton(false,true);setFeedback('Listen carefully.');\n  try{await runSequence(token);playing=false;compulsoryDone=true;lasinGameBridge('timerStart',index);setAudioButton(true);setTaskLocked(false);setFeedback('Now choose True or False.');}\n  catch{if(token!==audioToken)return;playing=false;setAudioButton(true);setTaskLocked(!compulsoryDone);}\n}\nasync function runSequence(token){\n  const item=lesson.items[index];\n  for(let r=0;r\u003cT.repet <script>
(()=>{"use strict";
const D=JSON.parse(document.getElementById("masterLessonData").textContent),T=D.html,A=D.assets,N=D.names;
const menu=document.getElementById("master-menu"),shell=document.getElementById("master-exercise-shell"),zone=document.getElementById("master-frame-zone"),loader=document.getElementById("masterLoader"),title=document.getElementById("masterToolbarTitle");
let frame=null,current=null;

/* ===== LASIN MOTIVATION ENGINE: master-level state ===== */
const GAME_SECONDS=20;
const GAME_MAX_PER_QUESTION=5;
function detectQuestionCount(exerciseNumber,html){
  if(Number(exerciseNumber)<2)return 0; // Exercise 01 is always preview-only.
  try{
    const doc=new DOMParser().parseFromString(String(html||""),"text/html");
    const practice=doc.getElementById("lasinLessonData");
    if(practice){
      const d=JSON.parse(practice.textContent||"{}");
      if(Array.isArray(d.words)){
        const rounds=doc.querySelectorAll(".stagePill").length||1;
        return d.words.length*rounds;
      }
    }
    const lessonData=doc.getElementById("lesson-data");
    if(lessonData){
      const d=JSON.parse(lessonData.textContent||"{}");
      if(Array.isArray(d.items))return d.items.length;
    }
    const direct=[...doc.querySelectorAll("[data-question],[data-question-id],[data-lasin-question],.question,.quiz-question,.exercise-question")];
    return direct.filter((el,i)=>!direct.some((other,j)=>i!==j&&other.contains(el))).length;
  }catch(e){console.warn("[LASIN Motivation] Could not count questions for exercise",exerciseNumber,e);return 0}
}
const GAME_COUNTS={};
Object.keys(T).sort((a,b)=>Number(a)-Number(b)).forEach(k=>GAME_COUNTS[k]=detectQuestionCount(k,T[k]));
const GAME_OFFSETS={};let runningOffset=0;
Object.keys(GAME_COUNTS).sort((a,b)=>Number(a)-Number(b)).forEach(k=>{GAME_OFFSETS[k]=runningOffset;runningOffset+=GAME_COUNTS[k]});
const GAME_TOTAL=runningOffset;

const game={
  started:false,student:"",points:0,correct:0,wrong:0,completed:0,
  records:new Map(),activeKey:null,activeGlobal:null,timerRAF:0,resultsScheduled:false
};
const gameStudent=document.getElementById("lasin-game-student");
const gamePoints=document.getElementById("lasin-game-points");
const gameMode=document.getElementById("lasin-game-mode");
const gameProgress=document.getElementById("lasin-game-progress");
const gameTimer=document.getElementById("lasin-game-timer");
const gameProgressFill=document.getElementById("lasin-game-progress-fill");
const gameStart=document.getElementById("lasin-game-start");
const gameName=document.getElementById("lasin-game-name");
const gameNameError=document.getElementById("lasin-game-name-error");
const gameResults=document.getElementById("lasin-game-results");
const gamePop=document.getElementById("lasin-game-pop");
const gamePopNumber=document.getElementById("lasin-game-pop-number");
const gamePopLabel=document.getElementById("lasin-game-pop-label");

function gameKey(ex,local){return "ex"+Number(ex)+"-q"+Number(local)}
function gameRecord(ex,local){
  const key=gameKey(ex,local);
  if(!game.records.has(key))game.records.set(key,{key,exercise:Number(ex),local:Number(local),mistake:false,completed:false,elapsedMs:0,startedAt:null,earned:0});
  return game.records.get(key);
}
function validGameQuestion(ex,local){
  ex=String(Number(ex));local=Number(local);
  return Number(ex)>=2&&Number.isInteger(local)&&local>=0&&local<(GAME_COUNTS[ex]||0);
}
function elapsedMs(rec){
  return rec.elapsedMs+(rec.startedAt!=null?Math.max(0,performance.now()-rec.startedAt):0);
}
function pauseGameClock(clearActive=true){
  if(game.activeKey){
    const rec=game.records.get(game.activeKey);
    if(rec&&rec.startedAt!=null){rec.elapsedMs+=Math.max(0,performance.now()-rec.startedAt);rec.startedAt=null}
  }
  cancelAnimationFrame(game.timerRAF);game.timerRAF=0;
  if(clearActive){game.activeKey=null;game.activeGlobal=null}
  updateGameHUD();
}
function pointsForSeconds(seconds){
  if(seconds<=5)return 5;
  if(seconds<=10)return 4;
  if(seconds<=15)return 3;
  if(seconds<=20)return 2;
  return 1;
}
function startGameClock(ex,local){
  if(!game.started||!validGameQuestion(ex,local))return;
  const rec=gameRecord(ex,local);if(rec.completed)return;
  if(game.activeKey&&game.activeKey!==rec.key)pauseGameClock(true);
  if(rec.startedAt==null)rec.startedAt=performance.now();
  game.activeKey=rec.key;game.activeGlobal=(GAME_OFFSETS[String(Number(ex))]||0)+Number(local)+1;
  updateGameHUD();runGameTimer();
}
function markGameMistake(ex,local){
  if(!game.started||!validGameQuestion(ex,local))return;
  const rec=gameRecord(ex,local);if(!rec.completed)rec.mistake=true;
}
function completeGameQuestion(ex,local){
  if(!game.started||!validGameQuestion(ex,local))return;
  const rec=gameRecord(ex,local);if(rec.completed)return;
  if(rec.startedAt!=null){rec.elapsedMs+=Math.max(0,performance.now()-rec.startedAt);rec.startedAt=null}
  if(rec.elapsedMs<=0)rec.elapsedMs=(GAME_SECONDS+0.001)*1000; // conservative fallback
  const clean=!rec.mistake;
  const earned=clean?pointsForSeconds(rec.elapsedMs/1000):0;
  rec.completed=true;rec.earned=earned;
  game.points+=earned;game.completed++;
  if(clean)game.correct++;else game.wrong++;
  if(game.activeKey===rec.key){cancelAnimationFrame(game.timerRAF);game.timerRAF=0;game.activeKey=null;game.activeGlobal=null}
  updateGameHUD(true);
  setTimeout(()=>showGamePoints(earned),450); // synchronized with the existing Bravo screens
  if(game.completed>=GAME_TOTAL&&!game.resultsScheduled){
    game.resultsScheduled=true;
    setTimeout(showGameResults,2650); // let the original final Bravo finish first
  }
}
function runGameTimer(){
  cancelAnimationFrame(game.timerRAF);
  const tick=()=>{
    if(!game.started||!game.activeKey)return;
    const rec=game.records.get(game.activeKey);if(!rec||rec.completed)return;
    const remaining=Math.max(0,GAME_SECONDS-elapsedMs(rec)/1000);
    gameTimer.textContent=Math.ceil(remaining)+"s";
    game.timerRAF=requestAnimationFrame(tick);
  };
  tick();
}
function updateGameHUD(bump=false){
  gameStudent.textContent=game.student||"—";
  gamePoints.textContent=String(game.points);
  if(bump){
    gamePoints.classList.remove("bump");void gamePoints.offsetWidth;gamePoints.classList.add("bump");
    setTimeout(()=>gamePoints.classList.remove("bump"),220);
  }
  const pct=GAME_TOTAL?Math.min(100,(game.completed/GAME_TOTAL)*100):0;
  gameProgressFill.style.width=pct+"%";
  if(String(current)==="1"){
    gameMode.textContent="Preview";gameProgress.textContent="Vocabulary";gameTimer.textContent="—";return;
  }
  if(game.activeKey&&game.activeGlobal!=null){
    gameMode.textContent="Question";gameProgress.textContent=game.activeGlobal+" / "+GAME_TOTAL;
    const rec=game.records.get(game.activeKey);
    if(rec)gameTimer.textContent=Math.ceil(Math.max(0,GAME_SECONDS-elapsedMs(rec)/1000))+"s";
  }else{
    gameMode.textContent="Progress";gameProgress.textContent=game.completed+" / "+GAME_TOTAL;gameTimer.textContent="—";
  }
}
function showGamePoints(points){
  gamePopNumber.textContent="+"+points;
  gamePopLabel.textContent="POINTS ⭐";
  gamePop.classList.remove("show");void gamePop.offsetWidth;gamePop.classList.add("show");
}
function ratingFor(pct){return pct>=90?"EXCELLENT":pct>=70?"VERY GOOD":pct>=50?"GOOD":"NOT SO GOOD"}
function showGameResults(){
  pauseGameClock(true);
  const accuracy=GAME_TOTAL?Math.round((game.correct/GAME_TOTAL)*100):0;
  document.getElementById("lasin-game-result-title").textContent="Great work, "+game.student+"!";
  document.getElementById("lasin-game-result-points").textContent=game.points+" / "+(GAME_TOTAL*GAME_MAX_PER_QUESTION);
  document.getElementById("lasin-game-result-correct").textContent=String(game.correct);
  document.getElementById("lasin-game-result-wrong").textContent=String(game.wrong);
  document.getElementById("lasin-game-result-total").textContent=String(GAME_TOTAL);
  document.getElementById("lasin-game-result-accuracy").textContent=accuracy+"%";
  document.getElementById("lasin-game-rating").textContent=ratingFor(accuracy);
  gameResults.classList.remove("hidden");
}
function startGame(){
  const name=String(gameName.value||"").trim();
  if(!name){gameNameError.textContent="Please type your name first.";gameName.focus();return}
  game.student=name;game.started=true;gameNameError.textContent="";
  gameStart.classList.add("hidden");document.body.classList.add("lasin-game-started");updateGameHUD();
}
document.getElementById("lasin-game-start-btn").addEventListener("click",startGame);
gameName.addEventListener("keydown",e=>{if(e.key==="Enter")startGame()});
document.getElementById("lasin-game-again-btn").addEventListener("click",()=>location.reload());
document.getElementById("lasin-game-menu-btn").addEventListener("click",()=>{gameResults.classList.add("hidden");showMenu()});

/* Receive tiny result/timer signals from the protected exercise iframes. */
window.addEventListener("message",e=>{
  if(!game.started||!frame||e.source!==frame.contentWindow)return;
  const d=e.data;
  if(!d||d.source!=="LASIN_MOTIVATION_BRIDGE")return;
  const ex=Number(d.exercise),local=Number(d.questionIndex);
  if(String(ex)!==String(current)||!validGameQuestion(ex,local))return;
  if(d.action==="timerStart")startGameClock(ex,local);
  else if(d.action==="mistake")markGameMistake(ex,local);
  else if(d.action==="complete")completeGameQuestion(ex,local);
});

/* ===== Existing master lesson navigation, preserved ===== */
function stop(){pauseGameClock(true);if(!frame)return;try{frame.src="about:blank"}catch(e){}try{frame.remove()}catch(e){}frame=null}
function mark(n){document.querySelectorAll(".master-mini-number").forEach(b=>{const on=Number(b.dataset.ex)===Number(n);b.classList.toggle("current",on);if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")})}
function openEx(n){
  n=String(Number(n));if(!T[n])return;stop();current=n;updateGameHUD();
  menu.style.display="none";shell.classList.add("active");loader.classList.remove("hidden");title.textContent="Exercise "+n+" • "+N[n];mark(n);
  const f=document.createElement("iframe");f.className="master-frame";f.title="Exercise "+n+": "+N[n];f.setAttribute("allow","autoplay; fullscreen");f.setAttribute("allowfullscreen","");f.setAttribute("loading","eager");
  f.addEventListener("load",()=>{if(f===frame)loader.classList.add("hidden")},{once:true});
  frame=f;zone.appendChild(f);f.srcdoc=T[n].replace(/@@LASIN_ASSET_\d{4}@@/g,m=>A[m]||m)
}
function showMenu(){
  stop();current=null;shell.classList.remove("active");menu.style.display="flex";loader.classList.remove("hidden");mark(null);updateGameHUD();
  try{window.scrollTo({top:0,left:0,behavior:"instant"})}catch(e){window.scrollTo(0,0)}
}
document.querySelectorAll(".master-number,.master-mini-number").forEach(b=>b.addEventListener("click",()=>openEx(b.dataset.ex)));
document.getElementById("masterBackMenu").addEventListener("click",showMenu);
document.addEventListener("keydown",e=>{if(shell.classList.contains("active")){if(e.key==="Escape"){e.preventDefault();showMenu()}else if(/^\d$/.test(e.key)&&T[e.key]&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();openEx(e.key)}}});
window.addEventListener("beforeunload",stop);

console.info("[LASIN Motivation] Scored questions:",GAME_COUNTS,"Total:",GAME_TOTAL);
updateGameHUD();
})();
</script>
