e-area-inset-left));\n    padding-right:max(9px,env(safe-area-inset-right));\n  }\n  .lesson-header{grid-template-columns:122px 1fr 122px;margin-bottom:10px}\n  .home-btn{min-height:46px;padding:0 12px;font-size:17px}\n  .page-pill{min-height:46px;padding:0 11px;font-size:14px}\n  .header-title{font-size:clamp(30px,5vw,40px)}\n  .header-sub{font-size:clamp(12px,2.5vw,18px)}\n  .cards{grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}\n  .cards \u003e .card{grid-column:span 2}\n  .cards.page-items-5 .card:nth-child(4){grid-column:2 / span 2}\n  .cards.page-items-5 .card:nth-child(5){grid-column:4 / span 2}\n  .card{border-radius:19px;padding:8px}\n  .picture-frame{border-radius:15px;padding:7px}\n  .word-box{min-height:43px;margin-top:9px;border-radius:11px;font-size:clamp(15px,2.5vw,21px)}\n  .audio-btn{width:48px;height:48px;flex-basis:48px}\n  .audio-btn svg{width:23px;height:23px}\n  .nav-btn{min-width:125px;min-height:49px;font-size:17px}\n}\n@media(max-width:650px){\n  .home-panel{width:min(96vw,560px);border-radius:26px;padding:22px 14px}\n  .eyebrow{font-size:12px;letter-spacing:.12em;margin-bottom:14px}\n  .lesson-banner{\n    min-height:82px;\n    border-radius:18px;\n    padding:14px 8px;\n    font-size:clamp(14px,4.15vw,20px);\n    letter-spacing:-.035em;\n  }\n  .home-actions{margin-top:22px}\n  .vocab-btn{min-height:78px;border-radius:18px;font-size:clamp(32px,11vw,46px)}\n  .lesson-header{grid-template-columns:88px 1fr 0;margin-bottom:8px;gap:6px}\n  .home-btn{min-height:42px;padding:0 9px;font-size:14px;border-radius:12px}\n  .page-pill{display:none}\n  .header-title{font-size:clamp(28px,8vw,36px)}\n  .header-sub{\n    margin-top:5px;\n    font-size:clamp(10px,3.15vw,14px);\n    white-space:nowrap;\n  }\n  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}\n  .cards \u003e .card{grid-column:auto}\n  .cards.partial-5,.cards.partial-4,.cards.partial-3,.cards.partial-2,.cards.partial-1{\n    grid-template-columns:repeat(2,minmax(0,1fr));justify-content:stretch\n  }\n  .cards.page-items-5 .card:last-child,\n  .cards.partial-1 .card:last-child,\n  .cards.partial-3 .card:last-child,\n  .cards.partial-5 .card:last-child{\n    grid-column:1 / -1;\n    width:calc(50% - 4px);\n    justify-self:center;\n  }\n  .card{padding:7px;border-radius:18px}\n  .picture-frame{padding:6px;border-radius:14px}\n  .word-box{\n    width:100%;\n    min-height:39px;\n    margin-top:8px;\n    padding:6px 5px;\n    border-radius:10px;\n    font-size:clamp(14px,4vw,18px);\n  }\n  .audio-area{margin-top:8px}\n  .audio-btn{width:45px;height:45px;flex-basis:45px}\n  .audio-btn svg{width:21px;height:21px}\n  .tap-note{font-size:9.5px;margin-top:6px}\n  .navbar{margin-top:8px}\n  .nav-btn{min-width:96px;min-height:45px;border-radius:12px;font-size:14px}\n  .dots{gap:6px;min-width:54px}\n  .dot{width:10px;height:10px}\n}\n@media(max-width:390px){\n  .cards{gap:6px}\n  .card{padding:6px}\n  .word-box{font-size:13.5px}\n  .audio-btn{width:42px;height:42px;flex-basis:42px}\n  .lesson-banner{font-size:13.8px}\n  .header-sub{font-size:10.5px}\n  .nav-btn{min-width:86px;font-size:13px}\n}\n@media(min-width:851px) and (max-height:760px){\n  #lessonScreen{padding-top:8px;padding-bottom:8px}\n  .lesson-header{margin-bottom:8px}\n  .card{padding:7px 9px}\n  .word-box{margin-top:8px;min-height:43px}\n  .audio-area{margin-top:7px}\n  .audio-btn{width:47px;height:47px;flex-basis:47px}\n  .tap-note{margin-top:5px}\n  .navbar{margin-top:7px}\n}\n@media(prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}\n}\n\n\n/* ---------- UNIT 01 \u2022 LESSON 02 \u2022 FEELINGS \u2022 FULL-VIEWPORT INDIVIDUAL VOCAB ---------- */\n/*\n  This lesson contains ten independent adjective vocabulary items.\n  There are NO paired sentence halves. Each item contains one picture, one\n  compact blue word box, one original-audio headset control, and one listening note.\n\n  PAGINATION RULE:\n  Four adjective items per page on every device. Ten items therefore produce\n  exactly three pages: 4 + 4 + 2. Responsive behavior changes only the visual\n  arrangement and proportions of those cards; it never changes page capacity.\n\n  FULL-SCREEN RULE:\n  The lesson consumes the complete usable viewport. Header and navigation keep\n  only the height they need; the learning area receives every remaining pixel.\n  Safe-area insets stay protected and layout decisions use viewport dimensions,\n  never operating-system or device-name detection.\n*/\n:root{\n  --page-width:100%;\n  --learning-font-size:clamp(30px,2.25vw,44px);\n  --learning-font-weight:800;\n  --learning-line-height:1.05;\n  --learning-letter-spacing:.005em;\n  --lesson-gap:clamp(5px,.62vmin,9px);\n}\n\nhtml,body{width:100%;height:100%}\n\n#lessonScreen{\n  width:100%;\n  height:100vh;\n  height:100dvh;\n  min-height:0;\n  overflow:hidden;\n  flex-direction:column;\n  padding:\n    max(6px,env(safe-area-inset-top))\n    max(8px,env(safe-area-inset-right))\n    max(6px,env(safe-area-inset-bottom))\n    max(8px,env(safe-area-inset-left));\n}\n\n.lesson-header{\n  width:100%;\n  flex:0 0 auto;\n  margin:0 0 clamp(5px,.7vh,9px);\n  grid-template-columns:minmax(108px,160px) minmax(0,1fr) minmax(108px,160px);\n  gap:clamp(6px,.7vw,10px);\n}\n.home-btn,.page-pill{min-height:clamp(42px,5.3vh,52px);border-radius:14px}\n.home-btn{padding:0 clamp(12px,1.2vw,18px);font-size:clamp(16px,1.25vw,20px)}\n.header-title{font-size:clamp(34px,2.8vw,48px)}\n.header-sub{margin-top:4px;font-size:clamp(14px,1.35vw,21px)}\n.page-pill{padding:0 clamp(12px,1vw,16px);font-size:clamp(14px,1.12vw,18px)}\n\n/* Four vocabulary items per page: a balanced 2 \u00d7 2 teaching grid. */\n.cards{\n  width:100%;\n  max-width:none;\n  flex:1 1 auto;\n  min-height:0;\n  height:auto;\n  margin:0;\n  display:grid;\n  grid-template-columns:repeat(2,minmax(0,1fr));\n  grid-template-rows:repeat(2,minmax(0,1fr));\n  gap:var(--lesson-gap);\n  align-items:stretch;\n  align-content:stretch;\n}\n.cards \u003e .card{grid-column:auto}\n.cards.page-size-4,\n.cards.page-items-4{\n  grid-template-columns:repeat(2,minmax(0,1fr));\n  grid-template-rows:repeat(2,minmax(0,1fr));\n  justify-content:stretch;\n}\n\n/* One card = one independent adjective. */\n.card{\n  min-width:0;\n  min-height:0;\n  height:100%;\n  overflow:hidden;\n  background:#fff;\n  border:1px solid var(--border);\n  border-radius:clamp(16px,1.2vw,22px);\n  box-shadow:var(--shadow);\n  padding:clamp(3px,.35vw,6px);\n  display:block;\n}\n\n.learning-panel{\n  min-width:0;\n  min-height:0;\n  width:100%;\n  height:100%;\n  overflow:hidden;\n  border:1px solid #E6ECF4;\n  border-radius:clamp(13px,1vw,17px);\n  background:#fff;\n  padding:clamp(2px,.28vw,4px);\n  display:grid;\n  grid-template-columns:minmax(0,1.48fr) minmax(170px,.72fr);\n  grid-template-rows:minmax(0,1fr) minmax(0,1fr);\n  align-items:stretch;\n  justify-items:stretch;\n  column-gap:clamp(4px,.48vw,8px);\n  row-gap:2px;\n}\n\n.picture-frame{\n  grid-column:1;\n  grid-row:1 / span 2;\n  width:100%;\n  height:100%;\n  min-width:0;\n  min-height:0;\n  aspect-ratio:auto;\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  overflow:hidden;\n  background:#fff;\n  border:1px solid #DDE5EF;\n  border-radius:clamp(11px,.9vw,15px);\n  padding:clamp(1px,.18vw,3px);\n}\n.picture-frame img{\n  display:block;\n  width:100%;\n  height:100%;\n  object-fit:contain;\n  object-position:center;\n  image-rendering:auto;\n}\n\n.word-box{\n  grid-column:2;\n  grid-row:1;\n  align-self:end;\n  justify-self:center;\n  width:max-content;\n  max-width:100%;\n  min-height:clamp(42px,5.4vh,58px);\n  margin:0 auto clamp(2px,.35vh,5px);\n  padding:clamp(6px,.7vh,9px) clamp(14px,1.25vw,24px);\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  text-align:center;\n  border-radius:clamp(10px,.8vw,13px);\n  background:var(--blue);\n  color:#fff;\n  box-shadow:0 7px 14px rgba(33,108,222,.16);\n  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Arial,sans-serif;\n  font-size:var(--learning-font-size);\n  font-weight:var(--learning-font-weight);\n  line-height:var(--learning-line-height);\n  letter-spacing:var(--learning-letter-spacing);\n  white-space:nowrap;\n}\n\n.audio-area{\n  grid-column:2;\n  grid-row:2;\n  align-self:start;\n  justify-self:stretch;\n  width:100%;\n  min-height:0;\n  margin-top:clamp(2px,.3vh,5px);\n  display:flex;\n  flex-direction:column;\n  align-items:center;\n  justify-content:flex-start;\n}\n.audio-btn{\n  width:clamp(45px,3.5vw,56px);\n  height:clamp(45px,3.5vw,56px);\n  flex:0 0 clamp(45px,3.5vw,56px);\n}\n.audio-btn svg{width:clamp(22px,1.8vw,27px);height:clamp(22px,1.8vw,27px)}\n.tap-note{\n  min-height:12px;\n  margin-top:clamp(2px,.32vh,4px);\n  color:#79859A;\n  font-size:clamp(9px,.7vw,11.5px);\n  line-height:1.05;\n  text-align:center;\n  font-weight:650;\n}\n\n.navbar{width:100%;flex:0 0 auto;margin:clamp(5px,.62vh,8px) 0 0;gap:clamp(6px,.8vw,12px)}\n.nav-btn{min-width:clamp(108px,9.5vw,154px);min-height:clamp(44px,5.4vh,54px);border-radius:14px;font-size:clamp(15px,1.25vw,19px)}\n.dots{min-width:62px}\n\n/*\n  Final page (2 items): use the available area instead of leaving two empty grid\n  cells. Wide/landscape viewports use two full-height columns. Portrait tablet\n  and phone viewports use two full-width rows so both pictures remain large.\n*/\n.cards.partial-2{\n  grid-template-columns:repeat(2,minmax(0,1fr));\n  grid-template-rows:minmax(0,1fr);\n  justify-content:stretch;\n  align-content:stretch;\n}\n.cards.partial-2 .card{\n  width:100%;\n  max-width:none;\n  min-height:0;\n  max-height:none;\n  justify-self:stretch;\n  align-self:stretch;\n}\n\n/* Generic future remainder support. */\n.cards.partial-3{\n  grid-template-columns:repeat(2,minmax(0,1fr));\n  grid-template-rows:repeat(2,minmax(0,1fr));\n}\n.cards.partial-3 .card:last-child{\n  grid-column:1 / -1;\n  width:calc(50% - var(--lesson-gap)/2);\n  justify-self:center;\n}\n.cards.partial-1{\n  grid-template-columns:minmax(0,1fr);\n  grid-template-rows:minmax(0,1fr);\n  justify-content:stretch;\n  align-content:center;\n}\n.cards.partial-1 .card,\n.cards.partial-1 .card:last-child{\n  width:100%;\n  max-width:none;\n  max-height:58%;\n  min-height:220px;\n  justify-self:stretch;\n  align-self:center;\n}\n\n/* Portrait tablets / iPads: 4 cards remain on the page; only their internal layout changes. */\n@media(max-width:1050px) and (min-height:650px){\n  :root{--learning-font-size:clamp(24px,3.2vw,34px);--lesson-gap:clamp(4px,.5vmin,7px)}\n  .learning-panel{\n    grid-template-columns:minmax(0,1fr);\n    grid-template-rows:minmax(0,1fr) auto auto;\n    column-gap:0;\n    row-gap:clamp(2px,.3vh,4px);\n  }\n  .picture-frame{grid-column:1;grid-row:1;width:100%;height:100%}\n  .word-box{\n    grid-column:1;grid-row:2;align-self:center;\n    min-height:clamp(36px,4.4vh,48px);\n    margin:0 auto;\n    padding:5px clamp(10px,1.6vw,18px);\n  }\n  .audio-area{grid-column:1;grid-row:3;align-self:center;margin-top:0}\n  .audio-btn{width:44px;height:44px;flex-basis:44px}\n  .audio-btn svg{width:21px;height:21px}\n  .tap-note{font-size:9px;margin-top:2px}\n\n  .cards.partial-2{\n    grid-template-columns:minmax(0,1fr);\n    grid-template-rows:repeat(2,minmax(0,1fr));\n  }\n}\n\n/* Phone portrait (iOS / Android): keep all 4 words, maximize picture share in a 2 \u00d7 2 grid. */\n@media(max-width:700px) and (min-height:521px){\n  :root{\n    --learning-font-size:clamp(18px,5.6vw,26px);\n    --lesson-gap:3px;\n  }\n  #lessonScreen{\n    padding:\n      max(3px,env(safe-area-inset-top))\n      max(3px,env(safe-area-inset-right))\n      max(3px,env(safe-area-inset-bottom))\n      max(3px,env(safe-area-inset-left));\n  }\n  .lesson-header{\n    grid-template-columns:76px minmax(0,1fr) 0;\n    gap:3px;\n    margin-bottom:3px;\n  }\n  .home-btn{min-height:36px;padding:0 7px;font-size:12px;border-radius:10px}\n  .page-pill{display:none}\n  .header-title{font-size:clamp(25px,7vw,33px)}\n  .header-sub{margin-top:2px;font-size:clamp(9px,2.85vw,13px);white-space:nowrap}\n\n  .cards{\n    grid-template-columns:repeat(2,minmax(0,1fr));\n    grid-template-rows:repeat(2,minmax(0,1fr));\n  }\n  .card{padding:2px;border-radius:13px}\n  .learning-panel{\n    padding:1px;\n    border-radius:10px;\n    grid-template-columns:1fr;\n    grid-template-rows:minmax(0,1fr) auto auto;\n    row-gap:2px;\n  }\n  .picture-frame{\n    grid-column:1;\n    grid-row:1;\n    padding:0;\n    border-radius:9px;\n  }\n  .word-box{\n    grid-column:1;\n    grid-row:2;\n    min-height:30px;\n    padding:4px 7px;\n    border-radius:8px;\n    margin:0 auto;\n  }\n  .audio-area{grid-column:1;grid-row:3;margin-top:0}\n  .audio-btn{width:36px;height:36px;flex-basis:36px}\n  .audio-btn svg{width:17px;height:17px}\n  .tap-note{font-size:7.25px;margin-top:1px;min-height:8px}\n\n  .navbar{margin-top:3px;gap:4px}\n  .nav-btn{min-width:76px;min-height:36px;border-radius:10px;font-size:12px}\n  .dots{gap:5px;min-width:42px}\n  .dot{width:9px;height:9px}\n\n  .cards.partial-2{\n    grid-template-columns:1fr;\n    grid-template-rows:repeat(2,minmax(0,1fr));\n  }\n}\n\n@media(max-width:390px) and (min-height:521px){\n  :root{--learning-font-size:clamp(17px,5.3vw,22px)}\n  .lesson-header{grid-template-columns:70px minmax(0,1fr) 0}\n  .home-btn{min-height:34px;font-size:11px;padding:0 6px}\n  .header-title{font-size:clamp(23px,7vw,30px)}\n  .header-sub{font-size:clamp(8.5px,2.75vw,11px)}\n  .word-box{min-height:28px;padding:3px 5px}\n  .audio-btn{width:33px;height:33px;flex-basis:33px}\n  .audio-btn svg{width:16px;height:16px}\n  .tap-note{font-size:6.7px}\n  .nav-btn{min-width:70px;min-height:34px;font-size:11px}\n}\n\n@media(max-width:340px) and (min-height:521px){\n  :root{--learning-font-size:16px}\n  .lesson-header{grid-template-columns:66px minmax(0,1fr) 0}\n  .header-title{font-size:22px}\n  .header-sub{font-size:8.2px}\n  .audio-btn{width:31px;height:31px;flex-basis:31px}\n  .tap-note{font-size:6.3px}\n}\n\n/* Phone landscape / short constrained windows: same 4 items, horizontal use inside each card. */\n@media(max-height:520px) and (max-width:1000px){\n  :root{--learning-font-size:clamp(17px,2.75vw,26px);--lesson-gap:3px}\n  #lessonScreen{\n    padding:\n      max(2px,env(safe-area-inset-top))\n      max(4px,env(safe-area-inset-right))\n      max(2px,env(safe-area-inset-bottom))\n      max(4px,env(safe-area-inset-left));\n  }\n  .lesson-header{\n    margin-bottom:2px;\n    grid-template-columns:minmax(72px,105px) minmax(0,1fr) 0;\n    gap:3px;\n  }\n  .home-btn{min-height:30px;font-size:11px;padding:0 7px;border-radius:9px}\n  .page-pill{display:none}\n  .header-title{font-size:clamp(22px,6vh,30px)}\n  .header-sub{margin-top:1px;font-size:clamp(8px,2.5vh,11px)}\n\n  .cards{\n    grid-template-columns:repeat(2,minmax(0,1fr));\n    grid-template-rows:repeat(2,minmax(0,1fr));\n    gap:3px;\n  }\n  .card{padding:2px;border-radius:11px}\n  .learning-panel{\n    padding:1px;\n    border-radius:9px;\n    grid-template-columns:minmax(0,1.45fr) minmax(105px,.62fr);\n    grid-template-rows:minmax(0,1fr) minmax(0,1fr);\n    column-gap:3px;\n    row-gap:1px;\n  }\n  .picture-frame{\n    grid-column:1;\n    grid-row:1 / span 2;\n    height:100%;\n    padding:0;\n    border-radius:8px;\n  }\n  .word-box{\n    grid-column:2;\n    grid-row:1;\n    align-self:end;\n    min-height:26px;\n    margin:0 auto 1px;\n    padding:3px 6px;\n    border-radius:7px;\n  }\n  .audio-area{grid-column:2;grid-row:2;align-self:start;margin-top:1px}\n  .audio-btn{width:28px;height:28px;flex-basis:28px}\n  .audio-btn svg{width:14px;height:14px}\n  .tap-note{font-size:6.2px;margin-top:1px;min-height:7px}\n\n  .navbar{margin-top:2px;gap:3px}\n  .nav-btn{min-width:66px;min-height:30px;border-radius:9px;font-size:10px}\n  .dots{gap:4px;min-width:36px}\n  .dot{width:7px;height:7px}\n\n  .cards.partial-2{\n    grid-template-columns:repeat(2,minmax(0,1fr));\n    grid-template-rows:minmax(0,1fr);\n  }\n}\n\n/* Short laptop mode: 4 cards remain in a 2 \u00d7 2 grid, with horizontal item layout. */\n@media(max-height:649px) and (min-width:1001px){\n  :root{--learning-font-size:clamp(20px,2.1vw,31px);--lesson-gap:4px}\n  #lessonScreen{\n    padding:\n      max(3px,env(safe-area-inset-top))\n      max(5px,env(safe-area-inset-right))\n      max(3px,env(safe-area-inset-bottom))\n      max(5px,env(safe-area-inset-left));\n  }\n  .lesson-header{\n    margin-bottom:3px;\n    grid-template-columns:minmax(82px,125px) minmax(0,1fr) minmax(82px,125px);\n    gap:4px;\n  }\n  .home-btn,.page-pill{min-height:34px;border-radius:10px}\n  .home-btn{font-size:13px;padding:0 8px}\n  .page-pill{font-size:12px;padding:0 8px}\n  .header-title{font-size:clamp(25px,4.5vh,34px)}\n  .header-sub{margin-top:1px;font-size:clamp(9px,2.35vh,14px)}\n\n  .card{padding:2px;border-radius:12px}\n  .learning-panel{\n    padding:1px;\n    border-radius:10px;\n    grid-template-columns:minmax(0,1.45fr) minmax(145px,.62fr);\n    grid-template-rows:minmax(0,1fr) minmax(0,1fr);\n    column-gap:3px;\n    row-gap:1px;\n  }\n  .picture-frame{grid-column:1;grid-row:1 / span 2;height:100%;padding:0;border-radius:8px}\n  .word-box{\n    grid-column:2;grid-row:1;align-self:end;\n    min-height:28px;margin:0 auto 1px;\n    padding:3px clamp(7px,.8vw,11px);border-radius:7px;\n  }\n  .audio-area{grid-column:2;grid-row:2;align-self:start;margin-top:1px}\n  .audio-btn{width:31px;height:31px;flex-basis:31px}\n  .audio-btn svg{width:15px;height:15px}\n  .tap-note{font-size:6.8px;margin-top:1px;min-height:8px}\n\n  .navbar{margin-top:3px}\n  .nav-btn{min-width:78px;min-height:34px;border-radius:9px;font-size:11px}\n  .dots{gap:5px;min-width:40px}\n  .dot{width:8px;height:8px}\n}\n\n@media(max-height:360px){\n  :root{--learning-font-size:clamp(15px,2.35vw,22px)}\n  .header-title{font-size:21px}\n  .header-sub{font-size:8px}\n  .home-btn{min-height:27px}\n  .word-box{min-height:23px;padding-top:2px;padding-bottom:2px}\n  .audio-btn{width:25px;height:25px;flex-basis:25px}\n  .audio-btn svg{width:12px;height:12px}\n  .tap-note{font-size:5.7px}\n  .nav-btn{min-height:27px}\n}\n\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003csection id=\"homeScreen\" class=\"screen active\" aria-label=\"Vocabulary home\"\u003e\n  \u003cdiv class=\"home-panel\"\u003e\n    \u003cp class=\"eyebrow\"\u003eEverybody Up 2 Vocabulary\u003c/p\u003e\n    \u003cdiv class=\"lesson-banner\"\u003eUnit 01 | Lesson 02 | Feelings\u003c/div\u003e\n\n    \u003cdiv class=\"home-actions\"\u003e\n      \u003cbutton id=\"openVocab\" class=\"vocab-btn\" type=\"button\"\u003eVocab\u003c/button\u003e\n\n      \u003cdiv id=\"embedWrap\" class=\"embed-wrap show\"\u003e\n        \u003cbutton id=\"embedButton\" class=\"embed-btn\" type=\"button\"\u003eEmbed Original MP3s\u003c/button\u003e\n        \u003cinput id=\"audioPicker\" type=\"file\" accept=\".mp3,audio/mpeg\" multiple=\"\"\u003e\n        \u003cdiv id=\"embedHelp\" class=\"embed-help\"\u003eOne-time teacher setup only. Select the 10 original adjective MP3 files; the browser will create the final standalone student HTML.\u003c/div\u003e\n        \u003cdiv id=\"embedStatus\" class=\"embed-status\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003csection id=\"lessonScreen\" class=\"screen\" aria-label=\"Vocabulary lesson\"\u003e\n  \u003cheader class=\"lesson-header\"\u003e\n    \u003cbutton id=\"homeButton\" class=\"home-btn\" type=\"button\" aria-label=\"Return to Home\"\u003e\u2190 Home\u003c/button\u003e\n\n    \u003cdiv class=\"header-center\"\u003e\n      \u003ch1 class=\"header-title\"\u003eVocab\u003c/h1\u003e\n      \u003cdiv class=\"header-sub\"\u003eUnit 01 \u2022 Lesson 02 \u2022 Feelings\u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv id=\"pagePill\" class=\"page-pill\" aria-live=\"polite\"\u003ePage 1\u003c/div\u003e\n  \u003c/header\u003e\n\n  \u003cmain id=\"cards\" class=\"cards\" aria-live=\"polite\"\u003e\u003c/main\u003e\n\n  \u003cnav class=\"navbar\" aria-label=\"Vocabulary page navigation\"\u003e\n    \u003cbutton id=\"prevButton\" class=\"nav-btn prev\" type=\"button\" disabled=\"\"\u003e\u2190 Previous\u003c/button\u003e\n    \u003cdiv id=\"dots\" class=\"dots\"\u003e\u003c/div\u003e\n    \u003cbutton id=\"nextButton\" class=\"nav-btn next\" type=\"button\"\u003eNext \u2192\u003c/button\u003e\n  \u003c/nav\u003e\n\u003c/section\u003e\n\n\u003cscript id=\"vocab-data\" type=\"application/json\"\u003e[{\"word\":\"sick\",\"image\":\"assets/images/image_4ad0096470f9083b.webp\",\"audio\":\"assets/audio/audio_17f1e633b666af2f.mp3\",\"audioFallback\":\"\",\"expectedFile\":\"sick.mp3\"},{\"word\":\"tired\",\"image\":\"assets/images/image_e101684288a65601.webp\",\"audio\":\"assets/audio/audio_1d6905b44dd79007.mp3\",\"audioFallback\":\"\",\"expectedFile\":\"tired.mp3\"},{\"word\":\"bored\",\"image\":\"assets/images/image_a6ef6bb52f7ffd51.webp\",\"audio\":\"assets/audio/audio_0b7038d369d4f5e3.mp3\",\"audioFallback\":\"\",\"expectedFile\":\"bored.mp3\"},{\"word\":\"excited\",\"image\":\"assets/images/image_5a4e1009fa8d6cf5.webp\",\"audio\":\"assets/audio/audio_a55108fd15ba02f4.mp3\",\"audioFallback\":\"\",\"expectedFile\":\"excited.mp3\"},{\"word\":\"happy\",\"image\":\"assets/images/image_88f4c9e8dbab3f2c.webp\",\"audio\":\"assets/audio/audio_104f9b435f79e76d.mp3\",\"audioFallback\":\"\",\"expectedFile\":\"happy.mp3\"},{\"word\":\"sad\",\"image\":\"assets/images/image_41a09d5780367d85.webp\",\"audio\":\"assets/audio/audio_17c1113ad34c4d37.mp3\",\"audioFallback\":\"\",\"expectedFile\":\"sad.mp3\"},{\"word\":\"hot\",\"image\":\"assets/images/image_891de7848172c470.webp\",\"audio\":\"assets/audio/audio_5228050991d2432d.mp3\",\"audioFallback\":\"\",\"expectedFile\":\"hot.mp3\"},{\"word\":\"cold\",\"image\":\"assets/images/image_96e86f9ed1bfb748.webp\",\"audio\":\"assets/audio/audio_1b0cf4f9e1046d9a.mp3\",\"audioFallback\":\"\",\"expectedFile\":\"cold.mp3\"},{\"word\":\"hungry\",\"image\":\"assets/images/image_08fa56e0588dee3b.webp\",\"audio\":\"assets/audio/audio_b14f89987c412521.mp3\",\"audioFallback\":\"\",\"expectedFile\":\"hungry.mp3\"},{\"word\":\"thirsty\",\"image\":\"assets/images/image_19136e2c81a45d06.webp\",\"audio\":\"assets/audio/audio_ff61ee1167b46e7a.mp3\",\"audioFallback\":\"\",\"expectedFile\":\"thirsty.mp3\"}]\u003c/script\u003e\n\u003cscript\u003e\n(() =\u003e {\n\"use strict\";\n\nconst PAGE_SIZE = 4;\nconst REPEAT_GAP_MS = 500;\nconst EXPORT_FILENAME = \"Everybody_Up_2_Unit_01_Lesson_02_Feelings_Vocab_EMBEDDED.html\";\n\nconst homeScreen = document.getElementById(\"homeScreen\");\nconst lessonScreen = document.getElementById(\"lessonScreen\");\nconst openVocab = document.getElementById(\"openVocab\");\nconst homeButton = document.getElementById(\"homeButton\");\nconst cardsEl = document.getElementById(\"cards\");\nconst dotsEl = document.getElementById(\"dots\");\nconst prevButton = document.getElementById(\"prevButton\");\nconst nextButton = document.getElementById(\"nextButton\");\nconst pagePill = document.getElementById(\"pagePill\");\nconst embedWrap = document.getElementById(\"embedWrap\");\nconst embedButton = document.getElementById(\"embedButton\");\nconst audioPicker = document.getElementById(\"audioPicker\");\nconst embedStatus = document.getElementById(\"embedStatus\");\nconst embedHelp = document.getElementById(\"embedHelp\");\n\nlet ITEMS = JSON.parse(document.getElementById(\"vocab-data\").textContent);\nconst pageSize = PAGE_SIZE;\nlet currentPage = 0;\nlet activeButton = null;\nlet sequenceTimer = null;\nlet playToken = 0;\n\nconst sharedAudio = new Audio();\nsharedAudio.preload = \"auto\";\n\n/* Four vocabulary items per page on every viewport. Responsive CSS changes\n   card arrangement/proportions only; pagination never changes with device size. */\n\nfunction totalPages(){\n  return Math.max(1, Math.ceil(ITEMS.length / pageSize));\n}\n\nfunction normalizeFileName(name){\n  return String(name || \"\")\n    .replace(/^.*[\\\\/]/,\"\")\n    .trim()\n    .toLowerCase()\n    .replace(/\\s+/g,\" \")\n    .replace(/\\.+mp3$/i,\".mp3\");\n}\n\nfunction itemAudio(item){\n  return item.audio || item.audioFallback || \"\";\n}\n\n/* Requirements are built from current lesson data and deduplicated by normalized filename.\n   This Feelings lesson resolves to ten unique original adjective recordings. */\nfunction buildAudioRequirements(){\n  const byName = new Map();\n\n  const addRequirement = (label, expected, assign) =\u003e {\n    const key = normalizeFileName(expected);\n    if(!key) return;\n    if(!byName.has(key)) byName.set(key,{label,expected,assigners:[]});\n    byName.get(key).assigners.push(assign);\n  };\n\n  ITEMS.forEach(item =\u003e {\n    addRequirement(item.expectedFile,item.expectedFile,data =\u003e {\n      item.audio = data;\n      item.audioFallback = \"\";\n    });\n  });\n\n  return Array.from(byName.values());\n}\n\nfunction requiredAudioCount(){\n  return buildAudioRequirements().length;\n}\n\nfunction allAudioEmbedded(){\n  return ITEMS.length \u003e 0 \u0026\u0026 ITEMS.every(item =\u003e Boolean(itemAudio(item)));\n}\n\nfunction updateEmbedCopy(){\n  const count = requiredAudioCount();\n  if(embedHelp){\n    embedHelp.textContent = `One-time teacher setup only. Select the ${count} original adjective MP3 files; the browser will create the final standalone student HTML.`;\n  }\n}\n\nfunction updateEmbedVisibility(){\n  updateEmbedCopy();\n  if(allAudioEmbedded()) embedWrap.classList.remove(\"show\");\n  else embedWrap.classList.add(\"show\");\n}\n\nfunction showEmbedStatus(text,type=\"\"){\n  embedStatus.textContent = text;\n  embedStatus.className = \"embed-status show\" + (type ? \" \" + type : \"\");\n}\n\nfunction clearPlayingVisual(){\n  if(activeButton){\n    activeButton.classList.remove(\"playing\");\n    activeButton.setAttribute(\"aria-pressed\",\"false\");\n  }\n  activeButton = null;\n}\n\nfunction stopAudio(){\n  playToken++;\n  if(sequenceTimer){\n    clearTimeout(sequenceTimer);\n    sequenceTimer = null;\n  }\n  sharedAudio.pause();\n  sharedAudio.removeAttribute(\"src\");\n  sharedAudio.load();\n  sharedAudio.onended = null;\n  sharedAudio.onerror = null;\n  clearPlayingVisual();\n}\n\nfunction headsetSvg(){\n  return `\n    \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"\u003e\n      \u003cpath fill=\"currentColor\" d=\"M12 3a8 8 0 0 0-8 8v6a3 3 0 0 0 3 3h2v-8H6v-1a6 6 0 1 1 12 0v1h-3v8h2a3 3 0 0 0 3-3v-6a8 8 0 0 0-8-8Zm-5 11h1v4H7a1 1 0 0 1-1-1v-3h1Zm10 4h-1v-4h2v3a1 1 0 0 1-1 1Z\"/\u003e\n    \u003c/svg\u003e`;\n}\n\n/* Play one original adjective MP3 completely, wait exactly 500 ms after its\n   natural ended event, then play the same original MP3 completely a second time. */\nfunction playSequence(steps,button,missingMessage){\n  stopAudio();\n\n  if(!steps.length || steps.some(step =\u003e !step.src)){\n    showEmbedStatus(missingMessage,\"error\");\n    return;\n  }\n\n  const myToken = ++playToken;\n  activeButton = button;\n  button.classList.add(\"playing\");\n  button.setAttribute(\"aria-pressed\",\"true\");\n  let stepIndex = 0;\n\n  const playStep = () =\u003e {\n    if(myToken !== playToken) return;\n    const step = steps[stepIndex];\n\n    sharedAudio.onended = () =\u003e {\n      if(myToken !== playToken) return;\n      if(stepIndex \u003e= steps.length - 1){\n        sharedAudio.onended = null;\n        clearPlayingVisual();\n        return;\n      }\n      const gap = Math.max(0,Number(step.gapAfterMs) || 0);\n      stepIndex++;\n      sequenceTimer = setTimeout(() =\u003e {\n        sequenceTimer = null;\n        if(myToken !== playToken) return;\n        playStep();\n      },gap);\n    };\n\n    sharedAudio.onerror = () =\u003e {\n      if(myToken === playToken) stopAudio();\n    };\n\n    sharedAudio.src = step.src;\n    try{ sharedAudio.currentTime = 0; }catch(e){}\n    sharedAudio.play().catch(() =\u003e {\n      if(myToken === playToken) stopAudio();\n    });\n  };\n\n  playStep();\n}\n\nfunction playTwice(src,button,missingMessage){\n  playSequence([\n    {src,gapAfterMs:REPEAT_GAP_MS},\n    {src,gapAfterMs:0}\n  ],button,missingMessage);\n}\n\nfunction playItemTwice(index,button){\n  const item = ITEMS[index];\n  playTwice(\n    itemAudio(item),\n    button,\n    `Original audio for \"${item.word}\" is not embedded yet. Use \u201cEmbed Original MP3s\u201d on the Home screen.`\n  );\n}\n\nfunction renderDots(){\n  dotsEl.innerHTML = \"\";\n  const pages = totalPages();\n  for(let i=0;i\u003cpages;i++){\n    const dot = document.createElement(\"button\");\n    dot.type = \"button\";\n    dot.className = \"dot\" + (i === currentPage ? \" active\" : \"\");\n    dot.setAttribute(\"aria-label\",`Go to page ${i+1}`);\n    if(i === currentPage) dot.setAttribute(\"aria-current\",\"page\");\n    dot.addEventListener(\"click\",() =\u003e goToPage(i));\n    dotsEl.appendChild(dot);\n  }\n}\n\nfunction partialClass(count){\n  if(count \u003e= pageSize) return \"\";\n  return \" partial-\" + Math.max(1,count);\n}\n\nfunction createPicture(src,alt){\n  const frame = document.createElement(\"div\");\n  frame.className = \"picture-frame\";\n  const img = document.createElement(\"img\");\n  img.src = src;\n  img.alt = alt;\n  img.draggable = false;\n  frame.appendChild(img);\n  return frame;\n}\n\nfunction createAudioArea(buttonLabel,onClick){\n  const area = document.createElement(\"div\");\n  area.className = \"audio-area\";\n  const button = document.createElement(\"button\");\n  button.type = \"button\";\n  button.className = \"audio-btn\";\n  button.innerHTML = headsetSvg();\n  button.setAttribute(\"aria-label\",buttonLabel);\n  button.setAttribute(\"aria-pressed\",\"false\");\n  button.addEventListener(\"click\",() =\u003e onClick(button));\n\n  const note = document.createElement(\"div\");\n  note.className = \"tap-note\";\n  note.textContent = \"Tap to hear it twice\";\n  area.append(button,note);\n  return area;\n}\n\nfunction renderPage(){\n  stopAudio();\n  const pages = totalPages();\n  if(currentPage \u003e pages - 1) currentPage = pages - 1;\n  if(currentPage \u003c 0) currentPage = 0;\n\n  const start = currentPage * pageSize;\n  const slice = ITEMS.slice(start,start + pageSize);\n\n  cardsEl.className = `cards page-size-${pageSize} page-items-${slice.length}${partialClass(slice.length)}`;\n  cardsEl.innerHTML = \"\";\n\n  slice.forEach((item,localIndex) =\u003e {\n    const absoluteIndex = start + localIndex;\n    const card = document.createElement(\"article\");\n    card.className = \"card\";\n    card.setAttribute(\"aria-label\",`${item.word} vocabulary item`);\n\n    const panel = document.createElement(\"section\");\n    panel.className = \"learning-panel word-panel\";\n    panel.appendChild(createPicture(item.image,`${item.word} vocabulary illustration`));\n\n    const wordBox = document.createElement(\"div\");\n    wordBox.className = \"word-box\";\n    wordBox.textContent = item.word;\n    panel.appendChild(wordBox);\n    panel.appendChild(createAudioArea(\n      `Play the word ${item.word} twice`,\n      button =\u003e playItemTwice(absoluteIndex,button)\n    ));\n\n    card.appendChild(panel);\n    cardsEl.appendChild(card);\n  });\n\n  pagePill.textContent = `Page ${currentPage + 1} of ${pages}`;\n  prevButton.disabled = currentPage === 0;\n  nextButton.disabled = currentPage === pages - 1;\n  renderDots();\n}\n\nfunction goToPage(index){\n  const pages = totalPages();\n  const next = Math.max(0,Math.min(pages - 1,index));\n  if(next === currentPage){\n    stopAudio();\n    return;\n  }\n  currentPage = next;\n  renderPage();\n  window.scrollTo({top:0,behavior:\"auto\"});\n}\n\nfunction showHome(){\n  stopAudio();\n  lessonScreen.classList.remove(\"active\");\n  homeScreen.classList.add(\"active\");\n  updateEmbedVisibility();\n}\n\nfunction showLesson(){\n  stopAudio();\n  homeScreen.classList.remove(\"active\");\n  lessonScreen.classList.add(\"active\");\n  renderPage();\n}\n\nopenVocab.addEventListener(\"click\",showLesson);\nhomeButton.addEventListener(\"click\",showHome);\nprevButton.addEventListener(\"click\",() =\u003e goToPage(currentPage - 1));\nnextButton.addEventListener(\"click\",() =\u003e goToPage(currentPage + 1));\n\n/* -------- ORIGINAL MP3 EMBEDDER \u2014 CONTENT-DRIVEN REQUIREMENTS -------- */\nembedButton.addEventListener(\"click\",() =\u003e {\n  audioPicker.value = \"\";\n  audioPicker.click();\n});\n\naudioPicker.addEventListener(\"change\",async () =\u003e {\n  const files = Array.from(audioPicker.files || []);\n  if(!files.length) return;\n\n  const fileMap = new Map();\n  files.forEach(file =\u003e fileMap.set(normalizeFileName(file.name),file));\n\n  const requirements = buildAudioRequirements();\n  const missing = [];\n  const matched = [];\n\n  for(const req of requirements){\n    const file = fileMap.get(normalizeFileName(req.expected));\n    if(file) matched.push({req,file});\n    else missing.push(req.label);\n  }\n\n  if(missing.length){\n    showEmbedStatus(\n      `Missing ${missing.length} file${missing.length===1?\"\":\"s\"}: ${missing.join(\", \")}. Nothing was exported.`,\n      \"error\"\n    );\n    return;\n  }\n\n  const requiredCount = requirements.length;\n  showEmbedStatus(`All ${requiredCount} original adjective MP3s were found. Embedding them now\u2026`);\n\n  try{\n    const readAsDataURL = file =\u003e new Promise((resolve,reject) =\u003e {\n      const reader = new FileReader();\n      reader.onload = () =\u003e resolve(reader.result);\n      reader.onerror = () =\u003e reject(reader.error || new Error(\"Could not read file\"));\n      reader.readAsDataURL(file);\n    });\n\n    for(const {req,file} of matched){\n      const data = await readAsDataURL(file);\n      req.assigners.forEach(assign =\u003e assign(data));\n    }\n\n    document.getElementById(\"vocab-data\").textContent = JSON.stringify(ITEMS);\n    showEmbedStatus(\n      `All ${requiredCount} original adjective MP3s were embedded successfully. Creating the final standalone student HTML\u2026`,\n      \"ok\"\n    );\n    exportStandaloneHTML();\n  }catch(err){\n    showEmbedStatus(`Audio embedding failed: ${err \u0026\u0026 err.message ? err.message : err}`,\"error\");\n  }\n});\n\nfunction exportStandaloneHTML(){\n  stopAudio();\n\n  const clone = document.documentElement.cloneNode(true);\n  clone.querySelector(\"#homeScreen\").classList.add(\"active\");\n  clone.querySelector(\"#lessonScreen\").classList.remove(\"active\");\n  clone.querySelector(\"#vocab-data\").textContent = JSON.stringify(ITEMS);\n\n  /* Cards regenerate from lesson data; clearing rendered markup prevents duplicate base64 images. */\n  const cloneCards = clone.querySelector(\"#cards\");\n  if(cloneCards){\n    cloneCards.innerHTML = \"\";\n    cloneCards.className = \"cards\";\n  }\n\n  const cloneDots = clone.querySelector(\"#dots\");\n  if(cloneDots) cloneDots.innerHTML = \"\";\n\n  const clonePagePill = clone.querySelector(\"#pagePill\");\n  if(clonePagePill) clonePagePill.textContent = \"Page 1\";\n\n  const clonePrev = clone.querySelector(\"#prevButton\");\n  if(clonePrev) clonePrev.disabled = true;\n  const cloneNext = clone.querySelector(\"#nextButton\");\n  if(cloneNext) cloneNext.disabled = false;\n\n  const cloneEmbedStatus = clone.querySelector(\"#embedStatus\");\n  if(cloneEmbedStatus){\n    cloneEmbedStatus.className = \"embed-status\";\n    cloneEmbedStatus.textContent = \"\";\n  }\n\n  const clonePicker = clone.querySelector(\"#audioPicker\");\n  if(clonePicker) clonePicker.removeAttribute(\"value\");\n\n  clone.querySelectorAll(\".audio-btn.playing\").forEach(el =\u003e {\n    el.classList.remove(\"playing\");\n    el.setAttribute(\"aria-pressed\",\"false\");\n  });\n\n  const source = \"\u003c!doctype html\u003e\\n\" + clone.outerHTML;\n  const blob = new Blob([source],{type:\"text/html;charset=utf-8\"});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement(\"a\");\n  a.href = url;\n  a.download = EXPORT_FILENAME;\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  setTimeout(() =\u003e URL.revokeObjectURL(url),3000);\n}\n\n/* -------- LIFECYCLE SAFETY -------- */\ndocument.addEventListener(\"visibilitychange\",() =\u003e {\n  if(document.hidden) stopAudio();\n});\nwindow.addEventListener(\"pagehide\",stopAudio);\nwindow.addEventListener(\"beforeunload\",stopAudio);\n\nupdateEmbedVisibility();\nrenderPage();\n})();\n\u003c/script\u003e\n\n\n\u003c/body\u003e\u003c/html\u003e"</script>

"he-cold\"},{\"recordType\":\"statement\",\"id\":\"she-cold\"},{\"recordType\":\"question\",\"id\":\"q-he-bored\"},{\"recordType\":\"question\",\"id\":\"q-she-bored\"},{\"recordType\":\"question\",\"id\":\"q-he-excited\"},{\"recordType\":\"question\",\"id\":\"q-she-excited\"},{\"recordType\":\"question\",\"id\":\"q-he-sad\"},{\"recordType\":\"question\",\"id\":\"q-she-sad\"},{\"recordType\":\"question\",\"id\":\"q-he-happy\"},{\"recordType\":\"question\",\"id\":\"q-she-happy\"},{\"recordType\":\"question\",\"id\":\"q-he-hot\"},{\"recordType\":\"question\",\"id\":\"q-she-hot\"},{\"recordType\":\"question\",\"id\":\"q-he-thirsty\"},{\"recordType\":\"question\",\"id\":\"q-she-thirsty\"},{\"recordType\":\"question\",\"id\":\"q-he-sick\"},{\"recordType\":\"question\",\"id\":\"q-she-sick\"},{\"recordType\":\"question\",\"id\":\"q-he-tired\"},{\"recordType\":\"question\",\"id\":\"q-she-tired\"},{\"recordType\":\"question\",\"id\":\"q-he-hungry\"},{\"recordType\":\"question\",\"id\":\"q-she-hungry\"},{\"recordType\":\"question\",\"id\":\"q-he-cold\"},{\"recordType\":\"question\",\"id\":\"q-she-cold\"}],\"qa\":[{\"questionId\":\"q-he-bored\",\"visualId\":\"he-sad\",\"truth\":false,\"answerId\":\"no-he\"},{\"questionId\":\"q-she-bored\",\"visualId\":\"she-bored\",\"truth\":true,\"answerId\":\"yes-she\"},{\"questionId\":\"q-he-excited\",\"visualId\":\"he-excited\",\"truth\":true,\"answerId\":\"yes-he\"},{\"questionId\":\"q-she-excited\",\"visualId\":\"she-happy\",\"truth\":false,\"answerId\":\"no-she\"},{\"questionId\":\"q-he-sad\",\"visualId\":\"he-hot\",\"truth\":false,\"answerId\":\"no-he\"},{\"questionId\":\"q-she-sad\",\"visualId\":\"she-sad\",\"truth\":true,\"answerId\":\"yes-she\"},{\"questionId\":\"q-he-happy\",\"visualId\":\"he-happy\",\"truth\":true,\"answerId\":\"yes-he\"},{\"questionId\":\"q-she-happy\",\"visualId\":\"she-thirsty\",\"truth\":false,\"answerId\":\"no-she\"},{\"questionId\":\"q-he-hot\",\"visualId\":\"he-sick\",\"truth\":false,\"answerId\":\"no-he\"},{\"questionId\":\"q-she-hot\",\"visualId\":\"she-hot\",\"truth\":true,\"answerId\":\"yes-she\"},{\"questionId\":\"q-he-thirsty\",\"visualId\":\"he-thirsty\",\"truth\":true,\"answerId\":\"yes-he\"},{\"questionId\":\"q-she-thirsty\",\"visualId\":\"she-tired\",\"truth\":false,\"answerId\":\"no-she\"},{\"questionId\":\"q-he-sick\",\"visualId\":\"he-hungry\",\"truth\":false,\"answerId\":\"no-he\"},{\"questionId\":\"q-she-sick\",\"visualId\":\"she-sick\",\"truth\":true,\"answerId\":\"yes-she\"},{\"questionId\":\"q-he-tired\",\"visualId\":\"he-tired\",\"truth\":true,\"answerId\":\"yes-he\"},{\"questionId\":\"q-she-tired\",\"visualId\":\"she-cold\",\"truth\":false,\"answerId\":\"no-she\"},{\"questionId\":\"q-he-hungry\",\"visualId\":\"he-bored\",\"truth\":false,\"answerId\":\"no-he\"},{\"questionId\":\"q-she-hungry\",\"visualId\":\"she-hungry\",\"truth\":true,\"answerId\":\"yes-she\"},{\"questionId\":\"q-he-cold\",\"visualId\":\"he-cold\",\"truth\":true,\"answerId\":\"yes-he\"},{\"questionId\":\"q-she-cold\",\"visualId\":\"she-excited\",\"truth\":false,\"answerId\":\"no-she\"}]}}\u003c/script\u003e\n\u003cscript\u003e\n\"use strict\";\n\n\n/* LASIN v3.0 scoring bridge \u2014 Exercise 01 / 150 educational questions. */\nlet LASIN_CHILD_ACTIVE=false;\nlet LASIN_RESTORE_INDEX=0;\nfunction lasinSend(action,payload={}){\n  try{ parent.postMessage({channel:'LASIN_MOTIVATION_V3',action,payload:Object.assign({exerciseId:'exercise-01'},payload)},'*'); }catch(e){}\n}\nfunction lasinCurrentMeta(){\n  if(q\u003c0 || q\u003e=TOTAL) return null;\n  const pos=currentPosition(); if(!pos || !pos.question) return null;\n  let sourceQuestionId='', responseMode='selection', expectedAnswer=null;\n  const x=pos.question;\n  if(pos.stage===0){ sourceQuestionId=`listen-word:${x.id}`; responseMode='selection'; }\n  else if(pos.stage===1){ sourceQuestionId=`listen-statement:${x.id}`; responseMode='selection'; }\n  else if(pos.stage===2){ sourceQuestionId=`drag:${(x.pageIndex||0)+1}`; responseMode='drag'; }\n  else if(pos.stage===3){ const w=adjectiveById.get(x.id); sourceQuestionId=`missing:${x.id}`; responseMode='letters'; expectedAnswer=w?w.text:null; }\n  else if(pos.stage===4){ const s=statementById.get(x.id),w=s?adjectiveById.get(s.adjectiveId):null; sourceQuestionId=`spell:${x.id}`; responseMode='letters'; expectedAnswer=w?w.text:null; }\n  else if(pos.stage===5){ sourceQuestionId=`true-false:${(x.index||0)+1}:${x.questionId}`; responseMode='selection'; expectedAnswer=x.truth?'True':'False'; }\n  else if(pos.stage===6){ const r=recordFromUnscramble(x); sourceQuestionId=`unscramble:${x.recordType}:${x.id}`; responseMode='tiles'; expectedAnswer=r?r.text:null; }\n  else if(pos.stage===7){ const a=answerById.get(x.answerId); sourceQuestionId=`qa:${(x.index||0)+1}:${x.questionId}:${x.visualId}`; responseMode='selection'; expectedAnswer=a?a.text:null; }\n  return {questionId:String(q+1),localIndex:q+1,responseMode,expectedAnswer,sourceQuestionId};\n}\nfunction lasinReadyCurrent(){ const m=lasinCurrentMeta(); if(LASIN_CHILD_ACTIVE\u0026\u0026m) lasinSend('question-ready',m); }\nfunction lasinPauseCurrent(){ const m=lasinCurrentMeta(); if(m) lasinSend('pause-active',m); }\nfunction lasinMistakeCurrent(){ const m=lasinCurrentMeta(); if(m) lasinSend('question-mistake',m); }\nfunction lasinCompleteCurrent(){ const m=lasinCurrentMeta(); if(m) lasinSend('question-completed',m); }\nfunction lasinExerciseFinished(){ lasinSend('exercise-finished',{}); }\nwindow.addEventListener('message',event=\u003e{\n  const data=event.data||{};\n  if(data.channel!=='LASIN_MOTIVATION_V3'||data.action!=='lasin:set-active') return;\n  const p=data.payload||{}; if(p.exerciseId!=='exercise-01') return;\n  if(Number.isFinite(Number(p.resumeLocalIndex))) LASIN_RESTORE_INDEX=Math.max(0,Math.min(TOTAL-1,Number(p.resumeLocalIndex)-1));\n  LASIN_CHILD_ACTIVE=Boolean(p.active);\n  if(!LASIN_CHILD_ACTIVE){\n    const hadPending=!!pendingConfirmation;\n    stopAudio();\n    if(hadPending \u0026\u0026 pendingConfirmation){\n      audioBtn.disabled=false;\n      audioBtnLabel.textContent=pendingConfirmation.kind==='answer'?'Retry answer audio':'Retry audio';\n      bad('Audio was interrupted. It will continue when you return.');\n    }\n    return;\n  }\n  const qs=document.getElementById('questionScreen');\n  if(!qs || qs.classList.contains('hidden') || q\u003e=TOTAL) return;\n  if(pendingConfirmation \u0026\u0026 typeof pendingConfirmation.run==='function'){\n    audioBtn.disabled=true;\n    audioBtnLabel.textContent=pendingConfirmation.kind==='answer'?'Playing answer\u2026':'Playing audio\u2026';\n    pendingConfirmation.run();\n    return;\n  }\n  if(answered) return;\n  const pos=currentPosition();\n  if(stageUsesGate(pos.stage)){\n    if(audioRequirementSatisfied) lasinReadyCurrent();\n    else renderQuestion();\n  }else if(pos.stage===2 \u0026\u0026 dragPageState \u0026\u0026 !dragPageState.frozen){\n    lasinReadyCurrent();\n  }\n});\nsetTimeout(()=\u003elasinSend('child-ready',{}),0);\n\n\n/* LASIN \u2014 Feelings \u0026 States Vocabulary Practice\n   New approved hybrid engine built from the existing LASIN visual/audio architecture.\n   8 rounds / 150 global progress questions/pages:\n   10 Listen Words + 20 Listen Statements + 10 Drag pages + 10 Missing Letters\n   + 20 Spell Adjective + 20 True/False + 40 Unscramble + 20 Question \u0026 Answer.\n   All gated audio encounters use 3 complete plays with 500 ms gaps.\n   Drag \u0026 Drop and Q\u0026A correct-answer confirmation use the same safe 3-play confirmation architecture.\n*/\nconst LASIN_DATA_NODE=document.getElementById(\"lasinLessonData\");\nconst lesson=JSON.parse(LASIN_DATA_NODE.textContent);\nconst $=s=\u003edocument.querySelector(s);\nconst main=$(\"#main\"),feedback=$(\"#feedback\"),questionTitle=$(\"#questionTitle\"),instruction=$(\"#instruction\"),eyebrow=$(\"#eyebrow\");\nconst audioArea=$(\"#audioArea\"),audioBtn=$(\"#audioBtn\"),audioBtnLabel=$(\"#audioBtnLabel\"),startBtn=$(\"#startBtn\");\n\nconst adjectiveById=new Map(lesson.adjectives.map(x=\u003e[x.id,x]));\nconst statementById=new Map(lesson.statements.map(x=\u003e[x.id,x]));\nconst questionById=new Map(lesson.questions.map(x=\u003e[x.id,x]));\nconst answerById=new Map(lesson.answers.map(x=\u003e[x.id,x]));\nconst visualById=new Map(lesson.visuals.map(x=\u003e[x.id,x]));\nconst allAudioRecords=[...lesson.adjectives,...lesson.statements,...lesson.questions,...lesson.answers];\n\nconst stageDefs=[\n {name:\"Listen \u0026 Choose \u2014 Words\",overlayTitle:\"Listen \u0026 Choose \u2014 Words\",overlayText:\"Listen carefully, then choose the matching picture.\",questions:lesson.stageData.listenWordIds.map(id=\u003e({type:\"listenWord\",id}))},\n {name:\"Listen \u0026 Choose \u2014 Statements\",overlayTitle:\"Listen \u0026 Choose \u2014 Statements\",overlayText:\"Listen carefully, then choose the picture that matches the statement.\",questions:lesson.stageData.listenStatementIds.map(id=\u003e({type:\"listenStatement\",id}))},\n {name:\"Drag \u0026 Drop\",overlayTitle:\"Drag \u0026 Drop\",overlayText:\"Drag each picture to the word or sentence that matches it.\",questions:lesson.stageData.dragGroups.map((items,pageIndex)=\u003e({type:\"drag\",items,pageIndex}))},\n {name:\"Missing 2 Letters\",overlayTitle:\"Missing Two Letters\",overlayText:\"Listen, then complete the two missing letters.\",questions:lesson.stageData.missingWordIds.map(id=\u003e({type:\"missing\",id}))},\n {name:\"Spell the Adjective\",overlayTitle:\"Spell the Adjective\",overlayText:\"Listen, then tap the letters to complete the statement.\",questions:lesson.stageData.spellStatementIds.map(id=\u003e({type:\"spellStatement\",id}))},\n {name:\"True or False\",overlayTitle:\"True or False\",overlayText:\"Listen to the question and decide whether it matches the picture.\",questions:lesson.stageData.trueFalse.map((item,index)=\u003e({type:\"trueFalse\",...item,index}))},\n {name:\"Unscramble\",overlayTitle:\"Unscramble Sentences \ function typingMetrics(expectedAnswer){const normalized=normalizeExpectedAnswer(expectedAnswer),characters=[...normalized].filter(ch=>!(/\s/u.test(ch))).length,words=normalized?normalized.split(/\s+/u).filter(Boolean).length:0;return {normalized,characters,words}}
function characterAllowance(chars){for(const b of CONFIG.typingFairness.characterBands)if(chars<=+b.maxCharacters)return Math.max(0,+b.allowanceSeconds||0);return 0}
function calculateTypingAllowanceSeconds(meta){meta=meta||{};const mode=normalizeMode(meta.responseMode||meta.inputMode);if(!isTypingResponseMode(mode))return 0;if(meta.typingAllowanceOverrideSeconds!=null&&Number.isFinite(+meta.typingAllowanceOverrideSeconds))return Math.min(Math.max(0,+meta.typingAllowanceOverrideSeconds),Math.max(0,+CONFIG.typingFairness.maxAllowanceSeconds||0));const m=typingMetrics(meta.expectedAnswer);if(!m.normalized)return 0;return Math.min(Math.max(0,+CONFIG.typingFairness.maxAllowanceSeconds||0),characterAllowance(m.characters)+Math.max(0,m.words-1)*Math.max(0,+CONFIG.typingFairness.extraWordSeconds||0))}
function pointsForEffectiveSeconds(seconds){const safe=Math.max(0,+seconds||0);if(CONFIG.hardDeadline&&safe>CONFIG.timerSeconds)return 0;const b=CONFIG.pointsBands.find(x=>safe<=+x.maxSeconds);if(b)return Math.max(0,+b.points||0);const last=CONFIG.pointsBands.at(-1);return last?Math.max(0,+last.points||0):0}
function questionCompleted(payload){const q=resolveQuestion(payload);if(!state.started||state.finished||!q)return {accepted:false};if(q.completed)return {accepted:false,reason:'already-completed'};if(payload&&payload.hadMistake===true)q.hadMistake=true;if(payload&&payload.matchedExpectedAnswer!=null)q.matchedExpectedAnswer=payload.matchedExpectedAnswer;const elapsedMs=effectiveElapsedMs(q);pauseQuestion(q);const rawSeconds=Math.max(0,elapsedMs/1000),answerForFairness=q.matchedExpectedAnswer!=null?q.matchedExpectedAnswer:q.expectedAnswer,allowance=calculateTypingAllowanceSeconds({responseMode:q.responseMode,expectedAnswer:answerForFairness,typingAllowanceOverrideSeconds:q.typingAllowanceOverrideSeconds}),effectiveSeconds=Math.max(0,rawSeconds-allowance),clean=!q.hadMistake,earned=clean?pointsForEffectiveSeconds(effectiveSeconds):0;q.completed=true;q.elapsedMs=elapsedMs;q.rawElapsedSeconds=rawSeconds;q.typingAllowanceSeconds=allowance;q.effectiveElapsedSeconds=effectiveSeconds;q.classification=clean?'correct':'wrong';q.pointsEarned=earned;state.points+=earned;if(clean)state.correct++;else state.wrong++;if(clean&&earned>0)showPointsCelebration(earned);updateHUD(true);persist();finishIfComplete(q.exerciseId);return {accepted:true}}
function runTimer(){cancelAnimationFrame(state.timerRAF);const frame=()=>{const q=activeQuestion();if(!state.started||state.finished||!q||q.completed||q.runningSince==null){state.timerRAF=0;updateHUD();return}const elapsed=effectiveElapsedMs(q)/1000,remaining=Math.max(0,CONFIG.timerSeconds-elapsed);timerEl.textContent=`${Math.ceil(remaining)}s`;timerFillEl.style.width=`${Math.max(0,Math.min(1,remaining/CONFIG.timerSeconds))*100}%`;state.timerRAF=requestAnimationFrame(frame)};frame()}
function ratingForAccuracy(a){if(a>=90)return'EXCELLENT';if(a>=70)return'VERY GOOD';if(a>=50)return'GOOD';return'NOT SO GOOD'}
function updateHUD(bump=false){studentEl.textContent=state.studentName||'—';pointsEl.textContent=String(state.points);if(bump){pointsEl.classList.remove('bump');void pointsEl.offsetWidth;pointsEl.classList.add('bump');setTimeout(()=>pointsEl.classList.remove('bump'),220)}const ex=state.exercises.get(state.activeExerciseId),q=activeQuestion();if(!ex||!ex.scorable){modeLabelEl.textContent='Preview';progressEl.textContent=ex?ex.label:'Preview';timerEl.textContent=state.started?'PREVIEW':'—';timerFillEl.style.width='100%';return}if(q&&!q.completed){modeLabelEl.textContent='Question';const gi=globalIndexFor(q.exerciseId,q.localIndex);progressEl.textContent=gi?`${gi} / ${totalScoredQuestions()}`:ex.label;if(q.runningSince==null){timerEl.textContent=q.ready?'PAUSED':'WAIT';timerFillEl.style.width='100%'}return}modeLabelEl.textContent='Progress';progressEl.textContent=`${completedQuestions().length} / ${totalScoredQuestions()}`;timerEl.textContent='WAIT';timerFillEl.style.width='100%'}
function showPointsCelebration(points){const pop=document.createElement('div');pop.className='lasin-points-pop';pop.innerHTML=`<span class="lasin-points-main">+${points}</span><span class="lasin-points-sub">POINT${points===1?'':'S'} ⭐</span>`;document.body.appendChild(pop);pop.addEventListener('animationend',()=>pop.remove(),{once:true});setTimeout(()=>pop.remove(),1600)}
function finishIfComplete(exerciseId){if(totalScoredQuestions()>0&&completedQuestions().length===totalScoredQuestions()){state.pendingFinish=true;state.finalizingExerciseId=exerciseId;persist()}}
function onExerciseFinished(exerciseId){if(!state.pendingFinish||state.finished||completedQuestions().length!==totalScoredQuestions())return;if(state.finalizingExerciseId&&exerciseId!==state.finalizingExerciseId)return;clearTimeout(finishDelay);finishDelay=setTimeout(finish,700)}
function finish(){if(state.finished||completedQuestions().length!==totalScoredQuestions())return false;state.finished=true;state.pendingFinish=false;pauseActive();renderResults();resultsScreen.classList.remove('hidden');persist();return true}
function renderResults(){const total=totalScoredQuestions(),accuracy=total?Math.round(state.correct/total*100):0,rating=ratingForAccuracy(accuracy);$('#lasin-results-title').textContent=`Great work, ${state.studentName}!`;$('#lasin-result-points').textContent=`${state.points} / ${maxPoints()}`;$('#lasin-result-correct').textContent=String(state.correct);$('#lasin-result-wrong').textContent=String(state.wrong);$('#lasin-result-total').textContent=String(total);$('#lasin-result-accuracy').textContent=`${accuracy}%`;$('#lasin-rating').textContent=rating}
function serializePersistentQuestion(q){return {key:q.key,exerciseId:q.exerciseId,questionId:q.questionId,localIndex:q.localIndex,ready:q.ready,hadMistake:q.hadMistake,completed:q.completed,classification:q.classification,pointsEarned:q.pointsEarned,elapsedMs:effectiveElapsedMs(q),responseMode:q.responseMode,expectedAnswer:q.expectedAnswer,matchedExpectedAnswer:q.matchedExpectedAnswer,typingAllowanceOverrideSeconds:q.typingAllowanceOverrideSeconds,typingAllowanceSeconds:q.typingAllowanceSeconds,rawElapsedSeconds:q.rawElapsedSeconds,effectiveElapsedSeconds:q.effectiveElapsedSeconds}}
function persist(){if(hydrating||!CONFIG.persistSession)return;try{sessionStorage.setItem(CONFIG.persistenceKey,JSON.stringify({version:CONFIG.version,studentName:state.studentName,started:state.started,finished:state.finished,pendingFinish:state.pendingFinish,finalizingExerciseId:state.finalizingExerciseId,activeExerciseId:state.activeExerciseId,points:state.points,correct:state.correct,wrong:state.wrong,questions:[...state.questions.values()].map(serializePersistentQuestion),lastQuestionByExercise:[...state.lastQuestionByExercise.entries()]}))}catch(e){}}
function restore(){let saved=null;try{const raw=sessionStorage.getItem(CONFIG.persistenceKey);if(raw)saved=JSON.parse(raw)}catch(e){}if(saved&&saved.version===CONFIG.version){state.studentName=saved.studentName||'';state.started=!!saved.started;state.finished=!!saved.finished;state.pendingFinish=!!saved.pendingFinish;state.finalizingExerciseId=saved.finalizingExerciseId||null;state.activeExerciseId=state.exercises.has(saved.activeExerciseId)?saved.activeExerciseId:'vocab';state.points=+saved.points||0;state.correct=+saved.correct||0;state.wrong=+saved.wrong||0;(saved.questions||[]).forEach(s=>{const q=ensureQuestion(s.exerciseId,s.questionId,s.localIndex);Object.assign(q,{ready:!!s.ready,hadMistake:!!s.hadMistake,completed:!!s.completed,classification:s.classification||null,pointsEarned:+s.pointsEarned||0,elapsedMs:Math.max(0,+s.elapsedMs||0),runningSince:null,responseMode:normalizeMode(s.responseMode),expectedAnswer:s.expectedAnswer??null,matchedExpectedAnswer:s.matchedExpectedAnswer??null,typingAllowanceOverrideSeconds:s.typingAllowanceOverrideSeconds==null?null:+s.typingAllowanceOverrideSeconds,typingAllowanceSeconds:Math.max(0,+s.typingAllowanceSeconds||0),rawElapsedSeconds:s.rawElapsedSeconds==null?null:+s.rawElapsedSeconds,effectiveElapsedSeconds:s.effectiveElapsedSeconds==null?null:+s.effectiveElapsedSeconds})});state.lastQuestionByExercise=new Map(Array.isArray(saved.lastQuestionByExercise)?saved.lastQuestionByExercise:[]);if(state.started){nameInput.value=state.studentName;startScreen.classList.add('hidden');root.classList.add('started')}if(state.finished){renderResults();resultsScreen.classList.remove('hidden')}}hydrating=false;updateHUD();updateNav();if(state.started)showExercise(state.activeExerciseId,{skipPersist:true});persist()}
function firstIncompleteIndex(exerciseId){const ex=state.exercises.get(exerciseId);if(!ex||!ex.scorable)return 1;for(let i=1;i<=ex.totalQuestions;i++){const q=state.questions.get(questionKey(exerciseId,String(i)));if(!q||!q.completed)return i}return 1}
const frames=new Map(),loaded=new Set();
function ensureFrame(exerciseId){if(frames.has(exerciseId))return frames.get(exerciseId);const frame=document.createElement('iframe');frame.className='lasin-lesson-frame';frame.title=state.exercises.get(exerciseId)?.label||exerciseId;frame.dataset.exercise=exerciseId;frame.setAttribute('allow','autoplay');frame.addEventListener('load',()=>{loaded.add(exerciseId);sendActiveToChild(exerciseId,exerciseId===state.activeExerciseId)});const srcNode=document.getElementById(`lasin-src-${exerciseId}`);frame.srcdoc=JSON.parse(srcNode.textContent);host.appendChild(frame);frames.set(exerciseId,frame);return frame}
function sendActiveToChild(exerciseId,active){const frame=frames.get(exerciseId);if(!frame||!frame.contentWindow)return;frame.contentWindow.postMessage({channel:CONFIG.messageChannel,action:'lasin:set-active',payload:{exerciseId,active,resumeLocalIndex:firstIncompleteIndex(exerciseId)}},'*')}
function showExercise(exerciseId,opt={}){if(!state.exercises.has(exerciseId))return;const old=state.activeExerciseId;if(old!==exerciseId){pauseActive();sendActiveToChild(old,false)}state.activeExerciseId=exerciseId;const frame=ensureFrame(exerciseId);frames.forEach((f,id)=>f.classList.toggle('active',id===exerciseId));if(loaded.has(exerciseId))sendActiveToChild(exerciseId,true);if(state.started&&!state.finished&&isScorableExercise(exerciseId))resumeQuestionForExercise(exerciseId);updateHUD();updateNav();if(!opt.skipPersist)persist()}
function updateNav(){document.querySelectorAll('.lasin-nav-btn').forEach(b=>{const id=b.dataset.exercise;b.classList.toggle('active',id===state.activeExerciseId);const ex=state.exercises.get(id);if(ex&&ex.scorable){let c=0;for(let i=1;i<=ex.totalQuestions;i++){const q=state.questions.get(questionKey(id,String(i)));if(q&&q.completed)c++}b.querySelector('.nav-count')?.remove();if(c){const s=document.createElement('span');s.className='nav-count';s.textContent=`${c}/${ex.totalQuestions}`;b.appendChild(s)}}})}
function start(name){const clean=String(name??nameInput.value??'').trim();if(!clean){startError.textContent='Please type your name first.';nameInput.focus();return false}state.studentName=clean;state.started=true;state.finished=false;state.pendingFinish=false;startError.textContent='';startScreen.classList.add('hidden');resultsScreen.classList.add('hidden');root.classList.add('started');updateHUD();persist();showExercise(state.activeExerciseId);return true}
function reset(){try{sessionStorage.removeItem(CONFIG.persistenceKey)}catch(e){}location.reload()}
window.addEventListener('message',event=>{const data=event.data||{};if(data.channel!==CONFIG.messageChannel||typeof data.action!=='string')return;let sourceExercise=null;for(const [id,f] of frames){if(f.contentWindow===event.source){sourceExercise=id;break}}if(!sourceExercise)return;const p=Object.assign({},data.payload||{},{exerciseId:sourceExercise});if(data.action==='child-ready'){sendActiveToChild(sourceExercise,sourceExercise===state.activeExerciseId);return}if(sourceExercise!==state.activeExerciseId&&['question-ready','pause-active','question-mistake','question-completed'].includes(data.action))return;if(data.action==='question-ready')questionReady(p);else if(data.action==='pause-active')questionWaiting(p);else if(data.action==='question-mistake')questionMistake(p);else if(data.action==='question-completed')questionCompleted(p);else if(data.action==='exercise-finished')onExerciseFinished(sourceExercise)});
document.querySelectorAll('.lasin-nav-btn').forEach(b=>b.addEventListener('click',()=>showExercise(b.dataset.exercise)));startBtn.addEventListener('click',()=>start());nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')start()});restartBtn.addEventListener('click',reset);window.addEventListener('pagehide',pauseActive);document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseActive();sendActiveToChild(state.activeExerciseId,false)}else if(state.started&&!state.finished){sendActiveToChild(state.activeExerciseId,true);resumeQuestionForExercise(state.activeExerciseId)}});
window.LASINMotivation=Object.freeze({version:CONFIG.version,config:CONFIG,getState:()=>({started:state.started,finished:state.finished,studentName:state.studentName,activeExerciseId:state.activeExerciseId,totalQuestions:totalScoredQuestions(),answered:completedQuestions().length,correct:state.correct,wrong:state.wrong,points:state.points,maxPoints:maxPoints(),timerSeconds:CONFIG.timerSeconds}),calculateTypingAllowanceSeconds,pointsForEffectiveSeconds,reset});
restore();
})();
</script>
