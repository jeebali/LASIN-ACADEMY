<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>LASIN | Everybody Up 1 | Unit 01 Lesson 01 Grammar | Exercise 03</title>
<style>
:root{
  --blue:#103d9b;--blue2:#0b2f7e;--soft:#eef4ff;--line:#dbe7ff;
  --good:#1d9d58;--bad:#d93b3b;--red:#e52d35;--red2:#bd2028;
  --text:#102247;--muted:#61749c;--paper:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
img{-webkit-user-drag:none;user-select:none}
#app{
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right))
          max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
}
.screen{width:min(95vw,1500px);min-height:min(95dvh,980px);margin:auto;text-align:center;display:flex;align-items:center;justify-content:center}
.intro{
  width:min(760px,94vw);padding:46px 28px;border:2px solid var(--line);border-radius:30px;background:#fff;
  box-shadow:0 14px 38px rgba(28,68,140,.10)
}
.intro h1{font-size:clamp(42px,6vw,68px);font-weight:900;color:var(--blue);margin:0;line-height:1.08}
.start,.restart{
  margin:30px auto 0;border:none;border-radius:999px;background:var(--blue);color:#fff;
  font-size:clamp(24px,4vw,35px);font-weight:900;padding:16px 50px;cursor:pointer;
  animation:glow 1.45s ease-in-out infinite alternate
}
.start:disabled{opacity:.38;cursor:not-allowed;animation:none;box-shadow:none}
@keyframes glow{from{box-shadow:0 0 8px rgba(16,61,155,.26)}to{box-shadow:0 0 28px rgba(16,61,155,.72)}}

.stage{width:100%;min-height:0;margin:auto;display:flex;flex-direction:column;justify-content:center}
.progress-wrap{width:min(1180px,96%);margin:0 auto 12px}
.progress-meta{display:flex;justify-content:flex-end;margin-bottom:5px;color:var(--muted);font-size:14px;font-weight:900}
.progress-track{height:12px;border-radius:999px;background:#eaf0ff;border:1px solid #d7e2fb;overflow:hidden}
.progress-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#3f8cff,#103d9b);transition:width .4s ease}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,1.6vw,24px);align-items:stretch;width:100%;flex:1;min-height:0}
.half{
  border:2px solid #e1eaff;border-radius:28px;background:#fff;padding:clamp(15px,1.65vw,24px);
  box-shadow:0 12px 30px rgba(28,68,140,.08);min-width:0;display:flex;flex-direction:column;justify-content:flex-start
}
.half-title{font-size:clamp(22px,2.2vw,30px);font-weight:900;color:var(--blue2);margin:0 0 9px}
.half.locked{opacity:.47;transition:opacity .25s ease}
.half.open{opacity:1}
.audio-btn{
  width:clamp(60px,5vw,74px);height:clamp(60px,5vw,74px);border:none;border-radius:50%;background:var(--soft);cursor:pointer;
  display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 8px 22px rgba(20,64,140,.13);
  transition:transform .15s ease,opacity .2s ease,box-shadow .15s ease
}
.audio-btn:hover:not(:disabled){box-shadow:0 11px 28px rgba(20,64,140,.19)}
.audio-btn:active:not(:disabled){transform:scale(.94)}
.audio-btn:disabled{opacity:.32;cursor:not-allowed;box-shadow:none}
.audio-btn.ready{animation:pulse 1.05s ease-in-out infinite alternate}
.audio-btn.playing{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{from{box-shadow:0 0 5px rgba(16,61,155,.16)}to{box-shadow:0 0 25px rgba(16,61,155,.58)}}
.audio-btn svg{width:54%;height:54%;fill:var(--blue)}

.picture-card{
  flex:1;min-height:280px;border:2px solid #edf2ff;border-radius:22px;background:#fff;
  display:flex;align-items:center;justify-content:center;padding:clamp(18px,3vw,36px);
  box-shadow:0 6px 17px rgba(20,64,140,.055);overflow:hidden
}
.picture-card img{width:min(92%,520px);height:min(45vh,430px);object-fit:contain;display:block}
.left-caption{margin:12px 0 0;color:var(--muted);font-size:15px;font-weight:800;min-height:20px}

.task-wrap{display:flex;flex-direction:column;flex:1;justify-content:center;min-height:0}
.listen-note{min-height:24px;font-size:15px;font-weight:900;color:var(--muted);margin:0 0 8px}
.sentence-area{
  width:min(680px,100%);margin:4px auto 20px;padding:14px 12px 11px;
  min-height:78px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  border-bottom:5px solid var(--blue);color:var(--blue);font-size:clamp(25px,3vw,38px);font-weight:900
}
.answer-slot{
  min-width:120px;min-height:48px;border:2px dashed #b8c9ec;border-radius:13px;background:#f8faff;
  display:inline-flex;align-items:center;justify-content:center;padding:3px 8px;color:#9aabd1;font-size:.75em
}
.period{margin-left:-2px}
.word-bank{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(9px,1.2vw,15px);min-height:64px;margin:0 auto 8px}
.word-tile{
  border:3px solid transparent;border-radius:14px;background:var(--red);color:#fff;padding:12px 20px;
  font-size:clamp(20px,2vw,28px);font-weight:900;cursor:pointer;box-shadow:0 7px 16px rgba(180,35,42,.18);
  transition:transform .14s ease,opacity .18s ease,box-shadow .14s ease,border-color .14s ease
}
.word-tile:hover:not(:disabled){transform:translateY(-2px)}
.word-tile:active:not(:disabled){transform:scale(.97)}
.word-tile:disabled{opacity:.38;cursor:not-allowed}
.word-tile.is-wrong{background:var(--red2);border-color:#8f1118;box-shadow:0 0 0 5px rgba(217,59,59,.12)}
.word-tile.moved{opacity:0;pointer-events:none;transform:translateY(-18px) scale(.9)}
.built-word{
  background:var(--blue);color:#fff;border-radius:12px;padding:9px 13px;
  font-size:clamp(20px,2vw,28px);font-weight:900;box-shadow:0 6px 14px rgba(16,61,155,.17);
  animation:wordPop .27s ease-out
}
@keyframes wordPop{from{transform:translateY(14px) scale(.92);opacity:.2}to{transform:none;opacity:1}}
.feedback{min-height:30px;margin:8px 0 0;font-size:18px;font-weight:900;color:var(--good)}
.feedback.bad{color:var(--bad)}
.shake{animation:shake .34s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.fly-tile{
  position:fixed;z-index:10000;margin:0;pointer-events:none;transition:transform .33s cubic-bezier(.2,.8,.25,1),opacity .33s ease;
  will-change:transform,opacity
}

.celebration{
  position:fixed;inset:0;z-index:9999;background:rgba(220,252,231,.97);
  display:flex;align-items:center;justify-content:center;overflow:hidden;animation:celebrateIn .25s ease-out
}
@keyframes celebrateIn{from{opacity:0}to{opacity:1}}
.celebration-core{position:relative;z-index:2;text-align:center;animation:bravoPop .48s cubic-bezier(.2,.9,.25,1.35)}
.celebration-title{
  font-size:clamp(76px,15vw,176px);font-weight:1000;letter-spacing:2px;color:#138a4f;
  text-shadow:0 6px 0 rgba(255,255,255,.9),0 12px 30px rgba(20,140,80,.18);line-height:.9
}
.celebration-sub{margin-top:16px;font-size:clamp(20px,3vw,35px);font-weight:900;color:var(--blue2)}
@keyframes bravoPop{0%{transform:scale(.45) rotate(-4deg);opacity:.1}70%{transform:scale(1.08) rotate(1deg);opacity:1}100%{transform:scale(1)}}
.star{
  position:absolute;z-index:1;font-size:clamp(26px,4vw,54px);color:#f4b400;
  text-shadow:0 3px 0 rgba(255,255,255,.75);animation:starFly 1.7s ease-out forwards;pointer-events:none
}
@keyframes starFly{0%{transform:translate(0,0) rotate(0) scale(.2);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.25);opacity:0}}
.complete{
  width:min(700px,94vw);padding:38px 24px;border:2px solid var(--line);border-radius:30px;background:#fff;
  box-shadow:0 14px 38px rgba(28,68,140,.10)
}
.complete h2{font-size:clamp(38px,6vw,62px);color:var(--blue);margin:0 0 10px;font-weight:900}
.complete p{font-size:21px;font-weight:700;color:#5a6b8f;margin:0}

.audio-setup{
  width:min(680px,96%);margin:18px auto 0;padding:15px 17px;border:2px solid #dbe7ff;border-radius:18px;
  background:#f8faff;box-shadow:0 8px 20px rgba(16,61,155,.07)
}
.audio-setup-title{font-size:16px;font-weight:1000;color:var(--blue2);margin-bottom:5px}
.audio-setup-text{font-size:13px;line-height:1.45;font-weight:800;color:var(--muted)}
.audio-setup-btn{
  margin-top:11px;border:0;border-radius:14px;background:var(--blue);color:#fff;padding:12px 17px;font-weight:1000;
  cursor:pointer;box-shadow:0 8px 16px rgba(16,61,155,.16)
}
.audio-setup-status{min-height:20px;margin-top:9px;font-size:13px;font-weight:900;color:var(--muted)}
.audio-setup-status.ok{color:var(--good)}.audio-setup-status.bad{color:var(--bad)}
.audio-setup-track{height:8px;background:#e5edfc;border-radius:999px;overflow:hidden;margin-top:9px}
.audio-setup-fill{height:100%;width:0;background:var(--blue);border-radius:999px;transition:width .15s ease}

@media(max-width:900px){
  #app{align-items:flex-start}
  .screen{width:96vw;min-height:auto}
  .stage{justify-content:flex-start}
  .halves{grid-template-columns:1fr;gap:12px}
  .half{padding:13px 10px 14px;border-radius:22px}
  .picture-card{min-height:210px;padding:18px}
  .picture-card img{height:min(32vh,300px)}
  .sentence-area{min-height:68px;margin-bottom:15px}
}
@media(max-width:520px){
  #app{padding:max(8px,env(safe-area-inset-top)) max(7px,env(safe-area-inset-right)) max(9px,env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left))}
  .intro{padding:36px 18px;border-radius:22px}.intro h1{font-size:clamp(36px,11vw,48px)}
  .progress-wrap{width:98%;margin-bottom:8px}.progress-track{height:10px}
  .halves{gap:9px}.half{border-radius:18px;padding:10px 8px 12px}
  .half-title{margin-bottom:6px;font-size:22px}
  .audio-btn{width:56px;height:56px;margin-bottom:8px}
  .picture-card{min-height:175px;border-radius:15px;padding:12px}.picture-card img{height:190px}
  .sentence-area{font-size:24px;gap:6px;padding:10px 5px 8px;border-bottom-width:4px;min-height:62px}
  .answer-slot{min-width:92px;min-height:43px}
  .word-bank{gap:7px;min-height:58px}.word-tile{padding:10px 14px;font-size:20px;border-radius:11px}
  .built-word{padding:8px 10px;font-size:20px;border-radius:10px}
  .feedback{font-size:16px;min-height:25px}
  .audio-setup{width:98%;padding:12px}.audio-setup-btn{width:100%}
}
@media(max-height:760px) and (min-width:901px){
  #app{align-items:flex-start;padding-top:7px}.screen{min-height:auto}.progress-wrap{margin-bottom:7px}
  .half{padding-top:10px;padding-bottom:10px}.half-title{margin-bottom:4px}
  .audio-btn{width:54px;height:54px;margin-bottom:6px}
  .picture-card{min-height:180px;padding:12px}.picture-card img{height:230px}
  .sentence-area{min-height:58px;margin-bottom:12px;padding-top:8px}.word-tile{padding:9px 15px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}


/* Exercise 03 additions */
.intro-title{font-size:clamp(34px,5vw,58px)!important;line-height:1.13!important}
.intro-title span{display:block}
.intro-title span+span{margin-top:12px}
.dialogue-task{display:flex;flex-direction:column;gap:12px;width:100%;max-width:720px;margin:0 auto}
.dialogue-block{border:2px solid #edf2ff;border-radius:18px;background:#fbfcff;padding:12px 14px}
.dialogue-label{font-size:14px;font-weight:900;color:var(--muted);margin-bottom:5px}
.dialogue-line{
  width:100%;min-height:70px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  border-bottom:5px solid var(--blue);color:var(--blue);font-size:clamp(24px,2.7vw,36px);font-weight:900;padding:10px 8px 9px
}
.dialogue-line.model{border-bottom:0;min-height:58px;background:#f4f7ff;border-radius:14px;padding:10px 12px}
.fixed-word,.fixed-tail,.punct{color:var(--blue);font-weight:900}
.build-zone{display:inline-flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;min-height:46px}
.ellipsis{color:#9aabd1;font-size:.88em;letter-spacing:.08em;padding:0 4px}
.sub-bank{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(8px,1vw,13px);margin-top:11px;min-height:58px}
.sub-bank.locked-bank{opacity:.45}
.mini-note{font-size:13px;font-weight:900;color:var(--muted);min-height:18px;margin-top:5px}
.task-divider{height:2px;background:#edf2ff;border-radius:999px;margin:1px 0}
.round-badge{display:inline-block;margin:0 auto 8px;padding:5px 11px;border-radius:999px;background:#eef4ff;color:var(--blue2);font-size:13px;font-weight:900}
@media(max-width:520px){
  .intro-title{font-size:clamp(30px,9vw,42px)!important}.intro-title span+span{margin-top:8px}
  .dialogue-task{gap:9px}.dialogue-block{padding:9px 8px;border-radius:14px}
  .dialogue-line{min-height:58px;font-size:22px;gap:5px;padding:8px 4px 7px;border-bottom-width:4px}
  .dialogue-line.model{min-height:52px;font-size:21px}
  .build-zone{gap:5px;min-height:40px}.sub-bank{gap:6px;margin-top:8px;min-height:52px}
  .round-badge{margin-bottom:5px}
}
@media(max-height:760px) and (min-width:901px){
  .dialogue-task{gap:8px}.dialogue-block{padding:8px 10px}.dialogue-line{min-height:54px;padding:7px 7px 6px}
  .sub-bank{margin-top:7px;min-height:49px}.mini-note{margin-top:2px}
}
</style>

","mode":"qa_full","item":"eraser","picture":"../assets/0696fb1c1c28e8774c46.png","leftAudio":"word_eraser","answerAudio":"answer_eraser","questionChoices":["it","is","What"],"questionAnswer":["What","is","it"],"answerChoices":["eraser","an","is","It"],"answerAnswer":["It","is","an","eraser"]},{"id":"round4_ruler_full_dialogue","roundLabel":"Round 4 · Make the question and answer","mode":"qa_full","item":"ruler","picture":"../assets/9597431c9c2658dbf9a5.png","leftAudio":"word_ruler","answerAudio":"answer_ruler","questionChoices":["is","What","it"],"questionAnswer":["What","is","it"],"answerChoices":["is","ruler","It","a"],"answerAnswer":["It","is","a","ruler"]},{"id":"round4_pencil_case_full_dialogue","roundLabel":"Round 4 · Make the question and answer","mode":"qa_full","item":"pencil case","picture":"../assets/1509b758488e8eaabd6e.png","leftAudio":"word_pencil_case","answerAudio":"answer_pencil_case","questionChoices":["it","What","is"],"questionAnswer":["What","is","it"],"answerChoices":["pencil case","a","It","is"],"answerAnswer":["It","is","a","pencil case"]},{"id":"round4_backpack_full_dialogue","roundLabel":"Round 4 · Make the question and answer","mode":"qa_full","item":"backpack","picture":"../assets/955c649c033483c22e5f.png","leftAudio":"word_backpack","answerAudio":"answer_backpack","questionChoices":["What","is","it"],"questionAnswer":["What","is","it"],"answerChoices":["It","backpack","is","a"],"answerAnswer":["It","is","a","backpack"]}]}</script>
<script>
(()=>{
'use strict';
const LASIN_MOTIVATION_EXERCISE_ID='exercise-03';
function lasinMotivationBridge(action,payload={}){try{window.parent.postMessage({channel:'LASIN_MOTIVATION_V2',action,payload:Object.assign({exerciseId:LASIN_MOTIVATION_EXERCISE_ID},payload||{})},'*');}catch(e){}}
function lasinMotivationSignal(action,extra={}){const localIndex=roundIndex+1;lasinMotivationBridge(action,Object.assign({questionId:String(localIndex),localIndex},extra||{}));}

const DATA=JSON.parse(document.getElementById('lesson-data').textContent);
lasinMotivationBridge('register-exercise',{id:LASIN_MOTIVATION_EXERCISE_ID,order:3,label:'Exercise 03',scorable:true,totalQuestions:DATA.rounds.length,mode:'scored'});
const screen=document.getElementById('screen');
const ENTRY_DELAY=800, WORD_REPEAT_GAP=500, QA_GAP=800, QA_REPEAT_GAP=500, SIDE_HANDOFF=500, WRONG_CLEAR=900, BRAVO_TIME=2100;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let roundIndex=0, audioToken=0, currentAudio=null, audioCtx=null, timers=new Set();
let currentAudioAbort=null, sleepResolvers=new Map(), hostActive=true, mandatoryPhase='word', mandatoryNeedsTap=false;
let mandatoryDone=false, rightSequenceRunning=false, pendingRoundFinish=false;
let qBuilt=0, aBuilt=0, answerUnlocked=false;

function headphones(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a8 8 0 0 0-8 8v6a3 3 0 0 0 3 3h2v-8H6v-1a6 6 0 0 1 12 0v1h-3v8h2a3 3 0 0 0 3-3v-6a8 8 0 0 0-8-8Z"/></svg>'}
function clearTimers(){for(const id of [...timers]){clearTimeout(id);const r=sleepResolvers.get(id);if(r)r();}timers.clear();sleepResolvers.clear()}
function sleep(ms){return new Promise(res=>{let done=false;const finish=()=>{if(done)return;done=true;timers.delete(id);sleepResolvers.delete(id);res()};const id=setTimeout(finish,ms);timers.add(id);sleepResolvers.set(id,finish)})}
function stopAudio(){audioToken++;if(currentAudioAbort){const abort=currentAudioAbort;currentAudioAbort=null;try{abort()}catch(e){}}clearTimers();if(currentAudio){try{currentAudio.pause();currentAudio.currentTime=0}catch(e){}}currentAudio=null;document.querySelectorAll('.audio-btn').forEach(b=>b.classList.remove('playing'))}
async function unlockAudio(){
  try{
    const a=new Audio('../assets/93bef78ec2fb0694560a.wav');
    a.volume=.001;await a.play();a.pause();
  }catch(e){}
  try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume()}catch(e){}
}
function audioReady(){return Object.keys(DATA.audioFiles).every(k=>String(DATA.audio[k]||'').startsWith('data:audio'))}
function normalizeName(name){
  return String(name||'').split(/[\\/]/).pop().trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/\.+(?=mp3$)/,'.');
}
function progressMarkup(){const current=roundIndex+1,total=DATA.rounds.length,pct=current/total*100;return `<div class="progress-wrap"><div class="progress-meta">${current} / ${total}</div><div class="progress-track" role="progressbar" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${current}"><div class="progress-fill" style="width:${pct}%"></div></div></div>`}
function introMarkup(withSetup){return `<section class="intro"><h1 class="intro-title"><span>${escapeHTML(DATA.titleTop)}</span><span>${escapeHTML(DATA.titleBottom)}</span></h1><button class="start" id="start" ${withSetup?'disabled':''}>Start</button>${withSetup?audioSetupMarkup():''}</section>`}
function renderIntro(){stopAudio();mandatoryDone=false;screen.innerHTML=introMarkup(!audioReady());const start=document.getElementById('start');start.addEventListener('click',async()=>{await unlockAudio();renderRound(0)});if(!audioReady())bindAudioSetup();window.scrollTo({top:0,behavior:'auto'})}
function audioSetupMarkup(){return `<div class="audio-setup" id="audioSetup"><div class="audio-setup-title">Original Audio Setup</div><div class="audio-setup-text">Select the 13 original MP3 files for this complete 24-question Exercise 03 activity. The browser embeds your original files exactly as they are — no re-encoding and no replacement audio.</div><button class="audio-setup-btn" id="embedAudio">Embed the Original MP3s</button><input id="audioFiles" type="file" accept="audio/mpeg,.mp3" multiple hidden><div class="audio-setup-track"><div class="audio-setup-fill" id="audioFill"></div></div><div class="audio-setup-status" id="audioStatus">Waiting for the 13 original MP3 files.</div></div>`}
function bindAudioSetup(){
  const btn=document.getElementById('embedAudio'),input=document.getElementById('audioFiles');
  btn.addEventListener('click',()=>input.click());input.addEventListener('change',()=>embedOriginalAudio([...input.files]));
}
async function embedOriginalAudio(files){
  const status=document.getElementById('audioStatus'),fill=document.getElementById('audioFill'),btn=document.getElementById('embedAudio');
  const expected=Object.entries(DATA.audioFiles), byName=new Map(files.map(f=>[normalizeName(f.name),f]));
  const missing=expected.filter(([,name])=>!byName.has(normalizeName(name))).map(([,name])=>name);
  if(missing.length){status.className='audio-setup-status bad';status.textContent='Missing: '+missing.join(' | ');return}
  btn.disabled=true;status.className='audio-setup-status';status.textContent='Embedding the original MP3s...';
  let done=0;
  for(const [key,name] of expected){const file=byName.get(normalizeName(name));DATA.audio[key]=await readFile(file);done++;fill.style.width=(done/expected.length*100)+'%';status.textContent=`Embedded ${done} / ${expected.length}`}
  if(!audioReady()){status.className='audio-setup-status bad';status.textContent='Audio validation failed. Please select the files again.';btn.disabled=false;return}
  document.getElementById('lesson-data').textContent=JSON.stringify(DATA);
  status.className='audio-setup-status ok';status.textContent='All original MP3s are embedded. Creating the clean student version...';
  document.getElementById('start').disabled=false;
  await sleep(250);exportEmbedded();
}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function exportEmbedded(){
  const clone=document.documentElement.cloneNode(true), dataNode=clone.querySelector('#lesson-data');dataNode.textContent=JSON.stringify(DATA);
  const cloneScreen=clone.querySelector('#screen');cloneScreen.innerHTML=`<section class="intro"><h1 class="intro-title"><span>${escapeHTML(DATA.titleTop)}</span><span>${escapeHTML(DATA.titleBottom)}</span></h1><button class="start" id="start">Start</button></section>`;
  const clean='<!doctype html>\n'+clone.outerHTML,blob=new Blob([clean],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='LASIN_EU1_U01_L01_Grammar_Exercise_03_FULL_EMBEDDED.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)
}
function roundTitle(mode){return mode==='q_partial'?'Then listen and complete the question.':mode==='q_full'?'Then listen and make the question.':mode==='a_partial'?'Then listen and make the answer.':'Then listen and make the question and answer.'}
function renderRound(index){
  stopAudio();roundIndex=index;mandatoryDone=false;mandatoryPhase='word';mandatoryNeedsTap=false;rightSequenceRunning=false;pendingRoundFinish=false;qBuilt=0;aBuilt=0;answerUnlocked=false;
  const r=DATA.rounds[roundIndex];
  screen.innerHTML=`<section class="stage">${progressMarkup()}<div class="halves"><section class="half" id="leftHalf" aria-label="Picture and word listening"><h2 class="half-title">Look and listen.</h2><button class="audio-btn" id="leftAudio" aria-label="Listen again to ${escapeHTML(r.item)}">${headphones()}</button><div class="picture-card"><img src="${r.picture}" alt="${escapeHTML(r.item)}"></div><div class="left-caption" id="leftCaption">Listen carefully.</div></section><section class="half locked" id="rightHalf" aria-label="Question and answer grammar task"><div class="round-badge">${escapeHTML(r.roundLabel)}</div><h2 class="half-title">${roundTitle(r.mode)}</h2><button class="audio-btn" id="rightAudio" aria-label="Listen again to the question and answer" disabled>${headphones()}</button><div class="task-wrap"><div class="listen-note" id="listenNote">Listen to the complete question and answer twice first.</div>${taskMarkup(r)}<div class="feedback" id="feedback" aria-live="polite"></div></div></section></div></section>`;
  bindRound(r);window.scrollTo({top:0,behavior:'auto'});beginMandatoryFlow(r)
}
function questionLine(buildId,fixedWhat=false,model=false){
  if(model)return `<div class="dialogue-line model">What is it?</div>`;
  return `<div class="dialogue-line">${fixedWhat?'<span class="fixed-word">What</span>':''}<span class="build-zone" id="${buildId}"><span class="ellipsis">...</span></span><span class="punct">?</span></div>`
}
function answerLine(buildId,fixedNoun=null,modelText=null){
  if(modelText)return `<div class="dialogue-line model">${escapeHTML(modelText)}</div>`;
  return `<div class="dialogue-line"><span class="build-zone" id="${buildId}"><span class="ellipsis">...</span></span>${fixedNoun?`<span class="fixed-tail">${escapeHTML(fixedNoun)}</span>`:''}<span class="punct">.</span></div>`
}
function bankMarkup(words,kind,locked=false){return `<div class="sub-bank${locked?' locked-bank':''}" data-bank="${kind}">${words.map(w=>`<button class="word-tile" data-kind="${kind}" data-word="${escapeAttr(w)}" disabled>${escapeHTML(w)}</button>`).join('')}</div>`}
function taskMarkup(r){
  if(r.mode==='q_partial')return `<div class="dialogue-task"><div class="dialogue-block"><div class="dialogue-label">Question</div>${questionLine('qBuild',true)}${bankMarkup(r.questionChoices,'q')}</div><div class="dialogue-block"><div class="dialogue-label">Answer</div>${answerLine('',null,r.modelAnswer)}</div></div>`;
  if(r.mode==='q_full')return `<div class="dialogue-task"><div class="dialogue-block"><div class="dialogue-label">Question</div>${questionLine('qBuild')}${bankMarkup(r.questionChoices,'q')}</div><div class="dialogue-block"><div class="dialogue-label">Answer</div>${answerLine('',null,r.modelAnswer)}</div></div>`;
  if(r.mode==='a_partial')return `<div class="dialogue-task"><div class="dialogue-block"><div class="dialogue-label">Question</div>${questionLine('',false,true)}</div><div class="dialogue-block"><div class="dialogue-label">Answer</div>${answerLine('aBuild',r.fixedNoun)}${bankMarkup(r.answerChoices,'a')}</div></div>`;
  return `<div class="dialogue-task"><div class="dialogue-block"><div class="dialogue-label">Question</div>${questionLine('qBuild')}${bankMarkup(r.questionChoices,'q')}<div class="mini-note" id="questionMini">Make the question first.</div></div><div class="task-divider"></div><div class="dialogue-block"><div class="dialogue-label">Answer</div>${answerLine('aBuild')}${bankMarkup(r.answerChoices,'a',true)}<div class="mini-note" id="answerMini">The answer unlocks after the question is complete.</div></div></div>`
}
function bindRound(r){
  document.getElementById('leftAudio').addEventListener('click',()=>handleMandatoryAudioClick(r,'word'));
  document.getElementById('rightAudio').addEventListener('click',()=>handleMandatoryAudioClick(r,'conversation'));
  document.querySelectorAll('.word-tile').forEach(b=>b.addEventListener('click',()=>chooseTile(b,r)));
}
function lockAllChoices(){document.querySelectorAll('.word-tile').forEach(b=>b.disabled=true)}
function enterMandatoryFailure(phase,r){
  mandatoryDone=false;mandatoryPhase=phase;mandatoryNeedsTap=true;rightSequenceRunning=false;lockAllChoices();
  const leftBtn=document.getElementById('leftAudio'),rightBtn=document.getElementById('rightAudio');
  if(leftBtn){leftBtn.disabled=phase!=='word';leftBtn.classList.toggle('ready',phase==='word');}
  if(rightBtn){rightBtn.disabled=phase!=='conversation';rightBtn.classList.toggle('ready',phase==='conversation');}
  const note=document.getElementById('listenNote');if(note)note.textContent=phase==='word'?'Tap the left headset and listen to the word twice to continue.':'Tap the right headset and listen to the complete question and answer twice to unlock the task.';
}
async function runMandatoryFlow(r,startPhase='word',includeEntry=true){
  stopAudio();const token=++audioToken;mandatoryDone=false;mandatoryNeedsTap=false;lockAllChoices();
  const leftBtn=document.getElementById('leftAudio'),rightBtn=document.getElementById('rightAudio');if(!leftBtn||!rightBtn)return;
  leftBtn.classList.remove('ready');rightBtn.classList.remove('ready');leftBtn.disabled=true;rightBtn.disabled=true;
  if(startPhase==='word'){
    mandatoryPhase='word';if(includeEntry){await sleep(ENTRY_DELAY);if(token!==audioToken)return;}
    const wordOK=await playWordTwice(DATA.audio[r.leftAudio],leftBtn,token);if(token!==audioToken)return;
    if(!wordOK){enterMandatoryFailure('word',r);return;}
    const caption=document.getElementById('leftCaption');if(caption)caption.textContent='You can listen again after the model conversation.';
    mandatoryPhase='conversation';await sleep(SIDE_HANDOFF);if(token!==audioToken)return;
  }else mandatoryPhase='conversation';
  const rightHalf=document.getElementById('rightHalf');if(rightHalf){rightHalf.classList.remove('locked');rightHalf.classList.add('open');if(innerWidth<=900)rightHalf.scrollIntoView({behavior:reducedMotion?'auto':'smooth',block:'start'});}
  rightSequenceRunning=true;const conversationOK=await playConversation(DATA.audio.question_what_is_it,DATA.audio[r.answerAudio],rightBtn,token);if(token!==audioToken)return;rightSequenceRunning=false;
  if(!conversationOK){enterMandatoryFailure('conversation',r);return;}
  mandatoryDone=true;mandatoryPhase='done';mandatoryNeedsTap=false;leftBtn.disabled=false;leftBtn.classList.add('ready');rightBtn.disabled=false;rightBtn.classList.add('ready');unlockInitialChoices(r);
  const note=document.getElementById('listenNote');if(note)note.textContent=r.mode==='q_partial'?'Now complete the question.':r.mode==='q_full'?'Now make the whole question.':r.mode==='a_partial'?'Now make the answer.':'Now make the question first, then the answer.';
  lasinMotivationSignal('question-ready');
}
async function beginMandatoryFlow(r){return runMandatoryFlow(r,'word',true)}
function unlockInitialChoices(r){if(r.mode==='qa_full'){document.querySelectorAll('[data-bank="q"] .word-tile').forEach(b=>b.disabled=false);return}document.querySelectorAll('.word-tile').forEach(b=>b.disabled=false)}
async function playClip(src,btn,token){
  if(!src||token!==audioToken)return false;
  return new Promise(resolve=>{const a=new Audio(src);currentAudio=a;a.preload='auto';a.setAttribute('playsinline','');a.setAttribute('webkit-playsinline','');if(btn)btn.classList.add('playing');let done=false;
    const finish=ok=>{if(done)return;done=true;if(currentAudioAbort===abort)currentAudioAbort=null;if(btn)btn.classList.remove('playing');if(currentAudio===a)currentAudio=null;resolve(!!ok)};
    const abort=()=>finish(false);currentAudioAbort=abort;
    a.addEventListener('ended',()=>finish(token===audioToken),{once:true});a.addEventListener('error',()=>finish(false),{once:true});let p;try{p=a.play()}catch(e){finish(false);return}if(p&&p.catch)p.catch(()=>finish(false));
  })
}
async function playWordTwice(src,btn,token){
  const first=await playClip(src,btn,token);if(!first||token!==audioToken)return false;await sleep(WORD_REPEAT_GAP);if(token!==audioToken)return false;const second=await playClip(src,btn,token);return !!second&&token===audioToken;
}
async function playConversation(qSrc,aSrc,btn,token){
  for(let i=0;i<2;i++){
    if(token!==audioToken)return false;if(!await playClip(qSrc,btn,token))return false;if(token!==audioToken)return false;await sleep(QA_GAP);if(token!==audioToken)return false;if(!await playClip(aSrc,btn,token))return false;if(token!==audioToken)return false;if(i===0){await sleep(QA_REPEAT_GAP);if(token!==audioToken)return false;}
  }return true;
}
async function handleMandatoryAudioClick(r,phase){
  if(!mandatoryDone){if(!mandatoryNeedsTap||mandatoryPhase!==phase)return;await runMandatoryFlow(r,phase,false);return;}
  if(phase==='word')await manualReplayWord(r.leftAudio,'leftAudio');else await manualReplayConversation(r.answerAudio,'rightAudio');
}
async function manualReplayWord(key,btnId){if(!mandatoryDone)return;stopAudio();const token=++audioToken,btn=document.getElementById(btnId);await playWordTwice(DATA.audio[key],btn,token);if(token===audioToken&&pendingRoundFinish)maybeFinishRound()}
async function manualReplayConversation(answerKey,btnId){if(!mandatoryDone)return;stopAudio();const token=++audioToken,btn=document.getElementById(btnId);await playConversation(DATA.audio.question_what_is_it,DATA.audio[answerKey],btn,token);if(token===audioToken&&pendingRoundFinish)maybeFinishRound()}
function suspendForHost(){const incomplete=!mandatoryDone&&!!DATA.rounds[roundIndex]&&document.querySelector('.stage');const phase=mandatoryPhase==='done'?'conversation':mandatoryPhase;stopAudio();if(incomplete)enterMandatoryFailure(phase==='word'?'word':'conversation',DATA.rounds[roundIndex])}
window.addEventListener('message',e=>{const d=e.data;if(!d||d.channel!=='LASIN_HOST_V1'||d.action!=='active-state')return;hostActive=!!(d.payload&&d.payload.active);if(!hostActive)suspendForHost()});

function setFeedback(text,bad=false){const f=document.getElementById('feedback');if(!f)return;f.textContent=text;f.className='feedback'+(bad?' bad':'')}
function wrongTile(btn){lasinMotivationSignal('question-mistake');btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('is-wrong','shake');setFeedback('Try again!',true);const id=setTimeout(()=>{timers.delete(id);btn.classList.remove('is-wrong','shake');setFeedback('')},WRONG_CLEAR);timers.add(id)}
async function chooseTile(btn,r){
  if(!mandatoryDone||btn.disabled)return;const kind=btn.dataset.kind,word=btn.dataset.word;
  if(kind==='q'){
    const expected=r.questionAnswer[qBuilt];if(word!==expected){wrongTile(btn);return}
    const isFinal=qBuilt===r.questionAnswer.length-1;
    if(isFinal&&r.mode!=='qa_full')lasinMotivationSignal('question-completed');
    await moveTile(btn,'qBuild',word);qBuilt++;
    if(qBuilt===r.questionAnswer.length){
      document.querySelectorAll('[data-bank="q"] .word-tile').forEach(b=>b.disabled=true);
      if(r.mode==='qa_full'){
        answerUnlocked=true;document.querySelector('[data-bank="a"]').classList.remove('locked-bank');document.querySelectorAll('[data-bank="a"] .word-tile').forEach(b=>b.disabled=false);
        const qm=document.getElementById('questionMini');if(qm)qm.textContent='Great! Now make the answer.';const am=document.getElementById('answerMini');if(am)am.textContent='Now make the complete answer.';
      }else{setFeedback('Great job!');finishRoundWhenSafe()}
    }
  }else{
    if(r.mode==='qa_full'&&!answerUnlocked)return;const expected=r.answerAnswer[aBuilt];if(word!==expected){wrongTile(btn);return}
    const isFinal=aBuilt===r.answerAnswer.length-1;if(isFinal)lasinMotivationSignal('question-completed');
    await moveTile(btn,'aBuild',word);aBuilt++;
    if(aBuilt===r.answerAnswer.length){document.querySelectorAll('[data-bank="a"] .word-tile').forEach(b=>b.disabled=true);setFeedback('Great job!');finishRoundWhenSafe()}
  }
}

async function moveTile(btn,targetId,word){const target=document.getElementById(targetId);await flyInto(btn,target,word);btn.classList.add('moved');btn.disabled=true;const ell=target.querySelector('.ellipsis');if(ell)ell.remove();const node=document.createElement('span');node.className='built-word';node.textContent=word;target.appendChild(node)}
function flyInto(btn,target,text){return new Promise(resolve=>{if(reducedMotion){resolve();return}const a=btn.getBoundingClientRect(),b=target.getBoundingClientRect(),clone=btn.cloneNode(true);clone.className='word-tile fly-tile';clone.disabled=true;clone.textContent=text;clone.style.left=a.left+'px';clone.style.top=a.top+'px';clone.style.width=a.width+'px';clone.style.height=a.height+'px';document.body.appendChild(clone);const dx=(b.left+b.width/2)-(a.left+a.width/2),dy=(b.top+b.height/2)-(a.top+a.height/2);requestAnimationFrame(()=>{clone.style.transform=`translate(${dx}px,${dy}px) scale(.82)`;clone.style.opacity='.12'});setTimeout(()=>{clone.remove();resolve()},340)})}
function finishRoundWhenSafe(){pendingRoundFinish=true;maybeFinishRound()}
function maybeFinishRound(){if(!pendingRoundFinish)return;if(currentAudio&&!currentAudio.paused)return;pendingRoundFinish=false;const id=setTimeout(()=>{timers.delete(id);showBravo()},350);timers.add(id)}
function successChime(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const now=audioCtx.currentTime,freqs=[523.25,659.25,783.99,1046.50];freqs.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.11);g.gain.exponentialRampToValueAtTime(.13,now+i*.11+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*.11+.24);o.connect(g).connect(audioCtx.destination);o.start(now+i*.11);o.stop(now+i*.11+.26)})}catch(e){}}
function showBravo(){successChime();const layer=document.createElement('div');layer.className='celebration';layer.innerHTML='<div class="celebration-core"><div class="celebration-title">BRAVO!</div><div class="celebration-sub">Excellent work!</div></div>';for(let i=0;i<30;i++){const s=document.createElement('div');s.className='star';s.textContent='★';s.style.left=(46+Math.random()*8)+'%';s.style.top=(42+Math.random()*12)+'%';s.style.setProperty('--dx',((Math.random()-.5)*1100)+'px');s.style.setProperty('--dy',((Math.random()-.5)*760)+'px');s.style.setProperty('--rot',((Math.random()-.5)*680)+'deg');s.style.animationDelay=(Math.random()*.16)+'s';layer.appendChild(s)}document.body.appendChild(layer);const id=setTimeout(()=>{timers.delete(id);layer.remove();lasinMotivationSignal('question-settled');if(roundIndex+1<DATA.rounds.length)renderRound(roundIndex+1);else renderComplete()},BRAVO_TIME);timers.add(id)}
function renderComplete(){stopAudio();screen.innerHTML=`<section class="complete"><h2>Great job!</h2><p>You finished all ${DATA.rounds.length} questions.</p><button class="restart" id="restart">Play again</button></section>`;document.getElementById('restart').addEventListener('click',renderIntro);window.scrollTo({top:0,behavior:'auto'})}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(v){return escapeHTML(v)}
document.addEventListener('pointerdown',unlockAudio,{once:false,passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden){hostActive=false;suspendForHost()}});window.addEventListener('pagehide',stopAudio);renderIntro();
})();
</script>
