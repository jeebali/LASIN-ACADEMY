<style>

.progress-track{height:12px;border-radius:999px;background:#eaf0ff;border:1px solid #d7e2fb;overflow:hidden}

.audio-btn{

.audio-btn:disabled{opacity:.32;cursor:not-allowed;box-shadow:none}
.audio-btn.ready{animation:pulse 1.05s ease-in-out infinite alternate}
.audio-btn.playing{animation:pulse .7s ease-in-out infinite alternate}

@media(max-height:760px) and (min-width:901px){
  #app{align-items:flex-start;padding-top:7px}.screen{min-height:auto}.progress-wrap{margin-bottom:7px}

  .sentence-area{min-height:58px;margin-bottom:12px;padding-top:8px}.word-tile{padding:9px 15px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>

<script>
(() => {
'use strict';
const LASIN_MOTIVATION_EXERCISE_ID='exercise-02';
function lasinMotivationBridge(action,payload={}){try{window.parent.postMessage({channel:'LASIN_MOTIVATION_V2',action,payload:Object.assign({exerciseId:LASIN_MOTIVATION_EXERCISE_ID},payload||{})},'*');}catch(e){}}
function lasinMotivationSignal(action,extra={}){const localIndex=roundIndex+1;lasinMotivationBridge(action,Object.assign({questionId:String(localIndex),localIndex},extra||{}));}

const DATA = JSON.parse(document.getElementById('lesson-data').textContent);
lasinMotivationBridge('register-exercise',{id:LASIN_MOTIVATION_EXERCISE_ID,order:2,label:'Exercise 02',scorable:true,totalQuestions:DATA.rounds.length,mode:'scored'});
const screen = document.getElementById('screen');
const ENTRY_DELAY = 800;
const REPEAT_GAP = 500;
const SIDE_HANDOFF = 500;
const WRONG_CLEAR = 900;
const BRAVO_TIME = 2100;
let roundIndex = 0;
let audioToken = 0;
let currentAudio = new Audio();
currentAudio.preload = 'auto';
currentAudio.setAttribute('playsinline','');
currentAudio.setAttribute('webkit-playsinline','');
let timers = new Set();
let stage = 'intro';
let mandatoryRightDone = false;
let mandatoryPhase = 'left';
let mandatoryNeedsTap = false;
let hostActive = true;

let rightSequenceRunning = false;
let pendingRoundFinish = false;

let audioCtx = null;

  const id=setTimeout(finish,ms);timers.add(id);sleepResolvers.set(id,finish);
});
function clearTimers(){ for(const id of [...timers]){ clearTimeout(id); const r=sleepResolvers.get(id); if(r)r(); } timers.clear(); sleepResolvers.clear(); }
function headphones(){ return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a8 8 0 0 0-8 8v6a3 3 0 0 0 3 3h2v-8H6v-1a6 6 0 0 1 12 0v1h-3v8h2a3 3 0 0 0 3-3v-6a8 8 0 0 0-8-8z"/></svg>'; }
function audioReady(){ return Object.values(DATA.audio).every(v => typeof v === 'string' && v.startsWith('data:audio')); }
function persistData(){ document.getElementById('lesson-data').textContent = JSON.stringify(DATA).replace(/<\//g,'<\\/'); }
function stopAudio(){
  audioToken++;
  if(currentAudioAbort){const abort=currentAudioAbort;currentAudioAbort=null;try{abort();}catch(e){}}

async function unlockAudio(){

async function playClip(src, btn, token){
  if(!src || token !== audioToken) return false;

  if(btn) btn.classList.add('playing');
  return await new Promise(resolve => {
    let done = false;
    const finish = ok => {

async function playTwice(src, btn, token){

}
function bindSetup(){
  const btn=document.getElementById('embedAudio'), input=document.getElementById('audioFiles');
  if(!btn||!input) return;
  btn.addEventListener('click',()=>input.click());
  input.addEventListener('change',()=>embedFiles([...input.files]));
}
async function embedFiles(files){
  const status=document.getElementById('audioStatus'), fill=document.getElementById('audioFill');
  const byName=new Map(files.map(f=>[normalizeName(f.name),f]));
  const expected=Object.entries(DATA.audioFiles);
  const missing=expected.filter(([,name])=>!byName.has(normalizeName(name)));
  if(missing.length){
    status.className='audio-setup-status bad'; status.textContent='Missing: '+missing.map(x=>x[1]).join(', '); fill.style.width='0%'; return;
  }
  let done=0;
  for(const [key,name] of expected){
    const f=byName.get(normalizeName(name));
    DATA.audio[key]=await readDataURL(f); done++; fill.style.width=((done/expected.length)*100)+'%';
  }
  if(!audioReady()){
    status.className='audio-setup-status bad'; status.textContent='Audio validation failed. Please select the files again.'; return;
  }
  persistData();
  status.className='audio-setup-status ok'; status.textContent='Original MP3s embedded successfully. The full activity is ready.';
  const start=document.getElementById('startBtn'); start.disabled=false;
  await sleep(180);
  exportCleanLesson();
}
function readDataURL(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); }); }
function exportCleanLesson(){
  const clone=document.documentElement.cloneNode(true);
  const setup=clone.querySelector('#audioSetup'); if(setup) setup.remove();
  const start=clone.querySelector('#startBtn'); if(start) start.removeAttribute('disabled');
  const clean='<!doctype html>\n'+clone.outerHTML;
  const blob=new Blob([clean],{type:'text/html;charset=utf-8'}), url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='LASIN_EU1_U01_L01_Grammar_FULL_EMBEDDED.html'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function renderRound(index){
  stopAudio(); roundIndex=index; stage='left'; mandatoryRightDone=false; mandatoryPhase='left'; mandatoryNeedsTap=false; pendingRoundFinish=false;
  const r=DATA.rounds[roundIndex];
  const rightTitle=r.mode==='complete'?'Then listen and choose.':'Then listen and make the sentence.';
  screen.innerHTML=`<section class="stage">${progressMarkup()}<div class="halves">
    <section class="half" id="leftHalf" aria-label="Picture and word listening">
      <h2 class="half-title">Look and listen.</h2>
      <button class="audio-btn" id="leftAudio" aria-label="Listen again to ${escapeHTML(r.item)}">${headphones()}</button>
      <div class="picture-card"><img src="${r.picture}" alt="${escapeHTML(r.item)}"></div>
      <div class="left-caption" id="leftCaption">Listen carefully.</div>
    </section>
    <section class="half locked" id="rightHalf" aria-label="Grammar listening task">
      <h2 class="half-title">${rightTitle}</h2>
      <button class="audio-btn" id="rightAudio" aria-label="Listen again to the sentence" disabled>${headphones()}</button>
      <div class="task-wrap" id="taskWrap">${taskMarkup(r)}</div>
    </section>
  </div></section>`;
  bindRound(r);
  window.scrollTo({top:0,behavior:'auto'});
  beginMandatoryFlow(r);
}
function taskMarkup(r){
  if(r.mode==='complete'){
    return `<div class="listen-note" id="listenNote">Listen to the whole sentence twice first.</div>
      <div class="sentence-area" id="sentenceArea" aria-label="Incomplete sentence"><span>${escapeHTML(r.stem)}</span><span class="answer-slot" id="answerSlot">...</span><span class="period">.</span></div>
      <div class="word-bank" id="wordBank">${r.choices.map(w=>`<button class="word-tile" data-word="${escapeAttr(w)}" disabled>${escapeHTML(w)}</button>`).join('')}</div>
      <div class="feedback" id="feedback" aria-live="polite"></div>`;
  }
  return `<div class="listen-note" id="listenNote">Listen to the whole sentence twice first.</div>
    <div class="sentence-area" id="sentenceArea" aria-label="Build the sentence"><span class="answer-slot" id="buildTarget">...</span></div>
    <div class="word-bank" id="wordBank">${r.chunks.map(w=>`<button class="word-tile" data-word="${escapeAttr(w)}" disabled>${escapeHTML(w)}</button>`).join('')}</div>
    <div class="feedback" id="feedback" aria-live="polite"></div>`;
}
function bindRound(r){
  document.getElementById('leftAudio').addEventListener('click',()=>handleMandatoryAudioClick(r,'left'));
  document.getElementById('rightAudio').addEventListener('click',()=>handleMandatoryAudioClick(r,'right'));
  if(r.mode==='complete') document.querySelectorAll('.word-tile').forEach(b=>b.addEventListener('click',()=>chooseComplete(b,r)));
  else document.querySelectorAll('.word-tile').forEach(b=>b.addEventListener('click',()=>chooseChunk(b,r)));
}
function lockChoices(){ document.querySelectorAll('.word-tile').forEach(b=>b.disabled=true); }
function enterMandatoryFailure(phase,r){
  mandatoryRightDone=false;mandatoryPhase=phase;mandatoryNeedsTap=true;rightSequenceRunning=false;lockChoices();
  const leftBtn=document.getElementById('leftAudio'),rightBtn=document.getElementById('rightAudio');
  if(leftBtn){leftBtn.disabled=phase!=='left';leftBtn.classList.toggle('ready',phase==='left');}
  if(rightBtn){rightBtn.disabled=phase!=='right';rightBtn.classList.toggle('ready',phase==='right');}
  const note=document.getElementById('listenNote');if(note)note.textContent=phase==='left'?'Tap the left headset and listen to the word twice to continue.':'Tap the right headset and listen to the whole sentence twice to unlock the answers.';
}
async function runMandatoryFlow(r,startPhase='left',includeEntry=true){
  stopAudio();const token=++audioToken;mandatoryNeedsTap=false;mandatoryRightDone=false;lockChoices();
  const leftBtn=document.getElementById('leftAudio'),rightBtn=document.getElementById('rightAudio');if(!leftBtn||!rightBtn)return;
  leftBtn.classList.remove('ready');rightBtn.classList.remove('ready');leftBtn.disabled=true;rightBtn.disabled=true;
  if(startPhase==='left'){
    mandatoryPhase='left';
    if(includeEntry){await sleep(ENTRY_DELAY);if(token!==audioToken)return;}
    const leftOK=await playTwice(DATA.audio[r.leftAudio],leftBtn,token);if(token!==audioToken)return;
    if(!leftOK){enterMandatoryFailure('left',r);return;}
    const caption=document.getElementById('leftCaption');if(caption)caption.textContent='You can listen again anytime.';
    mandatoryPhase='right';
    await sleep(SIDE_HANDOFF);if(token!==audioToken)return;
  }else mandatoryPhase='right';
  const rightHalf=document.getElementById('rightHalf');if(rightHalf){rightHalf.classList.remove('locked');rightHalf.classList.add('open');if(innerWidth<=900)rightHalf.scrollIntoView({behavior:reducedMotion?'auto':'smooth',block:'start'});}
  rightSequenceRunning=true;
  const rightOK=await playTwice(DATA.audio[r.rightAudio],rightBtn,token);if(token!==audioToken)return;
  rightSequenceRunning=false;
  if(!rightOK){enterMandatoryFailure('right',r);return;}
  mandatoryRightDone=true;mandatoryPhase='done';mandatoryNeedsTap=false;stage='answer';
  leftBtn.disabled=false;leftBtn.classList.add('ready');rightBtn.disabled=false;rightBtn.classList.add('ready');
  unlockChoices();
  const note=document.getElementById('listenNote');if(note)note.textContent=r.mode==='complete'?'Now choose the correct word.':'Now make the sentence in the correct order.';
  lasinMotivationSignal('question-ready');
}
async function beginMandatoryFlow(r){ return runMandatoryFlow(r,'left',true); }
function unlockChoices(){ document.querySelectorAll('.word-tile').forEach(b=>b.disabled=false); }
async function handleMandatoryAudioClick(r,side){
  if(!mandatoryRightDone){
    if(!mandatoryNeedsTap||mandatoryPhase!==side)return;
    await runMandatoryFlow(r,side,false);return;
  }
  await manualReplay(side==='left'?r.leftAudio:r.rightAudio,side==='left'?'leftAudio':'rightAudio');
}
async function manualReplay(audioKey,btnId){
  if(!mandatoryRightDone)return;
  stopAudio();const token=++audioToken,btn=document.getElementById(btnId);if(!btn)return;
  await playTwice(DATA.audio[audioKey],btn,token);
  if(token===audioToken&&pendingRoundFinish)maybeFinishRound();
}
function suspendForHost(){
  const incomplete=!mandatoryRightDone&&stage!=='intro'&&stage!=='complete';
  const phase=mandatoryPhase==='done'?'right':mandatoryPhase;
  stopAudio();
  if(incomplete)enterMandatoryFailure(phase==='left'?'left':'right',DATA.rounds[roundIndex]);
}
window.addEventListener('message',e=>{const d=e.data;if(!d||d.channel!=='LASIN_HOST_V1'||d.action!=='active-state')return;hostActive=!!(d.payload&&d.payload.active);if(!hostActive)suspendForHost();});

function setFeedback(text,bad=false){ const f=document.getElementById('feedback'); if(!f) return; f.textContent=text; f.className='feedback'+(bad?' bad':''); }
function wrongTile(btn){
  lasinMotivationSignal('question-mistake');
  btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('is-wrong','shake'); setFeedback('Try again!',true);
  const id=setTimeout(()=>{ timers.delete(id); btn.classList.remove('is-wrong','shake'); setFeedback(''); },WRONG_CLEAR); timers.add(id);
}
async function chooseComplete(btn,r){
  if(!mandatoryRightDone || btn.disabled) return;
  const word=btn.dataset.word;
  if(word!==r.correct){ wrongTile(btn); return; }
  document.querySelectorAll('.word-tile').forEach(b=>b.disabled=true);
  lasinMotivationSignal('question-completed');
  const slot=document.getElementById('answerSlot');
  await flyInto(btn,slot,word);
  slot.className='built-word'; slot.textContent=word;
  btn.classList.add('moved'); setFeedback('Great job!');
  finishRoundWhenSafe();
}
let builtCount=0;
async function chooseChunk(btn,r){
  if(!mandatoryRightDone || btn.disabled) return;
  const word=btn.dataset.word, expected=r.answerChunks[builtCount];
  if(word!==expected){ wrongTile(btn); return; }
  const isFinal=builtCount===r.answerChunks.length-1;if(isFinal)lasinMotivationSignal('question-completed');
  const target=document.getElementById('sentenceArea');
  await flyInto(btn,target,word);
  btn.classList.add('moved'); btn.disabled=true;
  const placeholder=document.getElementById('buildTarget'); if(placeholder) placeholder.remove();
  const node=document.createElement('span'); node.className='built-word'; node.textContent=word; target.appendChild(node);
  builtCount++;
  if(builtCount===r.answerChunks.length){
    const period=document.createElement('span'); period.className='period'; period.textContent='.'; target.appendChild(period);
    document.querySelectorAll('.word-tile').forEach(b=>b.disabled=true);
    setFeedback('Great job!'); finishRoundWhenSafe();
  }
}
function flyInto(btn,target,text){
  return new Promise(resolve=>{
    if(reducedMotion){ resolve(); return; }
    const a=btn.getBoundingClientRect(), b=target.getBoundingClientRect();
    const clone=btn.cloneNode(true); clone.className='word-tile fly-tile'; clone.disabled=true; clone.textContent=text;
    clone.style.left=a.left+'px'; clone.style.top=a.top+'px'; clone.style.width=a.width+'px'; clone.style.height=a.height+'px';
    document.body.appendChild(clone);
    const dx=(b.left+b.width/2)-(a.left+a.width/2), dy=(b.top+b.height/2)-(a.top+a.height/2);
    requestAnimationFrame(()=>{ clone.style.transform=`translate(${dx}px,${dy}px) scale(.82)`; clone.style.opacity='.12'; });
    setTimeout(()=>{ clone.remove(); resolve(); },340);
  });
}
function finishRoundWhenSafe(){ pendingRoundFinish=true; maybeFinishRound(); }
function maybeFinishRound(){
  if(!pendingRoundFinish) return;
  if(currentAudio && !currentAudio.paused) return;
  pendingRoundFinish=false;
  const id=setTimeout(()=>{ timers.delete(id); showBravo(); },350); timers.add(id);
}
function successChime(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const now=audioCtx.currentTime, freqs=[523.25,659.25,783.99,1046.50];
    freqs.forEach((f,i)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,now+i*.11); g.gain.exponentialRampToValueAtTime(.13,now+i*.11+.02); g.gain.exponentialRampToValueAtTime(.0001,now+i*.11+.24); o.connect(g).connect(audioCtx.destination); o.start(now+i*.11); o.stop(now+i*.11+.26); });
  }catch(e){}
}
function showBravo(){
  stage='bravo'; successChime();
  const layer=document.createElement('div'); layer.className='celebration'; layer.innerHTML='<div class="celebration-core"><div class="celebration-title">BRAVO!</div><div class="celebration-sub">Excellent work!</div></div>';
  for(let i=0;i<30;i++){
    const s=document.createElement('div'); s.className='star'; s.textContent='★'; s.style.left=(46+Math.random()*8)+'%'; s.style.top=(42+Math.random()*12)+'%';
    s.style.setProperty('--dx',((Math.random()-.5)*1100)+'px'); s.style.setProperty('--dy',((Math.random()-.5)*760)+'px'); s.style.setProperty('--rot',((Math.random()-.5)*680)+'deg'); s.style.animationDelay=(Math.random()*.16)+'s'; layer.appendChild(s);
  }
  document.body.appendChild(layer);
  const id=setTimeout(()=>{ timers.delete(id); layer.remove(); lasinMotivationSignal('question-settled'); if(roundIndex+1<DATA.rounds.length){ builtCount=0; renderRound(roundIndex+1); }else renderComplete(); },BRAVO_TIME); timers.add(id);
}
function renderComplete(){
  stopAudio(); stage='complete';
  screen.innerHTML=`<section class="complete"><h2>Great job!</h2><p>You finished all ${DATA.rounds.length} questions.</p><button class="restart" id="restart">Play again</button></section>`;
  document.getElementById('restart').addEventListener('click',()=>{ builtCount=0; renderIntro(); });
  window.scrollTo({top:0,behavior:'auto'});
}
function escapeHTML(v){ return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(v){ return escapeHTML(v); }
document.addEventListener('pointerdown',unlockAudio,{once:false,passive:true});
document.addEventListener('visibilitychange',()=>{ if(document.hidden){hostActive=false;suspendForHost();} });
window.addEventListener('pagehide',stopAudio);
renderIntro();
})();
</script>

</body></html>
