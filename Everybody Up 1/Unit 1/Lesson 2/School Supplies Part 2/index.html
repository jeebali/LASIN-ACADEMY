function calculateTypingAllowanceSeconds(meta={}){if(!isTypingMode(meta.responseMode||meta.inputMode))return 0;if(meta.typingAllowanceOverrideSeconds!=null&&Number.isFinite(Number(meta.typingAllowanceOverrideSeconds)))return Math.min(Math.max(0,Number(meta.typingAllowanceOverrideSeconds)),CONFIG.typingFairness.maxAllowanceSeconds);const m=typingMetrics(meta.expectedAnswer);if(!m.normalized)return 0;let charSec=0;for(const b of CONFIG.typingFairness.characterBands){if(m.characters<=Number(b.maxCharacters)){charSec=Math.max(0,Number(b.allowanceSeconds)||0);break}}const wordSec=Math.max(0,m.words-1)*CONFIG.typingFairness.extraWordSeconds;return Math.min(CONFIG.typingFairness.maxAllowanceSeconds,charSec+wordSec)}
function pointsForEffectiveSeconds(seconds){const safe=Math.max(0,Number(seconds)||0);if(CONFIG.hardDeadline&&safe>CONFIG.timerSeconds)return 0;const b=CONFIG.pointsBands.find(x=>safe<=Number(x.maxSeconds));return b?Math.max(0,Number(b.points)||0):1}
function questionCompleted(p){const q=resolveQuestion(p);if(!state.started||state.finished||!q)return{accepted:false};if(q.completed)return{accepted:false,reason:'already-completed'};if(p&&p.hadMistake===true)q.hadMistake=true;if(p&&p.matchedExpectedAnswer!=null)q.matchedExpectedAnswer=p.matchedExpectedAnswer;const elapsedMs=effectiveElapsedMs(q);pauseQuestion(q);const raw=Math.max(0,elapsedMs/1000),answer=q.matchedExpectedAnswer!=null?q.matchedExpectedAnswer:q.expectedAnswer,allowance=calculateTypingAllowanceSeconds({responseMode:q.responseMode,expectedAnswer:answer,typingAllowanceOverrideSeconds:q.typingAllowanceOverrideSeconds}),effective=Math.max(0,raw-allowance),clean=!q.hadMistake,earned=clean?pointsForEffectiveSeconds(effective):0;q.completed=true;q.elapsedMs=elapsedMs;q.rawElapsedSeconds=raw;q.typingAllowanceSeconds=allowance;q.effectiveElapsedSeconds=effective;q.classification=clean?'correct':'wrong';q.pointsEarned=earned;state.points+=earned;if(clean)state.correct++;else state.wrong++;if(clean&&earned>0)showPoints(earned);persist();updateHUD(true);finishIfComplete();return{accepted:true,result:serializeQuestion(q)}}
function serializeQuestion(q){return{questionKey:q.key,exerciseId:q.exerciseId,questionId:q.questionId,localIndex:q.localIndex,globalIndex:globalIndex(q.exerciseId,q.localIndex),ready:q.ready,hadMistake:q.hadMistake,completed:q.completed,classification:q.classification,pointsEarned:q.pointsEarned,rawElapsedSeconds:q.completed?q.rawElapsedSeconds:effectiveElapsedMs(q)/1000,typingAllowanceSeconds:q.typingAllowanceSeconds,effectiveElapsedSeconds:q.effectiveElapsedSeconds,responseMode:q.responseMode,expectedAnswer:q.expectedAnswer}}
function completedCount(){let n=0;for(const q of state.questions.values())if(q.completed)n++;return n}
function runTimer(){cancelAnimationFrame(state.timerRAF);const tick=()=>{const q=activeQuestion();if(!state.started||state.finished||!q||q.completed||q.runningSince==null){state.timerRAF=0;updateHUD();return}const elapsed=effectiveElapsedMs(q)/1000,remaining=Math.max(0,CONFIG.timerSeconds-elapsed);timerEl.textContent=`${Math.ceil(remaining)}s`;timerFillEl.style.width=`${Math.max(0,Math.min(1,remaining/CONFIG.timerSeconds))*100}%`;state.timerRAF=requestAnimationFrame(tick)};tick()}
function updateHUD(bump=false){studentEl.textContent=state.studentName||'—';pointsEl.textContent=String(state.points);if(bump){pointsEl.classList.remove('lasin-bump');void pointsEl.offsetWidth;pointsEl.classList.add('lasin-bump');setTimeout(()=>pointsEl.classList.remove('lasin-bump'),220)}const ex=planMap.get(state.activeExerciseId),q=activeQuestion(),done=completedCount();if(!state.started){modeLabelEl.textContent='Preview';progressEl.textContent=`0 / ${TOTAL}`;timerEl.textContent='—';timerFillEl.style.width='100%';return}if(!ex||!ex.scorable){modeLabelEl.textContent='Preview';progressEl.textContent=`${done} / ${TOTAL}`;timerEl.textContent='PREVIEW';timerFillEl.style.width='100%';return}if(q&&!q.completed){modeLabelEl.textContent=`${ex.label} • Q${globalIndex(q.exerciseId,q.localIndex)}`;progressEl.textContent=`${done} / ${TOTAL}`;if(q.runningSince==null){timerEl.textContent=q.ready?'PAUSED':'LISTEN';timerFillEl.style.width='100%'}return}modeLabelEl.textContent=ex.label;progressEl.textContent=`${done} / ${TOTAL}`;timerEl.textContent='LISTEN';timerFillEl.style.width='100%'}
function showPoints(points){const pop=document.createElement('div');pop.className='lasin-points-pop';pop.innerHTML=`<span class="lasin-points-main">+${points}</span><span class="lasin-points-sub">POINT${points===1?'':'S'} ⭐</span>`;document.body.appendChild(pop);pop.addEventListener('animationend',()=>pop.remove(),{once:true});setTimeout(()=>pop.remove(),1600)}
function ratingForAccuracy(a){if(a>=90)return'EXCELLENT';if(a>=70)return'VERY GOOD';if(a>=50)return'GOOD';return'NOT SO GOOD'}
function finishIfComplete(){if(completedCount()===TOTAL)finish()}
function finish(){if(state.finished||completedCount()!==TOTAL)return false;state.finished=true;pauseActive();const accuracy=Math.round((state.correct/TOTAL)*100);$('lasin-motivation-results-title').textContent=`Great work, ${state.studentName}!`;$('lasin-motivation-rating').textContent=ratingForAccuracy(accuracy);$('lasin-motivation-result-points').textContent=`${state.points} / ${MAX_POINTS}`;$('lasin-motivation-result-correct').textContent=String(state.correct);$('lasin-motivation-result-wrong').textContent=String(state.wrong);$('lasin-motivation-result-total').textContent=String(TOTAL);$('lasin-motivation-result-accuracy').textContent=`${accuracy}%`;resultsScreen.classList.remove('lasin-hidden');persist();return true}
function serializePersistent(q){return{key:q.key,exerciseId:q.exerciseId,questionId:q.questionId,localIndex:q.localIndex,ready:q.ready,hadMistake:q.hadMistake,completed:q.completed,classification:q.classification,pointsEarned:q.pointsEarned,elapsedMs:effectiveElapsedMs(q),responseMode:q.responseMode,expectedAnswer:q.expectedAnswer,matchedExpectedAnswer:q.matchedExpectedAnswer,typingAllowanceOverrideSeconds:q.typingAllowanceOverrideSeconds,typingAllowanceSeconds:q.typingAllowanceSeconds,rawElapsedSeconds:q.rawElapsedSeconds,effectiveElapsedSeconds:q.effectiveElapsedSeconds}}
function persist(){if(hydrating)return;try{sessionStorage.setItem(CONFIG.persistenceKey,JSON.stringify({version:CONFIG.version,studentName:state.studentName,started:state.started,finished:state.finished,activeExerciseId:state.activeExerciseId,points:state.points,correct:state.correct,wrong:state.wrong,questions:[...state.questions.values()].map(serializePersistent)}))}catch(e){}}
function hydrate(){try{const raw=sessionStorage.getItem(CONFIG.persistenceKey);if(raw){const s=JSON.parse(raw);if(s&&s.version===CONFIG.version){state.studentName=String(s.studentName||'');state.started=Boolean(s.started);state.finished=Boolean(s.finished);state.activeExerciseId=planMap.has(s.activeExerciseId)?s.activeExerciseId:'vocab';state.points=Number(s.points)||0;state.correct=Number(s.correct)||0;state.wrong=Number(s.wrong)||0;for(const v of Array.isArray(s.questions)?s.questions:[]){const q=ensureQuestion(v.exerciseId,v.questionId,v.localIndex);if(!q)continue;q.ready=Boolean(v.ready);q.hadMistake=Boolean(v.hadMistake);q.completed=Boolean(v.completed);q.classification=v.classification||null;q.pointsEarned=Number(v.pointsEarned)||0;q.elapsedMs=Math.max(0,Number(v.elapsedMs)||0);q.runningSince=null;q.responseMode=normalizeMode(v.responseMode);q.expectedAnswer=v.expectedAnswer??null;q.matchedExpectedAnswer=v.matchedExpectedAnswer??null;q.typingAllowanceOverrideSeconds=v.typingAllowanceOverrideSeconds==null?null:Number(v.typingAllowanceOverrideSeconds);q.typingAllowanceSeconds=Math.max(0,Number(v.typingAllowanceSeconds)||0);q.rawElapsedSeconds=v.rawElapsedSeconds==null?null:Number(v.rawElapsedSeconds);q.effectiveElapsedSeconds=v.effectiveElapsedSeconds==null?null:Number(v.effectiveElapsedSeconds)}}}}catch(e){}hydrating=false;if(state.studentName)nameInput.value=state.studentName;if(state.started){root.classList.add('lasin-motivation-started');document.body.classList.add('lasin-challenge-started');startScreen.classList.add('lasin-hidden')}if(state.finished)finishResultsOnly();updateHUD();persist()}
function finishResultsOnly(){const accuracy=Math.round((state.correct/TOTAL)*100);$('lasin-motivation-results-title').textContent=`Great work, ${state.studentName}!`;$('lasin-motivation-rating').textContent=ratingForAccuracy(accuracy);$('lasin-motivation-result-points').textContent=`${state.points} / ${MAX_POINTS}`;$('lasin-motivation-result-correct').textContent=String(state.correct);$('lasin-motivation-result-wrong').textContent=String(state.wrong);$('lasin-motivation-result-total').textContent=String(TOTAL);$('lasin-motivation-result-accuracy').textContent=`${accuracy}%`;resultsScreen.classList.remove('lasin-hidden')}
function deactivateFrame(id){const f=frames.get(id);if(!f||!f.contentWindow)return;try{const child=f.contentWindow.LASIN_MOTIVATION_CHILD;if(child&&typeof child.deactivate==='function')child.deactivate();else if(f.contentWindow.LASIN&&typeof f.contentWindow.LASIN.stopAudio==='function')f.contentWindow.LASIN.stopAudio()}catch(e){}}
function activateFrame(id){const f=frames.get(id);if(!f||!f.contentWindow)return;try{const child=f.contentWindow.LASIN_MOTIVATION_CHILD;if(child&&typeof child.activate==='function')child.activate()}catch(e){}}
function setActiveExercise(id){if(!planMap.has(id))return false;const old=state.activeExerciseId;if(old!==id){deactivateFrame(old);pauseActive();state.activeExerciseId=id}for(const [fid,f] of frames)f.classList.toggle('lasin-active-frame',fid===id);nav.querySelectorAll('[data-lasin-exercise]').forEach(b=>{const on=b.dataset.lasinExercise===id;b.classList.toggle('active',on);b.setAttribute('aria-selected',on?'true':'false')});persist();updateHUD();if(state.started)setTimeout(()=>activateFrame(id),0);return true}
function loadFrames(){for(const ex of LESSON_PLAN){const f=frames.get(ex.id);f.addEventListener('load',()=>{setTimeout(()=>{if(state.activeExerciseId===ex.id&&state.started)activateFrame(ex.id);else deactivateFrame(ex.id)},0)});f.src=FRAME_URLS[ex.id]}}
function startChallenge(){const name=String(nameInput.value||'').trim();if(!name){startError.textContent='Please type your name first.';nameInput.focus();return}if(state.studentName&&state.studentName!==name&&(state.points||completedCount())){try{sessionStorage.removeItem(CONFIG.persistenceKey)}catch(e){}location.reload();return}state.studentName=name;state.started=true;state.finished=false;startError.textContent='';root.classList.add('lasin-motivation-started');document.body.classList.add('lasin-challenge-started');startScreen.classList.add('lasin-hidden');resultsScreen.classList.add('lasin-hidden');setActiveExercise(state.activeExerciseId||'vocab');persist();updateHUD();if(completedCount()===TOTAL)finish()}
function restartChallenge(){for(const id of frames.keys())deactivateFrame(id);try{sessionStorage.removeItem(CONFIG.persistenceKey)}catch(e){}location.reload()}
function getState(){return{version:CONFIG.version,started:state.started,finished:state.finished,studentName:state.studentName,activeExerciseId:state.activeExerciseId,totalQuestions:TOTAL,answered:completedCount(),correct:state.correct,wrong:state.wrong,points:state.points,maxPoints:MAX_POINTS,timerSeconds:CONFIG.timerSeconds,hardDeadline:CONFIG.hardDeadline,activeQuestion:activeQuestion()?serializeQuestion(activeQuestion()):null}}
window.LASINMotivation=Object.freeze({version:CONFIG.version,config:CONFIG,questionReady,questionMistake,questionCompleted,pauseActive,setActiveExercise,calculateTypingAllowanceSeconds,pointsForEffectiveSeconds,getState,get totalQuestions(){return TOTAL},get maxPoints(){return MAX_POINTS}});
startBtn.addEventListener('click',startChallenge);nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')startChallenge()});restartBtn.addEventListener('click',restartChallenge);nav.addEventListener('click',e=>{const b=e.target.closest('[data-lasin-exercise]');if(b)setActiveExercise(b.dataset.lasinExercise)});window.addEventListener('pagehide',()=>{pauseActive();for(const id of frames.keys())deactivateFrame(id)});document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseActive();deactivateFrame(state.activeExerciseId)}else if(state.started&&!state.finished)setTimeout(()=>activateFrame(state.activeExerciseId),0)});
hydrate();loadFrames();setActiveExercise(state.activeExerciseId);if(state.studentName&&!state.started)startBtn.textContent='Continue';
})();
</script>
