<style>

<script>
(()=>{
'use strict';
const LASIN_MOTIVATION_EXERCISE_ID='exercise-03';
function lasinMotivationBridge(action,payload={}){
  try{window.parent.postMessage({channel:'LASIN_MOTIVATION_V2',action,payload:Object.assign({exerciseId:LASIN_MOTIVATION_EXERCISE_ID},payload||{})},'*');}catch(e){}
}
function lasinMotivationSignal(action,extra={}){

}
function lasinHostSuspend(){
  const hasQuestion=!!document.querySelector('.word-tile');
  if(!hasQuestion){stopAudio();return;}
  if(!mandatoryDone){
    stopAudio();mandatoryDone=false;mandatoryNeedsTap=true;setAudioButtonsState(true,false);

  }
  const replayActive=!!currentAudio||!!document.querySelector('.audio-btn.playing');
  if(replayActive){
    stopAudio();setAudioButtonsState(true,false);restoreInteraction();
    if(qBuilt<4)setListenNote('Now build the question.');else setListenNote('Now complete the answer.');

}
window.addEventListener('message',e=>{
  const d=e.data;if(!d||d.channel!=='LASIN_HOST_V1'||d.action!=='active-state')return;

const AUTO_DELAY=800,QA_GAP=700,REPEAT_GAP=800,WRONG_CLEAR=750,BRAVO_MS=1900;

const REQUIRED_AUDIO=['q_she','q_he','a_act','a_sleep','a_win','a_learn','a_ride','a_read'];
const QUESTIONS=[];
for(const mode of ['verb','phrase'])for(const item of DATA.items)QUESTIONS.push({mode,item});
lasinMotivationBridge('register-exercise',{order:3,label:'Exercise 03',scorable:true,totalQuestions:QUESTIONS.length,mode:'scored'});
let currentIndex=0,qBuilt=0,mandatoryDone=false,mandatoryNeedsTap=false,pendingFinish=false,currentAudio=null,audioToken=0,finishTimer=null;
const timers=new Set();
const reducedMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function escapeHTML(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function allAudioEmbedded(){return REQUIRED_AUDIO.every(k=>String(DATA.audio[k]||'').length>0);}
function clearTimers(){for(const t of timers)clearTimeout(t);timers.clear();if(finishTimer){clearTimeout(finishTimer);finishTimer=null;}}
function stopAudio(){audioToken++;clearTimers();if(currentAudio){try{currentAudio.pause();currentAudio.currentTime=0;}catch(e){}currentAudio=null;}document.querySelectorAll('.audio-btn').forEach(b=>b.classList.remove('playing'));}
function sleep(ms,token){return new Promise(resolve=>{const id=setTimeout(()=>{timers.delete(id);resolve(token===audioToken);},ms);timers.add(id);});}
function playOne(url,token){return new Promise(resolve=>{
  if(token!==audioToken||!url){resolve(false);return;}
  const a=new Audio();currentAudio=a;a.preload='auto';a.setAttribute('playsinline','');a.setAttribute('webkit-playsinline','');a.src=url;
  const done=ok=>{if(currentAudio===a)currentAudio=null;resolve(ok&&token===audioToken);};
  a.addEventListener('ended',()=>done(true),{once:true});a.addEventListener('error',()=>done(false),{once:true});
  const p=a.play();if(p&&p.catch)p.catch(()=>done(false));
});}
function setFeedback(msg,bad=false){const f=document.getElementById('feedback');if(!f)return;f.textContent=msg||'';f.className='feedback'+(bad?' bad':'');}
function setListenNote(msg){const e=document.getElementById('listenNote');if(e)e.textContent=msg;}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffledNotSame(arr){let out=shuffle(arr);if(arr.length>1&&out.every((v,i)=>v===arr[i]))[out[0],out[1]]=[out[1],out[0]];return out;}
function progressHTML(){const pct=((currentIndex+1)/QUESTIONS.length)*100;return `<div class="progress-wrap"><div class="progress-meta">${currentIndex+1} / ${QUESTIONS.length}</div><div class="progress-track" aria-label="Progress"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;}

}
function renderIntro(){stopAudio();currentIndex=0;qBuilt=0;mandatoryDone=false;mandatoryNeedsTap=false;pendingFinish=false;const embedded=allAudioEmbedded();const builder=document.documentElement.dataset.builder==='true';screenEl.innerHTML=`<section class="intro"><h1>${escapeHTML(DATA.title)}</h1><button class="start" id="startBtn" type="button" ${embedded?'':'disabled'}>Start</button>${builder&&!embedded?audioSetupHTML():''}</section>`;document.getElementById('startBtn').addEventListener('click',()=>{if(allAudioEmbedded()){unlockMobileAudio();renderQuestion();}});if(window.LASIN_BUILDER&&builder)window.LASIN_BUILDER.bind();}
function questionSlotsHTML(item){return `<span class="answer-slot question-slot" id="qslot0">...</span><span class="answer-slot question-slot" id="qslot1">...</span><span class="answer-slot question-slot" id="qslot2">...</span><span class="answer-slot question-slot" id="qslot3">...</span><span class="fixed-chunk">when ${item.pronoun} was on vacation?</span>`;}
function answerHTML(q){const i=q.item;if(q.mode==='verb')return `<span class="fixed-chunk">${i.subject}</span><span class="answer-slot" id="answerSlot">...</span><span class="fixed-chunk">${escapeHTML(i.phrase)}.</span>`;return `<span class="fixed-chunk">${i.subject} ${escapeHTML(i.verb)}</span><span class="answer-slot phrase-slot" id="answerSlot">...</span><span class="period">.</span>`;}
function questionChoices(item){return shuffledNotSame(['What','did',item.pronoun,'do']);}
function answerChoices(q){return shuffle(q.mode==='verb'?q.item.verbChoices:q.item.phraseChoices);}
function setAudioButtonsState(enabled,playing=false){document.querySelectorAll('.audio-btn').forEach(b=>{b.disabled=!enabled;b.classList.toggle('ready',enabled&&!playing);b.classList.toggle('playing',playing);});}
function restoreInteraction(){if(!mandatoryDone){document.querySelectorAll('.word-tile').forEach(b=>b.disabled=true);return;}document.querySelectorAll('.question-tile').forEach(b=>{if(!b.classList.contains('moved'))b.disabled=(qBuilt>=4);});const questionDone=qBuilt>=4;document.getElementById('answerPanel')?.classList.toggle('locked',!questionDone);document.querySelectorAll('.answer-tile').forEach(b=>{if(!b.classList.contains('moved'))b.disabled=!questionDone;});}
async function runQASequence(buttonId,isMandatory){
  stopAudio();const token=audioToken;setAudioButtonsState(false,true);document.querySelectorAll('.word-tile').forEach(b=>b.disabled=true);if(isMandatory)mandatoryNeedsTap=false;
  const q=QUESTIONS[currentIndex],qa=DATA.audio[q.item.qAudio],aa=DATA.audio[q.item.aAudio];
  if(isMandatory)setListenNote('Listen carefully. The question and answer will play twice.');else setListenNote('Listen again.');
  let ok=await playOne(qa,token);if(!ok||token!==audioToken)return false;
  ok=await sleep(QA_GAP,token);if(!ok)return false;ok=await playOne(aa,token);if(!ok)return false;
  ok=await sleep(REPEAT_GAP,token);if(!ok)return false;ok=await playOne(qa,token);if(!ok)return false;
  ok=await sleep(QA_GAP,token);if(!ok)return false;ok=await playOne(aa,token);if(!ok)return false;
  if(token!==audioToken)return false;
  if(isMandatory){mandatoryDone=true;mandatoryNeedsTap=false;}
  setAudioButtonsState(true,false);restoreInteraction();
  if(isMandatory)lasinMotivationSignal('question-ready');
  if(qBuilt<4)setListenNote('Now build the question.');else setListenNote('Now complete the answer.');
  maybeFinishQuestion();return true;
}
async function runMandatoryWithFallback(){
  const ok=await runQASequence('rightAudioBtn',true);
  if(ok||mandatoryDone)return;
  mandatoryDone=false;mandatoryNeedsTap=true;setAudioButtonsState(true,false);document.querySelectorAll('.word-tile').forEach(b=>b.disabled=true);setListenNote('Tap the headset to listen twice.');
}
function audioClick(){if(!allAudioEmbedded())return;if(mandatoryDone)runQASequence(null,false);else if(mandatoryNeedsTap)runMandatoryWithFallback();}
function renderQuestion(){
  stopAudio();qBuilt=0;mandatoryDone=false;mandatoryNeedsTap=false;pendingFinish=false;const q=QUESTIONS[currentIndex],i=q.item,qChoices=questionChoices(i),aChoices=answerChoices(q);
  screenEl.innerHTML=`<section class="stage">${progressHTML()}<div class="halves">
    <section class="half" aria-label="Picture and listening prompt"><h2 class="half-title">Look and listen.</h2><button class="audio-btn" id="leftAudioBtn" aria-label="Listen to the question and answer again" type="button" disabled>${HEADSET}</button><div class="picture-card"><img src="${i.image}" alt="Picture for: ${escapeHTML(i.answer)}"></div><p class="left-caption">You can listen again anytime.</p></section>
    <section class="half" aria-label="Grammar exercise"><h2 class="half-title">Then listen and choose.</h2><button class="audio-btn" id="rightAudioBtn" aria-label="Listen to the question and answer again" type="button" disabled>${HEADSET}</button><div class="task-wrap"><p class="listen-note" id="listenNote">Listen carefully. The question and answer will play twice.</p>
      <div class="task-block"><div class="task-label">Question</div><div class="sentence-area question-area" id="questionArea" aria-label="Question building area">${questionSlotsHTML(i)}</div><div class="word-bank" id="questionBank">${qChoices.map(w=>`<button class="word-tile question-tile" type="button" data-word="${escapeHTML(w)}" aria-label="Choose ${escapeHTML(w)}" disabled>${escapeHTML(w)}</button>`).join('')}</div></div>
      <div class="task-block answer-panel locked" id="answerPanel"><div class="task-label">Answer</div><div class="sentence-area answer-area" id="answerArea" aria-label="Answer completion area">${answerHTML(q)}</div><div class="word-bank" id="answerBank">${aChoices.map(w=>`<button class="word-tile answer-tile" type="button" data-word="${escapeHTML(w)}" aria-label="Choose ${escapeHTML(w)}" disabled>${escapeHTML(w)}</button>`).join('')}</div></div>
      <p class="feedback" id="feedback" aria-live="polite"></p></div></section>
  </div></section>`;
  document.getElementById('leftAudioBtn').addEventListener('click',audioClick);document.getElementById('rightAudioBtn').addEventListener('click',audioClick);
  document.querySelectorAll('.question-tile').forEach(btn=>btn.addEventListener('click',()=>chooseQuestionTile(btn,q)));
  document.querySelectorAll('.answer-tile').forEach(btn=>btn.addEventListener('click',()=>chooseAnswerTile(btn,q)));
  const token=audioToken;const id=setTimeout(()=>{timers.delete(id);if(token===audioToken)runMandatoryWithFallback();},AUTO_DELAY);timers.add(id);
}
function wrongTile(btn){lasinMotivationSignal('question-mistake');btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('is-wrong','shake');setFeedback('Try again!',true);const id=setTimeout(()=>{timers.delete(id);btn.classList.remove('is-wrong','shake');setFeedback('');},WRONG_CLEAR);timers.add(id);}
function flyInto(btn,target,text){return new Promise(resolve=>{if(reducedMotion){resolve();return;}const a=btn.getBoundingClientRect(),b=target.getBoundingClientRect();const clone=btn.cloneNode(true);clone.className='word-tile fly-tile';clone.disabled=true;clone.textContent=text;clone.style.left=a.left+'px';clone.style.top=a.top+'px';clone.style.width=a.width+'px';clone.style.height=a.height+'px';document.body.appendChild(clone);const dx=(b.left+b.width/2)-(a.left+a.width/2),dy=(b.top+b.height/2)-(a.top+a.height/2);requestAnimationFrame(()=>{clone.style.transform=`translate(${dx}px,${dy}px) scale(.82)`;clone.style.opacity='.12';});setTimeout(()=>{clone.remove();resolve();},340);});}
async function chooseQuestionTile(btn,q){if(!mandatoryDone||btn.disabled||qBuilt>=4)return;const expected=['What','did',q.item.pronoun,'do'][qBuilt],word=btn.dataset.word;if(word!==expected){wrongTile(btn);return;}const slot=document.getElementById('qslot'+qBuilt);await flyInto(btn,slot,word);slot.className='built-word';slot.textContent=word;btn.classList.add('moved');btn.disabled=true;qBuilt++;setFeedback('');if(qBuilt===4){document.querySelectorAll('.question-tile').forEach(b=>b.disabled=true);document.getElementById('answerPanel').classList.remove('locked');document.querySelectorAll('.answer-tile').forEach(b=>b.disabled=false);setListenNote('Great! Now complete the answer.');}}
async function chooseAnswerTile(btn,q){if(!mandatoryDone||qBuilt<4||btn.disabled)return;const expected=q.mode==='verb'?q.item.verb:q.item.phrase,word=btn.dataset.word;if(word!==expected){wrongTile(btn);return;}lasinMotivationSignal('question-completed');document.querySelectorAll('.answer-tile').forEach(b=>b.disabled=true);const slot=document.getElementById('answerSlot');await flyInto(btn,slot,word);slot.className='built-word';slot.textContent=word;btn.classList.add('moved');setFeedback('Great job!');finishQuestionWhenSafe();}
function finishQuestionWhenSafe(){pendingFinish=true;maybeFinishQuestion();}
function maybeFinishQuestion(){if(!pendingFinish)return;if(currentAudio&&!currentAudio.paused&&!currentAudio.ended)return;pendingFinish=false;setAudioButtonsState(false,false);finishTimer=setTimeout(()=>{finishTimer=null;showBravo();},320);}
function playSuccessChime(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();const now=ctx.currentTime;[523.25,659.25,783.99].forEach((f,k)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12,now+.02+k*.04);g.gain.exponentialRampToValueAtTime(.0001,now+.34+k*.05);o.connect(g);g.connect(ctx.destination);o.start(now+k*.05);o.stop(now+.42+k*.06);});setTimeout(()=>ctx.close&&ctx.close(),900);}catch(e){}}
function showBravo(){playSuccessChime();const overlay=document.createElement('div');overlay.className='celebration';overlay.innerHTML='<div class="celebration-core"><div class="celebration-title">BRAVO!</div><div class="celebration-sub">Excellent work!</div></div>';document.body.appendChild(overlay);for(let i=0;i<30;i++){const s=document.createElement('span');s.className='star';s.textContent='★';s.style.left=(44+Math.random()*12)+'%';s.style.top=(43+Math.random()*14)+'%';const angle=Math.random()*Math.PI*2,dist=130+Math.random()*340;s.style.setProperty('--dx',Math.cos(angle)*dist+'px');s.style.setProperty('--dy',Math.sin(angle)*dist+'px');s.style.setProperty('--rot',(Math.random()*720-360)+'deg');s.style.animationDelay=(Math.random()*.16)+'s';overlay.appendChild(s);}setTimeout(()=>{overlay.remove();lasinMotivationSignal('question-settled');if(currentIndex<QUESTIONS.length-1){currentIndex++;renderQuestion();}else renderComplete();},BRAVO_MS);}
function renderComplete(){stopAudio();screenEl.innerHTML=`<section class="complete"><h2>Great job!</h2><p>You finished all ${QUESTIONS.length} questions.</p><button class="restart" id="restartBtn" type="button">Play again</button></section>`;document.getElementById('restartBtn').addEventListener('click',renderIntro);}
function unlockMobileAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();const o=ctx.createOscillator(),g=ctx.createGain();g.gain.value=0;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.01);if(ctx.state==='suspended')ctx.resume();setTimeout(()=>ctx.close&&ctx.close(),100);}catch(e){}}
document.addEventListener('pointerdown',unlockMobileAudio,{once:true,passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAudio();});window.addEventListener('pagehide',stopAudio);window.addEventListener('beforeunload',stopAudio);
window.LASIN={DATA,renderIntro,allAudioEmbedded,stopAudio};renderIntro();
})();
</script>

</body></html>
