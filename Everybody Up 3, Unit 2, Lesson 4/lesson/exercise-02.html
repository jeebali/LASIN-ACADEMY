let reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches,audioCtx=null,resizeRAF=0,currentMaskRound=null;
/* ===== LASIN Motivation v3.0 parent bridge ===== */
const LASIN_MOTIVATION_EXERCISE_ID='exercise-02';
const LASIN_MOTIVATION_QUESTION_IDS=["school-01-intro-object","school-02-intro-phrase","school-03-step1-connector","school-04-step2-connector","school-05-step3-connector","school-06-step4-connector","school-07-step1-action","school-08-step2-action","school-09-step3-action","school-10-step4-action","supermarket-11-intro-object","supermarket-12-intro-phrase","supermarket-13-step1-connector","supermarket-14-step2-connector","supermarket-15-step3-connector","supermarket-16-step4-connector","supermarket-17-step1-action","supermarket-18-step2-action","supermarket-19-step3-action","supermarket-20-step4-action","flowers-21-intro-object","flowers-22-intro-phrase","flowers-23-step1-connector","flowers-24-step2-connector","flowers-25-step3-connector","flowers-26-step4-connector","flowers-27-step1-action","flowers-28-step2-action","flowers-29-step3-action","flowers-30-step4-action"];
let lasinMotivationIsActive=true,lasinRoundCompleted=false;
function lasinMotivationAPI(){try{return window.parent&&window.parent!==window&&window.parent.LASINMotivation?window.parent.LASINMotivation:null}catch(e){return null}}
function lasinMotivationQuestionId(index=roundIndex,r=DATA.rounds[index]){if(!r)return null;return `${r.project}-${String(index+1).padStart(2,'0')}-${String(r.mask||'round').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}`}
function lasinMotivationPayload(r=DATA.rounds[roundIndex]){if(!r)return null;return{exerciseId:LASIN_MOTIVATION_EXERCISE_ID,questionId:lasinMotivationQuestionId(roundIndex,r),localIndex:roundIndex+1,responseMode:'selection'}}
function lasinMotivationReady(r=DATA.rounds[roundIndex]){if(!lasinMotivationIsActive||lasinRoundCompleted)return;const api=lasinMotivationAPI(),p=lasinMotivationPayload(r);if(api&&p)api.questionReady(p)}
function lasinMotivationMistake(r=DATA.rounds[roundIndex]){if(!lasinMotivationIsActive||lasinRoundCompleted)return;const api=lasinMotivationAPI(),p=lasinMotivationPayload(r);if(api&&p)api.questionMistake(p)}
function lasinMotivationComplete(r=DATA.rounds[roundIndex]){if(!lasinMotivationIsActive||lasinRoundCompleted)return;lasinRoundCompleted=true;const api=lasinMotivationAPI(),p=lasinMotivationPayload(r);if(api&&p)api.questionCompleted(p)}
function lasinMotivationFeedbackComplete(){const api=lasinMotivationAPI();if(api&&typeof api.feedbackComplete==='function')api.feedbackComplete()}
function lasinMotivationDeactivate(){
  lasinMotivationIsActive=false;
  try{stopAudio()}catch(e){}
  document.querySelectorAll('.celebration').forEach(n=>n.remove());
}
function lasinMotivationActivate(){
  lasinMotivationIsActive=true;
  if(document.getElementById('startBtn')||document.getElementById('restart'))return;
  const r=DATA.rounds[roundIndex]; if(!r)return;
  if(lasinRoundCompleted){document.querySelectorAll('.celebration').forEach(n=>n.remove());showBravo();return;}
  if(mandatoryDone){document.querySelectorAll('.is-wrong,.shake').forEach(b=>b.classList.remove('is-wrong','shake'));setFeedback('');lasinMotivationReady(r);return;}
  renderRound(roundIndex);
}
window.LASIN_MOTIVATION_CHILD={exerciseId:LASIN_MOTIVATION_EXERCISE_ID,activate:lasinMotivationActivate,deactivate:lasinMotivationDeactivate,getLocalIndex:()=>roundIndex+1};
/* ===== End LASIN Motivation bridge ===== */

const sleep=ms=>new Promise(resolve=>{const id=setTimeout(()=>{timers.delete(id);resolve();},ms);timers.add(id);});
function clearTimers(){for(const id of timers)clearTimeout(id);timers.clear();}
function headphones(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a8 8 0 0 0-8 8v6a3 3 0 0 0 3 3h2v-8H6v-1a6 6 0 0 1 12 0v1h-3v8h2a3 3 0 0 0 3-3v-6a8 8 0 0 0-8-8z"/></svg>';}
function audioReady(){return Object.keys(DATA.audioFiles).every(k=>typeof DATA.audio[k]==='string'&&DATA.audio[k].startsWith('data:audio'));}
function persistData(){document.getElementById('lesson-data').textContent=JSON.stringify(DATA).replace(/<\//g,'<\/');}
function stopAudio(){audioToken++;clearTimers();try{currentAudio.pause();currentAudio.currentTime=0;}catch(e){}document.querySelectorAll('.audio-btn').forEach(b=>b.classList.remove('playing'));}
async function unlockAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();const silent=new Audio('../assets/c0230a47897258f34fc3.wav');silent.volume=.001;await silent.play();silent.pause();}catch(e){}}
async function playClip(src,btn,token){if(!src||token!==audioToken)return false;try{currentAudio.pause();currentAudio.currentTime=0;}catch(e){}currentAudio.src=src;if(btn)btn.classList.add('playing');return await new Promise(resolve=>{let done=false;const finish=ok=>{if(done)return;done=true;currentAudio.onended=null;currentAudio.onerror=null;if(btn)btn.classList.remove('playing');resolve(ok);};currentAudio.onended=()=>finish(token===audioToken);currentAudio.onerror=()=>finish(false);currentAudio.play().catch(()=>finish(false));});}
async function playTwice(src,btn,token){if(!await playClip(src,btn,token))return false;if(token!==audioToken)return false;await sleep(REPEAT_GAP);if(token!==audioToken)return false;return await playClip(src,btn,token);}
function progressMarkup(){const current=roundIndex+1,total=DATA.rounds.length,pct=current/total*100;return `<div class="progress-wrap"><div class="progress-meta">${current} / ${total}</div><div class="progress-track" role="progressbar" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${current}"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;}
function renderIntro(){stopAudio();stage='intro';roundIndex=0;currentMaskRound=null;screen.classList.remove('activity-screen');const ready=audioReady();screen.innerHTML=`<section class="intro"><h1>${escapeHTML(DATA.title)}</h1><button class="start" id="startBtn" ${ready?'':'disabled'}>Start</button>${ready?'':setupMarkup()}</section>`;document.getElementById('startBtn').addEventListener('click',async()=>{await unlockAudio();renderRound(0);});bindSetup();}
function setupMarkup(){return `<div class="audio-setup" id="audioSetup"><div class="audio-setup-title">Original Audio Setup</div><div class="audio-setup-text">Select the 15 original MP3 files for the three “Let’s make …” projects. The exact filenames are checked, harmless apostrophe or extra-dot differences are normalized, and the original MP3 bytes are embedded without re-encoding.</div><button class="audio-setup-btn" id="embedAudio">Embed the Original MP3s</button><input id="audioFiles" type="file" accept="audio/mpeg,.mp3" multiple hidden><div class="audio-setup-track"><div class="audio-setup-fill" id="audioFill"></div></div><div class="audio-setup-status" id="audioStatus">Waiting for the 15 original MP3 files.</div></div>`;}
function normalizeName(name){return String(name||'').normalize('NFKC').replace(/[’‘]/g,"'").split(/[\/]/).pop().trim().toLowerCase().replace(/\s+/g,' ').replace(/\.+mp3$/i,'.mp3');}
function bindSetup(){const btn=document.getElementById('embedAudio'),input=document.getElementById('audioFiles');if(!btn||!input)return;btn.addEventListener('click',()=>input.click());input.addEventListener('change',()=>embedFiles([...input.files]));}
async function embedFiles(files){const status=document.getElementById('audioStatus'),fill=document.getElementById('audioFill');const byName=new Map(files.map(f=>[normalizeName(f.name),f]));const expected=Object.entries(DATA.audioFiles);const missing=expected.filter(([,name])=>!byName.has(normalizeName(name)));if(missing.length){status.className='audio-setup-status bad';status.textContent='Missing: '+missing.map(x=>x[1]).join(', ');fill.style.width='0%';return;}let done=0;for(const [key,name] of expected){const f=byName.get(normalizeName(name));DATA.audio[key]=await readDataURL(f);done++;fill.style.width=(done/expected.length*100)+'%';}if(!audioReady()){status.className='audio-setup-status bad';status.textContent='Audio validation failed. Please select the files again.';return;}persistData();status.className='audio-setup-status ok';status.textContent='Original MP3s embedded successfully. The 30-question activity is ready.';document.getElementById('startBtn').disabled=false;await sleep(180);exportCleanLesson();}
function readDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}
function exportCleanLesson(){const clone=document.documentElement.cloneNode(true);const setup=clone.querySelector('#audioSetup');if(setup)setup.remove();const start=clone.querySelector('#startBtn');if(start)start.removeAttribute('disabled');const clean='<!doctype html>\n'+clone.outerHTML;const blob=new Blob([clean],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='LASIN_Everybody_Up_1_First_Next_Then_Finally_Exercise_02_FULL_EMBEDDED.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function renderRound(index){stopAudio();screen.classList.add('activity-screen');roundIndex=index;stage='visual';mandatoryDone=false;pendingRoundFinish=false;lasinRoundCompleted=false;const r=DATA.rounds[index];currentMaskRound=r;screen.innerHTML=`<section class="stage">${progressMarkup()}<div class="halves"><section class="half" id="leftHalf" aria-label="Picture and listening prompt"><h2 class="half-title">Look and listen.</h2><button class="audio-btn" id="leftAudio" aria-label="Listen again to the sentence" disabled>${headphones()}</button><div class="picture-stage" id="pictureStage"><img id="projectImage" src="${DATA.images[r.project]}" alt="${escapeAttr(r.aria)}"><div class="picture-mask" id="pictureMask" aria-hidden="true"></div></div><div class="left-caption" id="leftCaption">Listen carefully.</div></section><section class="half locked" id="rightHalf" aria-label="Choose the missing words"><h2 class="half-title">Listen and choose.</h2><div class="task-wrap"><div class="listen-note" id="listenNote">Listen to the whole sentence twice first.</div>${taskMarkup(r)}</div></section></div></section>`;bindRound(r);window.scrollTo({top:0,behavior:'auto'});prepareVisual(r).then(()=>beginMandatoryFlow(r));}
function taskMarkup(r){return `<div class="sentence-area" id="sentenceArea" aria-label="Incomplete sentence"><span>${escapeHTML(r.prefix)}</span><span class="answer-slot" id="answerSlot">...</span><span>${escapeHTML(r.suffix)}</span></div><div class="word-bank" id="wordBank">${r.choices.map(w=>`<button class="word-tile" data-word="${escapeAttr(w)}" disabled>${escapeHTML(w)}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div>`;}
function bindRound(r){document.getElementById('leftAudio').addEventListener('click',()=>manualReplay(r.audio,'leftAudio'));document.querySelectorAll('.word-tile').forEach(b=>b.addEventListener('click',()=>chooseAnswer(b,r)));}
function prepareVisual(r){return new Promise(resolve=>{const img=document.getElementById('projectImage');const done=()=>{requestAnimationFrame(()=>{positionMask();document.getElementById('pictureStage')?.classList.add('ready');resolve();});};if(img.complete&&img.naturalWidth)done();else{img.addEventListener('load',done,{once:true});img.addEventListener('error',done,{once:true});}});}
function positionMask(){if(!currentMaskRound)return;const stageEl=document.getElementById('pictureStage'),img=document.getElementById('projectImage'),mask=document.getElementById('pictureMask');if(!stageEl||!img||!mask||!img.clientWidth)return;const m=DATA.masks[currentMaskRound.project][currentMaskRound.mask];if(!m)return;const sr=stageEl.getBoundingClientRect(),ir=img.getBoundingClientRect(),sx=ir.width/DATA.imageWidth,sy=ir.height/DATA.imageHeight;mask.style.left=(ir.left-sr.left+m.x*sx)+'px';mask.style.top=(ir.top-sr.top+m.y*sy)+'px';mask.style.width=(m.w*sx)+'px';mask.style.height=(m.h*sy)+'px';}
async function beginMandatoryFlow(r){if(!lasinMotivationIsActive)return;const token=++audioToken;clearTimers();const leftBtn=document.getElementById('leftAudio');await sleep(ENTRY_DELAY);if(token!==audioToken)return;await playTwice(DATA.audio[r.audio],leftBtn,token);if(token!==audioToken)return;mandatoryDone=true;stage='answer';document.getElementById('leftCaption').textContent='You can listen again anytime.';leftBtn.disabled=false;leftBtn.classList.add('ready');const rightHalf=document.getElementById('rightHalf');rightHalf.classList.remove('locked');rightHalf.classList.add('open');unlockChoices();lasinMotivationReady(r);const note=document.getElementById('listenNote');if(note)note.textContent='Now choose the missing words.';if(innerWidth<=900)rightHalf.scrollIntoView({behavior:reducedMotion?'auto':'smooth',block:'start'});}
function unlockChoices(){document.querySelectorAll('.word-tile').forEach(b=>b.disabled=false);}
async function manualReplay(audioKey,btnId){if(!mandatoryDone)return;stopAudio();const token=++audioToken,btn=document.getElementById(btnId);if(!btn)return;await playTwice(DATA.audio[audioKey],btn,token);if(token===audioToken&&pendingRoundFinish)maybeFinishRound();}
function setFeedback(text,bad=false){const f=document.getElementById('feedback');if(!f)return;f.textContent=text;f.className='feedback'+(bad?' bad':'');}
function wrongTile(btn){lasinMotivationMistake(DATA.rounds[roundIndex]);btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('is-wrong','shake');setFeedback('Try again!',true);const id=setTimeout(()=>{timers.delete(id);btn.classList.remove('is-wrong','shake');setFeedback('');},WRONG_CLEAR);timers.add(id);}
async function chooseAnswer(btn,r){if(!mandatoryDone||btn.disabled)return;const word=btn.dataset.word;if(word!==r.correct){wrongTile(btn);return;}lasinMotivationComplete(r);document.querySelectorAll('.word-tile').forEach(b=>b.disabled=true);const slot=document.getElementById('answerSlot');await flyInto(btn,slot,word);slot.className='built-word';slot.textContent=word;btn.classList.add('moved');setFeedback('Great job!');finishRoundWhenSafe();}
function flyInto(btn,target,text){return new Promise(resolve=>{if(reducedMotion){resolve();return;}const a=btn.getBoundingClientRect(),b=target.getBoundingClientRect(),clone=btn.cloneNode(true);clone.className='word-tile fly-tile';clone.disabled=true;clone.textContent=text;clone.style.left=a.left+'px';clone.style.top=a.top+'px';clone.style.width=a.width+'px';clone.style.height=a.height+'px';document.body.appendChild(clone);const dx=(b.left+b.width/2)-(a.left+a.width/2),dy=(b.top+b.height/2)-(a.top+a.height/2);requestAnimationFrame(()=>{clone.style.transform=`translate(${dx}px,${dy}px) scale(.82)`;clone.style.opacity='.12';});setTimeout(()=>{clone.remove();resolve();},340);});}
function finishRoundWhenSafe(){pendingRoundFinish=true;maybeFinishRound();}
function maybeFinishRound(){if(!pendingRoundFinish)return;if(currentAudio&&!currentAudio.paused)return;if(!lasinMotivationIsActive)return;pendingRoundFinish=false;const id=setTimeout(()=>{timers.delete(id);if(lasinMotivationIsActive)showBravo();else pendingRoundFinish=true;},350);timers.add(id);}
function successChime(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const now=audioCtx.currentTime,freqs=[523.25,659.25,783.99,1046.50];freqs.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.11);g.gain.exponentialRampToValueAtTime(.13,now+i*.11+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*.11+.24);o.connect(g).connect(audioCtx.destination);o.start(now+i*.11);o.stop(now+i*.11+.26);});}catch(e){}}
function showBravo(){if(!lasinMotivationIsActive)return;stage='bravo';document.querySelectorAll('.celebration').forEach(n=>n.remove());successChime();const layer=document.createElement('div');layer.className='celebration';layer.innerHTML='<div class="celebration-core"><div class="celebration-title">BRAVO!</div><div class="celebration-sub">Excellent work!</div></div>';for(let i=0;i<30;i++){const s=document.createElement('div');s.className='star';s.textContent='★';s.style.left=(46+Math.random()*8)+'%';s.style.top=(42+Math.random()*12)+'%';s.style.setProperty('--dx',((Math.random()-.5)*1100)+'px');s.style.setProperty('--dy',((Math.random()-.5)*760)+'px');s.style.setProperty('--rot',((Math.random()-.5)*680)+'deg');s.style.animationDelay=(Math.random()*.16)+'s';layer.appendChild(s);}document.body.appendChild(layer);const id=setTimeout(()=>{timers.delete(id);layer.remove();if(!lasinMotivationIsActive)return;lasinMotivationFeedbackComplete();lasinRoundCompleted=false;if(roundIndex+1<DATA.rounds.length)renderRound(roundIndex+1);else renderComplete();},BRAVO_TIME);timers.add(id);}
function renderComplete(){stopAudio();stage='complete';currentMaskRound=null;screen.classList.remove('activity-screen');screen.innerHTML=`<section class="complete"><h2>Great job!</h2><p>You finished all ${DATA.rounds.length} questions.</p><button class="restart" id="restart">Play again</button></section>`;document.getElementById('restart').addEventListener('click',renderIntro);window.scrollTo({top:0,behavior:'auto'});}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(v){return escapeHTML(v);}
window.addEventListener('resize',()=>{if(resizeRAF)cancelAnimationFrame(resizeRAF);resizeRAF=requestAnimationFrame(positionMask);},{passive:true});
document.addEventListener('pointerdown',unlockAudio,{once:false,passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAudio();});
window.addEventListener('pagehide',stopAudio);
renderIntro();
})();
</script></body></html>
